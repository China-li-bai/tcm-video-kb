# FunASR SeACo-Paraformer settings (see docs/SEACO_HOTWORD_RESEARCH.md)
engine: seaco-paraformer
model: iic/speech_seaco_paraformer_large_asr_nat-zh-cn-16k-common-vocab8404-pytorch
vad_model: fsmn-vad
punc_model: ct-punc
batch_size_s: 300
# fsmn-vad max speech segment (ms). On CPU FunASR decodes VAD segments one by one,
# so this (plus s03 max_part_s) bounds per-step memory.
vad_max_single_segment_ms: 60000
# torch intra-op threads (null = torch default = all cores)
num_threads: null
# ASF / bias. NOT applied: FunASR 1.4.16 SeACo inference() hard-codes
# _seaco_decode_with_ASF(nfilter=50, seaco_weight=1.0) and ignores these kwargs.
nfilter: 50
seaco_weight: 1.0
# Hotword file: lexicon/dist/hotwords/{series}.txt — one term per line, no weights
hotword_max: 50

alt:
  engine: sensevoice
  model: iic/SenseVoiceSmall
  batch_size_s: 60
