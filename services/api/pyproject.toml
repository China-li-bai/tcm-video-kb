[project]
name = "tcmkb-api"
version = "0.1.0"
description = "FastAPI for tcm-video-kb (health + formula-pattern subgraph)"
requires-python = ">=3.11"
dependencies = [
  "tcmkb-graph",
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
