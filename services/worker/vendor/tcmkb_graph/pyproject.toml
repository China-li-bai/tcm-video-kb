[project]
name = "tcmkb-graph"
version = "0.1.0"
description = "Draft lecture edges (candidate only) and formula-pattern subgraph assembly"
requires-python = ">=3.11"
dependencies = [
  "tcmkb-core",
  "pydantic>=2",
  "pyyaml>=6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
