kps:
- type: clinical_tip
  s: 金匮第十三篇论消渴、小便不利、淋病；消渴范围大于西医糖尿病，经方对二型消渴可速效。
  seq: [1]
  q: 消渴
  ents: [symptom.xiao_ke, disease.lin_bing, symptom.xiao_bian_bu_li]
  conf: 0.95
- type: pathomechanism
  s: 中医消渴责血中缺水：口渴饮水而不能入血脉补津，故愈饮愈渴。
  seq: [63]
  q: 缺水
  ents: [symptom.xiao_ke]
  conf: 0.9
- type: clinical_tip
  s: 吃完宵夜即睡，食停胃中蠕动减缓，糖分释放、胃热渐增，为消渴重要成因；亦见“生活习惯遗传”。
  seq: [120]
  q: 小肠
  ents: [symptom.xiao_ke]
  conf: 0.85
- type: pathomechanism
  s: 内经三阳结谓之消渴：胃与大肠过热，中焦（含胆）随之热。
  seq: [198]
  q: 消渴
  ents: [symptom.xiao_ke]
  conf: 0.9
  asr: 三阳节=三阳结
- type: clause_interpretation
  s: 厥阴消渴气上冲心、心中疼热、饥不欲食；攻下利不止，示非宿食而属厥阴消渴。
  seq: [210]
  q: 消渴
  ents: [symptom.xiao_ke, six_channel.jueyin]
  conf: 0.9
  asr: 厥阴违=厥阴为；积而不遇食=饥而不欲食
- type: diagnostic_rule
  s: 饥不欲食、食即吐，若大黄甘草汤后能食不吐则为宿食；利不止则病未去，属厥阴消渴。
  seq: [219]
  q: 大黄甘草汤
  ents: [formula.da_huang_gan_cao_tang, symptom.xiao_ke]
  conf: 0.9
- type: formula_indication
  s: 上消口渴饮不解，上焦津伤，人参白虎汤（白虎加人参）证。
  seq: [249]
  q: 人参白虎汤
  ents: [formula.bai_hu_jia_ren_shen_tang, symptom.xiao_ke]
  conf: 0.95
- type: formula_indication
  s: 下消男子消渴小便多（饮一溲一）、性功能衰，肾气丸主之。
  seq: [252]
  q: 肾气丸
  ents: [formula.shen_qi_wan, symptom.xiao_ke]
  conf: 0.95
- type: formula_indication
  s: 脉浮小便不利为热在表/水停，消渴而小便不利者五苓散。
  seq: [259]
  q: 五苓散
  ents: [formula.wu_ling_san, symptom.xiao_bian_bu_li, symptom.xiao_ke]
  conf: 0.95
  asr: 无定散=五苓散
- type: formula_indication
  s: 渴欲饮水、水入则吐为水逆，亦属五苓散（如小儿吐乳）。
  seq: [264]
  q: 水逆
  ents: [syndrome.shui_ni, formula.wu_ling_san]
  conf: 0.95
- type: diagnostic_rule
  s: 口渴同见：小便不利→五苓散；小便自利而渴不止→白虎汤。
  seq: [281]
  q: 白虎汤
  ents: [formula.bai_hu_tang, formula.wu_ling_san, symptom.xiao_ke]
  conf: 0.95
  asr: 文和=白虎
- type: formula_composition
  s: 上消白虎加人参：石膏一两起、知母、生甘草、人参（或党参；无参可用瓜蒌根等生津）。
  seq: [289]
  q: 石膏
  ents: [formula.bai_hu_jia_ren_shen_tang, herb.shi_gao]
  conf: 0.9
- type: clinical_tip
  s: 中消三阳结兼便秘，白虎加大黄枳实清胃肠热；血糖过高或过低致饥颤均可重用石膏白虎。
  seq: [331]
  q: 肾气丸
  ents: [formula.shen_qi_wan, formula.bai_hu_tang, symptom.xiao_ke]
  conf: 0.85
- type: clinical_tip
  s: 中医淋含膏淋、沙淋、血淋等，范围大于西医淋病/性病。
  seq: [338]
  q: 淋病
  ents: [disease.lin_bing]
  conf: 0.9
  asr: 灵=淋；高龄=膏淋；沙林=沙淋
- type: diagnostic_rule
  s: 小便如粟状、少腹弦急痛引脐中；痛自尿道牵至脐多为膀胱结石，少腹剧痛多为输尿管结石。
  seq: [358]
  q: 膀胱
  ents: [zangfu.pang_guang, disease.lin_bing]
  conf: 0.9
