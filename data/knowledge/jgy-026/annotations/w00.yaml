kps:
- type: diagnostic_rule
  s: 渐冻人（ALS）案见手脚冰冷、全身无热、喜温饮、极度倦怠，属里寒湿盛，非纯虚劳。
  seq: [22]
  q: 双脚是冰冷的
  ents: [syndrome.han_shi, herb.fu_zi]
  conf: 0.9
  asr: AOS/lugarerk=ALS卢伽雷
- type: formula_indication
  s: 寒湿盛用茯苓四逆：四逆汤（生附干姜炙草）加茯苓白术，利小便祛寒湿；茯苓量宜重于白术以达下焦。
  seq: [40]
  q: 茯苓四逆汤
  ents: [formula.fu_ling_si_ni_tang, formula.si_ni_tang, herb.fu_zi, herb.fu_ling, herb.bai_zhu]
  conf: 0.95
  asr: 生父子=生附子；干将=干姜；白族=白术
- type: clinical_tip
  s: 下肢无力抽筋加牛膝；欲阴阳并补则桂枝与白芍同用（单补阳用桂枝，补阴侧重白芍）。
  seq: [43]
  q: 牛膝
  ents: [herb.niu_xi, herb.shao_yao, herb.gui_zhi]
  conf: 0.9
- type: contraindication
  s: 四逆须用生附配干姜；不可用炮附重剂冒充生附——炮附与生附主治不同（如桂附八味用炮附）。
  seq: [68]
  q: 泡附子
  ents: [herb.fu_zi, formula.si_ni_tang]
  conf: 0.9
  asr: 泡芙子/参附子=炮附/生附之辨
- type: clinical_tip
  s: 寒解征象为小便增多（如冰融）；药后手脚转温、抽筋减为向愈。
  seq: [77]
  q: 小便多
  ents: [formula.fu_ling_si_ni_tang]
  conf: 0.9
- type: clinical_tip
  s: 九碗水久煎成三碗：解毒、药力透出，且合经方剂量习惯；首剂得力可当晚深睡。
  seq: [88]
  q: 九碗水煮成三碗
  ents: [herb.fu_zi]
  conf: 0.85
- type: treatment_principle
  s: 停药时机：头面身体觉凉而手脚温热——里寒祛尽、阳归四末。
  seq: [116]
  q: 手脚是温热的
  ents: [formula.si_ni_tang]
  conf: 0.9
- type: prognosis
  s: ALS晚期可至轮椅、吞咽不能；辨为寒证而用生附辛热尚有转机，不知用里寒药则难阻进展。
  seq: [113]
  q: 他是寒症
  ents: [herb.fu_zi, syndrome.han_shi]
  conf: 0.85
