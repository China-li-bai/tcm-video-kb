chapters:
- key: c01
  title: 纯阳九数与导气六数
  start_seq: 0
  summary: 胃经穴（足三里、上巨虚、梁丘等）可行纯阳术（九数）补；泻则同行六数导气收回。提插留针，泻时出针不按孔。
  clauses: []
  topics:
  - acupoint.st36
  - method.bu_xie
- key: c02
  title: 烧针术治瘤痣
  start_seq: 50
  summary: 良性脂肪瘤、黑痣等可用烧针：麻油蘸针烧灼刺入；化脓用较粗针。可三针会刺或八点围刺加燃针（左右捻）。常用28号，示教可用32号。
  clauses: []
  topics:
  - method.shao_zhen
- key: c03
  title: 冲阳运气与梁丘
  start_seq: 194
  summary: 加重时取胃经原穴冲阳或络穴；泻用阴数六，酸麻后可偏向病所（如对乳房）导气。梁丘为胃郄，可同法。
  clauses: []
  topics:
  - acupoint.st42
  - acupoint.st34
  - method.bu_xie
- key: c04
  title: 丰隆治痰
  start_seq: 279
  summary: 丰隆在外踝上八寸胫腓骨间中点，为治痰要穴；亦言可助丰胸。取穴脚宜放平。
  clauses: []
  topics:
  - acupoint.st40
