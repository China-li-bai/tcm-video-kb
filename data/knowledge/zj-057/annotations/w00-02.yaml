- key: c02
  title: 引气与烧山火透天凉
  start_seq: 33
  summary: 针刺先引气（酸麻胀）。烧山火为大补治里寒，透天凉为大泻治大热；紧按慢提为补。天人地三部操作。
  clauses: []
  topics:
  - new.method.shao_shan_huo
  - new.method.tou_tian_liang
  - method.bu_xie
- key: c03
  title: 阳中引阴阴中引阳·寒热多少定补泻先后
  start_seq: 287
  summary: 先寒后热=先补后泻（阳中引阴）；先热后寒=先泻后补。问清寒多/热多或酸多/痛多；表证经络虚实用补泻手法灵活取穴。
  clauses: []
  topics:
  - method.bu_xie
