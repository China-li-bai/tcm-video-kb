chapters:
- key: c01
  title: 丘墟原穴与商丘透刺
  start_seq: 0
  summary: 丘墟在跗骨交接缝，为胆经原穴，主眼疾不分虚实；踝扭伤可商丘透丘墟，从两筋下方穿，一寸半针即可。绝骨可透向三阴交。
  clauses: []
  topics:
  - acupoint.gb40
  - acupoint.sp5
  - acupoint.gb39
- key: c02
  title: 足临泣本穴与地五会
  start_seq: 56
  summary: 足临泣（ASR灵气）为胆经本穴属木，治带脉样环腰痛、眼科及乳房硬块；地五会昔因动脉少针，今细针可用，常用于乳岩/乳房结块。
  clauses: []
  topics:
  - acupoint.gb41
  - acupoint.gb42
  - meridian.gb
- key: c03
  title: 侠溪母穴与窍阴井穴
  start_seq: 81
  summary: 侠溪为母穴，虚证及对侧偏头痛可取；窍阴为胆经井穴/末穴，在四趾外侧，异于五趾至阴。眼外眦痛取窍阴，下睑责厉兑。井穴多用五分针或放血，少灸。
  clauses: []
  topics:
  - acupoint.gb43
  - acupoint.gb44
  - acupoint.bl67
- key: c04
  title: 胆经尽而入肝经
  start_seq: 126
  summary: 窍阴经足底络至大趾侧交肝经隐白一带；胆经流注子时（23–1时），其后入肝。强调熟经络与流注助辨证；下堂讲肝经。
  clauses: []
  topics:
  - meridian.gb
  - meridian.lr
  - acupoint.gb44
