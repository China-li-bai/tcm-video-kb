kps:
- type: clinical_tip
  s: 金匮第十六篇统论惊悸、吐衄、下血、胸满、瘀血诸证。
  seq: [1]
  q: 下血
  ents: [disease.jing_ji, symptom.xia_xue, symptom.xiong_man, disease.yu_xue]
  conf: 0.95
  asr: 经悸=惊悸；吐拗=吐衄；淤血=瘀血
- type: diagnostic_rule
  s: 寸口脉动而弱：动（左右跳）为惊，弱细为悸；悸多因水饮，脐下悸用茯苓。
  seq: [7]
  q: 心悸
  ents: [disease.jing_ji, symptom.xin_ji, herb.fu_ling]
  conf: 0.9
  asr: 精/济=惊/悸；水影=水饮；洗下剂=脐下悸
- type: diagnostic_rule
  s: 衄血止后若目睛金晕黄（眼白仍黄）示未愈，因肝不藏血、木克土；黄退方为真愈。
  seq: [20]
  q: 流鼻血
  ents: [symptom.nv, zangfu.gan]
  conf: 0.9
  asr: 目金晕黄/阴黄=目睛黄晕
- type: pathomechanism
  s: 面无血色、无寒热而脉沉弦，见衄、下血或吐血：血离经；阳不固阴则阴外溢。阿司匹林等耗阳使血管失弹性易出血。
  seq: [57]
  q: 吐血
  ents: [symptom.tu_xie, symptom.nv, symptom.xia_xue, concept.yang_xu]
  conf: 0.9
  asr: 沉玄=沉弦
- type: diagnostic_rule
  s: 吐血咳逆上气、脉数有热不得卧为死候；肝阴实（肝硬肿大）血不归肝可致吐血，夜间不眠程度反映阴结进退。
  seq: [88]
  q: 吐血
  ents: [symptom.tu_xie, zangfu.gan]
  conf: 0.85
  asr: 阴实/因此=阴实；阴结死=阴结
- type: clinical_tip
  s: 常人上寒下热：上身皮肤与腹背凉，手掌足心热；据此可即时判断药是否有效（脚由热转冷则药不对证）。
  seq: [129]
  q: 上寒
  ents: [zangfu.fei, zangfu.xin]
  conf: 0.9
  asr: 上韩夏热=上寒下热
- type: contraindication
  s: 失血家已阴虚，汗血同源，绝对不可发汗；误汗则阳无所附，目不得瞑、不得眠。
  seq: [194]
  q: 发汗
  ents: [method.fa_han, concept.yin_xu, syndrome.wang_xue]
  conf: 0.95
  asr: 失学家/六家=失血家；汗穴同源=汗血同源
- type: diagnostic_rule
  s: 血虚时五脏争血，脉反大；孔脉中空如葱管。望诊手掌苍白无血色亦可辨贫血。
  seq: [254]
  q: 血虚
  ents: [concept.xue_xu]
  conf: 0.9
  asr: 孔脉=芤脉
- type: contraindication
  s: 亡血不可发其表，发汗则寒栗而振；妇人漏下、习惯性流产多属虚寒血虚，宜补血驱寒而非发表。
  seq: [279]
  q: 王学者
  ents: [syndrome.wang_xue, method.fa_han, concept.xue_xu]
  conf: 0.95
  asr: 王血/王学者/王雪茄=亡血
- type: diagnostic_rule
  s: 瘀血证：胸满、唇萎、舌青、口燥但欲漱水不欲咽，无表寒热；舌边齿痕、舌瘀点、少腹压痛可佐。
  seq: [285]
  q: 胸满
  ents: [disease.yu_xue, symptom.xiong_man, zangfu.pi]
  conf: 0.95
  asr: 猪淤汤=诸瘀；唇萎/唇尾=唇萎；内由于=内有瘀
- type: clinical_tip
  s: 貌有热状烦满口干渴而脉不数不浮者，为内有隐瘀，非真表热。
  seq: [322]
  q: 发热
  ents: [disease.yu_xue, symptom.fan_zao]
  conf: 0.9
- type: treatment_principle
  s: 瘀不去则新血不生：贫血久补无效当先活血化瘀；攻瘀与补虚可三七或对半配伍。
  seq: [326]
  q: 淤血
  ents: [disease.yu_xue, concept.xue_xu]
  conf: 0.95
  asr: 瘀不去心不生=瘀不去新不生
- type: clinical_tip
  s: 活血后大便由黑转黄、舌齿痕消退、唇转润、烦躁口燥除，为瘀退之征；久病及肿瘤多兼瘀。
  seq: [340]
  q: 淤血
  ents: [disease.yu_xue]
  conf: 0.85
- type: contraindication
  s: 凡失血状态（大出血、衄、便血、吐血）不可发表；发表含大青龙、小青龙、桂枝汤、葛根类。
  seq: [366]
  q: 发表
  ents: [syndrome.wang_xue, method.fa_biao, formula.gui_zhi_tang, formula.da_qing_long_tang, formula.xiao_qing_long_tang, herb.ge_gen]
  conf: 0.95
  asr: 王学者=亡血家
