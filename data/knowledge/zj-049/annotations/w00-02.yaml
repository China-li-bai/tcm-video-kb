- key: c01
  title: 胆与心包推动胆汁
  start_seq: 0
  summary: 肝如香水瓶、胆如喷头；胆汁受心包/心搏节律推动阵喷入肠助消化。胆木生小肠火。切胆后总管可积石。胆病见呕恶、事物倒逆等；治宜强心清胆疏肝。面部穴少灸（易起泡留疤）。
  clauses: []
  topics:
  - zangfu.dan
  - zangfu.xin_bao
  - zangfu.gan
- key: c02
  title: 听会阳白入胆经
  start_seq: 127
  summary: 目内眦睛明属膀胱；白睛湿热辨阳明与胆经。耳门、听宫、听会皆张口取穴。阳白可沿皮刺向眉中，主额头痛。
  clauses: []
  topics:
  - acupoint.gb2
  - acupoint.gb14
  - meridian.gb
