kps:
- type: concept_definition
  s: 百合病症杂、药食难纳，倪师比神经病；多发于大病初愈或久郁神经质。
  seq: [11, 13]
  q: 大病初愈
  ents: [syndrome.bai_he_bing, herb.bai_he]
  conf: 0.9
  asr: 不惑=狐惑；阴阳独=阴阳毒
- type: pathomechanism
  s: 五脏协调则神志开朗；失和则默然、欲卧不能卧（肾水不生肝木）。
  seq: [30, 58]
  q: 默然
  ents: [syndrome.bai_he_bing]
  conf: 0.85
- type: formula_indication
  s: 百合病误下津伤下利，用滑石利尿止利，不用猪苓茯苓。
  seq: [162, 168]
  q: 选滑石
  ents: [herb.hua_shi, syndrome.bai_he_bing]
  conf: 0.85
  asr: 指粒=止利；下粒=下利
- type: clinical_tip
  s: 汗吐下为中医三法，对应三种误治路径。
  seq: [178]
  q: 汗吐下
  ents: [syndrome.bai_he_bing]
  conf: 0.9
- type: formula_indication
  s: 狐惑精神梦游类证用甘草泻心汤；心下痞硬肠鸣下利恶心即是其证。
  seq: [297, 317]
  q: 甘草泻心汤
  ents: [formula.gan_cao_xie_xin_tang, syndrome.hu_huo]
  conf: 0.9
  asr: 湖货/湖惑/湖霍=狐惑；厨方=经方
- type: clinical_tip
  s: 即便西医诊为动脉血管堵塞，若呈甘草泻心汤证仍当开该方，中医重辨证。
  seq: [322]
  q: 甘草芥心汤
  ents: [formula.gan_cao_xie_xin_tang]
  conf: 0.85
  asr: 芥=泻
