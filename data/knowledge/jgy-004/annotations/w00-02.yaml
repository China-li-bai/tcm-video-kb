chapters:
- key: c01
  title: 百合病概说·情志与五脏
  start_seq: 0
  summary: 金匮第三篇百合狐惑阴阳毒。百合病症杂、药食皆拒，多见大病初愈或久郁神经质；五脏失和则神志异常，欲卧不能卧、欲行不能行。
  clauses: []
  topics:
  - syndrome.bai_he_bing
  - herb.bai_he
- key: c02
  title: 百合误下用滑石与汗吐下三误
  start_seq: 145
  summary: 百合病误下津伤下利，选滑石淡渗利尿止利，不用猪苓茯苓；汗吐下三法对应三种误治。百合宜泡洗涌泉煮以易烂。
  clauses: []
  topics:
  - syndrome.bai_he_bing
  - herb.hua_shi
  - formula.bai_he_hua_shi_san
- key: c03
  title: 狐惑与甘草泻心汤
  start_seq: 274
  summary: 狐惑见咽/阴蚀、眠不安、面色乍变，或类梦游惊恐；甘草泻心汤主之，凭心下痞硬肠鸣下利恶心辨证，勿被西医病名框死。
  clauses: []
  topics:
  - syndrome.hu_huo
  - disease.hu_huo_bing
  - formula.gan_cao_xie_xin_tang
