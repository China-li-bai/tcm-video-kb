- key: c28
  title: 小柴胡汤总论：胸胁苦满与三焦
  start_seq: 2093
  summary: 少阳半表半里、三焦枢纽；往来寒热、胸胁苦满、默默不欲饮食、心烦喜呕即小柴胡。柴半等量，可加减治肝炎、月经期感冒、甲状腺肿等少阳证。月经来潮得感冒一律小柴胡。
  clauses:
  - 96
  - 97
  topics:
  - formula.xiao_chai_hu_tang
  - six_channel.shaoyang
  - zangfu.san_jiao
  - herb.chai_hu
- key: c28.s1
  parent: c28
  title: 小柴胡加减：苓术、栀子、牡蛎软坚
  start_seq: 2155
  summary: 加白术茯苓祛湿；虚烦不眠加栀子；腹中痛去黄芩加芍药；胁下痞硬去大枣加牡蛎软坚（乳癖、瘿瘤、腋下结块）。
  topics:
  - herb.mu_li
  - herb.fu_ling
  - herb.shao_yao
- key: c29
  title: 第107条起 柴胡证罢转渴入阳明；三阳并病用和解
  start_seq: 2376
  summary: 服小柴胡后渴，为转入阳明之佳兆，可按白虎/承气/五苓等治。三阳并病用小柴胡和解。呕家禁用建中（过甜）；有柴胡证但见一证即可用。
  clauses:
  - 101
  - 104
  - 105
  topics:
  - formula.xiao_chai_hu_tang
  - six_channel.yangming
  - formula.xiao_jian_zhong_tang
- key: c30
  title: 小陷胸与建中、大陷胸线索
  start_seq: 2484
  summary: 心下按痛属小结胸病小陷胸汤（小儿不食、腹痛常用）；心中悸烦用小建中；并引出大陷胸危证。
  clauses:
  - 138
  - 100
  topics:
  - formula.xiao_xian_xiong_tang
  - formula.xiao_jian_zhong_tang
