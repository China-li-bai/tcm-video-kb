kps:
- type: formula_indication
  s: 小柴胡汤主少阳：往来寒热、胸胁苦满、默默不欲饮食、心烦喜呕；胁肋痛一闻即可径开。
  seq:
  - 2130
  - 2145
  q: 我这个肋骨之间很痛，已经已经看完了哦，女人都不用看到，小柴胡汤就开出去了
  ents:
  - formula.xiao_chai_hu_tang
  - six_channel.shaoyang
  conf: 0.9
- type: formula_composition
  s: 小柴胡中柴胡与半夏等量（一为容积一为重量）；为防传入阴经的枢纽方，可以此为基础广泛加减。
  seq:
  - 2136
  - 2232
  q: 柴胡汤小柴胡汤里面呢柴胡汤半夏是相等的量
  ents:
  - formula.xiao_chai_hu_tang
  - herb.chai_hu
  - herb.ban_xia
  conf: 0.85
- type: clinical_tip
  s: 妇女月经期感冒，不论太阳中风伤寒温病，一律小柴胡汤；亦治月经痛、瘿瘤、腋下结块等少阳三焦证。
  seq:
  - 2284
  - 2298
  q: 只要你月经来得了感冒，一律小柴胡汤
  ents:
  - formula.xiao_chai_hu_tang
  conf: 0.9
- type: herb_property
  s: 牡蛎味咸软坚，治胁下痞硬、乳癖、大脖子、腋下硬块；可与小柴胡同用（去大枣加牡蛎）。
  seq:
  - 2323
  - 2327
  q: 蛎加牡蛎，那这个米力的的能软坚
  ents:
  - herb.mu_li
  - formula.xiao_chai_hu_tang
  conf: 0.85
  asr: 米力=牡蛎
- type: diagnostic_rule
  s: 服小柴胡后转渴，示邪入阳明，为向愈机转，再按阳明热/燥选用白虎、承气或五苓等。
  seq:
  - 2377
  - 2386
  q: 喝了柴胡汤汤后转成渴，症变变成进入阳明症
  ents:
  - formula.xiao_chai_hu_tang
  - six_channel.yangming
  conf: 0.85
- type: treatment_principle
  s: 三阳并病用和解法，即小柴胡汤；汗吐下和四法中「和」即指此。
  seq:
  - 2470
  - 2478
  q: 如果三阳并病太阳病少阳病明明同时有的时候用和解小柴胡汤
  ents:
