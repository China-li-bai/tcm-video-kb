kps:
- type: diagnostic_rule
  s: 汗吐下后阴阳自和的指征：寸尺脉转缓不浮、医患一呼一吸间约四至五至、自觉舒服略累、汗已止且不渴——此时勿再投药，必自愈。
  seq: [487, 496]
  q: 这就代表从脉上面可以知道，阴阳和
  ents: [concept.yin_yang, pulse.huan]
  conf: 0.85
- type: treatment_principle
  s: 经方大原则：病症已去后勿急用滋阴药，应待阴液自行回复才算真愈；健康人可食补，病中不以补药代痊愈。
  seq: [497, 502]
  q: 要让他自己回头好才是真的痊愈
  ents: [person.zhang_zhong_jing, concept.jin_ye]
  conf: 0.85
- type: clause_interpretation
  s: 第59条：大下之后又发汗，见小便不利（量少而非淋痛结石），为津液暂伤，勿治之，得小便利则愈。
  seq: [504, 509]
  q: 小便不利者，王清也不也勿治之，得小便利必愈
  ents: [clause.shl.059, symptom.xiao_bian_bu_li, concept.jin_ye]
  conf: 0.9
  asr: 大夏=大下；王清=亡津液
- type: diagnostic_rule
  s: 吐下后判断邪尽的技巧：若服药（如峻吐剂）后出现明显口渴，多表示邪已净、津已伤，勿再投药；不渴则邪未必尽。
  seq: [515, 521]
  q: 我问你渴不渴，我很口渴。好了，结束了
  ents: [concept.jin_ye, new.symptom.口渴]
  conf: 0.8
- type: treatment_principle
  s: 第60条：先下后汗属顺序错误，可见怕冷、表里皆虚；张仲景写作「内外俱虚」而不写阴虚阳虚，以免医者滥开滋阴。无险象时宜食补静养。
  seq: [525, 535]
  q: 他绝对不会选阴虚阳虚，他不用这个字的
  ents: [clause.shl.060, new.concept.内外俱虚, concept.yin_xu]
  conf: 0.85
- type: clause_interpretation
  s: 第61条：下之后复发汗，昼日烦躁不得眠、夜而安静、不渴、身无大热、脉沉，为阳虚，干姜附子汤主之。
  seq: [543, 561]
  q: 病人呢出现了昼日躁不得眠
  ents: [clause.shl.061, formula.gan_jiang_fu_zi_tang, symptom.fan_zao, concept.yang_xu]
  conf: 0.9
- type: clinical_tip
  s: 临床最怕烦躁：安宁病房临终多见烦躁手足乱动；一旦昼烦夜安就要处方，仅「人虚而平稳」可观察勿药。
  seq: [545, 607]
  q: 一旦遇到烦躁烦躁了，病人会白天很烦躁啊，晚上很正常
  ents: [symptom.fan_zao]
  conf: 0.85
- type: herb_property
  s: 干姜附子汤：干姜约二钱温中温肺，生附子约二钱（去皮破八片）温心阳、补命门；肾阳不足多用炮附子，四逆救心阳可用生附子。
  seq: [561, 573]
  q: 干姜呢，你不要真的开一两哈
  ents: [formula.gan_jiang_fu_zi_tang, herb.gan_jiang, herb.fu_zi, formula.si_ni_tang]
  conf: 0.85
- type: herb_property
  s: 生附子增强心收缩力而不加快心率；麻黄则加速心率。附子形如心、色黑入肾，为肾中水中之火，使死水变活。
  seq: [575, 580]
  q: 生附子不会啊，这两个不太一样好
  ents: [herb.fu_zi, herb.ma_huang]
  conf: 0.85
- type: treatment_principle
  s: 张仲景补阳不补阴：干姜附子汤使阳回则阴自生，不加生地麦冬等滋阴药。
  seq: [582, 585]
  q: 阳会回头阳回来以后，阴会自己会慢慢慢回来
  ents: [formula.gan_jiang_fu_zi_tang, concept.yang_xu]
  conf: 0.9
- type: clinical_tip
  s: 小儿冻疮外敷干姜附子粉不够，须同时内服当归四逆汤等，才能避免截肢之祸；先熟伤寒再读他书才不致迷惑。
  seq: [587, 595]
  q: 光是外敷不够
  ents: [formula.dang_gui_si_ni_tang, formula.gan_jiang_fu_zi_tang]
  conf: 0.8
- type: formula_indication
  s: 第62条桂枝新加汤：发汗后身疼痛、脉沉迟，表邪已去而津伤；于桂枝汤增芍药、生姜各一两并加人参三两。汗漏不止当用桂枝加附子汤，二者不可互换。
  seq: [613, 626]
  q: 这个新加汤跟我们前面的桂枝汤家附子不一样
  ents: [clause.shl.062, formula.gui_zhi_jia_shao_yao_sheng_jiang_ge_yi_liang_ren_shen_san_liang_xin_jia_tang, formula.gui_zhi_jia_fu_zi_tang, pulse.mai_chen_chi]
  conf: 0.9
  asr: 心加汤/新家汤=新加汤
- type: treatment_principle
  s: 经方「滋阴」多用生晒参、生姜、甘草、芍药，重在恢复脏腑阳气令阴液自生，而非以外源性滋阴药取代自体制造（类比激素、胰岛素使人退化）。
  seq: [627, 642]
  q: 希望你阴液要治回，而不是你补阴的药给你
  ents: [herb.ren_shen, herb.shao_yao, concept.yang_qi]
  conf: 0.8
- type: clinical_tip
  s: 服发表药后宜清淡米汤或烂面，忌油腻肉类与寒凉生菜沙拉；次日中午胃气回复即为可复常食的标志。
  seq: [654, 669]
  q: 第二天中午胃气回复了
  ents: [formula.gui_zhi_tang, method.fa_han]
  conf: 0.85
- type: contraindication
  s: 汗漏不止误投新加汤会「边补津边漏汗」越补越坏；表虚汗漏须桂枝加附子汤收敛。
  seq: [671, 679]
  q: 流汗不止的时候，要桂枝汤加附子，不要给他新加汤
  ents: [formula.gui_zhi_jia_fu_zi_tang, formula.gui_zhi_jia_shao_yao_sheng_jiang_ge_yi_liang_ren_shen_san_liang_xin_jia_tang]
  conf: 0.9
- type: clause_interpretation
  s: 第63条：发汗后汗出而喘、无大热，予麻黄杏仁甘草石膏汤；热已退仅余喘咳短气时用之，本方有麻黄但不发汗。
  seq: [681, 690]
  q: 汗出而喘，无大恶者咳与好麻杏甘草汤
  ents: [clause.shl.063, formula.ma_huang_xing_ren_gan_cao_shi_gao_tang]
  conf: 0.9
  asr: 无大恶=无大热；麻杏甘草=麻杏甘石
- type: formula_composition
  s: 大青龙类黄金比例：麻黄剂量≈石膏+杏仁之和（如麻黄六钱则石膏四杏仁二），可防伤津；痰多热轻则石膏减杏仁增，但石膏与杏仁之和仍应与麻黄等。
  seq: [698, 720]
  q: 四加二是不六钱，刚好跟麻黄汤等的
  ents: [formula.da_qing_long_tang, herb.ma_huang, herb.shi_gao, herb.xing_ren]
  conf: 0.85
- type: clinical_tip
  s: 高热喘甚如SARS类大青龙证，麻黄剂量不足会误事，须按比例重用；麻杏甘石本身不针对高热，见高热却开本方即属误治。
  seq: [714, 724]
  q: 麻辛甘蔗汤不是要治治疗发烧的
  ents: [formula.ma_huang_xing_ren_gan_cao_shi_gao_tang, formula.da_qing_long_tang]
  conf: 0.85
  asr: 大青香/大陷胸多为大青龙之误
- type: clause_interpretation
  s: 第64条：发汗过多见叉手自冒、心下悸，桂枝甘草汤主之；多为麻黄汤发汗太过，肺津外泄而下焦水气上冲不及补位。
  seq: [738, 740]
  q: 擦手自冒，心心下悸
  ents: [clause.shl.064, formula.gui_zhi_gan_cao_tang, symptom.cha_shou_zi_mao_xin, symptom.xin_xia_ji]
  conf: 0.9
- type: diagnostic_rule
  s: 脐周动悸分脏：脐上属肾、脐左属肝、脐下属心、脐右属肺、正中属脾；按之舒适多为虚水上冲，按之剧痛须警惕癥积。
  seq: [745, 794]
  q: 肚脐的左边有洞悸，从肝脏肚脐以下，我们从心脏
  ents: [zangfu.xin_xia, zangfu.pi]
  conf: 0.75
  asr: 洞悸=动悸
- type: pathomechanism
  s: 肺津靠「饮食之水」经小肠腐熟、大肠气化上潮而来；仅喝水难止渴。麻黄汤后肺水外泄，下焦水来不及上补则停于心下而悸。
  seq: [765, 790]
  q: 肺里面的精液会往外走
  ents: [formula.ma_huang_tang, concept.jin_ye, zangfu.fei]
  conf: 0.85
- type: formula_composition
  s: 桂枝甘草汤桂枝四两、甘草二两，顿服；桂枝能降冲逆、气化心下水气。桂枝加桂汤则于桂枝汤中加肉桂，用于奔豚一类冲脉上逆。
  seq: [817, 831]
  q: 桂枝四这甘草二
  ents: [formula.gui_zhi_gan_cao_tang, formula.gui_zhi_jia_gui_tang, herb.gui_zhi, meridian.tv]
  conf: 0.85
- type: clause_interpretation
  s: 第65条：发汗后脐下悸、欲作奔豚，茯苓桂枝甘草大枣汤主之；多因桂枝汤发汗太过。苓桂甘枣较桂枝甘草汤多茯苓、大枣，茯苓能去烦。
  seq: [843, 862]
  q: 七十条呢吃桂枝汤太过好，所以动剂的位置不一样
