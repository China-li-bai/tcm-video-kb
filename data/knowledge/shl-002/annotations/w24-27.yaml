kps:
- type: clause_interpretation
  s: 第107条：表未解误下，胸满烦惊、小便不利、谵语、一身尽重不可转侧，柴胡加龙骨牡蛎汤主之。
  seq:
  - 3050
  - 3084
  q: 柴胡加龙骨牡蛎汤的处方
  ents:
  - clause.shl.107
  - formula.chai_hu_jia_long_gu_mu_li_tang
  conf: 0.85
- type: herb_property
  s: 龙骨潜阳收敛固涩偏治滑泄；牡蛎软坚兼生津偏治硬块与小便多；筋惕肉瞤用二者敛阳。
  seq:
  - 3120
  - 3134
  q: 当你精湿掉的时候，我们会重用龙骨
  ents:
  - herb.long_gu
  - herb.mu_li
  conf: 0.85
- type: formula_composition
  s: 柴胡加龙骨牡蛎汤重用柴胡，合龙牡桂枝茯苓人参等，用于误下后少阳兼神志不安。
  seq:
  - 3140
  - 3150
  q: 我们柴胡一定是重用柴胡嘛
  ents:
  - formula.chai_hu_jia_long_gu_mu_li_tang
  - herb.chai_hu
  conf: 0.85
- type: contraindication
  s: 太阳表证当汗解，禁用火熏烧针强求出汗；火逆可致衄、发黄、惊狂等。
  seq:
  - 3391
  - 3453
  q: 明言火逆哈
