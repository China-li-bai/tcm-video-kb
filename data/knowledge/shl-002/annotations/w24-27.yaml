  title: 龙骨牡蛎辨用
  start_seq: 3120
  summary: 早泄重龙骨，遗精尿多偏重牡蛎；等量或按症。牡蛎粉可外敷烫伤。
  topics:
  - herb.long_gu
  - herb.mu_li
- key: c35
  title: 火劫火逆与烧针奔豚
