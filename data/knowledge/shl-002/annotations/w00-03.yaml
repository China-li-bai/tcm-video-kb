kps:
- type: clause_interpretation
  s: 第42条：太阳病外证未解、脉浮弱者当以汗解，宜桂枝汤；中风证仍在即仍可用，不限于初病。
  seq: [2, 4]
  q: 脉浮弱者当以汗解桂枝汤
  ents: [clause.shl.042, formula.gui_zhi_tang, pulse.mai_fu_ruo, syndrome.tai_yang_zhong_feng]
  conf: 0.9
- type: formula_indication
  s: 桂枝汤证又兼咳嗽或微喘时，于桂枝汤上加厚朴、杏仁，即桂枝加厚朴杏子汤。
  seq: [8, 14]
  q: 本身有桂枝汤证，那还是有带有咳嗽
  ents: [formula.gui_zhi_jia_hou_po_xing_zi_tang, formula.gui_zhi_tang, herb.hou_po, herb.xing_ren, disease.ke_sou]
  conf: 0.85
  asr: 后补/候补=厚朴；柜子=桂枝；hope=厚朴；白竹=白术
- type: herb_property
  s: 厚朴祛「皮湿」：把脾湿迁入小肠，使小肠能增润津液；承气类方用厚朴亦同此意。
  seq: [18, 22]
  q: 帮忙脾脏搬家，把脾脏的呢呢到小肠里面去
  ents: [herb.hou_po, zangfu.pi, zangfu.xiao_chang, concept.jin_ye]
  conf: 0.85
  asr: 厚谱/后补=厚朴；皮脏=脾脏
- type: herb_property
  s: 白术祛肌肉关节与中焦之湿，须配茯苓才能从小便尽去；白术配炮附子则是祛湿并向表推邪（如阴疽、骨脓），与配茯苓利尿不同。
  seq: [23, 32]
  q: 白术的时候，你不用茯苓的时候，湿就不会完全去掉
  ents: [herb.bai_zhu, herb.fu_ling, herb.fu_zi]
  conf: 0.85
  asr: 白族=白术；泡附子=炮附子
- type: herb_property
  s: 杏仁止咳祛痰，并能润肺中津液；本方用量大约四至五钱。
  seq: [34, 41]
  q: 这杏人呢能够止咳
  ents: [herb.xing_ren]
  conf: 0.85
  asr: 杏人=杏仁；精液=津液
- type: clinical_tip
  s: 用发表药时，理想汗出是皮肤湿哒哒、摸上去又似无大汗的「湿绵绵」，而非大汗淋漓。
  seq: [43, 44]
  q: 就是湿绵绵的这种最好好
  ents: [method.fa_biao, method.fa_han]
  conf: 0.9
- type: treatment_principle
  s: 大原则：有表证必先解表再攻里；仅当大便五六日不下且人烦躁等必要时才考虑表里双解，切不可有表直接攻下。
  seq: [46, 52]
  q: 一定要先解表再去谈理，这是大原则
  ents: [method.jie_biao, formula.gui_zhi_tang, concept.biao_li]
  conf: 0.9
- type: clause_interpretation
  s: 第45条意：太阳病先发汗不解而又下之，若脉仍浮，说明病未离表，仍可用桂枝汤。
  seq: [54, 56]
  q: 脉浮呢，所以我们知道病还在外要解的还是用桂枝汤
  ents: [clause.shl.045, formula.gui_zhi_tang, pulse.fu]
  conf: 0.85
- type: clause_interpretation
  s: 第46条：脉浮紧、无汗、发热身疼痛，虽已八九日、过一候（六日）本当入里，表证仍在则仍予麻黄汤。
  seq: [57, 63]
  q: 虽然过了一个候啊，一猴就是六天以后表症，还是有你还是要麻黄汤
  ents: [clause.shl.046, formula.ma_huang_tang, pulse.mai_fu_jin, syndrome.tai_yang_shang_han]
  conf: 0.9
  asr: 麦浮井=脉浮紧；一猴=一候
- type: clinical_tip
  s: 麻黄汤后仅微汗而烦躁继以衄血，常见于十四岁以下纯阳之体，衄可作汗解之机，不必惊慌；小儿常衄者往往不易高烧。
  seq: [64, 80]
  q: 小孩子呢你只要发，只要是常常流鼻血的，他不会发高烧的哦
  ents: [formula.ma_huang_tang, symptom.nv, symptom.fan_zao]
  conf: 0.8
- type: diagnostic_rule
  s: 三四十岁无脉浮紧发热身痛而流鼻血，不可当「衄解」放过，须查明有无里病。
  seq: [104, 105]
  q: 三四十岁的人没事，也没有也没有拜辅警的发热
  ents: [symptom.nv]
  conf: 0.75
  asr: 拜辅警=脉浮紧
- type: pathomechanism
  s: 二阳并病：太阳发汗手软、汗出不彻，津液被提至体表却未透出，肠胃津液亏则转阳明，可见下利、恶心呕吐或便秘，若太阳症未尽则不可攻下。
  seq: [113, 127]
  q: 汗出不彻照，然后过了六天，结果呢转到阳明病
  ents: [clause.shl.048, six_channel.yangming, formula.gui_zhi_tang, formula.ge_gen_tang, concept.jin_ye]
  conf: 0.85
  asr: 二阳命病=二阳并病
- type: contraindication
  s: 只要表证仍在，即使已见便秘也不可攻下，恐表邪下陷于肺或三焦等。
  seq: [127, 132]
  q: 只要病人有表证在那边，你就不可以攻下
  ents: [syndrome.biao_zheng, method.fa_han]
  conf: 0.9
- type: clinical_tip
  s: 已发过汗而未透者，宜小发汗或以甘草、菖蒲、艾草等蒸汽熏之令微汗，勿再大发。
  seq: [133, 142]
  q: 小小发汗就好了，不用大发汗啊
  ents: [method.fa_han, herb.gan_cao, herb.chang_pu]
  conf: 0.8
- type: pathomechanism
  s: 汗出不彻可见游走性痛楚、不知痛处固定；脉偏细微（涩脉）是汗未透的指征，再予适当发汗可愈。
  seq: [145, 152]
  q: 这种就是汗出，没有透彻
  ents: [pulse.se, method.fa_han]
  conf: 0.8
  asr: 色脉=涩脉
- type: clinical_tip
  s: 治病要因时因地制宜：汗后当风致邪不尽时，可先以水梨等补津液再予麻黄汤，不必拘泥一定要熏蒸。
  seq: [174, 179]
  q: 要因时因地制宜嘛
  ents: [formula.ma_huang_tang, concept.jin_ye]
  conf: 0.85
- type: clause_interpretation
  s: 第49条：脉浮数者法当汗出而愈；若误下致身重、心有动悸，则不可再发汗，当俟其自汗而解。
  seq: [184, 195]
  q: 身重心有动悸者，这时候不可发汗了
  ents: [clause.shl.049, pulse.mai_fu_shu, symptom.shen_zhong, symptom.xin_ji]
  conf: 0.9
  asr: 麦浮附字=脉浮数
- type: pathomechanism
  s: 汗为心液：素虚之人发汗后血中津液不足则心悸；尺脉细弱主阴虚。伤寒家此时主张休息食养待阴液自回，不必急用温病派滋阴药。
  seq: [197, 214]
  q: 探为心液
  ents: [new.concept.汗为心液, concept.yin_xu, symptom.xin_ji]
  conf: 0.85
  asr: 探为心液=汗为心液；齿脉=尺脉
- type: clinical_tip
  s: 里虚汗后不宜再攻表：让病人多喝稀饭、番薯粥配酱菜等易消化物，必要时略用葱姜助微汗，待表里都实时自汗而愈。
  seq: [204, 217]
  q: 让他多喝点稀饭啊
  ents: [concept.jin_ye, herb.sheng_jiang]
  conf: 0.85
- type: contraindication
  s: 第50条：脉浮紧身疼痛本当汗解；若尺中迟，为营不足、血少，不可发汗。
  seq: [218, 225]
  q: 因为他营气不足，血少
  ents: [clause.shl.050, pulse.mai_fu_jin, concept.ying_qi]
  conf: 0.9
- type: concept_definition
