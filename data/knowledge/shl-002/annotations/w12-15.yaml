kps:
- type: diagnostic_rule
  s: 虚烦与实热：实热苔黄厚脉实；虚烦苔微黄、脉按之无，自觉不适而言不清。
  seq:
  - 1459
  - 1463
  q: 那如果是实热的时候，舌苔是黄
  ents:
  - symptom.xu_fan
  conf: 0.85
- type: formula_composition
  s: 栀子豉汤少气加甘草；仲景滋补不过甘草人参白芍。甘草兼解肠中残余宿食之毒。
  seq:
  - 1467
  - 1475
  q: 张仲景加了一个甘草
  ents:
  - formula.zhi_zi_shi_tang
  - herb.gan_cao
  conf: 0.9
- type: herb_property
  s: 病后呕恶用生姜不用半夏：半夏去胃中寒水，但津刚回时再沥则伤津；生姜止呕且为食物。
  seq:
  - 1509
  - 1520
  q: 这里不用办夏为什么
  ents:
  - herb.sheng_jiang
  - herb.ban_xia
  conf: 0.85
  asr: 办夏=半夏
- type: clinical_tip
  s: 表邪下陷成下利（肠病毒样）用葛根黄芩黄连汤；对证则苦药反觉甘甜，与五苓散「水入则吐独不吐散」同类。
  seq:
  - 1548
  - 1569
  q: 就是表邪下陷
  ents:
  - new.formula.葛根黄芩黄连汤
  - formula.wu_ling_san
  conf: 0.8
- type: formula_composition
  s: 栀子豉汤约栀子五钱、豆豉五钱；先煮栀子后下豆豉。
  seq:
  - 1578
  - 1586
  q: 一般呢栀子用五钱，豆豉也是五钱钱
  ents:
  - formula.zhi_zi_shi_tang
  conf: 0.9
- type: clause_interpretation
  s: 有表汗下后烦热胸中窒，虚热未清，栀子豉汤主之。
  seq:
  - 1590
  - 1594
  q: 烦热好，胸中炙者好，栀子豆汤汤
  ents:
  - clause.shl.077
  - formula.zhi_zi_shi_tang
  conf: 0.85
  asr: 胸中炙=胸中窒
- type: herb_property
  s: 厚朴专主腹满（虚实皆可用），移脾湿入肠；枳实主胸满宽肠，胸痛证中不用白芍。
  seq:
  - 1624
  - 1645
  q: 候补呢是专门对腹部胀满用的
  ents:
  - herb.hou_po
  - herb.zhi_shi
  conf: 0.85
- type: clinical_tip
  s: 胆石基本方思路：炙甘草强心、柴胡疏三焦、黄芩清湿热、枳实宽胆，可加海金沙等。
  seq:
  - 1687
  - 1692
  q: 然后再加上子石子可以宽胆
  ents:
  - herb.zhi_shi
  - herb.chai_hu
  - herb.huang_qin
  conf: 0.8
- type: contraindication
  s: 素体下利虚寒者慎栀子豉汤；若用配干姜反佐。
  seq:
  - 1739
  - 1743
  q: 栀子豆豉本来就是比较寒凉的药
  ents:
  - formula.zhi_zi_shi_tang
  - herb.gan_jiang
  conf: 0.85
- type: contraindication
  s: 衄家、咽干、疮家、亡血及中寒者不可强发汗；中寒再汗则胃中冷而吐。
  seq:
  - 1883
  - 1927
  q: 虐家也不可发汗，就是常常流鼻血的人
  ents:
