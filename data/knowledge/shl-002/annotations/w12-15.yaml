chapters:
- key: c23b
  title: 栀子豉汤类方：少气、呕恶与葛根黄连
  start_seq: 1459
  summary: 续虚烦辨虚实热；少气加甘草，呕用栀子生姜豉汤（病后津回勿用半夏再沥）；表邪下陷下利用葛根黄芩黄连汤。栀豉约各五钱，先栀后豉。
  clauses:
  - 76
  - 77
  topics:
  - formula.zhi_zi_shi_tang
  - herb.zhi_zi
  - herb.sheng_jiang
- key: c24
  title: 第77–79条 烦热胸中窒；厚朴枳实与胆石思路
  start_seq: 1590
  summary: 汗下后烦热胸中窒仍栀子豉。腹满虚实皆可用厚朴；胸满用枳实不用白芍。枳实宽肠扩胆，合柴胡黄芩炙草为胆石基本思路。
  clauses:
  - 77
  - 78
  - 79
  topics:
  - herb.hou_po
  - herb.zhi_shi
  - formula.zhi_zi_shi_tang
- key: c24.s1
  parent: c24
  title: 栀子配干姜：虚寒下利慎栀豉
  start_seq: 1717
  summary: 素体下利虚寒者栀豉偏凉宜慎；需用则配干姜反佐。
  clauses:
  - 80
- key: c25
  title: 诸家不可发汗：咽干、疮、衄、亡血、中寒
  start_seq: 1747
  summary: 咽喉干燥、疮家、衄家、亡血家及中寒者不可强汗；再汗则胃中冷吐。引出小柴胡将详论。
  clauses:
  - 83
  - 86
  - 89
  topics:
  - method.fa_han
  - concept.jin_ye
- key: c26
  title: 治则：有是证用是药
  start_seq: 1959
  summary: 无表而见承气燥结则攻里，不可因伤寒之名强汗。
  clauses:
  - 90
  topics:
  - method.fa_han
