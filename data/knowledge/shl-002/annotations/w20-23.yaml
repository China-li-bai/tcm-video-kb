kps:
- type: formula_indication
  s: 大柴胡汤：呕不止、心下急、郁郁微烦，或少阳兼阳明便秘烦躁；去小柴胡之人参加大黄枳实。
  seq:
  - 2573
  - 2587
  q: 也有大柴胡汤下肢者欲
  ents:
  - formula.da_chai_hu_tang
  - formula.xiao_chai_hu_tang
  conf: 0.85
  asr: 下肢者欲=下之则愈一类
- type: diagnostic_rule
  s: 少阳阳明间证：有往来寒热胸胁苦满又见便秘烦躁，用大柴胡；单纯少阳或太阳转入少阳用小柴胡。
  seq:
  - 2580
  - 2586
  q: 当你出现的少阳跟阳明中间兼政的时候，才是会有大柴胡汤的现象
  ents:
  - formula.da_chai_hu_tang
  - six_channel.shaoyang
  - six_channel.yangming
  conf: 0.9
- type: formula_composition
  s: 大柴胡：小柴胡去人参，加枳实、大黄；腹满再加厚朴。芍药与半夏等量。
  seq:
  - 2637
  - 2643
  q: 里面有加了子时，比小柴胡汤多了
  ents:
  - formula.da_chai_hu_tang
  - herb.zhi_shi
  - herb.da_huang
  conf: 0.85
- type: clinical_tip
  s: 潮热大便硬而兼柴胡证：先小柴胡解外，再柴胡加芒硝；芒硝专破大肠头燥屎。
  seq:
  - 2764
  - 2770
  q: 先以小柴胡汤进解外，再以柴胡加芒硝汤组织
  ents:
  - formula.chai_hu_jia_mang_xiao_tang
  - formula.xiao_chai_hu_tang
  conf: 0.85
- type: treatment_principle
  s: 误下后若柴胡证仍在，仍可再予小柴胡，不必因误下而弃方。
  seq:
  - 2730
  - 2730
  q: 只要有证还在，再他柴胡汤，还可以再用好
  ents:
  - formula.xiao_chai_hu_tang
  conf: 0.85
- type: clause_interpretation
  s: 第106条桃核承气：太阳瘀热结于膀胱，少腹急结、如狂，表解乃可攻；桃仁活血合调胃承气。
  seq:
  - 2928
  - 3006
  q: 外郁解，但少妇急竭者乃可攻之桃，而承气汤
  ents:
