  - formula.tao_he_cheng_qi_tang
  - symptom.ru_kuang
  conf: 0.85
  asr: 少妇急竭=少腹急结；调核=桃核
- type: formula_composition
  s: 桃核承气比例：桃仁三、桂枝二、大黄四，下合芒硝炙草即调胃承气加桃仁桂枝。
  seq:
  - 3003
  - 3006
  q: 桃仁是三，桂枝是二，大黄是四
