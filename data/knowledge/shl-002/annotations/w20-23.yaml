chapters:
- key: c31
  title: 第103–105条 大柴胡汤：少阳兼阳明
  start_seq: 2573
  summary: 柴胡证仍在先予小柴胡；呕不止、心下急、郁郁微烦为未解，大柴胡汤主之。少阳与阳明兼（便秘烦躁）方用大柴胡：去人参加大黄枳实，腹满加厚朴。临床治大肠癌未手术、阑尾炎等少阳阳明间证。
  clauses:
  - 103
  - 104
  - 105
  topics:
  - formula.da_chai_hu_tang
  - formula.xiao_chai_hu_tang
  - six_channel.yangming
- key: c31.s1
  parent: c31
  title: 大柴胡与承气、柴胡加芒硝
  start_seq: 2675
  summary: 小承气多矢气、大承气无屁；潮热大便硬先小柴胡解外，再柴胡加芒硝。大肠癌未手术多在少阳阳明之间，动刀后机局改变。
  topics:
  - formula.chai_hu_jia_mang_xiao_tang
  - formula.da_cheng_qi_tang
- key: c32
  title: 误下后柴胡证仍在仍可用；党参代人参
  start_seq: 2715
  summary: 本是柴胡证而误下，证仍在则可再用小柴胡；人参价昂可以党参代。
  clauses:
  - 101
  topics:
  - formula.xiao_chai_hu_tang
  - herb.ren_shen
- key: c33
  title: 第106条 桃核承气汤：热结膀胱如狂
  start_seq: 2921
  summary: 太阳随经瘀热在里、少腹急结、如狂，外解乃可攻，桃核承气汤（桃仁桂枝合调胃承气）。伤科瘀血、会阴损伤亦常用。
  clauses:
  - 106
  topics:
  - formula.tao_he_cheng_qi_tang
  - zangfu.pang_guang
  - symptom.ru_kuang
