chapters:
- key: c01
  title: 头侧本神头临泣目窗
  start_seq: 0
  summary: 阳白前为本神；头临泣（ASR头灵气）自瞳孔线上入发际约寸半；目窗（ASR汗木窗）等头侧穴主眼科，胆经上头而胃经止于面。
  clauses: []
  topics:
  - acupoint.gb13
  - acupoint.gb15
  - acupoint.gb16
  - meridian.gb
- key: c02
  title: 风池取穴与项强手法
  start_seq: 39
  summary: 风池在两项大筋间最凹；俯卧头正，针向对侧颧/旋梁方向斜刺。风府等同属后脑受风；项强可针外加火罐、膀胱经米酒刮痧。
  clauses: []
  topics:
  - acupoint.gb20
  - acupoint.gv16
  - meridian.bl
- key: c03
  title: 肩井配足三里与禁忌
  start_seq: 74
  summary: 肩井在肩峰最高肌腹中，宜浅刺；配健侧足三里引气，防气闷胸。孕妇禁针肩井恐动胎；深刺可穿肺。项酸常用后溪。
  clauses: []
  topics:
  - acupoint.gb21
  - acupoint.st36
  - acupoint.si3
- key: c04
  title: 日月京门与带脉穴
  start_seq: 129
  summary: 胆募为日月非京门；京门为肾募，常配肾俞/命门，针约一寸。带脉、五枢、维道三穴属奇经带脉，主带下与带脉痛。
  clauses: []
  topics:
  - acupoint.gb24
  - acupoint.gb25
  - acupoint.gb26
  - meridian.bv
- key: c05
  title: 华佗夹脊与腰痛辨经
  start_seq: 241
  summary: 督旁上下痛属华佗夹脊；带脉病痛横行不下行。胆经本穴配足三里等可治夹脊类背痛。
  clauses: []
  topics:
  - acupoint.ex_jia_ji
  - meridian.gv
  - meridian.gb
