chapters:
- key: c01
  title: 热极生寒与石膏白虎
  start_seq: 0
  summary: 阴阳圆形、热极生寒；石膏清肺胃三焦气分热，大热狂渴白虎汤证。对比西医降糖路径与中医生津补肾合石膏之治消渴。金石类粉入棉布袋煎。
  clauses: []
  topics: [herb.shi_gao, formula.bai_hu_tang, herb.shi_liu_huang]
- key: c02
  title: 干姜葛根与气化利水
  start_seq: 230
  summary: 干姜异于生姜，助水气化、肺为水之上源；水肿利水常配干姜。葛根汤发太阳阳明，鲜葛根可外敷。
  clauses: []
  topics: [herb.gan_jiang, herb.sheng_jiang, herb.ge_gen]
- key: c03
  title: 栝蒌根麻黄当归芍药
  start_seq: 470
  summary: 栝蒌根又名天花粉，清热生津治消渴；麻黄茎轻上散，戒滥作减肥。当归活血；白芍赤芍同源，当归川芎芍药合用补血活血。
  clauses: []
  topics: [herb.gua_lou_gen, herb.ma_huang, herb.dang_gui, herb.shao_yao]
- key: c04
  title: 秦艽续断百合知母
  start_seq: 1100
  summary: 秦艽（ASR芹交）左右交缠主经脉疼痛、续接经脉，骨折常配续断。百合可作食；知母水气盛、清气分热，白虎多方用知母。
  clauses: []
  topics: [new.herb.qin_jiao, herb.xu_duan, herb.bai_he, herb.zhi_mu]
- key: c05
  title: 紫菀紫草败酱
  start_seq: 1660
  summary: 紫菀（ASR紫月）温、祛痰止咳，寒咳肺痈可用。紫草寒凉治麻疹痘疹，勿泥于禁忌。败酱（ASR败姜）治肠痈腹膜炎类证，常合附子薏苡。
  clauses: []
  topics: [herb.zi_wan, herb.zi_cao, herb.bai_jiang]
- key: c06
  title: 紫参白鲜白薇苦瓜根海藻
  start_seq: 1900
  summary: 紫参汤治下利腹痛。白鲜色白入肺兼疏肝毒。白薇凉血退热治中风狂惑。苦瓜根吐下、可落胎，经期慎。海藻为长寿零食，散瘿消痰。
  clauses: []
  topics: [herb.zi_can, herb.bai_xian, herb.bai_wei, new.herb.ku_gua_gen, herb.hai_zao]
