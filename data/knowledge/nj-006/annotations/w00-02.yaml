- key: c01
  title: 热论·伤寒温病与六日传变
  start_seq: 0
  summary: 热病皆伤寒之类；温病源于伤寒。一日巨阳→六日厥阴传变；两感于寒则危。未满三日在阳可汗解，满三日入里可利二便。
  clauses: []
  topics:
  - syndrome.shang_han
  - syndrome.wen_bing
  - concept.liu_jing
- key: c02
  title: 病衰日程与复热禁忌
  start_seq: 131
  summary: 不两感者自七日巨阳病衰起逐日消退。热病初愈忌肉食，防遗热复燃；治当辨脏与十二经脉。
  clauses: []
  topics:
  - concept.liang_gan
  - syndrome.wen_bing
- key: c03
  title: 八纲辨便秘寒热与五脏热
  start_seq: 249
  summary: 便秘属实，须分寒实热实；问小便黄白、腹痛与否以别寒热。继述肝心肺脾肾热的日辰与针刺要点。
  clauses: []
  topics:
  - concept.yin_yang
  - zangfu.gan
