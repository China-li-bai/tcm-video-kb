kps:
- type: concept_definition
  s: 凡热病皆伤寒之类；温病由伤寒而来，初起当识伤寒本源。
  seq: [6, 15]
  q: 皆伤寒之类
  ents: [syndrome.shang_han, syndrome.wen_bing]
  conf: 0.95
- type: pathomechanism
  s: 伤寒按日传变：一日巨阳（太阳）至六日厥阴；表寒未解又感外寒为两感，较危。
  seq: [132, 135]
  q: 巨阳病衰
  ents: [concept.liang_gan, six_channel.taiyang]
  conf: 0.9
- type: treatment_principle
  s: 未满三日病在阳可汗解；满三日入里可宣泄、利二便。
  seq: [150, 151]
  q: 可以焊解
  ents: [method.fa_han]
  conf: 0.85
  asr: 焊解=汗解
- type: contraindication
  s: 热病初愈忌肉食，多食易遗热复燃。
  seq: [164]
  q: 不可以吃肉
  ents: [syndrome.wen_bing]
  conf: 0.95
- type: diagnostic_rule
  s: 便秘属实，须分寒热；小便黄多为热，白多为寒；热则腹痛、寒则多不痛。
  seq: [250, 265]
  q: 八纲来辩证
  ents: [concept.yin_yang]
  conf: 0.9
