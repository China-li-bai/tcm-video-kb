chapters:
- key: c01
  title: 五脏交经与青龙摆尾
  start_seq: 0
  summary: 五脏交经在本穴上用青龙摆尾加强补泻，使经气达脏（如胆本足临泣木生火以强心）。平补平泻引气不足时加摆尾。亦可在三阴交等穴加强以止经痛。
  clauses: []
  topics:
  - method.bu_xie
  - acupoint.gb41
  - acupoint.sp6
- key: c02
  title: 通关交经与赤凤摇头
  start_seq: 34
  summary: 通关交经用于关节受伤/脱臼后气不过；对侧取穴效不足时加强。通关多用赤凤摇头（泻法）。隔经补泻先治母经以止传变。
  clauses: []
  topics:
  - method.bu_xie
- key: c03
  title: 呼吸补泻
  start_seq: 55
  summary: 呼吸补泻最常用且力强，宜肉厚处。补：吸气时插/推；泻则相反。临床可不强求鼻口细则，重在得气与补泻方向。
  clauses: []
  topics:
  - method.bu_xie
  - acupoint.st36
