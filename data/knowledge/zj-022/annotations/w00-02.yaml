  - 89
  q: 腹部的针最好竞争，最好不要蒸它
  ents:
  - method.zhen_jiu
  conf: 0.8
  asr: 竞争=禁针/慎针；蒸=深
- type: acupoint_usage
  s: 伏兔在膝盖直上六寸，取象跪时股肌隆起如伏兔。
  seq:
  - 111
  - 115
  q: 膝盖头直上六寸好，是不是伏兔穴
  ents:
