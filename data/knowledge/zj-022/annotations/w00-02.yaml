- key: c01
  title: 天枢寒热与腹募四针
  start_seq: 0
  summary: 天枢寒证宜隔姜灸、热证宜针不宜灸。脐旁开二寸天枢为大肠募；关元小肠募、中脘胃募、中极膀胱募。水道与水分合用治水肿腹水；归来、气冲近胞宫，常灸可助孕；腹部深刺宜慎。
  clauses: []
  topics:
  - acupoint.st25
  - acupoint.cv4
  - acupoint.cv12
  - acupoint.st28
- key: c02
  title: 伏兔梁丘与足三里
  start_seq: 111
  summary: 伏兔在膝上六寸，取象跪时股肌如伏兔。梁丘为郄穴可消炎。足三里为胃经合穴、土经土穴，大穴；男人三十后宜常灸；治呕恶、足软不耐远行；腹部灸后燥热可灸足三里引火下行。
  clauses: []
  topics:
  - acupoint.st32
  - acupoint.st34
  - acupoint.st36
