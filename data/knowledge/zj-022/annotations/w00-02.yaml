kps:
- type: treatment_principle
  s: 天枢：寒证隔姜灸优于针；热实宜针不宜灸（灸如火上加油更燥痛）。
  seq:
  - 24
  - 30
  q: 如果是热时，你的针下针会比灸好
  ents:
  - acupoint.st25
  conf: 0.95
  asr: 天书=天枢；揪=灸
- type: concept_definition
  s: 天枢为大肠募，关元为小肠募，中脘为胃募（负四针配穴）；蛋白尿等可针天枢。
  seq:
  - 44
  - 44
  q: 天书是大肠的墓，关元是小肠的墓
  ents:
  - acupoint.st25
  - acupoint.cv4
  - acupoint.cv12
  - concept.mu_xue
  conf: 0.95
  asr: 天书=天枢；墓=募；中皖=中脘
- type: acupoint_usage
  s: 中极为膀胱募；水道（关元旁开）与水分常合用，治水肿、腹水。
  seq:
  - 76
  - 78
  q: 能够通理水水肿、肚子腹水
  ents:
  - acupoint.st28
  - acupoint.cv9
  - acupoint.cv3
  conf: 0.9
  asr: 水稻=水道
- type: acupoint_usage
  s: 归来名义与睾丸上缩等症相关；中极、气冲、归来、关元一带近胞宫，常灸可助孕。
  seq:
  - 79
  - 92
  q: 常常灸它的话，都容易住晕，帮她怀孕
  ents:
  - acupoint.st29
  - acupoint.st30
  - acupoint.cv3
  - acupoint.cv4
  conf: 0.85
  asr: 住晕=受孕；官员=关元
- type: clinical_tip
  s: 腹部针宜慎，最好勿深刺。
  seq:
