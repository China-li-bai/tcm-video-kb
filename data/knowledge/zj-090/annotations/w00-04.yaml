  - acupoint.li4
  - acupoint.bl1
  - acupoint.gb37
- key: c02
  title: 内经与大黄用例
  start_seq: 192
  summary: 强调《内经》不可死背、当活用。大黄生用/泡水取其气清上热（目赤等），煮后则下利。兼肺癌咳嗽病例思路（合谷等对应）收束全九十集。
  clauses: []
  topics:
  - classic.huang_di_nei_jing
  - herb.da_huang
