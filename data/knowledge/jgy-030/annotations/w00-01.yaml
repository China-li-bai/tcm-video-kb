kps:
- type: clinical_tip
  s: 乳癌术后仍失眠常见；问诊还须大便、胸痛、脚温凉、纳谷及更年热。
  seq: [8]
  q: 失眠
  ents: [new.disease.ru_ai]
  conf: 0.85
- type: diagnostic_rule
  s: 乳癌恶征：肿块硬而不规则、按之不痛；乳头下陷示阳气下陷，与阴茎内缩同理。
  seq: [42]
  q: 硬邦邦的
  ents: [new.disease.ru_ai]
  conf: 0.9
  asr: 主头陷=乳头陷
- type: formula_indication
  s: 乳癌兼肝热：小柴胡用黄芩清中焦热，不用黄连黄柏；柴胡兼入肝。
  seq: [53]
  q: 小柴胡汤
  ents: [formula.xiao_chai_hu_tang, herb.huang_qin]
  conf: 0.95
- type: formula_indication
  s: 失眠心神不安合黄连阿胶汤意：黄连+白芍酸收+阿胶；白芍提下肢血归心以减心负。
  seq: [56]
  q: 黄连阿胶汤
  ents: [formula.huang_lian_e_jiao_tang, herb.huang_lian, herb.e_jiao, herb.shao_yao]
  conf: 0.95
- type: contraindication
  s: 黄连阿胶安血分时勿妄加泽泻茯苓等利水，以免动气分而失血分之治。
  seq: [72]
  q: 茯苓
  ents: [formula.huang_lian_e_jiao_tang, herb.fu_ling]
  conf: 0.85
  asr: 折蟹=泽泻
- type: clinical_tip
  s: 喉肺已有转移灶可先布半夏、细辛开胸膈、止咳化痰；仍须抓住乳/卵巢源头。
  seq: [119]
  q: 半夏
  ents: [herb.ban_xia, new.disease.ru_ai]
  conf: 0.85
- type: clinical_tip
  s: 乳癌转移至肝往往较原发肝癌易治（邪由外入内）。
  seq: [133]
  q: 乳癌
  ents: [new.disease.ru_ai, new.disease.gan_ai]
  conf: 0.85
  asr: 疑诊=移诊/转移
- type: diagnostic_rule
  s: 更年期潮热冲上≠全身燥热（阴阳乖隔）；苔由厚腻转薄白示胃气来复，现镜面苔则危。
  seq: [153]
  q: 更年期生热
  ents: [concept.yin_yang]
  conf: 0.9
- type: formula_indication
  s: 肝胆积坚用鳖甲等；可加大黄；喉核加强海藻软坚。龟板偏补虚长寿。
  seq: [221]
  q: 鳖甲
  ents: [herb.bie_jia, herb.hai_zao, herb.da_huang]
  conf: 0.9
  asr: 千草=茜草？或甘草；拜龟板=龟板
- type: formula_indication
  s: 乳癖硬块光滑或痛：四物汤加炒麦芽去乳积水；或桂枝汤加葛根。初期不必鳖甲海藻。
