- type: pathomechanism
  s: 风者百病之始（ASR死）；外风由表入，先孙络腠理，不已入经，再入腑，再入脏。
  seq: [9]
  q: 风者百病之死
  ents: []
  conf: 0.95
  asr: 百病之死=百病之始
- type: pathomechanism
  s: 表风由外入：孙络→肉→正经→腑→脏，此为传变次序。
  seq: [17]
  q: 孙落
  ents: []
  conf: 0.9
  asr: 孙落=孙络；衰肉=腠肉
- type: diagnostic_rule
  s: 有汗多属风；毛窍闭缩无汗属寒。
  seq: [28]
  q: 毛孔会闭缩掉
  ents: []
  conf: 0.9
- type: concept_definition
  s: 津液畅行无阻之力称为阳；津液不能敷布四肢则身重。
  seq: [36]
  q: 津液
  ents: [concept.jin_ye]
  conf: 0.9
- type: clinical_tip
  s: 恶寒汗出头痛身重等表风证，可取风府等穴。
