chapters:
- key: c01
  title: 骨空论与风为百病之始
  start_seq: 0
  summary: 略过气府论针灸经络后入骨空论。风者百病之始（ASR死）；外风由表孙络→肉→经→腑→脏。有汗属风、无汗属寒闭毛窍。身重恶寒汗出头痛可取风府等。津液畅行为阳，受阻则身重。
  clauses: []
  topics: [classic.sw_gu_kong_lun, classic.huang_di_nei_jing, acupoint.gv16, concept.jin_ye]
- key: c02
  title: 六经气血与刺法要点
  start_seq: 400
  summary: 气血逆乱可见热中等变。半表未入经络之神气变化。刺宜取压痛、从骨边下手；中风刺须及骨。伤寒六经辨证定义再申（太阳少阳阳明太阴少阴厥阴）。
  clauses: []
  topics: [concept.liu_jing, six_channel.taiyang, six_channel.shaoyang, six_channel.yangming]
- key: c03
  title: 望色神气与经方温病对照
  start_seq: 1900
  summary: 医道可传后世。望色须抓转头灯光变换等刹那神色；持续见红当心。温病与西医多循命定，经方可突破命限。兼及南北半球方位等术数避灾说。
  clauses: []
  topics: [classic.huang_di_nei_jing]
