kps:
- type: pathomechanism
  s: 红斑狼疮本案：经血/乳汁不得下泄而逆入心，病本在心；可询汗、眠以察心。
  seq: [12]
  q: 月经逆流到心脏
  ents: [new.disease.hong_ban_lang_chuang]
  conf: 0.9
  asr: 奶血=经血；红绿证=红斑狼疮
- type: diagnostic_rule
  s: 下寒上热：纳亢而口不渴、上焦虚热身常热；八年闭经不可简单归为更年期。
  seq: [47]
  q: 居然不渴
  ents: [zangfu.shang_jiao]
  conf: 0.85
- type: herb_property
  s: 真寒唯生附子可破，如地下火山；轻温如蜡烛不可融冰山。体胖可重用（本案五钱）。
  seq: [68]
  q: 生腹
  ents: [herb.fu_zi]
  conf: 0.95
  asr: 生腹/生父=生附
- type: formula_indication
  s: 乳房胀满蓄水用防己类沥乳中湿；未必周身水肿。黄芪运脾补气并可补肾。
  seq: [86]
  q: 乳房非常的胀满
  ents: [herb.fang_ji, herb.huang_qi]
  conf: 0.9
  asr: 房子/房脊=防己；黄金=黄芪；福利=茯苓？
- type: clinical_tip
  s: 小便失禁用桑螵蛸等固涩复膀胱约，与尿毒无尿有别；补肾须辨窍路而非笼统堆药。
  seq: [121]
  q: 小便失禁
  ents: [new.herb.sang_piao_xiao]
  conf: 0.85
  asr: 沙飘霜/三飘香=桑螵蛸
- type: clinical_tip
  s: 五剂后关节痛大减、眠深、纳降、足转温；可加柴胡郁金等防乳邪入肝。
  seq: [140]
  q: 关节痛动力减少很多
  ents: [new.disease.hong_ban_lang_chuang]
  conf: 0.9
  asr: 柴骨淤青干燥≈柴胡郁金龙胆草
- type: diagnostic_rule
  s: SLE主症可呈肩带四肢关节痛；肤色深者面部蝶斑可不显。
  seq: [154]
  q: 四肢关节的疼痛
  ents: [new.disease.hong_ban_lang_chuang]
  conf: 0.9
  asr: 红脉经囊=红斑性狼疮
- type: formula_indication
  s: 乳水内结虑入肺而咳白痰，用桂枝甘草汤意专治；黄痰干咳可加麦冬半夏。
  seq: [177]
  q: 甘草汤
  ents: [formula.gui_zhi_gan_cao_tang, herb.mai_men_dong]
  conf: 0.9
  asr: 桂枝杆子=桂枝甘草；麦克门冬=麦门冬
- type: clinical_tip
  s: 本案经治后西医复查红斑狼疮指标转阴；关节近愈后改丸剂巩固。
  seq: [215]
  q: 红脉性
  ents: [new.disease.hong_ban_lang_chuang]
  conf: 0.85
- type: treatment_principle
  s: 治则：复阳气，使阴邪无依可生；关节痛不论痛风风湿，乌头助阳气周行则积去。
  seq: [245]
  q: 乌头
  ents: [herb.wu_tou, concept.yang_qi, syndrome.feng_shi]
  conf: 0.9
  asr: 乌头油机=乌头游疾/游走
