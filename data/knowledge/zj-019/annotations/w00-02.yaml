- key: c01
  title: 面口合谷收与曲池手三里
  start_seq: 0
  summary: 歌诀“面口合谷收”：面口病取合谷；面部透针前先针对侧合谷可减痛（类麻醉）。曲池主肩痛、皮肤痒；下两寸为手三里，又名扭伤穴，治急性腰扭伤、落枕，针后令患者活动患处。
  clauses: []
  topics:
  - acupoint.li4
  - acupoint.li11
  - acupoint.li10
- key: c02
  title: 臂臑肩髃与禾髎迎香
  start_seq: 73
  summary: 五里深处有大动脉，一般禁针。臂臑为多经交会。手挛急可合谷透后溪。禾髎在人中旁主鼻病；迎香为大肠经末穴，治鼻不闻香臭、鼻窦炎，宜透刺勿直深刺，面部只针不灸。
  clauses: []
  topics:
  - acupoint.li13
  - acupoint.li14
  - acupoint.li19
  - acupoint.li20
