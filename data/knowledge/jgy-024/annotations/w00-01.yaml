chapters:
- key: c01
  title: 阴阳易·梅毒阴疮方
  start_seq: 0
  summary: 金匮阴阳易差后劳复。阴阳易为男女交合传染（性病）：身重少气、阴中痛引挛、热上冲胸、头重目花。倪氏弃烧裩散；女用狼牙汤，男用解毒剂（川芎忍冬甘草大黄等）治梅毒淋病阴疮睾肿；末期阴茎溃落用阿胶附子甘草汤止血固表解毒。
  clauses: []
  topics:
  - syndrome.yin_yang_yi
  - formula.lang_ya_tang
  - new.formula.e_jiao_fu_zi_tang
- key: c02
  title: 差后劳复·枳实栀子豉与小柴胡
  start_seq: 87
  summary: 大病初愈过劳复发用枳实栀子豉汤（先煮枳实栀子再下豉微汗）；有宿食用加大黄。差后仍发热属少阳余邪，用小柴胡汤。
  clauses: []
  topics:
  - formula.zhi_zi_shi_tang
  - formula.xiao_chai_hu_tang
- key: c03
  title: 病后水肿·牡蛎泽泻散
  start_seq: 114
  summary: 大病后腰以下水肿用牡蛎泽泻散等分（牡蛎泽泻海藻商陆葶苈等）咸软坚利尿；商陆等猛剂临床以常山等代慎用。
  clauses: []
  topics:
  - formula.mu_li_ze_xie_san
- key: c04
  title: 病后吐涎·理中与竹叶石膏
  start_seq: 134
  summary: 病后口吐涎沫为胃寒心火不降，用理中丸/汤。大病后短气欲吐恶心为胃虚热津伤，用竹叶石膏汤（竹叶石膏半夏麦冬人参粳米）；亦常用于糖尿虚羸恶心。实呕用姜半夏，肝虚顶胃呕用吴茱萸汤。差后忌骤进厚味，宜稀粥面食。
  clauses: []
  topics:
  - formula.li_zhong_wan
  - formula.zhu_ye_shi_gao_tang
  - formula.wu_zhu_yu_tang
