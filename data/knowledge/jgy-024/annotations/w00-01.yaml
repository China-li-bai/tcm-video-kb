kps:
- type: concept_definition
  s: 阴阳易为男女交合所传之病（性病）：身重少气、阴中痛挛、热反上冲胸、头重目花如中毒。
  seq: [3]
  q: 阴阳易
  ents: [syndrome.yin_yang_yi]
  conf: 0.9
  asr: 阴阳异=阴阳易
- type: contraindication
  s: 烧裩散倪氏临床不用；女阴疮用狼牙汤，男梅毒淋病阴疮用解毒剂类方。
  seq: [15]
  q: 烧昆散
  ents: [formula.lang_ya_tang, syndrome.yin_yang_yi]
  conf: 0.85
  asr: 烧昆/赵昆=烧裩
- type: formula_indication
  s: 梅毒末期阴茎溃落，阿胶附子甘草汤：阿胶止血、附子固表、甘草解毒，一剂可挽。
  seq: [68]
  q: 阿胶附子汤
  ents: [new.formula.e_jiao_fu_zi_tang, herb.e_jiao, herb.fu_zi, herb.gan_cao]
  conf: 0.9
- type: formula_indication
  s: 大病初愈因过劳复发，用枳实栀子豉汤微汗：先煮枳实栀子，后下豆豉；有宿食加大黄。
  seq: [101]
  q: 豆豉
  ents: [formula.zhi_zi_shi_tang]
  conf: 0.9
  asr: 子石=枳实；有子石之子豆芝=枳实栀子豉
- type: formula_indication
  s: 差后仍发热为少阳余邪未尽，用小柴胡汤；见「鬼神」亦属柴胡证机。
  seq: [107]
  q: 小柴胡汤
  ents: [formula.xiao_chai_hu_tang]
  conf: 0.95
- type: formula_indication
  s: 大病后独腰下水肿，牡蛎泽泻散等分粉服，咸味软坚利尿；猛泻药临床需代换慎用。
  seq: [116]
  q: 五蛎泽泻散
  ents: [formula.mu_li_ze_xie_san]
  conf: 0.9
  asr: 五蛎=牡蛎；暑期伤露=商陆之类
- type: diagnostic_rule
  s: 口中涎沫频吐为胃寒、心火不能下行；可用理中丸/汤温中。
  seq: [144]
  q: 口吐研沫
  ents: [formula.li_zhong_wan]
  conf: 0.85
  asr: 研沫/研膜=涎沫；李中=理中
- type: formula_indication
  s: 大病后短气欲吐恶心属胃虚热津伤，竹叶石膏汤清虚热、半夏止呕、麦冬人参复津；亦用于糖尿虚羸欲呕。
  seq: [152]
  q: 竹叶石膏汤
  ents: [formula.zhu_ye_shi_gao_tang, herb.ban_xia]
  conf: 0.95
- type: clinical_tip
  s: 实呕（胃有停水）用姜半夏；虚呕（肝胀顶胃）用吴茱萸汤——临证辨虚实。
  seq: [162]
  q: 无助益汤
  ents: [formula.wu_zhu_yu_tang, herb.ban_xia]
  conf: 0.85
  asr: 无助益/无助于=吴茱萸
- type: clinical_tip
  s: 大病初愈忌骤进鱼肉厚味致胃气上逆；宜稀粥面条等易消化饮食。
  seq: [177]
  q: 容易消化的东西
  ents: []
  conf: 0.85
