chapters:
- key: c01
  title: 痉湿暍概说·刚痉柔痉
  start_seq: 0
  summary: 金匮第二篇痉湿暍：痉近脑膜炎类急症，湿为风湿，暍为中暑。太阳发热无汗反恶寒为刚痉，发热汗出不恶寒为柔痉，方证不同，一剂可知。
  clauses: []
  topics:
  - new.disease.jing_bing
  - formula.ge_gen_tang
- key: c02
  title: 葛根汤与瓜蒌桂枝汤治痉
  start_seq: 120
  summary: 小儿痉见目直项强多用葛根汤；柔痉津伤可选瓜蒌桂枝汤（桂枝汤加瓜蒌根生津）。有疮家则痉难治。
  clauses: []
  topics:
  - formula.ge_gen_tang
  - formula.gua_lou_gui_zhi_tang
- key: c03
  title: 麻黄去节发汗与治症不拘病名
  start_seq: 251
  summary: 麻黄中空发汗、节止汗，汤剂宜去节。夜尿若见麻黄汤或葛根汤证亦可选用；治症勿被病名框死。里实燥结可合承气思路。
  clauses: []
  topics:
  - herb.ma_huang
  - formula.ma_huang_tang
