kps:
- type: concept_definition
  s: 少阳半表半里=三焦网络：肌肉间、脏腑间，以及头耳五官胸乳子宫心包皆属少阳，范围全身上下。
  seq:
  - 2
  - 7
  q: 胸部、乳房通通是属于三焦系统
  ents:
  - six_channel.shaoyang
  - zangfu.san_jiao
  conf: 0.95
- type: clinical_tip
  s: 妇人热入血室用柴胡类，因女子胞/血室属少阳三焦系统。
  seq:
  - 7
  - 7
  q: 女人来热入热入血丝，我们会用到柴柴汤汤汤是少阳
  ents:
  - new.pattern.热入血室
  - formula.xiao_chai_hu_tang
  conf: 0.85
  asr: 血丝=血室
- type: treatment_principle
  s: 三阳镇（太阳阳明少阳）无死证；入三阴乃现死证。能把病挡在少阳即无性命之虞。
  seq:
  - 91
  - 136
  q: 当你发现病进入少阳的时候，我们阻挡的少阳这第二开辟的第三个战场啊
  ents:
  - six_channel.shaoyang
  conf: 0.85
- type: clause_interpretation
  s: 第263条提纲：少阳之为病，口苦、咽干、目眩。胆溢则苦，三焦水道不利则咽干，少阳连目则眩。
  seq:
  - 156
  - 175
  q: 七十七条，少阳之为病，口苦烟目眩
  ents:
  - clause.shl.263
  - six_channel.shaoyang
  conf: 0.95
  asr: 烟=咽干
- type: contraindication
  s: 少阳在半表半里，禁吐、下、汗；耳目口鼻诸窍病亦属少阳，勿妄用吐下。宜和解。
  seq:
  - 266
  - 269
  q: 所少阳政是和解，好用吐下汉法都不好啊，要和解
  ents:
  - six_channel.shaoyang
  conf: 0.95
  asr: 政=证；汉=汗
- type: diagnostic_rule
  s: 脉弦细而头痛发热属少阳，虽见头痛发热亦不可发汗。
