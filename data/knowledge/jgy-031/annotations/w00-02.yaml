- key: c01
  title: 尿毒医案与水气头昏恶心
  start_seq: 0
  summary: 2007-02-09尿毒透析医案。肾衰主症头昏、恶心：肾不能气化则冷水停积，上犯膈胃则恶心，水晃则头昏；五苓散、苓桂术甘等利水消眩。保心阳则肾衰不立刻致命。
  clauses: []
  topics: [new.disease.niao_du, formula.wu_ling_san, formula.fu_ling_gui_zhi_bai_zhu_gan_cao_tang]
- key: c02
  title: 桂枝汤合当归四逆附子温阳
  start_seq: 90
  summary: 首诊从桂枝汤加减；四肢冷壮心阳用生附、干姜近四逆法；合当归四逆通血；苓桂类健脾开胃。尿毒常累心，炙甘草汤类可顾心。疗程中便通、血压稳，强调温阳利水强心。
  clauses: []
  topics: [formula.gui_zhi_tang, formula.dang_gui_si_ni_tang, herb.fu_zi, formula.zhi_gan_cao_tang]
