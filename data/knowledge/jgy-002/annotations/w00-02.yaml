kps:
- type: pathomechanism
  s: 肝有病首传脾；上工治未病，须在肝病将发时识之。
  seq: [0, 2]
  q: 影响到脾脏
  ents: [zangfu.gan, zangfu.pi, new.method.zhi_wei_bing]
  conf: 0.9
  asr: 上攻之未病=上工治未病；香生=相生
- type: clinical_tip
  s: 夜1–3点（肝经流注）不能入睡，当留意肝脏；治肝常兼通大便以泄肝压。
  seq: [9, 20]
  q: 不能睡觉
  ents: [zangfu.gan, zangfu.da_chang]
  conf: 0.95
- type: contraindication
  s: 见病即云阴虚而妄补，有六弊；下利误补尤易致脾陷腹鼓。
  seq: [144, 149]
  q: 补息的缺点
  ents: [concept.yin_xu]
  conf: 0.85
  asr: 补息=补虚
- type: clinical_tip
  s: 肝实可用清肝苦药；肝虚宜平淡建中之品，非实勿妄用肝泻药。
  seq: [138]
  q: 而不是虚症
  ents: [zangfu.gan]
  conf: 0.85
