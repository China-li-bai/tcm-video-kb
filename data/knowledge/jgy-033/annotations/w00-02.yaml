- type: diagnostic_rule
  s: 能平卧入睡示肺内无明显积水；不能平卧须先利水，久积可累心肺。
  seq: [20]
  q: 平躺的睡
  ents: [new.disease.fei_ai]
  conf: 0.9
  asr: 积损=积水
- type: diagnostic_rule
  s: 肺癌痰多呈白色泡沫；抽烟常见焦黄黑痰，二者有别。白沫咳亦可见于桔梗甘草汤证。
  seq: [38]
  q: 白色泡沫
  ents: [new.disease.fei_ai, new.formula.jie_geng_gan_cao_tang, herb.jie_geng]
  conf: 0.95
  asr: 接梗甘早=桔梗甘草
- type: formula_indication
  s: 肺癌寒湿痰：人参、半夏祛痰兼利水；紫菀等治寒痰咳；可合麻黄宣肺。
  seq: [54]
  q: 半夏
  ents: [herb.ban_xia, herb.ren_shen, syndrome.han_shi, new.herb.zi_wan]
  conf: 0.9
  asr: 申半夏；紫色的猫/色钢房≈紫菀
- type: clinical_tip
  s: 一周后咳大减、血块少、胸痛减；原夜不需盖被之燥热可转为需盖被。
  seq: [79]
