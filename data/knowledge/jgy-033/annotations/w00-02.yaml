  ents: [new.disease.fei_ai]
  conf: 0.85
- type: treatment_principle
  s: 治肺过程出现下利，不可骤减主方剂量；可加麦冬、党参、五味子等润肺止干咳。
  seq: [138]
  q: 下利
  ents: [herb.mai_men_dong, herb.wu_wei_zi]
