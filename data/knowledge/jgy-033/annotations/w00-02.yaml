chapters:
- key: c01
  title: 肺癌寒痰案·白沫与平卧
  start_seq: 0
  summary: 2007-02肺癌III–IV、重烟、咳六月。能平卧示肺无积水。肺癌痰多白泡沫；抽烟焦黄黑痰未必是癌。桔梗甘草汤主咳吐白沫。寒湿：人参半夏祛痰排水；紫菀类治寒痰咳；麻黄宣肺。一周咳减血块少。
  clauses: []
  topics:
  - new.disease.fei_ai
  - disease.ke_sou
  - herb.ban_xia
  - herb.jie_geng
- key: c02
  title: 干咳加味与下利不弃方
  start_seq: 119
  summary: 血压自高降至正常；癌常低热。后见下利勿弃主方剂量，加麦冬党参五味子等润肺。主方久不变仅加减。保胃气/阳气则虽癌不致饿死；化疗伤胃。骤戒烟或反生他病，可暂续抽。
  clauses: []
  topics:
  - herb.mai_men_dong
  - herb.wu_wei_zi
  - concept.yang_qi
- key: c03
  title: 肺与大肠·紫参代与未碰西医
  start_seq: 250
  summary: 肺气虚不能固肛则下利频（金匮紫参汤，紫参缺货可用他药代）。胸痛减、焦痰一层层排出。未开刀化疗者辨证清楚、效佳；已刀化则难识真机。半年随诊改善显著。
  clauses: []
  topics:
  - herb.zi_can
  - new.disease.fei_ai
  - zangfu.da_chang
