chapters:
- key: c01
  title: 太冲行间妇科与对刺
  start_seq: 0
  summary: 太冲治恶露不止、血崩、阴痛等；效不显可上下同经加行间。太冲与颌骨（合谷）可对侧对称刺，不拘补泻寒热。便血须辨石淋/肾瘤/肝癌排浊等。
  clauses: []
  topics:
  - acupoint.lr3
  - acupoint.lr2
  - acupoint.li4
- key: c02
  title: 中封蠡沟中都
  start_seq: 45
  summary: 中封在解溪内侧商丘相对处，用较少；蠡沟（ASR李沟）内踝上五寸，为肝经络穴，虚实皆可，主疝/挺纵与皮肤痒等；中都内踝上七寸，产后恶露常用。
  clauses: []
  topics:
  - acupoint.lr4
  - acupoint.lr5
  - acupoint.lr6
- key: c03
  title: 膝关阴包与腹灸
  start_seq: 84
  summary: 膝关在膝内侧，膝痛重时常加；阴包在曲泉上约三寸，主小便不利。近腹腔穴多灸（如隔姜），因动脉密布。
  clauses: []
  topics:
  - acupoint.lr7
  - acupoint.lr9
