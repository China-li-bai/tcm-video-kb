- key: c01
  title: 本穴与子母补泻
  start_seq: 0
  summary: 本穴=该经五行属性相同之穴（如胆木→足临泣、脾土→太白）。本穴可泻所克经之实、补所生经之虚。五门：本穴子母补泻、两穴合化五行等变化。
  clauses: []
  topics:
  - acupoint.gb41
  - acupoint.sp3
  - concept.wu_xing
- key: c02
  title: 行间二间合化生水
  start_seq: 134
  summary: 肝荥行间与大肠荥二间同留可合化生水，补膀胱虚；本穴补泻不必苍龟探穴等复杂手法，左右捻转即可。盔甲限制时取远端手足穴。
  clauses: []
  topics:
  - acupoint.lr2
  - acupoint.li2
- key: c03
  title: 青龙摆尾与白虎摇头
  start_seq: 185
  summary: 《针灸大成》载青龙摆尾、赤凤摇头、龙虎交战、龙虎升降。得气后行青龙摆尾；白虎摇头针尾呈方出。井荥等指趾端穴不必摆尾摇头。
  clauses: []
  topics:
  - method.bu_xie
