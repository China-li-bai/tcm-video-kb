- key: c01
  title: 合谷针刺禁忌与产诊
  start_seq: 0
  summary: 合谷旁有动脉，进针宜指甲拨开避脉，勿贴骨伤骨膜。孕妇一般禁针合谷；医书有可泻不可补之说。合谷为原穴，顺经为补逆经为泻。临产合谷脉动上达可助诊；合谷气通胞宫。
  clauses: []
  topics:
  - acupoint.li4
  - concept.yuan_xue
  - method.bu_xie
- key: c02
  title: 合谷太冲与偏历温溜曲池
  start_seq: 68
  summary: 阳溪较少用。合谷配太冲为“四关”。偏历为手阳明络穴；温溜在偏历上两寸。上半身皮肤瘙痒常取曲池、合谷（可配上巨虚）。
  clauses: []
  topics:
  - acupoint.lr3
  - acupoint.li6
  - acupoint.li11
  - acupoint.li5
