chapters:
- key: c01
  title: 期门肝募与热入血室
  start_seq: 0
  summary: 期门为肝募，胸胁苦满、胁下痛、肝痛可针；针后可圈穴嘱患者自灸。经期感寒邪可循血入胞为热入血室。
  clauses: []
  topics:
  - acupoint.lr14
  - zangfu.gan
- key: c02
  title: 十五络总论
  start_seq: 33
  summary: 十二经各有络穴，加任脉络鸠尾、督脉络长强、脾之大络大包，合十五络。外邪由络→经→腑；经络根于肾。络穴虚实皆可用。
  clauses: []
  topics:
  - concept.luo_xue
  - zangfu.shen
  - acupoint.cv15
- key: c03
  title: 诸经络穴举要
  start_seq: 125
  summary: 列缺（肺）、通里（心）、内关（心包，心痛）、支正（小肠）、偏历（大肠）、外关（三焦）、飞扬（膀胱）、丰隆（胃）、公孙（脾，主冲脉治胃肠）、蠡沟（肝）等。
  clauses: []
  topics:
  - acupoint.lu7
  - acupoint.pc6
  - acupoint.sp4
  - acupoint.st40
- key: c04
  title: 奇经与交会穴
  start_seq: 258
  summary: 冲脉公孙所主，可治喘咳心痛；督脉后溪、任脉列缺。带脉足临泣所主，病在腰周；阳跷申脉、阴跷照海等。
  clauses: []
  topics:
  - meridian.tv
  - acupoint.gb41
  - acupoint.sp4
