kps:
- type: treatment_principle
  s: 讲本经为给伤寒金匮立药性与剂量标准，药性不明则方剂剂量必错。
  seq: [16]
  q: 药性
  ents: [classic.shen_nong_ben_cao_jing, concept.jing_fang]
  conf: 0.95
- type: clinical_tip
  s: 清热石膏效优于犀角之类温病常用物；本经去芜存菁，不取纲目怪药。
  seq: [30]
  q: 石膏
  ents: [herb.shi_gao]
  conf: 0.85
- type: clinical_tip
  s: 润喉肠胃药宜作散，直达病所；汤散膏丹各因病位与便用而选。
  seq: [165]
  q: 做成药散
  ents: []
  conf: 0.85
- type: clinical_tip
  s: 表病皮肤用生药走表；取药心（如桂心）行内脏，取皮走表浅层。
  seq: [612]
  q: 走表
  ents: [herb.gui_zhi]
  conf: 0.9
- type: concept_definition
  s: 白术与茯苓同用为相须（相使）。
  seq: [798]
  q: 白术
  ents: [herb.bai_zhu, herb.fu_ling]
  conf: 0.9
  asr: 相虚/相居=相须/相使
- type: pathomechanism
  s: 咸能补心，非必天王补心丹；心苦缓，以酸收、以咸补。
  seq: [931]
  q: 咸能补之
  ents: [zangfu.xin, concept.wu_wei]
  conf: 0.9
- type: clinical_tip
  s: 脾湿太盛，苦味药可燥湿；肾病多用龙骨牡蛎等咸药。
  seq: [952]
  q: 苦味的药
  ents: [zangfu.pi, concept.wu_wei]
  conf: 0.9
- type: treatment_principle
  s: 虚则补其母，实则泻其子；子能令母实，母能令子虚。
  seq: [1182]
  q: 虚则补其母
  ents: [concept.wu_xing]
  conf: 0.95
- type: clinical_tip
  s: 朱砂未经火煅则汞隐于内不显毒；陈州产者佳。火煅则汞出。
  seq: [1722]
  q: 朱砂
  ents: [herb.dan_sha]
  conf: 0.9
  asr: 单杀=丹砂/朱砂
- type: clinical_tip
  s: 去鼻息肉用枯矾合麝香，约五十比一，非单用矾。
  seq: [1988]
  q: 五十
  ents: [herb.she_xiang, new.herb.ku_fan]
  conf: 0.9
- type: clinical_tip
  s: 便硬痛用芒硝软坚；便不硬勿用硝，大黄去实即可。芒硝降气分热，大黄入血分。
  seq: [2113]
  q: 芒硝
  ents: [herb.xiao_shi, herb.da_huang]
  conf: 0.95
  asr: 盲销=芒硝
- type: formula_indication
  s: 滑石清热利湿，通利小便，用于石淋膀胱肾结石之类。
  seq: [2175]
  q: 滑石
  ents: [herb.hua_shi]
  conf: 0.9
