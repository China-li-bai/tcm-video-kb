chapters:
- key: c01
  title: 为何讲神农本草经
  start_seq: 0
  summary: 本经非一人一时之作；张仲景为经方发扬者非创立者，所据汤液本草已佚，故以神农本草经定药性标准，方能用伤寒金匮剂量。删怪异纲目条目；石膏清热优于犀角之类。须识药性药味，汤散膏丹各有所宜。
  clauses: []
  topics:
  - classic.shen_nong_ben_cao_jing
  - concept.jing_fang
  - herb.shi_gao
- key: c02
  title: 剂量生熟与五色五味
  start_seq: 218
  summary: 生药毒性与力强于炮制品，表阳虚大汗用生附之类。五色五味归经：青入肝、白入肺、红入心、黄入脾、黑入肾；苦主宣泄、甘主滋补、咸入肾且能补心、酸收敛、辛发散。辛甘为阳发散，酸苦为阴。
  clauses: []
  topics:
  - concept.wu_wei
  - concept.wu_xing
  - herb.fu_zi
- key: c03
  title: 走表走里与相须
  start_seq: 600
  summary: 病在皮肤用生药走表；取心（桂心）行内脏，取皮（桂皮杜仲）走表浅。药色亦示归经。白术茯苓相须；相恶相反须知。气薄味厚等定升降浮沉。
  clauses: []
  topics:
  - herb.bai_zhu
  - herb.fu_ling
  - herb.gui_zhi
- key: c04
  title: 脏腑苦欲与补泻
  start_seq: 850
  summary: 依内经脏腑苦欲：如心苦缓急食酸，咸能补心；脾湿盛用苦燥；肾病多用咸（龙骨牡蛎）。虚则补其母、实则泻其子。风游走不定；内热重勿仅堆寒凉，可顺势再热以折之。
  clauses: []
  topics:
  - concept.wu_xing
  - zangfu.xin
  - zangfu.pi
  - zangfu.shen
- key: c05
  title: 炮制与矿物药
  start_seq: 1450
  summary: 炒蜜煅淬蒸煮乳制各变药性（姜半夏温散寒咳等）。朱砂陈州佳，未经火煅则汞隐于内不显毒；枯矾合麝香约五十比一去鼻息肉。道地与形色辨伪。
  clauses: []
  topics:
  - herb.dan_sha
  - herb.she_xiang
  - new.herb.ku_fan
- key: c06
  title: 大黄芒硝滑石
  start_seq: 1850
  summary: 大黄入血分泻火；芒硝软坚散结、降气分热，便不硬勿用硝。滑石清热利湿通淋，治石淋。空青曾青余粮等矿物续本经。
  clauses: []
  topics:
  - herb.da_huang
  - herb.xiao_shi
  - herb.hua_shi
