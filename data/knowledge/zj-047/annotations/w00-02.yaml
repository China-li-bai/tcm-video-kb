- key: c01
  title: 关冲中渚阳池
  start_seq: 0
  summary: 关冲为三焦井，在无名指外侧甲旁。中渚为输属木，夏至至冬至间为母穴，治三焦虚及眼科等。阳池可透对侧大陵；腕部多汗一般不灸。
  clauses: []
  topics:
  - acupoint.te1
  - acupoint.te3
  - acupoint.te4
- key: c02
  title: 外关透内关
  start_seq: 76
  summary: 外关对内关。高热时可外关得气后透向内关（通关过节类手法），疏通阳气，不必分补泻。
  clauses: []
  topics:
  - acupoint.te5
  - acupoint.pc6
