- type: clinical_tip
  s: 女子经期感冒：一问经期即可径开小柴胡和解，勿再纠结麻桂葛；热入血室如见鬼状多自解，表邪下陷所致。
  seq:
  - 1596
  - 1597
  q: 女孩子只要那个一感冒，你问他有没有月经，有就已经结束了
  ents:
  - formula.xiao_chai_hu_tang
  conf: 0.9
- type: formula_composition
  s: 柴胡桂枝汤：小柴胡与桂枝汤两方等量合方；表已不在则不用麻黄。重用柴胡可推桂枝得汗，因柴胡在半表半里。
  seq:
  - 1633
  - 1661
  q: 他把小柴胡汤跟桂枝汤两方并在一起
