  - formula.gui_zhi_tang
  conf: 0.9
- type: concept_definition
  s: 三焦通脐下之腑：女子胞、脑、骨髓、心包、胆等皆属三焦网络；故少阳和解可广泛加减。
  seq:
  - 1668
  - 1669
  q: 包括女人的女子胞、子宫、卵巢，包括我们的脑
