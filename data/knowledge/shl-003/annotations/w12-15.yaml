  - formula.chai_hu_gui_zhi_tang
- key: c11
  title: 柴胡桂枝干姜汤：劳损黏汗
  start_seq: 1943
  summary: 服柴胡桂枝干姜得黏汗，示血分有湿得解；临床视为治劳证第一方线索。往来寒热即须用柴胡。
  clauses:
  - 147
  topics:
  - formula.chai_hu_gui_zhi_gan_jiang_tang
- key: c12
  title: 第149条 心下满而痛为结胸；满而不痛为痞
  start_seq: 2072
  summary: 伤寒五六日呕而发热，柴胡证仍在者可与柴胡；心下满而硬痛为大结胸用大陷胸，满而不痛为痞用半夏泻心。复述陷胸丸/汤痛向上/下之别。
  clauses:
