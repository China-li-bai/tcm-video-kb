  - herb.da_huang
  conf: 0.9
  asr: 甘碎=甘遂
- type: clinical_tip
  s: 肠梗阻、肺痈痰热结胸、胸胁水结拒按，皆可按热实结胸用大陷胸，剂量按比例；小儿心下硬满亦然。
  seq:
