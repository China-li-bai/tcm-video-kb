kps:
- type: diagnostic_rule
  s: 脏结与结胸：脏结寒湿缓积、痰黏如浆；结胸多热实或水热互结较急。二者脉证易混，须合病程与寒热辨。
  seq:
  - 622
  - 646
  q: 病有结胸，有胀结，这个两个症状如何
  ents:
  - syndrome.jie_xiong
  - new.concept.脏结
  conf: 0.8
  asr: 胀结=脏结
- type: treatment_principle
  s: 心下痞用五种泻心汤；结胸用陷胸类；脏结则祛寒湿从小便出——三者病位治法不同，不可混用。
  seq:
  - 702
  - 728
  q: 我们有五种泻心汤，都来自品
  ents:
  - formula.ban_xia_xie_xin_tang
  - formula.da_xian_xiong_tang
  conf: 0.85
- type: clause_interpretation
  s: 结胸项亦强如柔痉状者，下之宜大陷胸；大陷胸为太阳篇最峻之剂，远过桂麻葛。
  seq:
  - 729
  - 731
  q: 结胸者相意，强如柔颈状，下肢则合大陷胸汤汤
  ents:
  - clause.shl.131
  - formula.da_xian_xiong_tang
  conf: 0.9
  asr: 相意强如柔颈=项亦强如柔痉；下肢=下之
- type: formula_composition
  s: 大陷胸汤：大黄、芒硝、甘遂，攻坚破结；丸剂力势较缓、偏治痛势向上者。
  seq:
  - 772
  - 903
  q: 大陷胸汤里面的时候我们会用到甘碎啊
  ents:
