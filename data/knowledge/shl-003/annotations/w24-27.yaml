- key: c18
  title: 第163条 桂枝人参汤：表未解而心下痞
  start_seq: 3129
  summary: 外证未除而数下之，协热下利、心下痞硬、表里不解，桂枝人参汤（理中加桂枝）：人参、干姜、白术、甘草、桂枝。与甘草泻心差在偏寒利、表证仍在。
  clauses:
  - 163
  topics:
  - formula.gui_zhi_ren_shen_tang
  - formula.li_zhong_wan
- key: c19
  title: 白虎汤与白虎加人参汤
  start_seq: 3376
  summary: 吐下后表里俱热、大渴汗出恶风、舌上干燥，白虎汤；口燥渴心烦背微恶寒或渴欲饮水无表证，白虎加人参汤。石膏须重用并布包；有表证勿独用白虎。血糖高低见燥渴壮热皆可思白虎证。
  clauses:
  - 168
  - 169
  - 170
  topics:
  - formula.bai_hu_tang
  - formula.bai_hu_jia_ren_shen_tang
  - herb.shi_gao
- key: c20
  title: 第165条 大柴胡汤
  start_seq: 3462
  summary: 发热汗出不解、心下痞硬呕而下利，大柴胡汤：小柴胡证兼大便不利即加大量大黄（燥屎可加芒硝）。
  clauses:
  - 165
  topics:
