kps:
- type: clause_interpretation
  s: 第163条：外证未除数下之，协热下利、心下痞硬、表里不解，桂枝人参汤（理中加桂枝）。
  seq:
  - 3129
  - 3151
  q: 外症未除，而术下之随邪热，下力还有力，下附子心下脾，便表里不节者，桂枝人参汤
  ents:
  - clause.shl.163
  - formula.gui_zhi_ren_shen_tang
  conf: 0.85
  asr: 术下=数下；脾=痞
- type: formula_indication
  s: 表证尚在又心下痞硬下利：五泻心之外，偏寒虚用桂枝人参汤；纯热痞用大黄黄连泻心。
  seq:
  - 3221
  - 3235
  q: 还有表症的时候不要去治脾脾有没有好，有五种泻心汤嘛
  ents:
  - formula.gui_zhi_ren_shen_tang
  - formula.da_huang_huang_lian_xie_xin_tang
  conf: 0.8
- type: clause_interpretation
  s: 吐下后七八日不解、热结在里、表里俱热、汗出恶风、大渴舌燥，白虎汤证。
  seq:
  - 3376
  - 3403
  q: 表里具热食汗恶风，大口而反折，上干燥
  ents:
  - formula.bai_hu_tang
  - clause.shl.168
  conf: 0.85
  asr: 大口=大渴；反折=舌
- type: formula_composition
  s: 白虎汤重用石膏，粳米调和；石膏须布包煎。有表证时勿独用白虎，可与桂枝合方表里双解。
  seq:
  - 3427
  - 3509
  q: 因为是白虎，所以我们就石膏石膏要重用
  ents:
  - formula.bai_hu_tang
  - herb.shi_gao
  conf: 0.9
- type: clinical_tip
  s: 白虎证核心是燥渴壮热：血糖高低、冷汗发抖等凡见此象皆可思白虎/加人参；无表证渴欲饮水用白虎加人参。
  seq:
  - 3441
  - 3494
  q: 渴欲饮水，无表症者，白虎加人参汤
  ents:
  - formula.bai_hu_jia_ren_shen_tang
  - formula.bai_hu_tang
  conf: 0.85
- type: formula_indication
