kps:
- type: clause_interpretation
  s: 第174条：伤寒八九日风湿相搏、身体疼烦不能转侧、脉浮虚而涩，桂枝附子汤；大便硬小便自利者去桂加白术。
  seq:
  - 3708
  - 3712
  q: 涩就是湿的一个脉，就是桂枝附子汤主之若其人大便堂小便治理的桂枝附子去桂枝加白术汤
  ents:
  - clause.shl.174
  - formula.gui_zhi_fu_zi_tang
  - formula.bai_zhu_fu_zi_tang
  conf: 0.85
  asr: 大便堂=大便硬；治理=自利
- type: formula_composition
  s: 桂枝附子汤：桂枝汤去芍药加炮附子；风湿游走痛重用炮附。白术附子则去桂加术，湿偏内停。
  seq:
  - 3715
  - 3817
  q: 他少了一个白勺，没有把白烧拿掉，变成这个泡附子，就是桂枝附子汤
  ents:
  - formula.gui_zhi_fu_zi_tang
  - herb.fu_zi
  - herb.bai_zhu
  conf: 0.9
  asr: 白勺/白烧=白芍
- type: formula_indication
  s: 甘草附子汤：经方最有名治痛风方，一剂知；炮附两枚、桂枝白术甘草。痛风红肿痛不必拘尿酸，临床以痛止为验。
  seq:
  - 3876
  - 3892
  q: 甘草附子汤是精方里面最有名的治痛风的处方一剂就知
  ents:
  - formula.gan_cao_fu_zi_tang
  - new.disease.痛风
  conf: 0.9
  asr: 精方=经方
- type: herb_property
  s: 肌表寒湿用炮附子；心肾阳虚欲绝用生附子。二者色形功用不同，不可互代。
  seq:
  - 3855
  - 3856
  q: 泡芙子泡附子子功能生附子有生附子的功能，两个不一样
  ents:
  - herb.fu_zi
  conf: 0.9
- type: clause_interpretation
  s: 脉浮滑当属热证，白虎汤主之；石膏须重用（一两以上）并布包。
  seq:
  - 3949
  - 3967
  q: 浮华是表有寒里有热，白虎汤组织
  ents:
