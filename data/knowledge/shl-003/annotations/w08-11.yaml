- type: diagnostic_rule
  s: 小结胸：正在心下，按之则痛、不按不痛；大结胸不按亦痛且硬满可下贯少腹。
  seq:
  - 1063
  - 1064
  q: 小结，胸正症在心下，暗之则痛
  ents:
  - formula.xiao_xian_xiong_tang
  - formula.da_xian_xiong_tang
  conf: 0.9
- type: formula_composition
  s: 小陷胸汤三味：黄连苦寒清热，半夏涤痰开结，瓜蒌实宽胸；中焦有热兼痰水互结。
  seq:
  - 1094
  - 1108
  q: 小陷胸汤里面像这黄连半夏用生半夏生热好
  ents:
  - formula.xiao_xian_xiong_tang
  - herb.huang_lian
  - herb.ban_xia
  conf: 0.9
- type: clause_interpretation
  s: 寒实结胸无热象，用三物小白散；与大陷胸之热实相对。肺癌寒痰壅肺不能平卧而无外热者常投。
  seq:
  - 1269
  - 1327
  q: 只要确定病人是寒食节凶，就可以使用三五小白散
  ents:
  - clause.shl.141
  - formula.san_wu_xiao_bai_san
  - herb.ba_dou
  conf: 0.85
  asr: 寒食节凶=寒实结胸；三五=三物
- type: formula_composition
  s: 三物小白散：桔梗、巴豆、贝母；巴豆用法共六种，本方为寒实破结之一。
  seq:
  - 1328
  - 1363
  q: 巴豆一共有六种
