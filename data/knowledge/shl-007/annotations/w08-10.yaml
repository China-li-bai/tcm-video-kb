- type: formula_composition
  s: 通脉四逆汤即四逆汤倍干姜；主下利清谷、里寒外热、手足厥逆、脉微欲绝。
  seq:
  - 1104
  - 1104
  q: 你说我干姜一中就变通来四季汤，干姜减一半，变成四逆汤
  ents:
  - formula.tong_mai_si_ni_tang
  - formula.si_ni_tang
  - herb.gan_jiang
  conf: 0.9
  asr: 通来四季=通脉四逆
- type: pathomechanism
  s: 少阴下利清谷多由太阴寒湿未治传入，中焦寒湿盛极；手足厥冷反映胃肠阳气败。
  seq:
  - 1009
  - 1019
  q: 少阴病是因为太阴病没治好才跑出来的
  ents:
  - six_channel.shaoyin
  - six_channel.taiyin
  conf: 0.9
- type: formula_indication
  s: 四逆散疏肝利胆、开气郁，可治胆结石胆胀；与四逆汤温阳救逆路径完全不同。
  seq:
  - 1159
  - 1159
  q: 那这治那个四逆散呢变成我们来拿拿来治胆结石胆发炎的时候非常好
  ents:
  - formula.si_ni_san
  conf: 0.9
- type: formula_composition
  s: 四逆散：炙甘草、枳实、柴胡、芍药。腹痛加炮附，咽痛去芍加桔梗，泄利下重加薤白。
  seq:
  - 1141
  - 1145
  q: 用炙甘草籽石，还有还有柴胡跟芍药
  ents:
