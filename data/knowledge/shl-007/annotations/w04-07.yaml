chapters:
- key: c04
  title: 附子汤与真武汤
  start_seq: 544
  summary: 身体痛骨节痛脉沉者附子汤（重炮附、人参、白术茯苓芍药）：祛寒湿兼扶正。附子汤去人参加生姜即真武。太阴传入少阴之寒湿痛证常用。
  clauses:
  - 304
  - 305
  topics:
  - formula.fu_zi_tang
  - formula.zhen_wu_tang
- key: c05
  title: 桃花汤、吴茱萸汤、猪肤汤、半夏散
  start_seq: 580
  summary: 下利便脓血腹痛小便不利→桃花汤（赤石脂干姜粳米）。吐而手足逆冷烦躁欲死者吴茱萸汤。下利咽痛胸满心烦→猪肤汤。咽中痛→半夏散及汤（半夏桂枝甘草等分）。
  clauses:
  - 306
  - 309
  - 310
  - 313
  topics:
  - formula.tao_hua_tang
  - formula.wu_zhu_yu_tang
  - formula.zhu_fu_tang
  - formula.ban_xia_san_ji_tang
- key: c06
  title: 白通汤与白通加猪胆汁汤
  start_seq: 827
  summary: 少阴下利不止，白通汤：葱白、干姜、生附子。服后利不止厥逆干呕烦→白通加猪胆汁人尿反佐。脉暴出者死，微续者生。
  clauses:
  - 314
  - 315
  topics:
  - formula.bai_tong_tang
  - formula.bai_tong_jia_zhu_dan_zhi_tang
  - herb.cong_bai
