kps:
- type: formula_composition
  s: 附子汤重用炮附子，配人参白术茯苓芍药祛寒湿扶正；去人参加生姜即真武汤。
  seq:
  - 549
  - 554
  q: 你如果把人生换成生姜，就是增午汤
  ents:
  - formula.fu_zi_tang
  - formula.zhen_wu_tang
  conf: 0.9
  asr: 人生=人参；增午=真武
- type: formula_indication
  s: 桃花汤：下利便脓血、腹痛、小便不利；与大黄附子汤攻下方向相反，一涩一攻。
  seq:
  - 613
  - 626
  q: 下利不止者便脓血者桃花汤
  ents:
  - formula.tao_hua_tang
  conf: 0.9
- type: formula_indication
  s: 少阴吐利手足逆冷烦躁欲死→吴茱萸汤温胃降逆。
  seq:
  - 637
  - 639
  q: 吐的很重，手脚冰冷、烦躁，欲食者无足以汤组织
  ents:
  - formula.wu_zhu_yu_tang
  conf: 0.85
  asr: 无足以=吴茱萸；欲食=欲死
- type: formula_indication
  s: 少阴下利咽痛胸满心烦→猪肤汤。
  seq:
  - 656
  - 656
  q: 少阴病病人有夏利，有咽痛、心烦者诸敷汤
  ents:
  - formula.zhu_fu_tang
  - clause.shl.310
  conf: 0.85
  asr: 夏利=下利；诸敷=猪肤
- type: formula_composition
  s: 半夏散及汤：半夏、桂枝、甘草等分捣散；咽中痛、喉痈可含咽。
  seq:
  - 786
  - 801
  q: 半夏桂枝、甘草治末哈各等分
  ents:
  - formula.ban_xia_san_ji_tang
  conf: 0.9
- type: formula_composition
  s: 白通汤：葱白、干姜、生附子；通表里温肾阳止下利。利不止厥逆干呕烦则加猪胆汁人尿反佐。
  seq:
  - 827
  - 851
  q: 白通汤葱白好，干姜附子生的生用一枚附子
  ents:
  - formula.bai_tong_tang
  - formula.bai_tong_jia_zhu_dan_zhi_tang
  - herb.cong_bai
  conf: 0.95
- type: diagnostic_rule
  s: 白通加猪胆汁后：脉暴出者死，微续者生。
  seq:
  - 890
  - 892
  q: 卖爆粗者死为序者生
  ents:
  - formula.bai_tong_jia_zhu_dan_zhi_tang
  - clause.shl.315
