chapters:
- key: c01
  title: 少阴病总论：心肾水火与禁汗
  start_seq: 0
  summary: 少阴属心肾（火水），多由太阴湿盛未治传入。附子可自肾温通血脉达心。少阴里寒湿盛，小便清白无色；禁发汗，误汗则咳而下利。脉微细沉数皆示里寒不可汗。
  clauses:
  - 281
  - 285
  - 286
  topics:
  - six_channel.shaoyin
  - herb.fu_zi
- key: c02
  title: 死证与自愈征：吐利手足逆冷 vs 恶寒蜷卧烦
  start_seq: 241
  summary: 吐利而手足逆冷为阴盛死证（不受药食）。下利恶寒蜷卧而烦者，阳气欲回可治。息高者危。
  clauses:
  - 292
  - 295
  - 299
  topics:
  - six_channel.shaoyin
- key: c03
  title: 麻黄附子细辛汤与大黄附子汤
  start_seq: 400
  summary: 少阴始得之反发热脉沉，麻黄附子细辛汤（2:3:2）利尿祛里湿而不走表。寒实结胸用大黄附子细辛（麻黄换大黄）。二三日无里证麻黄附子甘草汤微发汗。
  clauses:
  - 301
  - 302
  - 305
  topics:
  - formula.ma_huang_xi_xin_fu_zi_tang
  - formula.da_huang_fu_zi_tang
  - formula.ma_huang_fu_zi_gan_cao_tang
