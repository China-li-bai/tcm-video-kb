kps:
- type: concept_definition
  s: 少阴属心肾水火；多由太阴湿盛未治传入。附子自肾温通血脉可达心。
  seq:
  - 3
  - 9
  q: 病会跑到少阴去，是因为你在脾的时候没有治好，它才会进入少阴
  ents:
  - six_channel.shaoyin
  - six_channel.taiyin
  - herb.fu_zi
  conf: 0.9
- type: diagnostic_rule
  s: 少阴里寒湿盛，小便清白几乎无色，有别于热证黄赤。
  seq:
  - 66
  - 66
  q: 所以小便出是摆一个，根本就一点颜色都没有
  ents:
  - six_channel.shaoyin
  conf: 0.85
- type: contraindication
  s: 少阴禁发汗；脉微细沉数皆示里寒，误汗则伤津见咳与下利。
  seq:
  - 162
  - 178
  q: 少阴症出现的时候，因为是理寒湿，绝对不要用汉法
  ents:
  - six_channel.shaoyin
  - clause.shl.285
  conf: 0.95
  asr: 理=里；汉=汗
- type: diagnostic_rule
  s: 吐利而手足逆冷为阴盛死证（药食不受）；若反发热则尚有生机。
  seq:
  - 285
  - 291
  q: 病人有吐有下利的时候哈，手脚是冰冷的
  ents:
  - six_channel.shaoyin
  conf: 0.9
- type: formula_composition
  s: 麻黄附子细辛汤：麻黄二、炮附三、细辛二；合用则不走表发汗而入里利小便祛湿，兼固阳。
  seq:
  - 400
  - 422
  q: 麻黄附子细心汤呢，麻黄二钱，如果是麻黄有两钱细心，有两钱泡附子能有三钱
  ents:
  - formula.ma_huang_xi_xin_fu_zi_tang
  - herb.xi_xin
  - herb.ma_huang
  - herb.fu_zi
  conf: 0.95
  asr: 细心=细辛
- type: formula_indication
  s: 大黄附子汤=麻黄附子细辛去麻黄换大黄，治寒实积滞；热实用承气。
  seq:
  - 453
  - 458
  q: 遇到寒食的时候，我们就要用大黄附子泻心汤热食的时候，我们才会使用到成气汤
  ents:
  - formula.da_huang_fu_zi_tang
  conf: 0.85
  asr: 寒食=寒实；成气=承气
- type: clause_interpretation
  s: 第302条：少阴病得之二三日，麻黄附子甘草汤微发汗；二三日无里证故可汗。麻黄须先煮去沫。
  seq:
  - 460
  - 470
  q: 麻黄附子甘草汤为发，其汗，以二三日无理证，故为发汗
  ents:
  - clause.shl.302
  - formula.ma_huang_fu_zi_gan_cao_tang
  conf: 0.9
  asr: 理证=里证
