chapters:
- key: c01
  title: 环跳深刺与骨病初征
  start_seq: 0
  summary: 环跳须屈髋取穴，三寸针抵骨/关节旁；可行呼吸补泻。骨病初起常先见环跳痛；可治半身不遂，肩痛可刺对侧环跳。
  clauses: []
  topics:
  - acupoint.gb30
  - zangfu.gu
  - method.bu_xie
- key: c02
  title: 风市中渎治中风瘫痪
  start_seq: 63
  summary: 风市在膝外上七寸，与环跳并为中风/瘫痪大穴；中渎在风市下二寸，加强风湿不仁疗效。
  clauses: []
  topics:
  - acupoint.gb31
  - acupoint.gb32
  - syndrome.zhong_feng
- key: c03
  title: 阳陵泉筋会与外丘
  start_seq: 106
  summary: 阳陵泉为胆经合穴、筋会，膝不得屈伸、抽筋等筋病皆可取；外丘治狂走抽筋，灸可助解毒。
  clauses: []
  topics:
  - acupoint.gb34
  - acupoint.gb36
  - zangfu.jin
- key: c04
  title: 光明络穴与绝骨髓会
  start_seq: 223
  summary: 光明为胆经络穴，外踝上五寸，主眼科；悬钟又名绝骨，髓病、中风大穴，可寻压痛。
  clauses: []
  topics:
  - acupoint.gb37
  - acupoint.gb39
  - syndrome.zhong_feng
