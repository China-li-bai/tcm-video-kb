chapters:
- key: c01
  title: 痰饮咳嗽病与四饮概念
  start_seq: 0
  summary: 《金匮》痰饮咳嗽病第十二；与肺痿肺痈咳嗽上气相关。饮即水饮，人人或多或少；当运动出汗更新水液。四饮：痰饮（素盛今瘦、肠间沥沥有声）、悬饮（水流胁下咳唾引痛）、溢饮（水流四肢当汗不汗身疼重）、支饮。感冒屡重示内有伏饮，宜先排饮。
  clauses: []
  topics: [classic.jin_gui_yao_lve, classic.jgy_ch_tan_yin_ke_sou_bing_mai_zheng_bing_zhi, syndrome.tan_yin, syndrome.xuan_yin, syndrome.yi_yin, syndrome.zhi_yin]
- key: c02
  title: 小青龙与麻黄族排饮
  start_seq: 100
  summary: 小青龙汤证可见背冷如掌大。麻黄汤族发汗可排溢饮之水湿，兼利关节肌肉痛。杏仁与麻黄等量（秤不离砣）。留饮可见下利后心下仍满。
  clauses: []
  topics: [formula.xiao_qing_long_tang, formula.ma_huang_tang, herb.ma_huang, herb.xing_ren, syndrome.liu_yin]
- key: c03
  title: 呕家与发表排饮
  start_seq: 700
  summary: 久病吐下后加人参。呕家本渴；葛根汤、麻黄汤等发表可使饮随汗外解。亦及泽泻、茯苓、半夏等利水涤饮。
  clauses: []
  topics: [herb.ren_shen, formula.ge_gen_tang, formula.ma_huang_tang, herb.fu_ling, herb.ban_xia]
