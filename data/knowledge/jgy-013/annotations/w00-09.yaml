kps:
- type: concept_definition
  s: 本篇为金匮痰饮咳嗽病第十二；饮即水饮，运动出汗可排饮。
  seq: [1]
  q: 痰饮咳嗽病
  ents: [classic.jgy_ch_tan_yin_ke_sou_bing_mai_zheng_bing_zhi, syndrome.tan_yin]
  conf: 0.95
- type: concept_definition
  s: 四饮：痰饮、悬饮、溢饮、支饮（讲中血饮/意义/知饮为音讹）。
  seq: [7]
  q: 痰饮
  ents: [syndrome.tan_yin, syndrome.xuan_yin, syndrome.yi_yin, syndrome.zhi_yin]
  conf: 0.9
  asr: 血饮/意义/知饮≈悬溢支
- type: diagnostic_rule
  s: 素盛今瘦、肠间沥沥有声谓之痰饮。
  seq: [39]
  q: 痰饮
  ents: [syndrome.tan_yin]
  conf: 0.95
- type: diagnostic_rule
  s: 水流胁下、咳唾引痛为悬饮；勿畏用药。
  seq: [43]
  q: 悬疑
  ents: [syndrome.xuan_yin]
  conf: 0.9
  asr: 悬疑=悬饮
- type: diagnostic_rule
  s: 水流四肢、当汗不汗、身体疼重为溢饮；轻证可用麻黄汤族。
  seq: [44]
  q: 意淫
  ents: [syndrome.yi_yin, formula.ma_huang_tang]
  conf: 0.9
  asr: 意淫/意境=溢饮
- type: clinical_tip
  s: 小青龙汤证可见两肩胛间背冷如掌大。
  seq: [107]
  q: 小青龙汤
  ents: [formula.xiao_qing_long_tang]
  conf: 0.95
- type: clinical_tip
  s: 杏仁与麻黄等量，称「秤不离砣」；青龙类不易出偏差。
  seq: [535]
  q: 麻黄
  ents: [herb.ma_huang, herb.xing_ren]
  conf: 0.9
- type: diagnostic_rule
  s: 下利后心下仍坚满，示留饮未尽、水复回聚。
  seq: [323]
  q: 留饮
  ents: [syndrome.liu_yin]
  conf: 0.85
- type: clinical_tip
  s: 葛根汤、麻黄汤等发表，毛窍一开则饮可随汗外排。
  seq: [1070]
  q: 葛根汤
  ents: [formula.ge_gen_tang, formula.ma_huang_tang]
  conf: 0.9
- type: clinical_tip
  s: 感冒一剂即瘥者多无伏饮；屡发深重者内有饮，宜先排饮。
  seq: [25]
  q: 桂枝汤
  ents: [formula.gui_zhi_tang]
  conf: 0.85
