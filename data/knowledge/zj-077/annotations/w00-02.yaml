  - acupoint.gv14
  - method.bu_xie
- key: c02
  title: 表里经与子母选择
  start_seq: 15
  summary: 一经实证可取表里经（如肺实取大肠二间）或络穴转输；子母补泻与本穴可互换选用。
  clauses: []
