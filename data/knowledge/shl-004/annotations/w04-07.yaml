chapters:
- key: c05
  title: 第199–207条 潮热、不可攻与调胃承气
  start_seq: 499
  summary: 阳明脉浮紧必潮热；口燥但欲漱水不欲咽者必衄。有表证兼便秘须先解表再攻，防下陷成结胸。不吐不下心烦者调胃承气汤：酒洗大黄+炙甘草+芒硝，炙甘草缓大黄芒硝使停于十二指肠段。
  clauses:
  - 199
  - 201
  - 207
  topics:
  - formula.diao_wei_cheng_qi_tang
  - herb.xiao_shi
  - herb.da_huang
- key: c06
  title: 三承气与大黄诸方定位
  start_seq: 660
  summary: 大黄甘草汤治食已即吐（实证）；小承气解小肠燥实主排气；大承气攻大肠燥屎。脾约用麻子仁丸。芒硝攻坚积聚肿瘤亦可；芒硝后下勿久煮。
  clauses:
  - 208
  - 209
  topics:
  - formula.xiao_cheng_qi_tang
  - formula.da_cheng_qi_tang
  - formula.ma_zi_ren_wan
  - formula.da_huang_gan_cao_tang
- key: c07
  title: 经热白虎 vs 腑实承气
  start_seq: 997
  summary: 阳明潮热日晡：经热用白虎（石膏），腑实腐热用承气（大黄芒硝）。确定大承气证则唯一处方，勿犹豫。
  clauses:
  - 212
  - 219
  topics:
  - formula.bai_hu_tang
  - formula.da_cheng_qi_tang
