kps:
- type: formula_composition
  s: 麻子仁丸：小承气（大黄厚朴枳实）加麻仁、芍药、杏仁润肠；老人气血虚便秘首选，缓下不伤正。
  seq:
  - 2559
  - 2610
  q: 小承气汤，再加上麻仁，芍药跟杏仁都是滋润的药
  ents:
  - formula.ma_zi_ren_wan
  - formula.xiao_cheng_qi_tang
  conf: 0.95
- type: clinical_tip
  s: 燥屎坚者可用少量芒硝水送麻子仁丸，润下中兼软坚。
  seq:
  - 2624
  - 2624
  q: 半钱的芒硝放到那个碗里面，用水冲下去，化掉以后用这个水来推麻子仁丸
  ents:
  - formula.ma_zi_ren_wan
  - herb.xiao_shi
  conf: 0.85
- type: clause_interpretation
  s: 第248条：太阳病三日发汗不解蒸蒸发热属胃，调胃承气汤。
  seq:
  - 2628
  - 2631
  q: 三日发汗不解，真蒸发热者属胃炎，调胃承气汤
  ents:
  - clause.shl.248
  - formula.diao_wei_cheng_qi_tang
  conf: 0.9
  asr: 真蒸=蒸蒸；胃炎=胃
- type: diagnostic_rule
  s: 吐下汗后小便少大便硬→小承气；五六日仍不大便→大承气。纯燥实无兼证用大承气；兼湿痰用利小便配合。
  seq:
  - 2642
  - 2674
  q: 要用大承气汤哦
  ents:
  - formula.xiao_cheng_qi_tang
  - formula.da_cheng_qi_tang
  conf: 0.85
- type: treatment_principle
  s: 大承气急下存阴：汗多则津伤快；十天不大便小便黄，不必再辨调胃/小承，径用大承气。
  seq:
  - 2705
  - 2721
  q: 十天不大便小变黄已经讲完了，你管他什么怎么调胃承气汤大小神器都不要去考虑大承气汤
  ents:
  - formula.da_cheng_qi_tang
  conf: 0.9
- type: formula_indication
  s: 发黄三方：无汗有表→麻黄连轺赤小豆；有汗湿热在里→茵陈蒿；无表无里实仅瘀热→栀子柏皮。
  seq:
  - 2888
  - 2889
  q: 病人没有汗，完全不流汗，有表症的时候是麻黄连翘好，赤小豆
  ents:
  - formula.ma_huang_lian_yao_chi_xiao_dou_tang
  - formula.yin_chen_hao_tang
  - formula.zhi_zi_bo_pi_tang
  conf: 0.95
- type: formula_composition
  s: 栀子柏皮汤：栀子、炙甘草、黄柏；栀子清上焦热，黄柏清下焦热。可作眼科洗剂。
  seq:
  - 2861
  - 2864
  q: 栀子薄汤汤呢它的处方哦，栀子好，中间是一个哦炙甘草，好再来是黄渤
  ents:
  - formula.zhi_zi_bo_pi_tang
  - herb.zhi_zi
  - herb.huang_bai
  conf: 0.9
  asr: 薄=柏；黄渤=黄柏
- type: herb_property
  s: 麻黄不唯发汗：能发阳、消水肿、治疮陷；剂量与杏仁等量则安。少阴阳明篇仍可用麻黄。
  seq:
  - 2924
  - 2945
  q: 麻黄的剂量跟那个杏仁的量是相等的啊，就不会有问题
  ents:
  - herb.ma_huang
  conf: 0.9
