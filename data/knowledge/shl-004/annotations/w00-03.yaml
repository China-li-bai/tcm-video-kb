kps:
- type: concept_definition
  s: 阳明病专论肠胃；太阳战败或发汗太过可传入，阳明为第二道防线，病至此无所复传。
  seq:
  - 32
  - 43
  q: 所以说当你阳太没没好的的候进入阳明症，阳阳病不会传经就到此为止
  ents:
  - six_channel.yangming
  conf: 0.85
  asr: 阳太=太阳；阳阳=阳明
- type: clinical_tip
  s: 护胃气：平常吃七八分饱，病时五分饱，勿十分饱，使胃气自能运化。
  seq:
  - 62
  - 62
  q: 平常吃七八分饱，不要吃十分饱
  ents:
  - zangfu.wei
  conf: 0.9
- type: clause_interpretation
  s: 第179条三阳明：太阳阳明多因发汗利小便成脾约；正阳阳明胃家实；少阳阳明发汗利小便胃中燥大便难。
  seq:
  - 81
  - 91
  q: 这个太阳阳明者发汗皮曰是
  ents:
  - clause.shl.179
  - syndrome.pi_yue
  conf: 0.8
  asr: 皮曰=脾约
- type: clause_interpretation
  s: 第180条：阳明之为病，胃家实是也。胃家含胃、十二指肠、小肠、大肠。
  seq:
  - 107
  - 110
  q: 就是胃中有讲的胃不单单是胃，阳明呢包含的胃、十二指肠、小肠、大肠都在内
  ents:
  - clause.shl.180
  - six_channel.yangming
  conf: 0.95
- type: pathomechanism
  s: 转属阳明多因津液受伤：发汗过多或小便过多，胃中干燥而成燥实。
  seq:
  - 150
  - 156
  q: 你发汗了以后，津液发了散太多，汗流太多，小便多多成胃中干燥
  ents:
  - six_channel.yangming
  conf: 0.9
- type: concept_definition
  s: 阳明居中土，万物所归，无所复传；虽初恶寒，二日自止。病到阳明即停。
  seq:
  - 180
  - 184
  q: 杨明呢是居中图，也万物所归，无所复传
  ents:
  - clause.shl.184
  - six_channel.yangming
  conf: 0.9
  asr: 杨明=阳明；中图=中土
- type: diagnostic_rule
  s: 阳明病若能食为中风（胃热在），不能食为中寒（胃冷）；攻下必确认为正阳明燥实。
  seq:
  - 309
  - 310
  q: 阳明病，若能食名为中风，不能食名为中寒
  ents:
  - clause.shl.191
  conf: 0.95
- type: contraindication
  s: 虽见腹满咽干似阳明，若兼表寒或未纯里实，不可攻下；先解表，再攻里。
  seq:
  - 289
  - 308
  q: 你一定要看清楚，它是纯阳明
  ents:
  - six_channel.yangming
  - formula.da_cheng_qi_tang
  conf: 0.9
- type: clinical_tip
  s: 阳明潮热多在申酉（黄昏）时段；散步一阵热上即提示阳明热，当问大便。
  seq:
  - 381
  - 387
  q: 就是每次黄昏的时候哈，在夕阳西下的时候
  ents:
  - six_channel.yangming
  conf: 0.85
