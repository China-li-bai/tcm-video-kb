kps:
- type: treatment_principle
  s: 阳明有汗用桂枝汤（姜草枣护津），勿用麻黄；无汗而喘用麻黄汤先解表。有表证必先解表再攻里。
  seq:
  - 2075
  - 2093
  q: 只要有汗，你开桂枝汤，你即使开的很重，都不会丧失津液
  ents:
  - formula.gui_zhi_tang
  - formula.ma_huang_tang
  conf: 0.9
- type: formula_composition
  s: 茵陈蒿汤：茵陈与栀子等量，大黄减半；茵陈先煎去湿，栀子清上焦热，大黄利下焦湿热。
  seq:
  - 2160
  - 2167
  q: 我们的阴橙膏跟栀子呢是等量，比如说四钱四钱大黄两钱
  ents:
  - formula.yin_chen_hao_tang
  - herb.yin_chen_hao
  - herb.zhi_zi
  conf: 0.9
  asr: 阴橙膏=茵陈蒿
- type: formula_indication
  s: 抵当汤治下焦蓄血/瘀血（水蛭虻虫），为仲景活血化瘀第二主方；症见如狂、少腹硬满。轻证用桃核承气。
  seq:
  - 2207
  - 2266
  q: 抵当就是绝对唯一处方没有第二个主方
  ents:
  - formula.di_dang_tang
  - formula.tao_he_cheng_qi_tang
  conf: 0.9
- type: formula_indication
  s: 吴茱萸汤主胃虚寒朝食暮吐；宿食吐用大黄甘草汤。二者虚实不同。
  seq:
  - 2388
  - 2389
  q: 有果，是正虚症的时候无猪咀汤
  ents:
  - formula.wu_zhu_yu_tang
  - formula.da_huang_gan_cao_tang
  conf: 0.8
  asr: 无猪咀=吴茱萸
- type: diagnostic_rule
  s: 五苓散：大便正常而小便不利口渴；表水热证/瘟疫利尿。猪苓汤：结石血淋小便痛。津伤甚者勿再利。
  seq:
  - 2473
  - 2510
  q: 如果大便很正常，大便是正常小便不利，而渴才会用到五苓散
  ents:
  - formula.wu_ling_san
  - formula.zhu_ling_tang
  conf: 0.9
- type: clause_interpretation
  s: 跌阳脉浮而涩，浮则胃气强涩则小便数，浮涩相搏大便则硬，其脾为约，麻子仁丸主之。
  seq:
  - 2542
  - 2542
  q: 大便者呢g脾微约好，麻麻仁丸组织
  ents:
  - syndrome.pi_yue
  - formula.ma_zi_ren_wan
  conf: 0.85
