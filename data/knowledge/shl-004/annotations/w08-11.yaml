kps:
- type: diagnostic_rule
  s: 大承气舌苔黑而干；极寒舌黑而润有津。前硬后溏示内有寒湿，勿妄投大承气。
  seq:
  - 1053
  - 1063
  q: 那大承气汤那个黑呢根本就干掉了，一看就干掉了
  ents:
  - formula.da_cheng_qi_tang
  conf: 0.9
- type: clinical_tip
  s: 若本当大承气而误用小承气，则大便不出唯频矢气——提示应改大承气。
  seq:
  - 1050
  - 1050
  q: 你开成小神器，小神器这下去大便没出来，一直在放屁
  ents:
  - formula.da_cheng_qi_tang
  - formula.xiao_cheng_qi_tang
  conf: 0.9
  asr: 小神器=小承气
- type: treatment_principle
  s: 大承气得下即止后服，勿尽剂；一通即停。
  seq:
  - 1156
  - 1156
  q: 大承气汤正呢，你大便一通出来可以停掉
  ents:
  - formula.da_cheng_qi_tang
  conf: 0.95
- type: diagnostic_rule
  s: 同有潮热谵语：不能食→大承气；能食→小承气。
  seq:
  - 1220
  - 1226
  q: 如果不能吃东西，大神器如果可以吃东西，就是只是大片小承气汤汤
  ents:
  - formula.da_cheng_qi_tang
  - formula.xiao_cheng_qi_tang
  conf: 0.85
  asr: 大神器=大承气
- type: contraindication
  s: 承气攻下后大便仍不出，不可再攻，脉虚为难治；再攻则更虚。
  seq:
  - 1203
  - 1214
  q: 以虚者为难治，不可再给他承气汤
  ents:
  - formula.da_cheng_qi_tang
  conf: 0.9
- type: formula_indication
  s: 手足濈然汗出而阳明燥实已定→大承气；额上汗出手足濈然汗出而气喘→白虎。
  seq:
  - 1291
  - 1313
  q: 手脚汗出很多的时候，实症里面确定是阳明燥实造成的，手脚汗多，这个时候就开大承气汤
  ents:
  - formula.da_cheng_qi_tang
  - formula.bai_hu_tang
  conf: 0.9
- type: formula_indication
  s: 栀子豉汤清胃/上焦虚热，多用于病后懊憹、失眠调理；口干舌燥大渴→白虎加人参。
  seq:
  - 1340
  - 1347
  q: 栀子汤个药呢专门去胃里面的虚热啊，上焦的虚热
  ents:
  - formula.zhi_zi_shi_tang
  - formula.bai_hu_jia_ren_shen_tang
  conf: 0.9
- type: formula_composition
  s: 猪苓汤：猪苓泽泻茯苓阿胶滑石等量。五苓去桂术加阿胶滑石即成；主小便痛、结石、血淋。滑石攻坚，阿胶止血。
  seq:
  - 1352
  - 1366
  q: 把桂枝、白术拿掉，阿胶跟滑石就变成猪苓汤
  ents:
  - formula.zhu_ling_tang
  - formula.wu_ling_san
  conf: 0.95
- type: clause_interpretation
  s: 第225条：脉浮而迟、表热里寒、下利清谷，四逆汤。胃中虚冷不能食、饮水则哕，亦属里寒。
  seq:
  - 1438
  - 1440
  q: 表热里寒，下令清毒者，四逆汤
  ents:
  - clause.shl.225
  - formula.si_ni_tang
  conf: 0.85
  asr: 清毒=清谷
