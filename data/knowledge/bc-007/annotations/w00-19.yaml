chapters:
- key: c01
  title: 禹余粮与精石类禁忌
  start_seq: 0
  summary: 禹余粮（ASR余粮/余梁）止涩下利；咸入肾，过食伤肾而不吃盐反水肿；精石重镇安神，实热湿热忌；便秘须辨寒热再配大黄等。
  clauses: []
  topics:
  - herb.yu_yu_liang
  - herb.mu_li
- key: c02
  title: 白石英紫石英
  start_seq: 142
  summary: 白石英甘温主消渴，白色入肺；精石类镇烦躁焦虑；紫白石英禁忌阴虚火旺与阳虚精气者。
  clauses: []
  topics:
  - herb.bai_shi_ying
  - herb.zi_shi
- key: c03
  title: 空青白青与眼科
  start_seq: 371
  summary: 白青空青扁青多治眼科；水飞后可作眼药水；草木贝母亦可眼科。
  clauses: []
  topics:
  - herb.bai_qing
  - herb.kong_qing
  - herb.bei_mu
- key: c04
  title: 石菖蒲开窍
  start_seq: 394
  summary: 用石菖蒲非水菖蒲；开心孔通九窍治心病鼻病；外用喷鼻可配辛夷麝香；李时珍言解巴豆毒。
  clauses: []
  topics:
  - herb.chang_pu
  - herb.she_xiang
- key: c05
  title: 菊花杭菊
  start_seq: 512
  summary: 杭菊黄白小朵入药；清风热明目解毒；陈年菊花反不如鲜；平肝风热常配。
  clauses: []
  topics:
  - herb.ju_hua
- key: c06
  title: 人参补气禁忌
  start_seq: 544
  summary: 人参大补元气，贵则党参黄芪甘草代；虚劳气血两虚用，实热咳嗽痘疹发散期忌；平常勿日日服。
  clauses: []
  topics:
  - herb.ren_shen
  - herb.huang_qi
- key: c07
  title: 天门冬与经方温病
  start_seq: 672
  summary: 天门冬常配麦门冬；强调经方为本，温病药可附不可舍伤寒。
  clauses: []
  topics:
  - herb.tian_men_dong
  - herb.mai_men_dong
- key: c08
  title: 甘草生炙异用
  start_seq: 755
  summary: 甘草甘平补五脏解百毒；发汗方护胃津；生用解毒，炙甘草汤治脉结代心动悸；急下排水时不用。
  clauses: []
  topics:
  - herb.gan_cao
  - formula.zhi_gan_cao_tang
- key: c09
  title: 干地黄白术茯苓
  start_seq: 906
  summary: 干地黄滋阴养血，脾胃虚寒忌；白术苦燥祛湿健脾，常配茯苓利水；阴虚骨蒸溃疡忌白术。
  clauses: []
  topics:
  - herb.gan_di_huang
  - herb.bai_zhu
  - herb.fu_ling
- key: c10
  title: 牛膝下焦活血
  start_seq: 1216
  summary: 牛膝治下焦腿痛膝伤，活血兼补；孕妇禁用易落胎；走下焦上焦病不必用。
  clauses: []
  topics:
  - herb.niu_xi
- key: c11
  title: 柴胡连翘半表半里
  start_seq: 1525
  summary: 柴胡少阳半表半里，往来寒热胸胁苦满；连翘多治皮肤痒疹，与柴胡分用。
  clauses: []
  topics:
  - herb.chai_hu
  - herb.lian_qiao
- key: c12
  title: 麦门冬车前木香薯蓣
  start_seq: 1657
  summary: 麦门冬汤养肺胃；车前子利小便；木香行气；薯蓣（山药）补虚。
  clauses: []
  topics:
  - herb.mai_men_dong
  - herb.che_qian_zi
  - herb.mu_xiang
  - herb.shu_yu
- key: c13
  title: 泽泻远志龙胆
  start_seq: 2178
  summary: 泽泻利小便治水肿；远志开心窍；龙胆泻肝胆湿热收束本草上经石药段。
  clauses: []
  topics:
  - herb.ze_xie
  - herb.yuan_zhi
  - herb.long_dan
