kps:
- type: clinical_tip
  s: 禹余粮擅止涩，肠胃下利不止时经方中常用。
  seq: [3]
  q: 下利不止
  ents: [herb.yu_yu_liang]
  conf: 0.9
  asr: 余粮=禹余粮
- type: clinical_tip
  s: 咸入肾；过食伤身，但不吃盐则水溢而水肿，当以海盐少量。
  seq: [18]
  q: 不吃盐就水肿
  ents: []
  conf: 0.9
- type: contraindication
  s: 精石重镇类有实热时忌用，虚证用之为宜。
  seq: [30]
  q: 实热的时候都不可以用
  ents: [herb.mu_li]
  conf: 0.85
- type: concept_definition
  s: 白石英味甘温，本经主消渴；白色入肺。
  seq: [147]
  q: 主消渴
  ents: [herb.bai_shi_ying]
  conf: 0.95
- type: clinical_tip
  s: 紫石英白石英龙骨牡蛎等精石可代西药镇焦虑烦躁。
  seq: [176]
  q: 紫石英
  ents: [herb.zi_shi, herb.bai_shi_ying, herb.long_gu, herb.mu_li]
  conf: 0.9
- type: contraindication
  s: 紫石英白石英忌于阴虚火旺及阳虚精气不足者。
  seq: [258]
  q: 阴虚和阳虚
  ents: [herb.zi_shi, herb.bai_shi_ying]
  conf: 0.9
- type: clinical_tip
  s: 空青白青扁青多治眼科；水飞溶解可作眼药水止痛痒。
  seq: [391]
  q: 眼科的药水
  ents: [herb.kong_qing, herb.bai_qing]
  conf: 0.9
- type: clinical_tip
  s: 菖蒲用石菖蒲非水菖蒲；开心孔通九窍，治心病常用。
  seq: [430]
  q: 开心孔补五脏
  ents: [herb.chang_pu]
  conf: 0.95
- type: clinical_tip
  s: 麝香无孔不入，急救开窍可舌下或喷鼻，较菖蒲辛夷更捷。
  seq: [445]
  q: 无孔不入
  ents: [herb.she_xiang]
  conf: 0.95
- type: clinical_tip
  s: 李时珍谓菖蒲可解巴豆毒，冷开水送下即可。
  seq: [462]
  q: 解巴豆大吉的毒
  ents: [herb.chang_pu, herb.ba_dou]
  conf: 0.85
  asr: 大吉≈巴豆之大毒
- type: clinical_tip
  s: 入药宜杭菊黄白小朵；清风热明目解毒，外感头痛可用。
  seq: [540]
  q: 清风热明目解毒
  ents: [herb.ju_hua]
  conf: 0.9
- type: clinical_tip
  s: 中药多越陈越好，菊花陈年反不佳。
  seq: [551]
  q: 菊花陈年的并不是很好
  ents: [herb.ju_hua]
  conf: 0.9
- type: clinical_tip
  s: 人参大补元气；价贵可用党参，或黄芪甘草代其补气。
  seq: [653]
  q: 黄芪，甘草来取代人参
  ents: [herb.ren_shen, herb.huang_qi, herb.gan_cao]
  conf: 0.95
- type: contraindication
  s: 人参属气药，咳嗽肺热阴虚及痘疹发散期忌用，免恋邪。
  seq: [662]
  q: 人参是属于气药
  ents: [herb.ren_shen]
  conf: 0.9
- type: treatment_principle
  s: 基础当在伤寒经方；温病药可附于经方，不可舍经方只用温病。
  seq: [727]
  q: 温病的药来补
  ents: []
  conf: 0.9
- type: clinical_tip
  s: 甘草甘平补五脏解百毒；几乎各方常见。
  seq: [756]
  q: 补五脏
  ents: [herb.gan_cao]
  conf: 0.9
- type: clinical_tip
  s: 发汗剂中配甘草护胃津，防汗出伤津。
  seq: [779]
  q: 胃的津液就没了
  ents: [herb.gan_cao]
  conf: 0.9
- type: clinical_tip
  s: 解毒用生甘草；炙甘草汤重用炙草治心动悸脉结代。
  seq: [879]
  q: 生甘草
  ents: [herb.gan_cao, formula.zhi_gan_cao_tang]
  conf: 0.95
- type: clinical_tip
  s: 桔梗甘草汤可使肺痈脓血吐出，助肺容积恢复。
  seq: [829]
  q: 桔梗，甘草汤
  ents: [herb.jie_geng, herb.gan_cao]
  conf: 0.85
- type: clinical_tip
  s: 生姜解半夏毒甚捷，含姜片可复声。
  seq: [839]
  q: 生姜半下的毒更快
  ents: [herb.sheng_jiang, herb.ban_xia]
  conf: 0.9
  asr: 半下=半夏
- type: clinical_tip
  s: 干地黄甘寒滋阴养血；阴虚见阳症（红光满面乏力）可用生地。
  seq: [964]
  q: 呈现的都是热症，实际上是阴虚
  ents: [herb.gan_di_huang]
  conf: 0.9
- type: contraindication
  s: 脾胃虚寒者忌生地，寒中阴虚时更慎。
  seq: [968]
  q: 脾胃比较虚弱的人
  ents: [herb.gan_di_huang]
  conf: 0.9
- type: clinical_tip
  s: 白术苦燥祛湿，湿盛及风湿痹、纳差时用；健脾燥湿正药。
  seq: [981]
  q: 白术能够祛湿
  ents: [herb.bai_zhu]
  conf: 0.95
- type: clinical_tip
  s: 白术收湿后必配茯苓利尿，使湿从小便出。
  seq: [1052]
  q: 湿就会从小便排出来
  ents: [herb.bai_zhu, herb.fu_ling]
  conf: 0.95
- type: contraindication
  s: 阴虚骨蒸、喉闭、溃疡者忌白术，用之反生脓。
  seq: [1154]
  q: 白术是禁用的
  ents: [herb.bai_zhu]
  conf: 0.9
- type: clinical_tip
  s: 牛膝治下焦腿膝伤痛，活血化瘀且兼补；量要足。
  seq: [1220]
  q: 治疗下焦腿痛
  ents: [herb.niu_xi]
  conf: 0.95
  asr: 牛西=牛膝
- type: contraindication
  s: 牛膝活血，孕妇禁用，易落胎；血崩遗精下泄时忌再攻下。
  seq: [1221]
  q: 会落胎
  ents: [herb.niu_xi]
  conf: 0.95
- type: clinical_tip
  s: 柴胡为少阳半表半里药，主往来寒热、胸胁苦满。
  seq: [1556]
  q: 往来
  ents: [herb.chai_hu]
  conf: 0.9
- type: clinical_tip
  s: 连翘多用于皮肤痒疹过敏；与柴胡（三焦/半表半里）分工不同。
  seq: [1596]
  q: 皮肤有发银疹
  ents: [herb.lian_qiao]
  conf: 0.85
  asr: 银疹≈瘾疹
- type: clinical_tip
  s: 车前子利小便，治淋闭水肿常用。
  seq: [1804]
  q: 车前子
  ents: [herb.che_qian_zi]
  conf: 0.9
- type: clinical_tip
  s: 木香（广木香）行气止痛，中焦气滞常用。
  seq: [1877]
  q: 广木香
  ents: [herb.mu_xiang]
  conf: 0.85
- type: clinical_tip
  s: 泽泻利小便，治水肿水停。
  seq: [2178]
  q: 利小便
  ents: [herb.ze_xie]
  conf: 0.95
- type: clinical_tip
  s: 远志开心窍，安神益智常用。
  seq: [2338]
  q: 远志
  ents: [herb.yuan_zhi]
  conf: 0.85
- type: clinical_tip
  s: 龙胆泻肝胆湿热，与柴胡等同属本经上经收尾诸药。
  seq: [2414]
  q: 龙胆
  ents: [herb.long_dan, herb.chai_hu]
  conf: 0.9
