chapters:
- key: c01
  title: 地榆与海藻
  start_seq: 0
  summary: 地榆（ASR地狱/地鱼）主止血，痔血吐血、门脉破裂呕血常用。海藻咸寒软坚，散瘿消瘰疬淋巴瘤；可作长寿零食，处方三钱起，寒证慎。
  clauses: []
  topics: [herb.di_yu, herb.hai_zao]
- key: c02
  title: 泽兰桑白皮栀子厚朴青皮
  start_seq: 90
  summary: 泽兰妇科利水活血最常用。桑根白皮治虚劳、女子崩下腹块。栀子苦寒清心包烦热。厚朴宽中下气。青皮治皮肤病及黄疸。
  clauses: []
  topics: [herb.ze_lan, herb.sang_gen_bai_pi, herb.zhi_zi, herb.hou_po, new.herb.qing_pi]
- key: c03
  title: 龙眼鹿角羚羊角刺猬皮
  start_seq: 950
  summary: 龙眼滋养安神可作茶饮。鹿角/鹿茸补督脉最强。羚羊角熄风止痉，脑肿瘤外伤抽搐用。刺猬皮收敛祛湿止血，痔疮可用。
  clauses: []
  topics: [herb.long_yan, new.herb.lu_jiao, herb.ling_yang_jiao, new.herb.ci_wei_pi]
