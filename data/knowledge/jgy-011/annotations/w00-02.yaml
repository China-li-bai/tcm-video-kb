chapters:
- key: c01
  title: 腹满虚实辨·温药与攻下
  start_seq: 0
  summary: 金匮第十篇腹满寒疝宿食。腹满分虚实：按之不痛为虚当温药（理中类）；按之痛或舌苔黄为实可攻下（大柴胡/承气）。触诊取天枢；时胀时止属虚寒，持续胀属实。
  clauses: []
  topics:
  - symptom.fu_man
  - concept.xu_shi
  - formula.li_zhong_wan
- key: c02
  title: 胸中寒实·三物小白散与误下泻心
  start_seq: 120
  summary: 胸中寒实下利不止为死证；三物小白散（贝母桔梗巴豆，巴豆量三重）破寒结。绕脐痛属风冷勿妄承气；误下心下痞用泻心汤类补救。厚朴七物汤治太阳阳明合病腹满发热脉浮数。
  clauses: []
  topics:
  - formula.san_wu_xiao_bai_san
  - formula.xie_xin_tang
  - new.formula.hou_pu_qi_wu_tang
- key: c03
  title: 寒疝雷鸣·附子粳米与厚朴三物
  start_seq: 278
  summary: 腹寒剧痛雷鸣切痛（肠套叠感）用附子粳米汤温中降逆。痛而闭用厚朴三物汤（重厚朴枳实）；满而不痛便秘用小承气；不大便无矢气用大承气。厚朴三物与小承气之辨在痛否与药量配伍。
  clauses: []
  topics:
  - new.formula.fu_zi_geng_mi_tang
  - new.formula.hou_pu_san_wu_tang
  - formula.xiao_cheng_qi_tang
  - formula.da_cheng_qi_tang
