kps:
- type: diagnostic_rule
  s: 肝病预警：无故于丑时（约1–3点）定时醒，可早于西医确诊数年；按气血注时肝开于丑。
  seq: [12]
  q: 没有办法入眠
  ents: [new.disease.gan_ai]
  conf: 0.9
- type: treatment_principle
  s: 治肝病必顾大便；肝与大肠相通，经方治肝常从通肠入手以保持便畅。
  seq: [20]
  q: 大便的问题
  ents: [zangfu.da_chang, new.disease.gan_ai]
  conf: 0.95
- type: diagnostic_rule
  s: 肝癌/肝变进展时小便茶黄；可以溲色判病情进退。急性肝炎则可反见溲畅。
  seq: [28]
  q: 茶色的一样很黄
  ents: [new.disease.gan_ai]
  conf: 0.9
- type: pathomechanism
  s: 丑时阳气回流肝脏遇积则进不去，觉热而非高热（体温可正常）；烦躁燥热加重示病进。
  seq: [59]
  q: 烦躁燥热
  ents: [concept.yang_qi]
  conf: 0.85
  asr: 杨繁力≈阳返利/阳回流
- type: formula_indication
  s: 肝癌案主方小柴胡汤；常配郁金、龙胆草疏肝清肝。
  seq: [82]
  q: 小柴胡汤
  ents: [formula.xiao_chai_hu_tang, herb.long_dan, new.herb.yu_jin]
  conf: 0.95
  asr: 龙奶厂=龙胆草；芪郁金
- type: formula_indication
  s: B/C肝或肝硬化恶心呕吐食少：小柴胡加重半夏、党参（可代人参）。
  seq: [119]
  q: 恶心、呕吐
  ents: [formula.xiao_chai_hu_tang, herb.ban_xia, symptom.ou_tu]
  conf: 0.9
- type: formula_composition
  s: 苍术、泽泻、白术、茯苓四味利水通调，肝胆肾病常用，防腹积水；言实脾重于空言健脾。
  seq: [158]
  q: 白术、茯苓
  ents: [herb.bai_zhu, herb.fu_ling, herb.ze_xie, new.herb.cang_zhu]
  conf: 0.9
  asr: 苍竹蜇泻=苍术泽泻
- type: contraindication
  s: 无附子证（如寒凝不化）勿投生附子；药证相应才用强药。
  seq: [183]
  q: 生附子
  ents: [herb.fu_zi]
  conf: 0.9
- type: clinical_tip
  s: 燥热烦躁时段拉长（如由1–3点延至1–5/7点）示阳气更难入肝、病进。
  seq: [178]
  q: 烦躁时间拉长
  ents: [concept.yang_qi]
  conf: 0.85
- type: formula_indication
  s: 术后热象可用三黄泻心类；五苓散利水；治肝同时保持大便通畅以减毒负。
  seq: [260]
  q: 五苓散
  ents: [formula.wu_ling_san, herb.gan_cao]
  conf: 0.9
  asr: 三黄鲜应≈三黄泻心
- type: clinical_tip
  s: 兼肾结石可加乌药、艾叶、猪苓、滑石等；本案未刀前中药已改善眠溲，开刀非必。
  seq: [300]
  q: 肾的石
  ents: [herb.hua_shi, herb.ai]
  conf: 0.85
  asr: 朱林=猪苓
