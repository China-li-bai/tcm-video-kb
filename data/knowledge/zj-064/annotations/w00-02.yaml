kps:
- type: formula_indication
  s: 脑瘤痉挛抽搐可用全蝎、蜈蚣研粉入囊；针取百会配涌泉上下导引。
  seq: [14, 23]
  q: 蜈蚣
  ents: [herb.wu_gong, acupoint.gv20, acupoint.ki1]
  conf: 0.9
  asr: 全歇=全蝎；百汇=百会
- type: diagnostic_rule
  s: 绝骨压痛提示脑部有病；脑萎缩为虚、脑内有物为实，穴上皆可有压痛。
  seq: [36, 38]
  q: 绝骨
  ents: [acupoint.gb39]
  conf: 0.9
  asr: 厥骨/结骨=绝骨；湿疹=实证
- type: clinical_tip
  s: 百会与涌泉为一对导引：上导百会、下引涌泉。
  seq: [24]
  q: 导引
  ents: [acupoint.gv20, acupoint.ki1]
  conf: 0.95
- type: clinical_tip
  s: 鼻息肉等问题可针迎香（透内迎香）。
  seq: [153]
  q: 营香
  ents: [acupoint.li20]
  conf: 0.85
  asr: 营香/银香=迎香
- type: clinical_tip
  s: 支沟又名飞虎，属三焦，通阳气、舒筋活络，耳聋实证可配外关。
  seq: [273]
  q: 支沟
  ents: [acupoint.te6]
  conf: 0.9
