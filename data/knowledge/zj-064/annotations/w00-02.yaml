chapters:
- key: c01
  title: 头脑病·百会涌泉导引与绝骨诊脑
  start_seq: 0
  summary: 膀胱经后头痛粗痛取束骨、酸痛取委中。脑瘤痉挛取全蝎蜈蚣末；针用百会配涌泉上下导引。绝骨（悬钟）压痛提示脑病，虚实皆可见，命门等参辨。
  clauses: []
  topics:
  - acupoint.gv20
  - acupoint.ki1
  - acupoint.gb39
- key: c02
  title: 鼻病迎香与头面配穴
  start_seq: 147
  summary: 鼻鼽鼻窦炎息肉等常见，迎香透内迎香；眼科可配肝经原合等。风池等头面穴活用。
  clauses: []
  topics:
  - acupoint.li20
  - acupoint.gb20
- key: c03
  title: 耳病与支沟飞虎
  start_seq: 263
  summary: 耳门听会等轮换取穴免结硬。实证耳聋可配外关；支沟（飞虎）通三焦阳气，表里脏腑得力。
  clauses: []
  topics:
  - acupoint.te6
  - acupoint.te5
