kps:
- type: diagnostic_rule
  s: 肺热湿热肺炎：身热急、苔白厚腻；与肺癌阴实不同，恢复可很快。
  seq: [2]
  q: 肺热湿热
  ents: [new.disease.fei_yan]
  conf: 0.9
  asr: 肺因迟≈肺阴实之对举
- type: treatment_principle
  s: 肺与大肠表里；肺实证（便秘、溲黄）须问二便，治肺当通腑。
  seq: [32]
  q: 肺根大肠是表里
  ents: [zangfu.da_chang, new.disease.fei_yan]
  conf: 0.95
- type: formula_indication
  s: 肺炎/肺壅热便秘用大承气汤；不用承气则肺热难清。大小承气当辨。
  seq: [48]
  q: 大承气汤
  ents: [formula.da_cheng_qi_tang, formula.cheng_qi_tang]
  conf: 0.95
- type: clinical_tip
  s: 两日大便畅下、眠至天亮、纳复；余热有表虚汗时勿强收表，可加麦冬、西洋参润肺津。
  seq: [119]
  q: 大便跑出来
  ents: [herb.mai_men_dong, new.herb.xi_yang_shen]
  conf: 0.85
  asr: 脉冬=麦冬
- type: contraindication
  s: 大黄/承气减量过早则便秘咳痰复作，须回原通腑方。
  seq: [135]
  q: 四天没有大便
  ents: [formula.da_cheng_qi_tang, herb.da_huang]
  conf: 0.9
  asr: 大食经/大红黄=大承气/大黄
- type: herb_property
  s: 百合润肺力强，可固肺；百合病见意欲食复不能、如有神灵、诸药不和。
  seq: [145]
  q: 润费很强
  ents: [herb.bai_he, syndrome.bai_he_bing]
  conf: 0.9
  asr: 润费=润肺；百合金=百合
- type: formula_indication
  s: 善后：百合+桔梗甘草汤意合大承气；约九至十日可全复。
  seq: [151]
  q: 大承鸡汤
  ents: [formula.da_cheng_qi_tang, herb.bai_he, formula.gan_cao_tang]
  conf: 0.85
  asr: 伪金/煎饼甘草≈桔梗甘草；大承鸡=大承气
- type: pathomechanism
  s: 承气通下后可汗出：大便壅则肺气不降、肺热更炽；腑通则壅热外解。
  seq: [162]
  q: 大承气汤
  ents: [formula.da_cheng_qi_tang]
  conf: 0.9
