chapters:
- key: c01
  title: 血痹成因与黄芪桂枝五物汤
  start_seq: 0
  summary: 金匮血痹虚劳。血痹多见养尊处优、骨弱肌盛、疲劳汗出动摇感邪；痹为皮肤麻木。黄芪桂枝五物汤＝桂枝汤去炙甘草加黄芪，重用生姜；轻者可针。
  clauses: []
  topics:
  - syndrome.xue_bi
  - formula.huang_qi_gui_zhi_wu_wu_tang
- key: c02
  title: 虚劳遗精盗汗·桂枝加龙骨牡蛎汤
  start_seq: 126
  summary: 男子脉浮弱无子、妇人易堕同类虚寒劳证。桂枝加龙骨牡蛎汤不限于遗精，亦治少年遗精、夜尿、瘦弱盗汗；遗精分梦交、无梦、昼遗三等。
  clauses: []
  topics:
  - syndrome.xu_lao
  - new.formula.gui_zhi_jia_long_gu_mu_li_tang
  - herb.mu_li
- key: c03
  title: 桂枝附子剂量与天雄散
  start_seq: 257
  summary: 桂枝附子汤以桂枝量大于附子导药入节；术附则白术量重。继论天雄散等虚劳方。
  clauses: []
  topics:
  - formula.gui_zhi_fu_zi_tang
  - formula.tian_xiong_san
