- key: c01
  title: 委中承山飞扬
  start_seq: 0
  summary: 委中多汗不宜灸，宜刺络放血，治皮肤病（含牛皮癣），为解毒大穴。承山对肛，治痔效著，可配孔最；下针宜透至骨。飞扬为膀胱经络穴，承山下外开，可强健下肢。
  clauses: []
  topics:
  - acupoint.bl40
  - acupoint.bl57
  - acupoint.bl58
- key: c02
  title: 昆仑仆参京骨
  start_seq: 131
  summary: 昆仑在外踝与跟腱间，治项背痛；催产/下胞衣效强，孕妇慎用。仆参在跟旁治足跟痛。京骨为膀胱原穴，治剧烈头痛等。
  clauses: []
  topics:
  - acupoint.bl60
  - acupoint.bl61
  - acupoint.bl64
