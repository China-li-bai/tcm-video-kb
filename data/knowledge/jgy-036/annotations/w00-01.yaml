kps:
- type: clinical_tip
  s: 左肾癌切除后右肾可再发；见尿血、咳吐血、腹胀倦怠。腹胀任何病先想到脾。
  seq: [8]
  q: 咳嗽吐血
  ents: [new.disease.shen_ai, symptom.tu_xie]
  conf: 0.9
- type: formula_indication
  s: 肾癌腹胀纳差可用小陷胸汤开结消胀；有体力时攻、虚则先补再攻，勿连打耗正。
  seq: [40]
  q: 小陷胸汤
  ents: [formula.xiao_xian_xiong_tang, new.disease.shen_ai]
  conf: 0.9
  asr: 小陷红汤=小陷胸
- type: diagnostic_rule
  s: 尿血色深黑、丑时（约2:45–3点）吐血，示肾瘤累及肝脏气血注时。
  seq: [75]
  q: 吐血
  ents: [symptom.tu_xie, new.disease.shen_ai]
  conf: 0.85
- type: treatment_principle
  s: 吐血勿一味阿胶等收涩止血；当活血化瘀兼增温，因寒凝则脉易破而再出血。
  seq: [103]
  q: 阿胶
  ents: [herb.e_jiao, symptom.tu_xie]
  conf: 0.9
- type: contraindication
  s: 稳定之肾瘤不宜强攻（如葛根汤类猛剂）；能吃能喝能便、精神体力好即可长养观察。
  seq: [146]
  q: 葛根汤
  ents: [formula.ge_gen_tang, new.disease.shen_ai]
  conf: 0.85
  asr: 不能供他=不能攻他
- type: clinical_tip
  s: 本案观察约七年瘤稳定、生活质量佳；中药后精神体力好，偶咳感冒即可。
  seq: [150]
  q: 精神体力
  ents: [concept.jing_shen, new.disease.shen_ai]
  conf: 0.9
