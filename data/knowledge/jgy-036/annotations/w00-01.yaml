- key: c01
  title: 肾癌案·尿血吐血与小陷胸
  start_seq: 0
  summary: 左肾癌切除后右肾再发瘤；尿血、咳吐血、腹胀倦怠、口渴。腹胀责脾。初以小陷胸汤开腹胀消纳差；有体力时攻、虚则先补再攻。尿血深黑、丑时吐血示肾瘤累肝。止血勿一味收涩，当活血化瘀兼温通防脉破。
  clauses: []
  topics:
  - new.disease.shen_ai
  - formula.xiao_xian_xiong_tang
  - symptom.tu_xie
- key: c02
  title: 瘤不必强攻·七年随访
  start_seq: 131
  summary: 假设瘤择恶血自养、好血难入；不宜强攻如葛根汤类。能吃能喝能便、精神体力好即可长养观察；本案瘤稳定七年、生活质量佳。勿因西医必切/化疗而弃中医长养。
  clauses: []
  topics:
  - new.disease.shen_ai
  - concept.jing_shen
