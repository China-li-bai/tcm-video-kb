- key: c01
  title: 中府云门与天府侠白
  start_seq: 0
  summary: 中府、云门常同用；书称中府为肺募，口述以云门为真募。天府在臂内侧两肌间（“小老鼠”处），可治鼻血等；侠白在天府下一寸。迎随：顺气为补、逆气为泻。
  clauses: []
  topics:
  - acupoint.lu1
  - acupoint.lu2
  - acupoint.lu3
  - method.bu_xie
- key: c02
  title: 孔最、列缺与太渊补泻
  start_seq: 169
  summary: 孔最取压痛点（约肘腕间）。列缺为手太阴络穴，通任脉，治任脉病及咽喉至前阴一路。针向：顺经（向指）为补、逆经为泻。肺虚久咳可取太渊。
  clauses: []
  topics:
  - acupoint.lu6
  - acupoint.lu7
  - acupoint.lu9
  - meridian.cv
