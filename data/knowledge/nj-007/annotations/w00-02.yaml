kps:
- type: concept_definition
  s: 胸膈以上为阳、以下为阴；体内则阳降阴升，故头宜凉、足宜温。
  seq: [9, 10]
  q: 上面是阳，下面是阴
  ents: [concept.yin_yang]
  conf: 0.95
- type: pathomechanism
  s: 悲伤肺则上焦不通、营卫不散、胸中阳热积；恐伤肾则肺气不降、下焦胀而气不行。
  seq: [17, 33]
  q: 营卫不散
  ents: [zangfu.fei, zangfu.shen, concept.ying_wei]
  conf: 0.9
- type: contraindication
  s: 病愈后饮食不节（尤其食肉）易使余热或旧病复发。
  seq: [115, 117]
  q: 饮食不节
  ents: []
  conf: 0.95
- type: clinical_tip
  s: 胸胁支满、发病前先闻腥臭、吐血目眩等属血枯；内经第二方用乌贼骨。
  seq: [129, 152]
  q: 血枯
  ents: [new.disease.xue_ku, classic.huang_di_nei_jing]
  conf: 0.85
  asr: 血窟=血枯
- type: contraindication
  s: 热中消中者体内本热，不可再服芳草金石等悍热药；用药须病人心平气和。
  seq: [259, 267]
  q: 热中消中
  ents: [new.pattern.re_zhong_xiao_zhong]
  conf: 0.9
- type: concept_definition
  s: 人身四海：气海（颈）、水谷之海、十二经之海、脑髓之海。
  seq: [291, 332]
  q: 统称为四个海
  ents: [new.concept.si_hai]
  conf: 0.95
