chapters:
- key: c01
  title: 肺与大肠表里：气化生津
  start_seq: 0
  summary: 大肠环绕小肠，小肠火蒸腾使残渣之水气化，经肠壁上归于肺——此为肺与大肠相表里的气化解读。膀胱尿液亦需气化至一定容量才有尿意。
  clauses: []
  topics:
  - zangfu.da_chang
  - zangfu.fei
  - concept.biao_li
- key: c02
  title: 子午流注时辰与病机
  start_seq: 92
  summary: 十二时辰配十二经：如大肠卯时（5–7）当有大便；肝经丑时（1–3）当深睡。时辰颠倒（夜不寐昼嗜睡）示病进。可用按时取穴之时间针法。
  clauses: []
  topics:
  - new.concept.子午流注
  - zangfu.gan
  - zangfu.da_chang
- key: c03
  title: 五输穴：阴井木阳井金；原络
  start_seq: 228
  summary: 十二正经各有井荥输经合；阴经井为木，阳经井属性不同。阳经多原穴，阴经无原而有络穴横向联络。井穴（如厉兑）反应迅速，实热可刺；色病多取荥。手不过肘足不过膝取五输。
  clauses: []
  topics:
  - new.concept.五输穴
  - acupoint.st45
  - concept.jing_luo
