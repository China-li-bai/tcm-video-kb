  asr: 集拳/极拳=极泉；揪=灸
- type: concept_definition
  s: 心经阴经五输为木火土金水；少海为合属水。少冲井属木，木生火故为母穴；虚证补合穴少海，勿在井穴上强做补泻。
  seq:
  - 66
  - 91
  q: 上海穴就是心经的什么补泻
  ents:
  - acupoint.ht3
  - acupoint.ht9
  - meridian.ht
  conf: 0.85
  asr: 上海=少海；颈穴/紧穴=井穴
- type: acupoint_usage
  s: 神门治心烦易怒、心神不守、妄见妄笑等；为子穴，心实证可泻。针尖向掌少府方向顺心经刺入。
  seq:
  - 199
  - 212
  q: 下神门神门，就是那哦好，让他神定下来
  ents:
  - acupoint.ht7
  - zangfu.xin
  conf: 0.95
- type: acupoint_usage
  s: 少府在握拳小指端所指处（相对劳宫）；为心脏病急救大穴，又名手解。
  seq:
  - 174
  - 255
  q: 少府穴呢是心脏病的急救大穴
  ents:
