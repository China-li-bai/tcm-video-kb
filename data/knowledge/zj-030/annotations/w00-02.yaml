- key: c01
  title: 极泉青灵少海
  start_seq: 0
  summary: 手少阴心经起于极泉，平常少针少灸。青灵在肘上三寸，少用。少海为合穴属水；井穴少冲属木为母，虚证常补合穴少海，井穴不宜强行捻转补泻。
  clauses: []
  topics:
  - meridian.ht
  - acupoint.ht1
  - acupoint.ht3
- key: c02
  title: 灵道通里阴郄神门少府少冲
  start_seq: 129
  summary: 灵道为经穴。神门为输/子穴，治心烦易怒、神志不宁、见鬼妄笑等心实；针向掌少府方向顺经。少府为荥，亦名手解，心脏病急救要穴。少冲为井，补泻多改在少海。
  clauses: []
  topics:
  - acupoint.ht7
  - acupoint.ht8
  - acupoint.ht9
