  title: 奔豚与水气化·大小肠火金
  start_seq: 0
  summary: 金匮第八篇奔豚气。倪师以水气化释之：心火/小肠火蒸化，大肠吸水回肺；水路上阻则气冲如豚奔。
  clauses: []
  topics:
  - syndrome.ben_tun
  - disease.ben_tun_qi
- key: c02
  title: 奔豚气上冲·桂枝汤与桂枝加桂汤
  start_seq: 137
  summary: 脐下悸等多从苓桂类加减；奔豚气上冲胸腹痛往来寒热用桂枝汤；发汗后烧针致奔豚，气从少腹上冲心，桂枝加桂汤。
  clauses: []
  topics:
  - formula.gui_zhi_tang
  - formula.gui_zhi_jia_gui_tang
- key: c03
  title: 茯苓桂枝甘草大枣汤
  start_seq: 268
  summary: 汗后脐下悸欲作奔豚，用茯苓桂枝甘草大枣汤利水降冲。
  clauses: []
