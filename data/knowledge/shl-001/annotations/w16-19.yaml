kps:
- type: herb_property
  s: 白术祛湿；辨证时分辨风、寒、湿，才能在处方中配上祛风、祛寒、祛湿之药同时治好。
  seq: [2109, 2113]
  q: 好，我们为什么要知道这个有诗的原因就在帮助我们处方上面。
  ents: [herb.bai_zhu, new.concept.风寒湿]
  conf: 0.8
  ch: c22
- type: diagnostic_rule
  s: 素有中焦湿盛的人：舌苔厚、肚子较大、大便黏稠；这类人服桂枝汤后可出现心下满微痛、小便不利。
  seq: [2114, 2122]
  q: 舌苔拿出来看的时候，舌苔的苔很厚。
  ents: [new.tongue.苔厚, symptom.xin_xia_man, symptom.xiao_bian_bu_li]
  conf: 0.85
  ch: c22
- type: formula_composition
  s: 桂枝去桂加茯苓白术汤：白术祛湿、茯苓利水，使湿从小便排出；胃中微痛去桂枝（桂枝对胃不好），白术茯苓等量，小便利则愈。
  seq: [2123, 2138]
  q: 所祛湿跟利水的药，两个加在一起才有办法把这个思从好小便倒掉
  ents: [formula.gui_zhi_qu_gui_jia_fu_ling_bai_zhu_tang, herb.bai_zhu, herb.fu_ling, herb.gui_zhi]
  conf: 0.85
  ch: c22
- type: treatment_principle
  s: 桂枝汤加减规律：胸满去白芍，心下满（胃不适）去桂枝。
  seq: [2141, 2143]
  q: 那白芍拿掉是有胸满的时候，我们要把白芍抽掉
  ents: [formula.gui_zhi_tang, herb.shao_yao, herb.gui_zhi, symptom.xiong_man, symptom.xin_xia_man]
  conf: 0.9
  ch: c22
- type: clause_interpretation
  s: 第29条伤寒脉浮、自汗出、小便数、心烦、微恶寒，不是桂枝汤证；误用桂枝汤发汗后出现咽中干、烦躁、吐逆，是津液与胸阳不足。
  seq: [2147, 2160]
  q: 好，肺里面的胸阳不够了，胸阳不够了。
  ents: [clause.shl.029, formula.gui_zhi_tang]
  conf: 0.85
- type: formula_composition
  s: 甘草干姜汤：干姜温热强肺阳，炙甘草（蜜炙后味厚入心）强心阳；炙甘草剂量大于干姜（四两比二两），越重强心越有力。
  seq: [2163, 2170]
  q: 他能够把肺阳肺阳强起来。
  ents: [formula.gan_cao_gan_jiang_tang, herb.gan_jiang, herb.gan_cao]
  conf: 0.9
- type: pathomechanism
  s: 心肺之阳强起来，居中的脾功能也随之增强，这是《难经》泻南补北的思路；甘草干姜汤专救误汗致厥。
  seq: [2171, 2176]
  q: 当我们在强心强肺的时候，脾脏的功能会强起来。
  ents: [formula.gan_cao_gan_jiang_tang, classic.nan_jing, zangfu.xin, zangfu.fei, zangfu.pi]
  conf: 0.7
- type: diagnostic_rule
  s: 健康标准：一年四季头面凉、手脚温；检查时一手握病人掌心、一手按额头，额凉掌热为常，额热手冷为病态。
  seq: [2184, 2192]
  q: 额头是冷的，手掌是热的常态
  conf: 0.9
- type: formula_indication
  s: 甘草干姜汤服后足温表示阳复；此时用芍药甘草汤补肌肉血脉的津液，脚挛急就能伸展。
  seq: [2193, 2198]
  q: 当你用了甘草甘姜汤回来以后，脚热起来了，代表阳恢复了。
  ents: [formula.gan_cao_gan_jiang_tang, formula.shao_yao_gan_cao_tang, symptom.jiao_luan_ji, herb.shao_yao]
  conf: 0.9
- type: pathomechanism
  s: 脚冷是瘀血的主因：心脏搏动力量不足，热到不了离心最远的脚；寒使液体凝成固体，如冬天河流结冰。
  seq: [2223, 2236]
  q: 这个冷的是造成淤血块的主因
  ents: [zangfu.xin]
  conf: 0.75
- type: diagnostic_rule
  s: 判断用药对错的简单标准：服药后手脚变热是对的，越吃越冷就要换方。
  seq: [2243, 2244]
  q: 好，你吃下去以后，手脚开始热对了是对的。
  conf: 0.9
- type: treatment_principle
  s: 芍药甘草汤重用炙甘草使心热起来，白芍使血循环回流，热到了脚就能化掉瘀血——经方以温热活血化瘀，不必另加三七、丹皮等。
  seq: [2246, 2252]
  q: 好，所以中医活血化瘀是这样来的
  ents: [formula.shao_yao_gan_cao_tang, herb.gan_cao, herb.shao_yao, herb.mu_dan_pi, new.herb.三七]
  conf: 0.75
- type: concept_definition
  s: 手足厥冷与四逆之别：冷在手指到手腕、脚趾到脚踝是手足冰冷；冷到手肘、膝盖才叫四逆，表示病势危重。
  seq: [2263, 2270]
  q: 那如果是四逆的话，就代表说已经到手肘了当。
  ents: [symptom.shou_zu_jue_leng, formula.si_ni_tang, symptom.jue]
  conf: 0.9
- type: prognosis
  s: 让病人自己观察手脚冷的范围：服药后冷的范围往下缩是进步，可借此预防心脏病（倪师个人观点，认为心电图常要发作时才查得到）。
  seq: [2271, 2274]
  q: 这样就可以预防心脏病啊。
  conf: 0.6
- type: clinical_tip
  s: 倪师常说「足温者没有心脏病」，并认为脚温需靠中药调理。
  seq: [2298, 2300]
  q: 足温者没有心脏病
  conf: 0.65
- type: diagnostic_rule
  s: 误汗使胃中食物失水干结，胃气不和、谵语；腹诊中脘到神阙一带压痛，少少与调胃承气汤，把肠胃清一下即可。
  seq: [2318, 2328]
  q: 好，到神阙
  ents: [formula.diao_wei_cheng_qi_tang, symptom.zhan_yu, acupoint.cv12, acupoint.cv8]
  conf: 0.85
- type: formula_composition
  s: 甘草干姜汤炙甘草四两、干姜二两；芍药甘草汤芍药、炙甘草等量。
  seq: [2333, 2334]
  q: 所以枝甘草的剂量好会大于干姜的泡
  ents: [formula.gan_cao_gan_jiang_tang, formula.shao_yao_gan_cao_tang]
  conf: 0.9
- type: formula_indication
  s: 芍药甘草汤能使下肢静脉血回流，可治产后静脉瘤；倪师案例：白芍、炙甘草各八钱无效，加至各一两，一剂静脉瘤消去九成。
  seq: [2335, 2362]
  q: 刚开始呢我们白芍呢八钱
  ents: [formula.shao_yao_gan_cao_tang, new.disease.静脉曲张, herb.shao_yao, herb.gan_cao]
  conf: 0.75
- type: clinical_tip
  s: 处方对但剂量不够看不到效果；经方对症时病人服药后常出现头晕（瞑眩），这是药中病的表现。
  seq: [2350, 2357]
  q: 只要是对症
  ents: [new.concept.瞑眩]
  conf: 0.75
- type: formula_composition
  s: 调胃承气汤倪师常用炙甘草二钱、大黄四钱、芒硝二钱；大黄酒洗使药力停在胃部，不会一下冲到大肠。
  seq: [2373, 2388]
  q: 中药里面在神农甘草剂里面开宗明医。
  ents: [formula.diao_wei_cheng_qi_tang, herb.da_huang, herb.xiao_shi, herb.gan_cao]
  conf: 0.75
- type: herb_property
  s: 芒硝软坚，专治大便燥硬排不出；不可与大黄甘草同煮太久，应冲服（最快）或在汤将沸时放入后关火。
  seq: [2392, 2416]
  q: 所以盲销能够软煎。
  ents: [herb.xiao_shi]
  conf: 0.85
  asr: 盲销/囊硝/狼枭=芒硝；软煎=软坚
- type: formula_composition
  s: 大承气汤有芒硝、小承气汤没有；大承气证误开小承气，会想解便却排不出。
  seq: [2417, 2421]
  q: 好，就这个大尘器有盲硝。
  ents: [formula.da_cheng_qi_tang, formula.xiao_cheng_qi_tang, herb.xiao_shi]
  conf: 0.85
- type: clause_interpretation
  s: 第29条末：重发汗又加烧针，津液丧失、手足冷过肘膝，用四逆汤。
  seq: [2439, 2441]
  q: 发完汗就给他给人家那个烧针，就呢精液丧失太多精赛了就是四逆汤。
  ents: [clause.shl.029, formula.si_ni_tang, method.shao_zhen]
  conf: 0.85
- type: formula_composition
  s: 四逆汤：炙甘草、干姜、生附子一枚（去皮破八片）；救逆时附子要生用，近代畏毒只用一片是不够的。
  seq: [2445, 2450]
  q: 真正的我们在救逆的时候，附子是生用。
  ents: [formula.si_ni_tang, herb.fu_zi, herb.gan_jiang, herb.gan_cao]
  conf: 0.85
- type: clinical_tip
  s: 生附子用后咳嗽不止多因其纤维浮在汤面黏喉，并非毒性；用棉布包煮即可避免。
  seq: [2463, 2470]
