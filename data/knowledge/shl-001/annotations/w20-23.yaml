kps:
- type: formula_indication
  s: 脑膜炎角弓反张属刚痉，张仲景也用葛根汤，得汗则解；柔痉则用桂枝汤加栝楼根。
  seq: [2601, 2607]
  q: 那葛根汤是用在肛茎上面啊
  ents: [syndrome.gang_jing, syndrome.rou_jing, formula.ge_gen_tang, new.disease.脑膜炎, new.formula.栝楼桂枝汤]
  conf: 0.8
- type: formula_composition
  s: 生姜、炙甘草、大枣是补肠胃津液之药：发汗的源头在肠胃，不加它们汗后易便秘；治任何病都要同时顾护肠胃。
  seq: [2609, 2620]
  q: 随时我们那个中医治病呢，不管是治什么病，随时在同时在治病的同时一定要顾他的肠胃。
  ents: [herb.sheng_jiang, herb.gan_cao, herb.da_zao, concept.jin_ye]
  conf: 0.9
- type: treatment_principle
  s: 经方组成是「绝对处方」、比例是「黄金比例」，基本方不可改；可在其上加药（如葛根汤证兼便秘加大黄表里双解）。
  seq: [2624, 2630]
  q: 黄金比例不能动不能改，这个比例不要改。
  ents: [new.concept.绝对处方, new.concept.黄金比例, formula.ge_gen_tang, herb.da_huang]
  conf: 0.9
- type: clinical_tip
  s: 汉制两数不必死算：药材有按容积、有按重量计，重点是比例；依体格大小按比例增减，或同一锅药让小孩喝少一点。
  seq: [2632, 2645]
  q: 所以说你要看他的比例最重要，对不对？
  ents: [new.concept.黄金比例]
  conf: 0.85
- type: concept_definition
  s: 麻黄汤、桂枝汤、葛根汤所治属天地正气所伤之病，不传染；大青龙汤证属疫病会全家传染。
  seq: [2642, 2649]
  q: 这个病不会传染的。
  ents: [formula.ma_huang_tang, formula.gui_zhi_tang, formula.ge_gen_tang, formula.da_qing_long_tang]
  conf: 0.7
- type: formula_composition
  s: 葛根汤七味，先煮麻黄、葛根去沫再下他药，七碗煮三碗、一次一碗，覆取微似汗；有姜草枣，不必啜粥。
  seq: [2652, 2671]
  q: 那这个不需要醉粥于如桂枝汤法将其其禁忌
  ents: [formula.ge_gen_tang, method.chuai_zhou, herb.ma_huang, herb.ge_gen]
  conf: 0.8
- type: prognosis
  s: 葛根汤证救治太慢或误用他药，高烧不退可变脑膜炎（刚痉），仍可用葛根汤；过了六七天则入阳明，需改用阳明方。
  seq: [2679, 2688]
  q: 葛根汤汁，还在那边
  ents: [formula.ge_gen_tang, new.disease.脑膜炎, six_channel.yangming]
  conf: 0.7
- type: formula_composition
  s: 葛根汤的黄金比例是葛根四、麻黄三、桂芍二：麻黄若超过葛根，汗就不限于项背而是全身大汗，失去葛根汤的意义。
  seq: [2691, 2697]
  q: 好，所以黄金比例呢就是四三二
  ents: [formula.ge_gen_tang, herb.ge_gen, herb.ma_huang, herb.gui_zhi, herb.shao_yao]
  conf: 0.9
- type: clinical_tip
  s: 鼻窦炎用葛根汤：清涕属寒湿，加白术祛湿、附子祛寒；黄稠涕属湿热，不用附子而加黄芩等清热药。
  seq: [2699, 2714]
  q: 白术去湿
  ents: [new.disease.鼻窦炎, formula.ge_gen_tang, herb.bai_zhu, herb.fu_zi, herb.huang_qin]
  conf: 0.85
- type: formula_indication
  s: 痛风是表热里寒、风性游走，需祛风（桂枝）、祛湿（白术）、祛寒（炮附子）合炙甘草，即甘草附子汤。
  seq: [2716, 2722]
  q: 就经方里面很有名的甘草附子汤，专门治都痛风了
  ents: [new.disease.痛风, formula.gan_cao_fu_zi_tang, herb.gui_zhi, herb.bai_zhu, herb.fu_zi]
  conf: 0.8
- type: formula_indication
  s: 小儿水痘（倪师认为是胎毒）初起见指缝水泡、微烧，不可用寒凉药闷住；葛根汤一剂全身透发，热退、精神胃口恢复。
  seq: [2741, 2756]
  q: 所以我治疗水痘也是一剂好，葛根汤就下线好
  ents: [new.disease.水痘, formula.ge_gen_tang]
  conf: 0.75
- type: clinical_tip
  s: 面部中风用桂枝加葛根汤时葛根加倍（桂芍三、葛根由四加到六），恢复更快。
  seq: [2763, 2765]
  q: 葛格把它变成六好double上去，那脸就去的很快哦。
  ents: [formula.gui_zhi_jia_ge_gen_tang, herb.ge_gen, new.disease.面部中风]
  conf: 0.8
- type: formula_indication
  s: 白术、附子等量（倪师称术附汤）是排深部脓的好方：化脓表热里寒，祛寒祛湿能把骨边深处的脓逼出；一般用寒凉药反而不好。
  seq: [2774, 2788]
  q: 好，白术跟附子等量就可以把这种逼出来哦
  ents: [new.formula.术附汤, herb.bai_zhu, herb.fu_zi]
  conf: 0.7
- type: clinical_tip
  s: 排脓方各有所主：金匮赤小豆当归散所排为肛门痔疮之脓，与脚上化脓用的方不同，方剂应用必须对位。
  seq: [2789, 2794]
  q: 所以一定要知道方剂的应用好
  ents: [formula.chi_xiao_dou_dang_gui_san, formula.pai_nong_tang]
  conf: 0.6
- type: clinical_tip
  s: 糖尿病足溃烂不收口又见葛根汤证：仍用葛根汤，加术附排脓，白芍加倍使血液回流修补。
  seq: [2797, 2804]
  q: 把白芍怎么样加倍嘛
  ents: [formula.ge_gen_tang, herb.shao_yao, new.formula.术附汤]
  conf: 0.65
- type: clause_interpretation
  s: 第32条太阳与阳明合病必自下利，有项背强几几、无汗恶风兼下利，仍用葛根汤。
  seq: [2805, 2814]
  q: 那太阳和阳明合并的时候，一定会有下利的现象。
  ents: [clause.shl.032, syndrome.he_bing, symptom.xia_li, formula.ge_gen_tang]
  conf: 0.9
- type: concept_definition
  s: 以合病观念理解柴胡剂：小柴胡汤介于太阳与少阳之间，大柴胡汤介于少阳与阳明之间。
  seq: [2816, 2817]
  q: 那大柴胡汤是于阳明跟少阳中间的组合帮哦
  ents: [formula.xiao_chai_hu_tang, formula.da_chai_hu_tang, syndrome.he_bing]
  conf: 0.75
- type: pathomechanism
  s: 葛根汤把肠胃中的水往上提升，本来往下走的水上行，下利就止；中医止利有升提、和解、通利多种法。
  seq: [2819, 2822]
  q: 那葛根汤下去以后把肠胃的水提上来，下面就止掉了。
  ents: [formula.ge_gen_tang, symptom.xia_li]
  conf: 0.85
- type: contraindication
  s: 平素中焦湿热（舌苔黄湿、爱吃油腻、偏胖）者服葛根汤，会把湿热提上脸而红肿；应加白术、黄芩黄连清热祛湿，加茯苓从小便排出。
  seq: [2827, 2841]
  q: 好，我对那个葛根汤要小心一点。
  ents: [formula.ge_gen_tang, herb.bai_zhu, herb.huang_lian, herb.fu_ling]
  conf: 0.85
- type: formula_indication
  s: 第33条太阳阳明合病不下利但呕，用葛根加半夏汤（葛根汤加生半夏，约三钱，与麻黄比例相同）。
  seq: [2848, 2850]
  q: 好，加半夏。
  ents: [clause.shl.033, formula.ge_gen_jia_ban_xia_tang, herb.ban_xia, symptom.ou_tu]
  conf: 0.9
- type: herb_property
  s: 生半夏之毒主要是令人失声（喉咙发不出声），用生姜可解；倪师主张诊所直接用生半夏，认为各种炮制半夏力弱。
  seq: [2861, 2870]
  q: 那解败下的毒就要靠生姜啊
  ents: [herb.ban_xia, herb.sheng_jiang]
  conf: 0.65
- type: herb_property
  s: 倪师认为生半夏是唯一能排脑部积水（至高之水）的药，并强力止呕；孕吐亦可用（如干姜人参半夏丸），配生姜或干姜解其毒。
  seq: [2871, 2882]
  q: 最高的水要靠是卖家恶心，要靠审判下。
  ents: [herb.ban_xia, formula.gan_jiang_ren_shen_ban_xia_wan, herb.gan_jiang]
  conf: 0.6
- type: treatment_principle
  s: 解表的标准是「覆取微似汗」：身上摸着潮潮黏黏、看不到汗水，病出而津液不伤，恰到好处。
  seq: [2893, 2901]
  q: 复取为害为士汉，感觉身上有汗，实际上摸又没有汗，那是最标准的
  ents: [new.concept.微汗]
  conf: 0.9
- type: diagnostic_rule
