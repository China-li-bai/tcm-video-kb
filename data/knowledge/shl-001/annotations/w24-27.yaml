kps:
- type: formula_composition
  s: 麻黄汤九碗水先煮麻黄去两碗，再煮成两碗半，每次服三分之一，覆取微似汗；不需啜粥，因目的在解肺中之寒而非助胃。
  seq: [3127, 3136]
  q: 他是要解肺里面的寒，把它解掉。
  ents: [formula.ma_huang_tang, method.chuai_zhou]
  conf: 0.8
  ch: c28
- type: contraindication
  s: 服麻黄汤、桂枝汤期间忌生冷、滑腻、生鱼片与腌制食物。
  seq: [3137, 3140]
  q: 好，还有这个这个腌制过的东西不要吃啊。
  ents: [formula.ma_huang_tang, formula.gui_zhi_tang]
  conf: 0.85
  ch: c28
- type: herb_property
  s: 倪师认为杏仁并无一般所说的毒性，麻黄汤中杏仁至少与麻黄等量，可略多；并引用以杏仁治肺结核的传闻（个人观点）。
  seq: [3144, 3154]
  q: 这个杏能的量基本最基最基本杏仁还麻烦，要等量
  ents: [herb.xing_ren, formula.ma_huang_tang]
  conf: 0.55
  ch: c28
- type: concept_definition
  s: 太阳三纲：太阳中风用桂枝汤、太阳伤寒用麻黄汤、太阳温病用葛根汤。
  seq: [3158, 3158]
  q: 太阳中风、桂枝汤、太阳伤寒、麻黄汤、太阳温病的时候是葛根汤。
  ents: [formula.gui_zhi_tang, formula.ma_huang_tang, formula.ge_gen_tang, syndrome.tai_yang_zhong_feng, syndrome.shang_han, syndrome.wen_bing]
  conf: 0.95
  ch: c28
- type: clause_interpretation
  s: 第36条太阳与阳明合病，喘而胸满（病在肺有寒）不可攻下，宜麻黄汤；伤寒论原则：有表证必先解表，不可攻下。
  seq: [3160, 3171]
  q: 当有表症的时候
  ents: [clause.shl.036, syndrome.he_bing, formula.ma_huang_tang, symptom.chuan, symptom.xiong_man]
  conf: 0.9
- type: pathomechanism
  s: 伤寒证（身痛、恶寒）因便秘误用大承气汤攻下，寒邪内陷可成结胸；食物中毒致下也会出现同样变化。
  seq: [3173, 3181]
  q: 那个那个那个寒会结的胸会成为结胸症哦
  ents: [syndrome.jie_xiong, formula.da_cheng_qi_tang, syndrome.shang_han]
  conf: 0.8
- type: concept_definition
  s: 伤寒论的「伤寒」指一种证候，与西医的伤寒（传染病）不同，不可混为一谈。
  seq: [3184, 3186]
  q: 我们这伤寒跟西医讲的伤寒不一样哦
  ents: [syndrome.shang_han]
  conf: 0.9
- type: prognosis
  s: 太阳病经过一候（六七天）必有变化；肠胃好的人可不药而愈，故平时要顾好肠胃。
  seq: [3193, 3196]
  q: 所以随时要保持肠胃，要一定要很好啊。
  conf: 0.8
- type: clinical_tip
  s: 倪师主张桂枝汤调和阴阳、性质平和，平时受点风寒即可服用保养（个人观点）。
  seq: [3198, 3203]
  q: 所以平常没事，你就可以吃这桂枝汤啊
  ents: [formula.gui_zhi_tang]
  conf: 0.6
- type: clause_interpretation
  s: 第37条太阳病十日已去，若胸满胁痛（胸胁苦满）是已入少阳，用小柴胡汤；若脉但浮、太阳证仍在，仍用麻黄汤。
  seq: [3204, 3219]
  q: 这时候我们给小柴胡汤。
  ents: [clause.shl.037, formula.xiao_chai_hu_tang, formula.ma_huang_tang, symptom.xiong_xie_ku_man]
  conf: 0.85
- type: treatment_principle
  s: 有是证用是药：不论过了几天，只要太阳证还在就用太阳方，进入少阳才换方。
  seq: [3212, 3214]
  q: 只要还是有证还在的时候，太阳症还在的时候，就用太阳症的药。
  ents: [six_channel.taiyang, six_channel.shaoyang]
  conf: 0.9
- type: diagnostic_rule
  s: 小柴胡汤证除胸胁苦满外，还会有往来寒热与恶心。
  seq: [3207, 3208]
  q: 实际上小孩小柴胡汤呢会有往来寒热，而且恶心哦。
  ents: [formula.xiao_chai_hu_tang, symptom.xiong_xie_ku_man, symptom.wang_lai_han_re, symptom.e_xin]
  conf: 0.9
- type: clause_interpretation
  s: 第38条脉浮紧、发热恶寒、身疼痛、不汗出而烦躁，用大青龙汤；比麻黄汤证多了烦躁。
  seq: [3226, 3227]
  q: 这里多了一个烦躁
  ents: [clause.shl.038, formula.da_qing_long_tang, symptom.fan_zao, pulse.mai_fu_jin]
  conf: 0.85
  asr: 大陷红汤/大兴农场=大青龙汤
- type: diagnostic_rule
  s: 烦躁的表现：手足躁扰、睡不好、情绪易怒、来回走动无法安坐，小孩好动、家属抱怨也属之。
  seq: [3227, 3229]
  q: 没有办法坐，安静的坐下来，小朋友好动，通通属于烦躁啊。
  ents: [symptom.fan_zao]
  conf: 0.8
- type: contraindication
  s: 脉微弱、汗出恶风是桂枝汤证，不可服大青龙汤；误服则厥逆、筋惕肉瞤（肌肉跳动），因发表太强伤了已不足的津液。
  seq: [3232, 3247]
  q: 若如果说这个脉微弱，汗出恶风者不可服。
  ents: [formula.da_qing_long_tang, formula.gui_zhi_tang, pulse.mai_wei_ruo, new.symptom.筋惕肉瞤, symptom.jue]
  conf: 0.85
- type: diagnostic_rule
  s: 大青龙汤四字诀「表寒里热」：表寒见恶寒、肌肉痛、脉浮紧、无汗；里热见舌苔黄、咳喘、烦躁、口渴、黄痰。
  seq: [3248, 3263]
  q: 好，表含
  ents: [formula.da_qing_long_tang, new.concept.表寒里热, pulse.mai_fu_jin]
  conf: 0.9
- type: concept_definition
  s: 节气正常时得病用桂枝、麻黄、葛根汤；节气反常（如冬行春令）、老幼同病而传染者为疫，大青龙汤为疫病而设，中医同证同治。
  seq: [3266, 3275]
  q: 中医是同症同治好，还是大青隆汤症。
  ents: [formula.da_qing_long_tang, new.disease.疫病, formula.gui_zhi_tang, formula.ma_huang_tang, formula.ge_gen_tang]
  conf: 0.8
- type: clinical_tip
  s: 原方麻黄六两是比例，倪师可开麻黄六钱：一剂煮三碗，一碗仅两钱，小孩只喝一口，一次煮完也方便。
  seq: [3283, 3292]
  q: 诸位看麻黄看黄金比例哦
  ents: [formula.da_qing_long_tang, herb.ma_huang]
  conf: 0.75
- type: formula_composition
  s: 大青龙汤即麻杏甘石汤加桂枝、生姜、大枣（亦即麻黄汤加石膏、姜、枣），共七味；麻黄约为桂枝三倍。
  seq: [3296, 3299]
  q: 大青龙汤的祭汤的方法很简单
  ents: [formula.da_qing_long_tang, formula.ma_huang_xing_ren_gan_cao_shi_gao_tang, formula.ma_huang_tang, herb.shi_gao]
  conf: 0.9
- type: clinical_tip
  s: 大青龙汤石膏如鸡子大约五钱：咳嗽重多加杏仁，高烧多加石膏，可用到一两。
  seq: [3300, 3306]
  q: 病人烧很高的时候，我用石膏多加一点好。
  ents: [herb.shi_gao, herb.xing_ren, formula.da_qing_long_tang]
  conf: 0.85
- type: prognosis
