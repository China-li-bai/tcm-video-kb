kps:
- type: concept_definition
  s: 「伤寒」之名出自《难经》五十八难：伤寒有五，即中风、伤寒、湿温、热病、温病；此中风是「伤于风」，不是西医的脑中风。
  seq: [4, 11]
  q: 这个伤寒呢是来自难经第五十八难。
  ents: [classic.nan_jing, syndrome.zhong_feng, syndrome.shang_han, syndrome.wen_bing]
  conf: 0.85
- type: concept_definition
  s: 冬主收藏、气候寒冷是「正气」；按节气受寒得病属正气病；冬行春令等气候与节气不合、男女老少同病者为疫病（如SARS），处方不同。
  seq: [17, 36]
  q: 不管他是大小是谁，哎，得到的症都一样，这就是所谓的意病
  ents: [classic.huang_di_nei_jing, new.concept.疫病, new.concept.时疫]
  conf: 0.8
  asr: 意病=疫病；十亿=时疫
- type: concept_definition
  s: 张仲景依据《黄帝内经·素问·热论》（第31篇）归纳出六经辨证：每一经的病变有对应症状与处方，有规可循，使中医易学。
  seq: [38, 47]
  q: 把它归纳起来以后，把它分成六经辨证。
  ents: [person.zhang_zhong_jing, classic.sw_re_lun, concept.liu_jing, concept.bian_zheng]
  conf: 0.9
- type: concept_definition
  s: 经方并非张仲景所创，可上溯至黄帝、岐伯，是上古传下的「绝对处方」；张仲景是传承与整理者，按六经条理编排，后人不宜随意改方。
  seq: [48, 54]
  q: 经方并不是张仲景研究出来的
  ents: [concept.jing_fang, person.zhang_zhong_jing, person.huang_di, person.qi_bo]
  conf: 0.85
- type: study_method
  s: 学伤寒论要熟练到一听症状就能开出处方的程度；太阳篇约占全书六成以上。
  seq: [56, 77]
  q: 整个整个伤寒论就占了百分之六十以上。
  ents: [classic.shang_han_lun, syndrome.tai_yang_bing]
  conf: 0.8
- type: concept_definition
  s: 一天十二时辰分为六气：厥阴（巳亥）、少阴（子午）、太阴（丑未）、少阳（寅申）、阳明（卯酉）、太阳（辰戌），阴阳是逐渐转换的。
  seq: [83, 104]
  q: 十二个时辰里面，我们分六个气，好，分六个气。
  ents: [new.concept.五运六气, six_channel.jueyin, six_channel.shaoyin, six_channel.taiyin, six_channel.shaoyang, six_channel.yangming, six_channel.taiyang]
  conf: 0.7
  asr: 时辰名ASR混乱（筹位=丑未、饮汗生=寅申、某时=卯酉、陈汉旭=辰戌），按六气司天对应补全
- type: pathomechanism
  s: 六气顺行为正气、无病；病气则逆行。治疗后病从厥阴依次转出到太阳，表示病在痊愈；反之由阳入阴说明治错了。
  seq: [109, 113]
  q: 正气就是说你是无病的状态
  ents: [concept.zheng_qi, six_channel.jueyin, six_channel.taiyang]
  conf: 0.8
- type: concept_definition
  s: 中医是「健康专家」而非某病专家：伤寒论条文虽多讲病，重心在健康标准，医生必须先知道什么是健康才能判断病已治好。
  seq: [114, 125]
  q: 重心在健康的标准哦，健康的标准。
  ents: [classic.shang_han_lun]
  conf: 0.85
- type: study_method
  s: 张仲景言简意赅，条文要把伤寒、金匮整套读完再整理成系统，否则背了也不会用；倪师的讲解即是整理后的体系。
  seq: [140, 150]
  q: 所以说真的要了伤伤金匮呢，要把整套看完以后把它稍微整理一下
  ents: [person.zhang_zhong_jing, classic.shang_han_lun, classic.jin_gui_yao_lve]
  conf: 0.8
- type: concept_definition
  s: 太阳主表，可与手太阳小肠经、足太阳膀胱经（肩背后部）相参；外感初起病在表，按八纲（阴阳表里虚实寒热）属表证。
  seq: [152, 163]
  q: 太阳呢在表诸位在练针灸的时候
  ents: [six_channel.taiyang, meridian.si, meridian.bl, new.concept.八纲辨证, concept.biao_li]
  conf: 0.85
- type: concept_definition
  s: 太阳为寒水：正常人皮肤摸上去偏凉而手脚温热；这层寒水不断更新，用以隔绝外界、保持体温，皮肤燥热则为病。
  seq: [165, 181]
  q: 所以正常人呢皮肤表面上是冰的，叫太阳寒水。
  ents: [new.concept.太阳寒水, six_channel.taiyang]
  conf: 0.85
- type: diagnostic_rule
  s: 张仲景以浮、沉、迟、数四脉为纲：浮数为阳脉，沉迟为阴脉；浮沉按部位分（轻触即得为浮，重按至骨为沉），迟数按速度分。
  seq: [188, 221]
  q: 主张仲景主要的代表了四个脉，
  ents: [pulse.fu, pulse.chen, pulse.chi, pulse.shu, person.zhang_zhong_jing]
  conf: 0.9
- type: diagnostic_rule
  s: 浮脉的定义：手指轻轻碰到皮肤即摸到脉，不要压。
  seq: [202, 208]
  q: 轻轻的摸到皮肤上面就可以摸到脉，就是叫做浮脉
  ents: [pulse.fu]
  conf: 0.9
- type: prognosis
  s: 初病脉浮大数滑，渐变为涩、微、弱者为阳转阴，表示病在进、越来越重；初病脉沉微弱，渐转浮大数有力者为阴转阳，表示病退。服药后脉越来越微弱即是吃坏了。
  seq: [224, 252]
  q: 这几种脉由阴脉变成阳经经就是病退
  ents: [pulse.fu, pulse.chen, pulse.se, pulse.wei, pulse.ruo]
  conf: 0.85
- type: diagnostic_rule
  s: 正常人的脉不浮不沉、不迟不数：轻摸皮肤摸不到，稍按即得，不必重按至骨。
  seq: [258, 262]
  q: 那是在中间也不迟，也不竖，这是正常人。
  conf: 0.8
- type: concept_definition
  s: 张仲景重望闻问切的综合，不强调把脉细分脏腑；只凭把脉说病、一开七八十味药的是下工，不是中医精神。
  seq: [264, 272]
  q: 这种是下工，就开处方的时候，一开出来七八十味药
  ents: [concept.xia_gong, person.zhang_zhong_jing]
  conf: 0.8
- type: prognosis
  s: 张仲景认为阳病不宜见阴脉，有病应见阳脉才是顺证；用对经方后一周内脉象即可改变，配合针灸则感冒可早上服药中午就好。
  seq: [276, 287]
  q: 有病呢，一定要看着阳脉。
  ents: [concept.jing_fang, method.zhen_jiu]
  conf: 0.7
- type: diagnostic_rule
  s: 第1条太阳提纲：脉浮、头项强痛、恶寒，是初得外感的表证。
  seq: [295, 297]
  q: 所以脉是浮到的那头像强痛恶寒。
  ents: [clause.shl.001, pulse.fu, new.symptom.头项强痛, symptom.e_han, syndrome.tai_yang_bing]
  conf: 0.9
- type: pathomechanism
  s: 后颈多以「风」命名的穴位（风池、风门、风府），是最怕风、风寒最易侵入之处；冷气从后颈吹最易重感冒，天冷时缩脖子可防寒。
  seq: [299, 304]
  q: 这些穴道你看都是用风字来命名。
  ents: [acupoint.gb20, acupoint.bl12]
  conf: 0.85
- type: clinical_tip
  s: 热天大汗后脸对冷气吹，次日可致面部中风（口眼歪斜）；张仲景虽不知冷气，但理论相同，经方治面瘫仍然有效——古方今用，环境变而理不变。
  seq: [306, 319]
  q: 所以我们我常常还是开经方在治疗那个面部中风很快
  ents: [concept.jing_fang]
  conf: 0.8
- type: pathomechanism
  s: 肺主皮毛；心肺主表：心搏动产热，肺属寒，二者如引擎与水箱相配以保持恒温。
  seq: [323, 331]
  q: 正常人呢肺主皮毛，所以皮肤毛孔呢就是肺脏在管。
  ents: [zangfu.fei, zangfu.xin, zangfu.pi_mao]
  conf: 0.85
- type: pathomechanism
  s: 受风寒后寒水停滞在表，新水不断供应而旧水排不掉，形成压力而头项强痛，并见恶寒；痛来自压力，不是发炎。
  seq: [335, 338]
  q: 当然会痛是来自压力
  ents: [new.symptom.头项强痛, symptom.e_han, new.concept.太阳寒水]
  conf: 0.85
- type: treatment_principle
  s: 见太阳证（脉浮、头项强痛、恶寒）就给太阳药，不必管内里是肺癌、肝癌等何病——依证不依病名。
  seq: [342, 346]
  q: 我不管你如果病人出现这个现象，你就给他太阳正风药就对了。
  ents: [syndrome.tai_yang_bing]
  conf: 0.85
- type: diagnostic_rule
  s: 望诊可替代问诊：病人穿厚夹克、衣服包得紧即知恶寒；哑巴或小孩可摸脉、看动作判断。
  seq: [358, 366]
  q: 一看就知道恶寒嘛
  ents: [symptom.e_han]
  conf: 0.8
- type: clause_interpretation
  s: 第2条太阳中风：发热、汗出、恶风、脉浮缓；中风是一组症状而非病名，汗是无故自汗，发热不高（高于正常一两度）。
  seq: [368, 387]
  q: 有发热、汗出恶风，脉寒者名为中风。
  ents: [clause.shl.002, syndrome.zhong_feng, symptom.fa_re, symptom.han_chu, symptom.e_feng, pulse.huan, pulse.fu]
  conf: 0.9
- type: diagnostic_rule
  s: 判断中风只需一两个主症：病人说怕风吹、有流汗即可判断为中风；中风、伤寒、温病各有不同处方。
  seq: [387, 391]
  q: 流汗你就已经已经可以你家一两个症状。
  ents: [syndrome.zhong_feng, symptom.han_chu, symptom.e_feng, syndrome.wen_bing]
  conf: 0.85
- type: pathomechanism
  s: 中风多因运动出汗后没保护好，如跑步后进冷气很强的商店，被风一吹就中风。
  seq: [394, 397]
  q: 这个病呢一般来说哦就是在运动了以后运动啊和流汗
  ents: [syndrome.zhong_feng]
  conf: 0.8
- type: diagnostic_rule
  s: 外感先问有无出汗：有汗就排除伤寒，再问怕不怕风，怕风即是中风，可直接处方。
  seq: [402, 403]
  q: 流汗有汗就不是伤寒论，你知道就已经把伤痕踢掉了。
  ents: [syndrome.shang_han, syndrome.zhong_feng, symptom.han_chu]
  conf: 0.85
- type: clause_interpretation
  s: 第3条太阳伤寒：或已发热或未发热（不是重点），必恶寒、体痛、呕逆、脉阴阳俱紧；中风与伤寒唯一区别是有汗（桂枝）与无汗（麻黄）。
  seq: [407, 411]
  q: 两个唯一的区分点就是一个有害，一个无害。
  ents: [clause.shl.003, syndrome.shang_han, symptom.e_han, symptom.ti_tong, symptom.ou_ni, pulse.jin, herb.gui_zhi, herb.ma_huang, symptom.wu_han]
  conf: 0.9
