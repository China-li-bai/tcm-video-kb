kps:
- type: formula_composition
  s: 汉制八两约合今六钱；桂枝汤桂枝三两约今2.3钱，倪师实际开三钱，芍药、炙甘草按比例；生姜不可开三两，两三片即可。
  seq: [1084, 1100]
  q: 所以如果现在是桂枝三两的时候，差不多是二点三
  ents: [formula.gui_zhi_tang, herb.gui_zhi, herb.shao_yao, herb.gan_cao, herb.sheng_jiang]
  conf: 0.75
- type: formula_composition
  s: 大枣要"擘"：把枣打扁让肉露出即可，不必用刀切。
  seq: [1101, 1102]
  q: 就把它打扁就好了，好，让它肉露出来。
  ents: [herb.da_zao]
  conf: 0.85
- type: formula_composition
  s: 汉代条件下"微火"实际是滚火；"一升"约为"六勺七抄"（把药抖松后取六勺），约合今五钱的量。
  seq: [1105, 1124]
  q: 所以现在来说一生用我们的剂量来的的哈，大概是五千的量啊
  conf: 0.6
  asr: 一生=一升；六勺七草=六勺七抄（推定）
- type: herb_property
  s: 依《神农本草经》：桂枝辛甘发散为阳药，白芍酸苦涌泄为阴药；桂枝汤中二者等量以调和阴阳。
  seq: [1130, 1139]
  q: 所以桂枝是阳药，白芍是阴药，这是肯定的
  ents: [herb.gui_zhi, herb.shao_yao, classic.shen_nong_ben_cao_jing, concept.yin_yang]
  conf: 0.9
- type: pathomechanism
  s: 桂枝对应动脉（阳）、白芍对应静脉（阴），动静脉等长，故桂芍等量；阳虚加重桂枝，阴不足加重白芍（如建中汤重用芍药）。
  seq: [1140, 1148]
  q: 当阳虚的时候，
  ents: [herb.gui_zhi, herb.shao_yao, formula.xiao_jian_zhong_tang]
  conf: 0.75
- type: treatment_principle
  s: 桂枝汤为调和阴阳的基础方，稍加减即可应对不同时机与症状；医生只要掌握阴阳，诊断与用药都能调回常态。
  seq: [1150, 1154]
  q: 那当个医生呢，你只要知道阴阳就可以做很好的医生。
  ents: [formula.gui_zhi_tang, concept.yin_yang]
  conf: 0.85
- type: contraindication
  s: 只用桂枝、白芍两味发汗力太强：汗后感冒虽好，但伤及肠胃津液，可致三天不大便；人的汗水来自肠胃。
  seq: [1157, 1163]
  q: 可是我三天没有大便好，为什么？
  ents: [herb.gui_zhi, herb.shao_yao, concept.jin_ye]
  conf: 0.85
- type: herb_property
  s: 大枣煮后黏如胃液、外红内黄（火生土），能补胃液；如十枣汤攻水时用大枣护胃，攻邪同时不伤正气。
  seq: [1164, 1169]
  q: 所以我在公的同时要把它补回来
  ents: [herb.da_zao, formula.shi_zao_tang]
  conf: 0.85
- type: herb_property
  s: 桂枝汤用生姜不用干姜：生姜辛辣发散，可刺激胃。
  seq: [1172, 1175]
  q: 那这是生姜，不是用干姜。
  ents: [herb.sheng_jiang, herb.gan_jiang]
  conf: 0.8
- type: herb_property
  s: 甘草解百毒，指解食物之毒：病中肠内宿食坏死产毒，甘草可防发炎；生甘草作用在肠胃，炙甘草强心，张仲景用法方向不同。
  seq: [1176, 1190]
  q: 当用生甘草的时候，那只是对肠胃用到枝甘草的时候，一定是对心脏
  ents: [herb.gan_cao]
  conf: 0.85
- type: treatment_principle
  s: 同病异治、异病同治：病人自称肠胃炎，但常无故出汗、怕风，即太阳中风，给桂枝汤后感冒与肠胃都好——中医辨证论治，把中风当症状而非病名。
  seq: [1208, 1214]
  q: 好，不同的病，同样的药，这里中医中医，所以中医是辩证论治。
  ents: [formula.gui_zhi_tang, syndrome.tai_yang_zhong_feng, concept.bian_zheng]
  conf: 0.9
- type: formula_composition
  s: 服桂枝汤后啜热稀粥约一小碗，借谷气（属土）充实胃中津液以助发汗；番薯与白米等量煮粥最能养脾胃。
  seq: [1232, 1244]
  q: 吃完桂枝汤以后，为什么要去喝一个稀饭？
  ents: [method.chuai_zhou, formula.gui_zhi_tang]
  conf: 0.85
- type: treatment_principle
  s: 最好的汗是微汗：身上摸着湿湿的又像没汗，邪排出而津液不伤；大汗淋漓太过反而病不除。
  seq: [1246, 1249]
  q: 最好的流汗呢是一点点为害
  ents: [new.concept.微汗, method.fa_han]
  conf: 0.9
- type: formula_composition
  s: 服法：一剂煮三碗，汗出病愈即停后服；未愈隔两三小时再服一碗并啜粥，半日（十二小时）内可服完三次。
  seq: [1250, 1260]
  q: 病好了，停后服就不要不要禁忌啊。
  ents: [formula.gui_zhi_tang]
  conf: 0.85
- type: clinical_tip
  s: 剂量随体格增减：百公斤壮汉桂枝可开五钱，瘦人一两钱，小孩减半或给大人汤药一小口；应用之妙存乎一心。
  seq: [1262, 1271]
  q: 所以说当这个应用之妙，存乎一心的不要那么死板板的
  ents: [herb.gui_zhi]
  conf: 0.85
- type: contraindication
  s: 发汗后不可当风、不可近火；汗后开窗吹冷风，太阳中风会转成太阳伤寒；须等次日中午胃口恢复、不再出汗不恶风才算痊愈。
  seq: [1279, 1288]
  q: 但是汗出以后，流汗以后不可以当风，哦也不可以靠火。
  ents: [syndrome.tai_yang_zhong_feng, syndrome.shang_han]
  conf: 0.9
- type: clause_interpretation
  s: 第13条太阳病头痛、发热、汗出、恶风，桂枝汤主之；汗出、恶风是主症，头痛有无都可用。
  seq: [1295, 1298]
  q: 像一定有汗出，这是主教的症状，是汗出和恶风。
  ents: [clause.shl.013, formula.gui_zhi_tang, symptom.han_chu, symptom.e_feng, symptom.tou_tong, symptom.fa_re]
  conf: 0.9
- type: clause_interpretation
  s: 第14条太阳病项背强几几、反汗出恶风，用桂枝加葛根汤，即桂枝汤加一味葛根（不是葛根汤）。
  seq: [1300, 1301]
  q: 里面加了一味药，多加一味药葛根。
  ents: [clause.shl.014, formula.gui_zhi_jia_ge_gen_tang, herb.ge_gen, new.symptom.项背强几几, formula.ge_gen_tang]
  conf: 0.9
- type: herb_property
  s: 葛根如藤蔓攀附大树，能把地下水吸到树顶，故能升津液、把新水提上去；《本草》言其能化脓、去痈肿。
  seq: [1303, 1314]
  q: 葛根葛根汤能够把这水新的水提上去，把旧的嘴排出来。
  ents: [herb.ge_gen, classic.shen_nong_ben_cao_jing]
  conf: 0.85
- type: formula_composition
  s: 桂枝加葛根汤中葛根剂量必须高于桂枝、白芍（如桂芍各三钱，葛根四至六钱），否则药力到不了皮肤。
  seq: [1316, 1321]
  q: 因直葛根的剂量一定要高于桂枝白透的计量。
  ents: [formula.gui_zhi_jia_ge_gen_tang, herb.ge_gen, herb.gui_zhi, herb.shao_yao]
  conf: 0.9
- type: formula_indication
  s: 桂枝加葛根汤治面部中风（吹冷气、车窗风致口眼歪斜）一两剂即效；也治头面肌肉麻木与化脓痈肿，但葛根药性上行，脚麻用不到。
  seq: [1327, 1336]
  q: 葛根的药性是往上升，所如果你脚麻，你你葛根就吃不到
  ents: [formula.gui_zhi_jia_ge_gen_tang, herb.ge_gen, new.disease.面部中风]
  conf: 0.85
- type: formula_composition
  s: 桂枝加葛根汤七碗水煮三碗，不需啜粥，因只要后脑膀胱经局部出汗；要大火快煮取药之气以达头面。
  seq: [1351, 1368]
  q: 那这个处方它不需要醉粥。
  ents: [formula.gui_zhi_jia_ge_gen_tang, method.chuai_zhou, meridian.bl]
  conf: 0.85
- type: clinical_tip
  s: 实际处方凭师承经验：倪师桂枝常开到五钱，因一剂分三次服，每次实际不到二钱；三小时未改善再服第二碗。
  seq: [1343, 1346]
  q: 我常常是开到桂枝，开到五千，为什么看它体格大小好？
  ents: [herb.gui_zhi]
  conf: 0.8
- type: treatment_principle
  s: 治炎症要清热兼祛湿：脓必有湿热，抗生素只能杀菌而不改湿热环境，故会复发；中医用黄芩、黄连清热，白术、知母等祛湿，改变环境（游泳池放水之喻）。
  seq: [1386, 1405]
