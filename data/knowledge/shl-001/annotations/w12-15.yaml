chapters:
- key: c16
  title: 第21–22条 桂枝去芍药汤与去芍药加附子汤
  start_seq: 1615
  summary: 太阳病误下后脉促胸满，去白芍；凡胸满（心脏病、气喘）张仲景一律不用白芍，腹痛则重用；若再微恶寒，表示里虚，加炮附子温阳。
  clauses: [21, 22]
  topics: [formula.gui_zhi_qu_shao_yao_tang, formula.gui_zhi_qu_shao_yao_jia_fu_zi_tang, herb.shao_yao, symptom.xiong_man]
- key: c17
  title: 第23条 桂枝麻黄各半汤：寒热如疟与身痒
  start_seq: 1673
  summary: 太阳病八九日寒热交替而无恶心仍属太阳，寒热时间相当用桂枝麻黄各半汤；汗到皮下出不来则身痒，小发其汗即愈；麻黄去节先煮去沫；出汗正常与否可判断心脏功能。
  clauses: [23]
  topics: [formula.gui_zhi_ma_huang_ge_ban_tang, herb.ma_huang]
- key: c17.s1
  parent: c17
  title: 寒热交替：太阳与少阳的区分
  start_seq: 1673
  summary: 脉微缓为欲愈不必治；阴阳俱虚不可再汗吐下；寒热交替加恶心就已入少阳，无恶心仍在太阳。
- key: c17.s2
  parent: c17
  title: 以其不得小汗出，身必痒
  start_seq: 1704
  summary: 以吸管喻发表与利尿的关系：毛孔一开小便即出；温性的麻黄桂枝小发其汗，汗出则痒止、小便通。
- key: c17.s3
  parent: c17
  title: 麻黄去节先煮与九碗煮三碗
  start_seq: 1735
  summary: 麻黄节止汗、茎发汗，故去节；先煮去上沫；倪师习惯九碗煮三碗，内科病早晚各一碗，表证三小时一碗至汗出。
- key: c17.s4
  parent: c17
  title: 汗为心之液：以汗判断心脏功能
  start_seq: 1781
  summary: 治肾病先治心、再治肺；运动后能正常出汗表示心脏功能恢复，汗越多水肿消得越快。
- key: c18
  title: 第24条 服桂枝汤反烦：先刺风池风府
  start_seq: 1813
  summary: 服桂枝汤后大部分症状好了但仍烦，余邪留在受风处，先针风池、风府再与桂枝汤即愈；平时脖子要遮好避风。
  clauses: [24]
  topics: [acupoint.gb20, acupoint.gv16, formula.gui_zhi_tang]
- key: c19
  title: 第25条 桂枝二麻黄一汤：热多寒少
  start_seq: 1835
  summary: 服桂枝汤后形似疟、一日再发，热多寒少用桂枝二麻黄一汤；桂芍麻约三二一比例，可依寒热比例调整剂量。
  clauses: [25]
  topics: [formula.gui_zhi_er_ma_huang_yi_tang]
- key: c20
  title: 第26条 转入阳明：白虎加人参汤
  start_seq: 1871
  summary: 太阳不愈可入阳明，阳明但热不寒，分经热（白虎）与腑热（承气）；大汗后大烦渴不解、脉洪大用白虎加人参汤，石膏要大剂、棉布包，粳米助水气化止渴，人参用于津液大伤。
  clauses: [26]
  topics: [formula.bai_hu_jia_ren_shen_tang, formula.bai_hu_tang, herb.shi_gao, six_channel.yangming]
- key: c20.s1
  parent: c20
  title: 阳明经热与腑热
  start_seq: 1874
  summary: 阳明证一派热症无寒：经热大渴喝水不止，用白虎；腑热为肠中燥屎便秘，用承气。
- key: c20.s2
  parent: c20
  title: 白虎加人参汤证：非桂枝汤所致
  start_seq: 1909
  summary: 服桂枝汤后出现白虎证，是病程刚好转入阳明，不是桂枝汤开坏；白虎证壮热恶热、踢被子，与发烧盖被怕冷者不同。
- key: c20.s3
  parent: c20
  title: 石膏、知母、粳米、人参的用法
  start_seq: 1937
  summary: 石膏黏稠要棉布包煮，倪师起手一两；粳米使水能气化入循环而止渴；只在大汗后大烦渴、津液大伤时加人参。
- key: c21
  title: 第27条 桂枝二越婢一汤：无阳不可发汗
  start_seq: 2000
  summary: 热多寒少而烦躁、脉微弱是无阳，不可发汗；桂枝汤配麻黄石膏（越婢汤）反能使阳回收；麻黄需配伍才发汗，石膏色白入肺，敛阳除烦，越婢汤治风水水肿。
  clauses: [27]
  topics: [formula.gui_zhi_er_yue_bi_yi_tang, formula.yue_bi_tang, herb.shi_gao, herb.ma_huang]
- key: c22
  title: 第28条 桂枝去桂加茯苓白术汤
  start_seq: 2098
  summary: 服桂枝汤或攻下后仍头项强痛、心下满微痛、小便不利，用桂枝汤去桂加茯苓白术。
  clauses: [28]
  topics: [formula.gui_zhi_qu_gui_jia_fu_ling_bai_zhu_tang, herb.fu_ling, herb.bai_zhu]
