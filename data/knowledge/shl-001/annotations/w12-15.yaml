kps:
- type: clinical_tip
  s: 汗止后不要再服桂枝加附子汤：表固得太过也不行，人运动、进食时应能出汗，静止时无汗才是正常。
  seq: [1593, 1598]
  q: 好，之所以有汗，我们也是必要有汗。
  ents: [formula.gui_zhi_jia_fu_zi_tang]
  conf: 0.85
  ch: c15
- type: clinical_tip
  s: 生长在严寒地区的人毛孔致密，服麻黄汤等发表药可能不出汗而是小便增多，只要病人自觉好转即可，不必强求发汗。
  seq: [1605, 1608]
  q: 好，所以有时候不见得是流汗哦，所以每人体质稍微也不太一样。
  ents: [formula.ma_huang_tang]
  conf: 0.8
  ch: c15
- type: clause_interpretation
  s: 第21条太阳病下之后脉促胸满，用桂枝去芍药汤；第22条若再微恶寒，用桂枝去芍药加附子汤——同一桂枝汤随证应变。
  seq: [1616, 1619]
  q: 好，就是同样桂枝汤在应变。
  ents: [clause.shl.021, clause.shl.022, formula.gui_zhi_qu_shao_yao_tang, formula.gui_zhi_qu_shao_yao_jia_fu_zi_tang]
  conf: 0.9
- type: contraindication
  s: 从伤寒到金匮，凡见胸满（气不过、胸口胀满、心口刺痛）张仲景都去白芍；故心脏病、气喘不用白芍，反之腹痛要重用白芍。
  seq: [1621, 1638]
  q: 胸满的时候一律不用白烧。
  ents: [herb.shao_yao, symptom.xiong_man]
  conf: 0.9
- type: pathomechanism
  s: 白芍酸苦属阴，作用如静脉回流；胸满时去白芍可使回心血流减缓，让心脏得到喘息。
  seq: [1630, 1633]
  q: 血流回心脏的速度就会减缓下来，就会让心脏得到喘息。
  ents: [herb.shao_yao, zangfu.xin]
  conf: 0.7
- type: herb_property
  s: 处方写芍药时临床用白芍即可，白芍、赤芍差别不必过分计较。
  seq: [1627, 1629]
  q: 实际上我们用白芍。
  ents: [herb.shao_yao]
  conf: 0.7
- type: pathomechanism
  s: 攻下后出现微恶寒是里虚、阳气被伤，加炮附子把里阳温回来；一服恶寒止即停。
  seq: [1641, 1646]
  q: 好，把这个里面的阳好，温回来啊，温回来。
  ents: [herb.fu_zi, symptom.e_han]
  conf: 0.85
- type: herb_property
  s: 温病表虚可用黄芪固表，但经方急需收表时用炮附子，黄芪作用较慢。
  seq: [1666, 1667]
  q: 金汤不是黄芪太慢了，泡芙子一下去就好了
  ents: [herb.huang_qi, herb.fu_zi]
  conf: 0.7
- type: prognosis
  s: 第23条太阳病八九日如疟状寒热，脉微缓者为阳气胃气回复、欲自愈，不要去治；脉微而恶寒为阴阳俱虚，不可再汗吐下。
  seq: [1679, 1683]
  q: 这个时候病人要自己痊愈了，你不要去治疗它。
  ents: [clause.shl.023]
  conf: 0.8
- type: diagnostic_rule
  s: 寒热交替（往来寒热）若伴恶心，病已入少阳；没有恶心则一律按太阳证处理。
  seq: [1698, 1702]
  q: 所以如果说病人有忽冷忽热，但是没有恶心，你一律在太阳症里面处理它。
  ents: [symptom.wang_lai_han_re, symptom.e_xin, six_channel.shaoyang, six_channel.taiyang]
  conf: 0.95
- type: formula_indication
  s: 太阳病寒热交替一天两三次、冷与热时间差不多相等，用桂枝麻黄各半汤，即桂枝汤与麻黄汤各取一半合方。
  seq: [1695, 1703]
  q: 寒也是一个小时，这就是桂枝麻黄各半汤。
  ents: [formula.gui_zhi_ma_huang_ge_ban_tang, formula.gui_zhi_tang, formula.ma_huang_tang]
  conf: 0.9
- type: pathomechanism
  s: 发表与利尿相通（吸管按住水不下、放开则出）：毛孔一开小便就排出，故水肿可用温热药发汗来利水。
  seq: [1708, 1712]
  q: 你发表一发表的时候，毛孔一开开小便就排出来了。
  ents: [symptom.shui_zhong, method.fa_han]
  conf: 0.8
- type: diagnostic_rule
  s: 以其不得小汗出身必痒：汗已到皮下却出不来，全身发痒而皮肤无病变；用桂枝麻黄各半汤小发其汗即可。
  seq: [1728, 1733]
  q: 停在皮肤下面的时候，这个时候皮肤就全身就会痒。
  ents: [symptom.shen_yang, formula.gui_zhi_ma_huang_ge_ban_tang]
  conf: 0.9
- type: herb_property
  s: 麻黄节能止汗、茎能发汗，故用麻黄要去节；张仲景用麻黄必先煮，去上沫后再下其他药。
  seq: [1744, 1755]
  q: 麻黄的节能功能是止汗。
  ents: [herb.ma_huang]
  conf: 0.9
- type: formula_composition
  s: 桂枝麻黄各半汤即桂枝汤加麻黄、杏仁，麻黄与桂枝等量；麻黄、杏仁、桂枝、甘草四味为麻黄汤。
  seq: [1748, 1753]
  q: 所谓各半，就是麻烦，按桂枝的剂量相等。
  ents: [formula.gui_zhi_ma_huang_ge_ban_tang, formula.ma_huang_tang, herb.ma_huang, herb.xing_ren]
  conf: 0.85
- type: clinical_tip
  s: 倪师常用九碗水煮成三碗：省时且药力强；内科病早晚各一碗、第三碗隔天喝；表证三小时一碗，至出汗即停。
  seq: [1759, 1768]
  q: 我最常用的是好九晚主持三碗
  conf: 0.85
- type: clinical_tip
  s: 服三碗仍无汗代表剂量太轻，应加重；倪师桂枝白芍常开五钱，因出汗太多还可加炮附子补救。
  seq: [1769, 1774]
  q: 喝完三碗一点汗都没有，代表剂量太重，太轻了
  ents: [herb.gui_zhi, herb.shao_yao, herb.fu_zi]
  conf: 0.8
- type: treatment_principle
  s: 依五行相生，治肾（水）病要先治心（火）、再治肺（金），肾功能才逐渐恢复；如同肝病先实脾。
  seq: [1786, 1794]
  q: 我们知道肾脏，我们先去治心脏，好，再去治肺脏
  ents: [zangfu.shen, zangfu.xin, zangfu.fei, concept.wu_xing]
  conf: 0.75
- type: diagnostic_rule
  s: 汗为心之液：可从病人运动后能否正常出汗判断心脏功能；肾病患者运动不出汗表示心脏未恢复，一旦能出汗水肿就消得快。
  seq: [1795, 1804]
  q: 所以当心脏功能很好的时候，我们可以从病人排汗的正常与否来决定心脏功能好不好
  ents: [zangfu.xin, zangfu.shen, symptom.shui_zhong]
  conf: 0.85
- type: acupoint_usage
  s: 第24条服桂枝汤反烦不解，余邪停在当初受风处，先针风池、风府，再给桂枝汤即愈。
  seq: [1813, 1815]
  q: 这个时候我们用针灸吃它的风池丰腹，回头再给桂枝汤好，它就好了。
  ents: [clause.shl.024, acupoint.gb20, acupoint.gv16, formula.gui_zhi_tang]
  conf: 0.9
- type: clinical_tip
  s: 风池、风府是风邪入侵之处，风大时脖子要遮好。
  seq: [1832, 1834]
  q: 好哦，脖子要盖好
  ents: [acupoint.gb20, acupoint.gv16]
  conf: 0.85
- type: formula_indication
  s: 第25条寒热如疟、热多寒少（冷十分钟、热一两小时），用桂枝二麻黄一汤；热越多，麻黄减、桂枝增。
  seq: [1840, 1848]
  q: 一定病人是热多寒少。
  ents: [clause.shl.025, formula.gui_zhi_er_ma_huang_yi_tang]
  conf: 0.9
- type: formula_composition
