kps:
- type: pathomechanism
  s: 表病入里只有两种可能：入阳明或入少阳；入阳明就到此为止，入少阳才可能再传太阴、少阴、厥阴。
  seq: [539, 557]
  q: 所以如果没有进没有进入阳明跑了少阳的话，就会有阴症的出现。
  ents: [six_channel.yangming, six_channel.shaoyang, six_channel.taiyin, six_channel.shaoyin, six_channel.jueyin]
  conf: 0.85
- type: prognosis
  s: 阳明无死证：病到阳明不再深入，如长年便秘者也不会因此致死；死证出在厥阴。
  seq: [545, 555]
  q: 阳明又是无死症哦
  ents: [syndrome.yang_ming_bing, new.symptom.便秘]
  conf: 0.85
- type: clause_interpretation
  s: 第4条"伤寒一日"指约六七天（一个经的周期）；脉若静（浮缓、浮紧不变）为不传，脉数急为传入里。
  seq: [567, 575]
  q: 这里一日一日呢是六天到七天
  ents: [clause.shl.004, pulse.fu, pulse.shu]
  conf: 0.8
- type: pathomechanism
  s: 病传经的主因是伤心：一是情志（感冒时生气吵架病就传），二是心脏功能受损；心情开朗病就不传。
  seq: [576, 583]
  q: 绝大多数病传经的传经的原因就是心脏。
  ents: [zangfu.xin]
  conf: 0.8
- type: contraindication
  s: 倪师反对外感用抗生素：认为抗生素先伤心，次日舌现地图状凹洞（舌为心之苗），心伤反使病传（倪师个人观点）。
  seq: [584, 593]
  q: 因为抗生素一下去以后，第一个伤热就是心脏。
  ents: [new.concept.抗生素伤心, new.tongue.地图舌, zangfu.xin]
  conf: 0.7
- type: concept_definition
  s: 心为君主之官，不受病（少听说心脏癌）；经方治好心，连情志也会变好。
  seq: [597, 601]
  q: 心脏不会受病啊，信君主之官
  ents: [zangfu.xin, concept.jing_fang]
  conf: 0.7
- type: clause_interpretation
  s: 第5条伤寒二三日不见阳明、少阳证为不传；欲吐表示入少阳（往来寒热、呕），烦躁表示入阳明（但热不寒）。
  seq: [608, 616]
  q: 好，如果补欲吐，若烦躁者为传言有欲吐，就是讲的是进入少阳。
  ents: [clause.shl.005, symptom.wang_lai_han_re, symptom.fan_zao, six_channel.shaoyang, six_channel.yangming, symptom.ou_tu]
  conf: 0.85
- type: concept_definition
  s: 烦躁含义很广：情绪烦乱摔东西、睡不安稳、手脚躁动、小孩好动跑来跑去、梦游，凡动作与情志静不下来都叫烦躁。
  seq: [617, 621]
  q: 所以烦躁的地域很广。
  ents: [symptom.fan_zao]
  conf: 0.85
- type: treatment_principle
  s: 伤寒条文分得细，是要医生一发现病将传就用经方截断；太阳表证处方对证常一剂即愈，有时三碗只喝第一碗就好，余药不必再喝。
  seq: [628, 633]
  q: 真的一剂，你处处方对的时候一剂就好了。
  ents: [concept.jing_fang]
  conf: 0.85
- type: clause_interpretation
  s: 第6条太阳病发热而渴、不恶寒者为温病；太阳病有中风、伤寒、温病三种，各有处方，张仲景并非没有温病方。
  seq: [636, 641]
  q: 好好，这太太病呢发热而咳着不恶寒，好为温病
  ents: [clause.shl.006, syndrome.wen_bing, syndrome.zhong_feng, syndrome.shang_han]
  conf: 0.9
- type: pathomechanism
  s: 温病源于"冬伤于寒，春必病温"：冬季受寒伏于肌肉，春天阳气升发时外发；温病派认为温病与伤寒无关是不对的。
  seq: [639, 645]
  q: 冬伤于寒春，病必温。
  ents: [syndrome.wen_bing, syndrome.shang_han]
  conf: 0.85
- type: concept_definition
  s: 按节气界定：霜降后受寒，到次年夏至前发出的热病为温病；夏至后的是暑热、湿热，不属温病。
  seq: [649, 663]
  q: 在夏至以后就看不到温病了。
  ents: [syndrome.wen_bing]
  conf: 0.8
- type: clinical_tip
  s: 暖冬节气不正易生疫病；倪师举台南十八岁学生感冒致死为例，认为是不会用大青龙汤。
  seq: [671, 675]
  q: 因为不会用大青龙嘛，然后就死掉了。
  ents: [formula.da_qing_long_tang, new.concept.疫病]
  conf: 0.7
- type: clause_interpretation
  s: 第6条风温：发汗后自汗不止、身灼热；常因医生发表药开得太重，或伤寒自愈过程中又劳动出汗再受风所致，医生要能收能放。
  seq: [683, 709]
  q: 若自汗出身灼热者，名为风温。
  ents: [clause.shl.006, syndrome.feng_wen, new.symptom.身灼热, method.fa_han]
  conf: 0.85
- type: pathomechanism
  s: 风温为病是津液不断流失：脉阴阳俱浮、汗出、身重、多眠睡、鼻鼾、语言难出，都是血中水分与肺津不足的表现；可用桂枝新加汤、人参补津液。
  seq: [710, 729]
  q: 都这些都是津液不足的现象。
  ents: [syndrome.feng_wen, concept.jin_ye, symptom.shen_zhong, new.symptom.多眠睡, herb.ren_shen, formula.gui_zhi_jia_shao_yao_sheng_jiang_ge_yi_liang_ren_shen_san_liang_xin_jia_tang]
  conf: 0.85
- type: contraindication
  s: 风温误作太阳中风再开桂枝汤发汗，津液更伤而小便不利，因汗与小便同源。
  seq: [730, 736]
  q: 因为汗它是同源。
  ents: [formula.gui_zhi_tang, symptom.xiao_bian_bu_li, syndrome.feng_wen]
  conf: 0.85
- type: contraindication
  s: 风温津亏时若误用攻下，肠中食物之水（津液源头）被泻掉，导致小便失禁滴漏、两眼直视，伤及厥阴肝血。
  seq: [738, 762]
  q: 水的源头也没了，病人呢很惨了
  ents: [symptom.shi_sou, method.xia_fa, six_channel.jueyin, zangfu.gan]
  conf: 0.8
- type: pathomechanism
  s: 津液来源：饮入之水在胃中气化，食物中的水在小肠泌别后进入血液循环。
  seq: [744, 747]
  q: 食物里面的水都是到小肠里面细化出来。
  ents: [concept.jin_ye, zangfu.xiao_chang, zangfu.wei]
  conf: 0.8
- type: concept_definition
  s: 中医处方不应看验血报告（如胆固醇高就开药）：验血不验水，血中水分多少会影响指数。
  seq: [748, 754]
  q: 所以我们处方的时候，我们不能看液举报告。
  conf: 0.75
- type: contraindication
  s: 风温误火（如北方睡热炕烘烤）使津液更失：皮肤发黄（失水贫血之黄，非肝胆之黄），甚则惊痫、抽搐；应让病人远离火源。
  seq: [764, 781]
  q: 有的时候它不是它是贫血的黄好是血不够的黄。
  ents: [symptom.fa_huang, new.symptom.惊痫瘈疭, syndrome.feng_wen]
  conf: 0.8
- type: clause_interpretation
  s: 第7条发热恶寒者发于阳（白天得病），无热恶寒者发于阴（夜里得病）；七日愈与六日愈只是起算点不同，实际都是足六天的自然病程。
  seq: [789, 816]
  q: 实际上都是十足的六天足六天。
  ents: [clause.shl.007, symptom.fa_re, symptom.e_han]
  conf: 0.85
- type: prognosis
  s: 经方对证：上午服药中午前就好；下午才服药，要到隔天中午才好，因中午阴阳交替、药力使阴阳平衡。
  seq: [817, 823]
  q: 如果你是在中午以前喝的，早上就吃的经方，中午以前就会好。
  ents: [concept.jing_fang]
  conf: 0.8
- type: acupoint_usage
  s: 第8条太阳病欲作再经者针足阳明：传经第一站是阳明，得病当天就扎足三里，使经不传，不必等六天。
  seq: [829, 844]
  q: 当天就把他扎了足。
  ents: [clause.shl.008, acupoint.st36, meridian.st, six_channel.yangming]
  conf: 0.85
- type: prognosis
