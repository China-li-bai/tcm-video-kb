chapters:
- key: c01
  title: 龙胆续与石斛
  start_seq: 0
  summary: 承接远志龙胆；石斛甘平治五脏虚劳阴伤。
  clauses: []
  topics: [herb.long_dan, herb.shi_hu]
- key: c02
  title: 防风石膏白蒿
  start_seq: 289
  summary: 防风祛风；石膏水生为佳寒凉；白蒿滋补。
  clauses: []
  topics: [herb.fang_feng, herb.shi_gao, herb.bai_hao]
- key: c03
  title: 狼毒乌头毒性
  start_seq: 590
  summary: 狼毒草剧毒；乌头即射罔，箭毒级，中毒伤心。
  clauses: []
  topics: [herb.lang_du, herb.wu_tou]
- key: c04
  title: 黄连清热
  start_seq: 740
  summary: 黄连苦寒清热解毒入血分，川产佳；外用口疮改五倍子/五味子粉；与石膏气氛血分异。
  clauses: []
  topics: [herb.huang_lian, herb.shi_gao, herb.wu_wei_zi]
- key: c05
  title: 黄芪补气实脾
  start_seq: 951
  summary: 黄芪气药大补脾肺，可代人参；托疮生肌排脓；与防风相制增强走表。
  clauses: []
  topics: [herb.huang_qi, herb.fang_feng]
- key: c06
  title: 蒲黄决明丹参
  start_seq: 1286
  summary: 蒲黄活血化瘀；决明子用途广；丹参一味功同四物。
  clauses: []
  topics: [herb.pu_huang, herb.jue_ming_zi, herb.dan_shen]
- key: c07
  title: 五味子兰草景天
  start_seq: 1647
  summary: 五味子酸收；兰草；景天治烫火伤蜂毒。
  clauses: []
  topics: [herb.wu_wei_zi, herb.lan_cao, herb.jing_tian]
- key: c08
  title: 王不留行胡麻葱白桂枝
  start_seq: 2059
  summary: 王不留行散主药；胡麻补精；葱白通阳；桂枝汤发汗解肌。
  clauses: []
  topics: [herb.wang_bu_liu_xing, herb.hu_ma, herb.cong_bai, herb.gui_zhi]
