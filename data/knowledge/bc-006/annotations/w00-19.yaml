kps:
- type: concept_definition
  s: 石斛味甘平，本经主五脏虚劳。
  seq: [182]
  q: 五脏虚劳
  ents: [herb.shi_hu]
  conf: 0.95
- type: clinical_tip
  s: 石膏以水生者为佳，寒凉清热。
  seq: [353]
  q: 水生的石膏
  ents: [herb.shi_gao]
  conf: 0.85
- type: clinical_tip
  s: 白蒿可滋补须发、补中益气。
  seq: [359]
  q: 补中益气
  ents: [herb.bai_hao]
  conf: 0.85
- type: contraindication
  s: 狼毒为剧毒草药，非野兽之毒；根黄内白，形近大黄须慎辨。
  seq: [590]
  q: 狼毒草药
  ents: [herb.lang_du]
  conf: 0.9
- type: contraindication
  s: 乌头即射罔，猎箭涂毒可致死，中毒伤心脏。
  seq: [603]
  q: 中了乌头毒怎么办
  ents: [herb.wu_tou]
  conf: 0.9
- type: clinical_tip
  s: 黄连极苦寒，清热解毒；川产色黄最佳。
  seq: [762]
  q: 苦寒
  ents: [herb.huang_lian]
  conf: 0.95
- type: clinical_tip
  s: 黄连入血分味厚，石膏入气分味淡，清热路径不同。
  seq: [785]
  q: 一个入血分，一个入气氛
  ents: [herb.huang_lian, herb.shi_gao]
  conf: 0.9
  asr: 气氛=气分
- type: clinical_tip
  s: 口疮外用不以黄连，而以五味子（五倍子）粉涂敷。
  seq: [810]
  q: 用五味子
  ents: [herb.wu_wei_zi, herb.huang_lian]
  conf: 0.85
- type: formula_indication
  s: 经方黄连阿胶汤等仍用生黄连。
  seq: [777]
  q: 黄连阿胶汤
  ents: [formula.huang_lian_e_jiao_tang, herb.huang_lian]
  conf: 0.9
- type: clinical_tip
  s: 黄芪气药，补虚劳；人参价贵可用黄芪代补气。
  seq: [963]
  q: 我用黄芪
  ents: [herb.huang_qi, herb.ren_shen]
  conf: 0.95
- type: clinical_tip
  s: 黄芪大补脾、通利三焦；疮口不敛、糖尿病足破溃可托脓生肌。
  seq: [994]
  q: 用黄芪把它提升上来
  ents: [herb.huang_qi]
  conf: 0.9
- type: clinical_tip
  s: 防风祛风，治风湿关节痛与风头痛；善散表亦能解毒。
  seq: [1211]
  q: 能够祛风
  ents: [herb.fang_feng]
  conf: 0.95
- type: clinical_tip
  s: 黄芪与防风相制：芪得防风力更强，合用治表肿肌肉关节痛。
  seq: [1229]
  q: 互相制衡的药
  ents: [herb.huang_qi, herb.fang_feng]
  conf: 0.9
- type: clinical_tip
  s: 活血化瘀方中常用蒲黄。
  seq: [1286]
  q: 蒲黄
  ents: [herb.pu_huang]
  conf: 0.9
- type: clinical_tip
  s: 决明子本经所载，用途甚广。
  seq: [1485]
  q: 决明子
  ents: [herb.jue_ming_zi]
  conf: 0.85
- type: clinical_tip
  s: 丹参一味可抵四物汤，补泻兼备。
  seq: [1519]
  q: 丹参一味可以抵四物汤
  ents: [herb.dan_shen]
  conf: 0.95
- type: clinical_tip
  s: 景天外用治烫火伤刀创，治蜂毒尤佳。
  seq: [1874]
  q: 蜜蜂效果最好
  ents: [herb.jing_tian]
  conf: 0.9
- type: formula_indication
  s: 经方有王不留行散，以王不留行为主药。
  seq: [2060]
  q: 王不留行散
  ents: [herb.wang_bu_liu_xing]
  conf: 0.9
- type: clinical_tip
  s: 胡麻仁/籽类子药能补精。
  seq: [1669]
  q: 胡麻仁
  ents: [herb.hu_ma]
  conf: 0.85
- type: clinical_tip
  s: 葱白汤散寒通阳，治外感湿寒。
  seq: [2154]
  q: 葱白
  ents: [herb.cong_bai]
  conf: 0.85

- type: clinical_tip
  s: 桂枝即肉桂之枝；伤寒金匮方中约六成含桂枝。
  seq: [2198]
  q: 百分之六十都是有桂枝
  ents: [herb.gui_zhi]
  conf: 0.95
- type: clinical_tip
  s: 四肢手足病首思桂枝，以其为枝走肢末。
  seq: [2201]
  q: 第一个就想到桂枝
  ents: [herb.gui_zhi]
  conf: 0.9
