  ents: [zangfu.fei]
  conf: 0.95
- type: pathomechanism
  s: 三焦原生于脾，网膜布脏腑之间以利水道；身中水宜热气化，冷水当化气或排出。
  seq: [13, 17]
  q: 原生于脾
  ents: [zangfu.san_jiao, zangfu.pi]
  conf: 0.9
- type: clinical_tip
