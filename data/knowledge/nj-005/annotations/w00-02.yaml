  ents: [six_channel.yangming]
  conf: 0.9
- type: herb_property
  s: 藏气法时五味：肝急甘缓、心缓酸收、脾湿苦燥、肺逆苦降、肾燥咸润；咸能软坚。
  seq: [177, 222]
