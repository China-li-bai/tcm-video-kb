chapters:
- key: c01
  title: 膈分清浊与三焦水道
  start_seq: 0
  summary: 横膈分清浊，清气升肺、浊气下行；三焦原生于脾、布周身以利水道。水宜化为气，冷水当化气或排；治水可用栀子豉汤一类方。
  clauses: []
  topics:
  - zangfu.san_jiao
  - zangfu.pi
  - formula.zhi_zi_shi_tang
- key: c02
  title: 六经辨证与俞穴泻阳
  start_seq: 34
  summary: 太阳独盛则阳气上壅、四肢反冷；三阳传变入少阳半表半里方可入里。经方六经辨证本于内经；阳过旺可取俞穴泻之。中医治症、同证同治，不拘西医病名。
  clauses: []
  topics:
  - concept.liu_jing
  - classic.huang_di_nei_jing
- key: c03
  title: 藏气法时·五味与肝病忌风
  start_seq: 155
  summary: 肝主春急则甘缓，心缓则酸收，脾湿则苦燥，肺气上逆宜苦降，肾燥则咸润；咸能软坚。病遇相生时节则愈、相克则凶；肝病忌当风。
  clauses: []
  topics:
  - concept.wu_wei
  - zangfu.gan
  - concept.wu_xing
