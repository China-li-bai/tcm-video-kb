kps:
- type: treatment_principle
  s: 视神经旁脑瘤治从鼻窍泄脑压积水，外用麝香白芷散喷鼻，麝香无孔不入、约一比五十。
  seq: [5]
  q: 麝香
  ents: [herb.she_xiang, herb.bai_zhi, new.disease.nao_liu]
  conf: 0.95
  asr: 白石散=白芷散
- type: clinical_tip
  s: 痞根为经外奇穴，肿瘤可取；压痛定侧、只针一侧，双侧力对消。消积穴自跟后大筋透刺须抵跟骨乃效。
  seq: [20]
  q: 脾根穴
  ents: [new.acupoint.pi_gen]
  conf: 0.85
  asr: 脾根/皮根=痞根
- type: diagnostic_rule
  s: 手脚肥大为逆危之象，示阴阳末梢决离；持续不见为实，时见时不见为虚。
  seq: [35]
  q: 手脚肥大
  ents: [concept.yin_yang]
  conf: 0.9
- type: diagnostic_rule
  s: 肿瘤皮肤乳块外凸属阳较安，内陷属阴危；不依西医定位，凭虚实阴阳。
  seq: [211]
  q: 往外长
  ents: [concept.yin_yang]
  conf: 0.95
- type: treatment_principle
  s: 治肿瘤癌首重排水勿积，次断营养；鼻近脑目，促嚏涕以泄脑水。
  seq: [251]
  q: 积水
  ents: [new.disease.nao_liu]
  conf: 0.9
- type: clinical_tip
  s: 苍术取本草苗部入肺鼻窍燥湿，白术取根入腹；鼻腹皆湿可同用。
  seq: [303]
  q: 苍族
  ents: [new.herb.cang_zhu, herb.bai_zhu]
  conf: 0.85
  asr: 苍族/白竹=苍术/白术
- type: clinical_tip
  s: 白睛赤为火克金；生大黄片开水泡茶取气清上焦，勿煮取味致泻。
  seq: [342]
  q: 大黄片
  ents: [herb.da_huang]
  conf: 0.9
- type: pathomechanism
  s: 夜尿频因小肠寒、膀胱水不化蒸汽，非括约肌病；乌药益智仁温化。
  seq: [366]
  q: 小肠的寒
  ents: [zangfu.xiao_chang]
  conf: 0.9
- type: treatment_principle
  s: 阴实须阳药直达深寒，硫磺如火山之烈；龙骨牡蛎敛阳使力集病所，防阳散手足烦躁。
  seq: [428]
  q: 硫磺
  ents: [herb.shi_liu_huang, herb.long_gu, herb.mu_li]
  conf: 0.9
