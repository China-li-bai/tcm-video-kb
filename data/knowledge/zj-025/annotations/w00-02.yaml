- key: c01
  title: 脾概说与隐白大都
  start_seq: 0
  summary: 黄入脾；思虑伤脾则味觉差。隐白为脾经井穴（阴经木火土金水），刺激强，可治气虚下陷等；灸三毛（大趾）治失眠效著。大都为荥穴属火，直刺。
  clauses: []
  topics:
  - zangfu.pi
  - acupoint.sp1
  - acupoint.sp2
- key: c02
  title: 太白与公孙
  start_seq: 230
  summary: 太白在大骨后骨缝下，为脾经输穴，直刺。公孙为络穴，用途广；配内关治诸胃病，效捷；通冲脉（列缺通任脉）。孕吐恶心可用公孙（或足三里）。
  clauses: []
  topics:
  - acupoint.sp3
  - acupoint.sp4
  - acupoint.pc6
