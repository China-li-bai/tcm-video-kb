- key: c01
  title: 鱼际少商与扁桃放血
  start_seq: 0
  summary: 久咳属虚可针太渊。鱼际为荥穴属火。少商为肺经井穴，常点刺放血，属十三鬼穴之一，治小儿扁桃体炎效著；放血后可配列缺利咽。时证按甲乙经可针太渊（腧穴）。
  clauses: []
  topics:
  - acupoint.lu9
  - acupoint.lu10
  - acupoint.lu11
- key: c02
  title: 大肠经开篇与商阳二间合谷
  start_seq: 99
  summary: 大肠者传导之官；辰时（5–7时）流注。肺与大肠表里。腹属阳，揉腹宜顺时针。商阳为大肠井穴，二间为荥（水），合谷为原穴虚实皆可治；病在大肠经时可取肺经络穴列缺。
  clauses: []
  topics:
  - meridian.li
  - zangfu.da_chang
  - acupoint.li4
  - concept.biao_li
