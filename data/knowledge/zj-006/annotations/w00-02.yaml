- key: c01
  title: 按时取穴：荥输经合与季节
  start_seq: 1
  summary: 按时发病取相应经之荥或输（甲乙经传统）；五脏不和取原穴。冬刺井、夏刺荥等季节原则；味觉嗅觉异常多取合穴。四肢取穴安全第一。
  clauses: []
  topics:
  - new.concept.五输穴
  - new.book.针灸甲乙经
  - method.zhen_jiu
- key: c02
  title: 任督为纲与会阴、列缺
  start_seq: 214
  summary: 找穴以任督为基准才不易错。会阴为任脉起点，可深刺；列缺主任脉，可用于急救开窍。十三鬼穴（人中、少商、隐白等）用于神志异常。
  clauses: []
