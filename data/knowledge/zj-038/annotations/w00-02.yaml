  - meridian.bl
  - meridian.gv
  - acupoint.bl23
  - acupoint.bl28
- key: c02
  title: 白环俞与八髎
  start_seq: 117
  summary: 白环俞在第二十一椎旁近尾骨。八髎为全身最小穴之一，在督脉与膀胱俞之间；上髎等可灸助孕，主阴部病及腰以下麻痛。
  clauses: []
  topics:
