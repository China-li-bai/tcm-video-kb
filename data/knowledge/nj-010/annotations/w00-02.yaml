- key: c02
  title: 阴阳互济与一脏为病
  start_seq: 123
  summary: 以物类比见阴阳偏盛；阴阳当互济。中医以肾水为先天第一脏。病变机虽传多脏，临证当专注本病一脏。
  clauses: []
  topics:
  - concept.yin_yang
  - zangfu.shen
- key: c03
  title: 肾阳外散与脾肺辨血
  start_seq: 269
  summary: 头重骨重而脉浮，示肾阳外散，病在肾非表。四肢懈惰、便血属脾不统血；咳血衄血属肺。一人之气病在一脏。
  clauses: []
  topics:
  - zangfu.shen
  - zangfu.pi
  - zangfu.fei
