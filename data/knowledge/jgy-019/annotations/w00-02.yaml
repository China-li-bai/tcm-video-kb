- type: diagnostic_rule
  s: 脉浮数当发热而反恶寒、局部痛处，示表有痈脓将成；手摸局部热者为有脓，不热为无脓。
  seq: [5]
  q: 恶寒
  ents: [disease.chuang_yong, symptom.fa_re, symptom.e_han]
  conf: 0.95
  asr: 拥涌/龙=痈脓
- type: clinical_tip
  s: 胆胀未破剧痛可牵右胁背肩及左腿阳陵泉下一寸压痛；一破则痛骤减，局部仍烫，勿误为已愈。
  seq: [24]
  q: 阳陵泉
  ents: [zangfu.dan, acupoint.gb34]
  conf: 0.85
- type: clinical_tip
  s: 阑尾炎破溃前后：破前剧痛，破后痛减而腹局部烫，示脓已出腹膜。
  seq: [31]
  q: 阑尾
  ents: [acupoint.ex_lan_wei, syndrome.chang_yong]
  conf: 0.9
- type: formula_indication
  s: 体表/深部化脓摸之烫，排脓汤可促脓外溃而消；经方家发痈用阳和汤（麻黄、炮姜、熟地、鹿角胶、肉桂）。
  seq: [41]
  q: 排脓汤
  ents: [formula.pai_nong_tang, new.formula.yang_he_tang, disease.chuang_yong]
  conf: 0.9
  asr: 羊和汤=阳和汤
- type: formula_indication
  s: 肠痈脉迟紧脓未成可下，大黄牡丹皮汤（大黄、牡丹皮、桃仁等）治急性阑尾炎类肠痈。
  seq: [146]
  q: 大黄牡丹
