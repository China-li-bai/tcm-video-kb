chapters:
- key: c01
  title: 疮痈诊脓·胆阑尾破溃·排脓与阳和
  start_seq: 0
  summary: 金匮第十八篇疮痈肠痈浸淫。脉浮数当发热而反恶寒、局部痛处，为表有痈脓；手摸热者为有脓。胆总管结石胀破前后剧痛可牵肩与阳陵泉下；破后痛减而局部烫。阑尾炎破溃同理。排脓汤治体表深部化脓；经方家另传阳和汤（麻黄泡姜熟地鹿角胶肉桂）发其痈。
  clauses: []
  topics:
  - disease.chuang_yong
  - formula.pai_nong_tang
  - syndrome.chang_yong
- key: c02
  title: 肠痈大黄牡丹皮·赤小豆当归
  start_seq: 146
  summary: 肠痈（急性阑尾炎）脉迟紧脓未成可下，大黄牡丹皮汤（大黄牡丹桃仁）。脓成或体表溃破后可用赤小豆当归散（赤小豆发芽、当归生用）排脓生肌。
  clauses: []
  topics:
  - formula.da_huang_mu_dan_tang
  - formula.chi_xiao_dou_dang_gui_san
  - syndrome.chang_yong
- key: c03
  title: 排脓散汤·桔梗·浸淫与兼方
  start_seq: 334
  summary: 排脓散：枳实芍药桔梗；可与柴胡/甘草类同用。排脓汤：甘草桔梗生姜大枣，肺痈痰多时桔梗类同葛根汤意。左侧腹痛气上冲可用茯苓桂枝甘草汤。
  clauses: []
  topics:
  - formula.pai_nong_san
  - formula.pai_nong_tang
  - herb.jie_geng
