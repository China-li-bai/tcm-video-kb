- type: clinical_tip
  s: 心绞痛刀刺样剧痛，合并糖尿/肾衰常不能手术；中医可排瘀复心，瓣膜闭锁不全与心律不齐可同法思路。
  seq: [2]
  q: 心绞痛
  ents: [disease.xin_tong]
  conf: 0.9
- type: herb_property
  s: 藏红花清轻无味偏入脑，宜脑溢血；川红花气臭入心，宜冠脉瘀阻。
