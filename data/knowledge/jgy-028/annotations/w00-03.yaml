  ents: [herb.xie_bai]
  conf: 0.85
  asr: 瓜肉丝/紫石=瓜蒌实/紫石英
- type: contraindication
  s: 石膏大寒易败胃缩纳，心痛剧证选药宜慎，非白虎热盛勿轻投。
  seq: [181]
  q: 石膏
  ents: [herb.shi_gao]
  conf: 0.85
- type: pathomechanism
  s: 桂枝加强心射血以冲开瘀；须配当归等护络，防压力骤增破脉。
  seq: [223]
