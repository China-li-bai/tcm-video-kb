  ents: [new.herb.hong_hua]
  conf: 0.9
  asr: 窗红花=川红花
- type: formula_indication
  s: 金匮红蓝花酒（红花）治心痛；合瓜蒌实、薤白、桂枝等通心气、化瘀宽胸。
  seq: [147]
  q: 心痛
  ents: [new.herb.hong_hua, disease.xin_tong, herb.xie_bai]
  conf: 0.95
  asr: 红兰花酒=红蓝花酒；蟹白/蟹瓜=薤白/瓜蒌
- type: herb_property
  s: 瓜蒌实色白偏心包，紫石英色深味厚入心，薤白辛白入肺——形色气味识药。
  seq: [155]
