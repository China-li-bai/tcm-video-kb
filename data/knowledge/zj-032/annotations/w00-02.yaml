- key: c02
  title: 肩胛痛辨经
  start_seq: 92
  summary: 肩胛骨后方痛属小肠经，前方大肠，中间三焦。肩井属胆经，下针勿过深（下即肺尖）。超过肩井后约三寸多属小肠经。
  clauses: []
  topics:
  - meridian.si
  - meridian.li
  - acupoint.gb21
