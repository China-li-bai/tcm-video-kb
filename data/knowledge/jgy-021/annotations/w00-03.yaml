  conf: 0.85
  asr: 择绝肢=谢绝医药/流产
- type: clinical_tip
  s: 不孕无固定专方；随现证用经方调理（便秘大柴胡、喘麻黄类、疮十二甘草等），常意外得孕；温经汤仅适用于合其证者。
