  asr: 此脉/吃小弱=阴脉小弱
- type: formula_indication
  s: 妊娠初两月有恶阻样不适，用桂枝汤调和阴阳、护正气，为安胎起步方。
  seq: [40]
  q: 桂枝汤
  ents: [formula.gui_zhi_tang]
  conf: 0.95
- type: contraindication
  s: 不知是孕而误攻下（如大黄甘草汤、盐汤探吐）可致择药绝医或流产，妊娠忌妄下。
