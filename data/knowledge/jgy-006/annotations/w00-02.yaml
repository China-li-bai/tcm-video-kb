chapters:
- key: c01
  title: 中风历节·气血两虚致中风
  start_seq: 0
  summary: 金匮第五篇中风历节。中风本于气血两虚，非西医高血压叙事；预防用黄芪益气，微祛风用防风独活，补血当归，气虚用人参/党参视胃气。
  clauses: []
  topics:
  - syndrome.zhong_feng
  - herb.huang_qi
- key: c02
  title: 面部中风·汗后受风与桂枝加葛根
  start_seq: 138
  summary: 汗出当风/对冷气可致面瘫；久病两侧同治。肌肉受风用桂枝汤解肌，加葛根升津。
  clauses: []
  topics:
  - syndrome.zhong_feng
  - formula.gui_zhi_tang
  - herb.ge_gen
- key: c03
  title: 虚寒中风与抵当类如狂
  start_seq: 264
  summary: 迟缓为寒虚，中风多气血两虚。汗出受冷可成麻黄类证；篇中夹杂抵当汤治如狂脉浮，按序讲读即可。
  clauses: []
  topics:
  - syndrome.zhong_feng
  - formula.di_dang_tang
