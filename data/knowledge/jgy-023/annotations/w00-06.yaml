- type: formula_composition
  s: 温经汤以吴茱萸为君补肝虚；归芎芍参桂阿胶丹皮生姜甘草等量加减；半夏化痰郁，麦冬润肺津，桂枝导心火入小肠。
  seq: [494]
  q: 温经汤
  ents: [formula.wen_jing_tang, herb.wu_zhu_yu, herb.e_jiao, herb.dang_gui]
  conf: 0.9
  asr: 无珠雨/五茱鱼/无助=吴茱萸
- type: clinical_tip
  s: 头痛必呕吐不论月经，多属吴茱萸/温经一类肝虚证；虚人阿胶可促经来，体实阿胶可致胸闷奔豚样反应。
  seq: [499]
  q: 温经
  ents: [formula.wen_jing_tang, herb.wu_zhu_yu, herb.e_jiao]
  conf: 0.85
- type: formula_indication
  s: 黄连阿胶汤以黄连黄芩为使，导阿胶入心补心血，有别于温经之调胞宫。
  seq: [536]
  q: 黄连阿胶汤
  ents: [formula.huang_lian_e_jiao_tang, herb.e_jiao]
  conf: 0.85
- type: formula_indication
  s: 月经隔月一至为瘀阻实证，用土瓜根散；虚证调经用温经汤，虚实不可混。
  seq: [554]
  q: 土瓜分散
