chapters:
- key: c01
  title: 经期感冒·小柴胡与半夏厚朴
  start_seq: 0
  summary: 金匮妇人杂病。经期伤寒发热恶寒、胸胁苦满用小柴胡汤（柴胡入三焦肝经过胞宫），不必等愈。咽中如有炙脔（梅核气）、自觉心下有物下坠用半夏厚朴汤。
  clauses: []
  topics:
  - formula.xiao_chai_hu_tang
  - new.formula.ban_xia_hou_po_tang
- key: c02
  title: 脏躁·甘麦大枣汤与癫痫
  start_seq: 98
  summary: 脏躁指胞宫津枯：悲伤欲哭、如有神灵、欠伸；甘麦大枣汤（小麦甘草大枣）甘缓肝急。扩用于小儿高热后癫痫、男女脏躁样情志。
  clauses: []
  topics:
  - new.formula.gan_mai_da_zao_tang
  - herb.xiao_mai
  - disease.dian_xian
- key: c03
  title: 吐涎沫误下·泻心与先表后里
  start_seq: 219
  summary: 上焦寒湿吐涎沫误下成心下痞；先解表（小青龙类）再治痞（五泻心：呕半夏泻心、利生姜泻心等）。
  clauses: []
  topics:
  - formula.xie_xin_tang
- key: c04
  title: 带下湿热寒湿·三黄与附子术
  start_seq: 346
  summary: 带下必有湿，分湿热（黄稠臭、体偏胖）与寒湿。湿热实用力用三黄泻心（黄连黄芩黄柏）；虚则扶正。寒湿漏下用炮附子固下焦配白术。
  clauses: []
  topics:
  - symptom.dai_xia
  - new.formula.san_huang_xie_xin_tang
  - herb.fu_zi
- key: c05
  title: 温经汤调经
  start_seq: 473
  summary: 年五十前后下血不止、暮发热、少腹里急腹满、手掌烦热、唇口干燥——瘀阻兼虚，温经汤（吴茱萸为君，归芎芍参桂阿胶丹皮姜草半夏麦冬等）温通调经；不必拘五十岁。头痛呕吐合吴茱萸；虚可加重阿胶促经来，实人阿胶慎用。黄连阿胶偏补心血。
  clauses: []
  topics:
  - formula.wen_jing_tang
  - herb.wu_zhu_yu
  - herb.e_jiao
- key: c06
  title: 经闭瘀实·土瓜根散椒姜与抵当
  start_seq: 553
  summary: 月经一月来一月不来为瘀阻用土瓜根散（实），温经汤主虚。陷经漏下黑不止（崩）倪氏作胶艾去艾加干姜（椒姜/姜艾变方）补血止血。抵当汤治纯血蓄胞宫：溲利、大便黑、喜忘易怒；血在膀胱则桃核承气。
  clauses: []
  topics:
  - new.formula.tu_gua_gen_san
  - formula.di_dang_tang
  - formula.tao_he_cheng_qi_tang
- key: c07
  title: 经痛转胞·当归芍药散与肾气丸
  start_seq: 748
  summary: 妇人腹中痛：水停当归芍药散；虚劳不食小建中。转胞（子宫/胎压膀胱）小便不通用肾气丸（桂附八味）；便秘偏六味，稀溏/小便不利偏桂附八味。
  clauses: []
  topics:
  - formula.dang_gui_shao_yao_san
  - formula.shen_qi_wan
- key: c08
  title: 阴疮阴吹·狼牙汤与猪膏发煎
  start_seq: 881
  summary: 阴中腐烂脓疮用狼牙汤煎汁棉裹纳阴中；蛇床子粉可外掺或入小柴胡。阴吹（阴道直肠瘘）用猪膏发煎，忌反复手术扩大瘘管。
  clauses: []
  topics:
  - formula.lang_ya_tang
  - herb.lang_ya
  - herb.she_chuang_zi
