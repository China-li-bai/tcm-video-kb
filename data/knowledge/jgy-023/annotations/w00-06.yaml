- type: formula_indication
  s: 抵当汤治纯血蓄结胞宫（无水）：经水不利实证。辨：小便自利、大便黑、喜忘易怒；若腹痛而小便不利则血在膀胱，用桃核承气汤。
  seq: [668]
  q: 抵当汤
  ents: [formula.di_dang_tang, formula.tao_he_cheng_qi_tang]
  conf: 0.95
