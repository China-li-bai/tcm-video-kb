kps:
- type: formula_indication
  s: 经期感冒发热恶寒、胸胁苦满，径予小柴胡汤，不必待自愈；柴胡入三焦，肝经过胞宫。
  seq: [10]
  q: 小柴胡汤
  ents: [formula.xiao_chai_hu_tang]
  conf: 0.95
- type: formula_indication
  s: 咽中如有炙脔（梅核气）、自觉有物梗喉或心下如物下坠，用半夏厚朴汤。
  seq: [57]
  q: 半夏候补汤
  ents: [new.formula.ban_xia_hou_po_tang, herb.ban_xia]
  conf: 0.95
  asr: 候补/后补/后葡=厚朴；炙腐=炙脔；没合剂=梅核气
- type: clinical_tip
  s: 病人自述「好像有人把我心脏炸入落下去」为半夏厚朴汤特证。
  seq: [63]
  q: 半夏后葡汤
  ents: [new.formula.ban_xia_hou_po_tang]
  conf: 0.85
  asr: 后葡=厚朴
- type: concept_definition
  s: 脏躁之「脏」指胞宫津枯：悲伤欲哭、如有神灵、数欠伸；津液不能循冲任而上，反从目出。
  seq: [105]
  q: 甘麦大枣汤
  ents: [new.formula.gan_mai_da_zao_tang]
  conf: 0.9
  asr: 葬灶=脏躁
- type: formula_indication
  s: 甘麦大枣汤甘缓肝急：妇人脏躁、小儿高热后癫痫及男女情志急躁皆可用。
  seq: [137]
  q: 甘麦大大枣汤
  ents: [new.formula.gan_mai_da_zao_tang, disease.dian_xian, herb.xiao_mai]
  conf: 0.95
  asr: 大澡堂/丹麦大宝=甘麦大枣
- type: treatment_principle
  s: 上焦寒湿吐涎沫而误下成痞：先解表去寒湿（青龙类），表解后再用泻心类治心下痞。
  seq: [226]
  q: 泻心汤
  ents: [formula.xie_xin_tang]
  conf: 0.9
  asr: 吐研沫/盐沫=涎沫；小心龙=小青龙
- type: diagnostic_rule
  s: 带下必兼湿，分湿热（色黄味重体偏胖）与寒湿；无湿则无带。
  seq: [354]
  q: 带下
  ents: [symptom.dai_xia]
  conf: 0.95
- type: formula_indication
  s: 带下湿热而体力尚实，用三黄泻心（黄连黄芩黄柏）清利；黄芩清肝经湿热，黄连清心移热小肠，黄柏入下焦膀胱。
  seq: [372]
  q: 三黄泻心汤
  ents: [new.formula.san_huang_xie_xin_tang, symptom.dai_xia]
  conf: 0.9
  asr: 黄渤=黄柏；行情/黄情=黄芩
- type: formula_indication
  s: 寒湿带下兼漏、阳不足，用炮附子固摄下焦配白术。
  seq: [407]
  q: 白术
  ents: [herb.fu_zi, herb.bai_zhu, symptom.dai_xia]
  conf: 0.85
  asr: 泡芙子/泡腹子=炮附子
- type: formula_indication
  s: 温经汤证：下血或经乱不止、暮即发热、少腹里急腹满、手掌烦热、唇口干燥；瘀阻兼虚，温通调经，不限五十岁。
  seq: [473]
  q: 温经汤
  ents: [formula.wen_jing_tang]
  conf: 0.95
