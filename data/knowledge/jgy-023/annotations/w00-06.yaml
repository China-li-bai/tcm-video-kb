  ents: [formula.lang_ya_tang, herb.lang_ya]
  conf: 0.95
  asr: 蓝牙/琅琊=狼牙
- type: clinical_tip
  s: 少阳往来寒热而经期易见「如见鬼」，小柴胡中可加蛇床子，外掺蛇床粉。
  seq: [925]
