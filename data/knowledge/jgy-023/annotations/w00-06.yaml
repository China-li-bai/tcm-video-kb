  conf: 0.85
  asr: 土瓜分散=土瓜根散
- type: formula_indication
  s: 陷经漏下黑不解（崩漏危证），倪氏取胶艾去艾叶加干姜（椒姜变方）：艾叶行血脉或增出血，故易干姜温中止血。
  seq: [592]
