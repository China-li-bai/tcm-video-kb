- type: formula_indication
  s: 妇人腹中痛有水用当归芍药散；虚劳不食腹中痛用小建中。
  seq: [749]
  q: 当归芍药散
  ents: [formula.dang_gui_shao_yao_san]
  conf: 0.9
- type: formula_indication
  s: 转胞（胎或子宫移位压膀胱）小便不通，用肾气丸（桂附八味）；非必妊娠。
  seq: [762]
  q: 肾气丸
  ents: [formula.shen_qi_wan]
  conf: 0.95
  asr: 转包=转胞；申请完/肾玄=肾气丸
- type: clinical_tip
  s: 便秘倾向用六味地黄丸；大便偏稀或小便不利、虚烦转胞用桂附八味（肾气丸）。手脚冷而心烦亦属肾气证。
  seq: [805]
  q: 六味地黄丸
  ents: [formula.shen_qi_wan]
  conf: 0.9
  asr: 贵妇八味/桂附八二=桂附八味
- type: formula_indication
  s: 阴中溃烂脓疮用狼牙汤：狼牙草煎汁，棉缠如茧纳阴中外治。
  seq: [929]
