  ents: [formula.xiao_chai_hu_tang, herb.she_chuang_zi]
  conf: 0.85
  asr: 赊窗子/蔗疮=蛇床子
- type: formula_indication
  s: 阴吹为阴道与肛门间瘘管，多用猪膏发煎；反复开刀反使瘘口扩大。
  seq: [941]
