chapters:
- key: c01
  title: 产后三病与小柴胡
  start_seq: 1
  summary: 产后气血两虚易中风、郁冒、大便难；三者并见或难辨时小柴胡汤和解为第一方；大便难用麻子仁丸润导，忌妄用承气。
  clauses: []
  topics: [formula.xiao_chai_hu_tang, formula.ma_zi_ren_wan, concept.xue_xu]
- key: c02
  title: 当归生姜羊肉汤与腹痛
  start_seq: 72
  summary: 产后腹痛寒疝虚劳用当归生姜羊肉汤；烦满不得卧为胞中浊秽未尽，枳实芍药散；不效则下瘀血汤。
  clauses: []
  topics: [formula.dang_gui_sheng_jiang_yang_rou_tang, herb.zhi_shi, formula.xia_yu_xue_tang]
- key: c03
  title: 产后风阳旦与竹叶汤
  start_seq: 148
  summary: 产后风久不解用阳旦汤（桂枝汤加肉桂）；面正赤喘头痛辨虚热用竹叶汤（含附子）而非白虎。
  clauses: []
  topics: [formula.gui_zhi_tang, formula.zhu_ye_tang]
- key: c04
  title: 竹皮大丸与退乳
  start_seq: 226
  summary: 哺乳乳中虚烦呕逆用竹皮大丸；退奶炒麦芽等可使月经来而乳消，兼治乳癖硬块。
  clauses: []
  topics: [formula.zhu_pi_da_wan, new.herb.mai_ya]
- key: c05
  title: 产后下利白头翁加味
  start_seq: 293
  summary: 产后热利下重虚甚，白头翁汤加甘草阿胶；阿胶勿久煮。
  clauses: []
  topics: [formula.bai_tou_weng_jia_gan_cao_e_jiao_tang]
