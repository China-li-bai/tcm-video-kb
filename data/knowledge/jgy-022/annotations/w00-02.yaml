kps:
- type: clinical_tip
  s: 产后三病：中风（痉）、郁冒、大便难，因气血两虚；坐月子避风。
  seq: [2]
  q: 有三个病
  ents: []
  conf: 0.9
- type: clinical_tip
  s: 产后大便难宜麻子仁丸润导，不可妄投大承气小承气。
  seq: [17]
  q: 麻子仁丸
  ents: [formula.ma_zi_ren_wan]
  conf: 0.95
- type: formula_indication
  s: 产后病多端难辨时，小柴胡汤和解为第一方，常可安情绪。
  seq: [25]
  q: 小柴胡汤好好
  ents: [formula.xiao_chai_hu_tang]
  conf: 0.95
- type: clinical_tip
  s: 产后郁冒脉微弱不能食、头汗出，为血虚阳浮；小柴胡汤主之。
  seq: [35]
  q: 脉微弱
  ents: [formula.xiao_chai_hu_tang]
  conf: 0.9
- type: pathomechanism
  s: 阳虚则毛孔不固阴出为汗；孤阳上出则头汗。
  seq: [43]
  q: 汗流不止
  ents: []
  conf: 0.85
- type: formula_indication
  s: 小柴胡汤是产后孕妇第一方。
  seq: [61]
  q: 产后孕妇第一方
  ents: [formula.xiao_chai_hu_tang]
  conf: 0.95
- type: clinical_tip
  s: 产后血虚已复、能食而发热见阳明燥实，可用大承气汤。
  seq: [69]
  q: 大承气汤
  ents: [formula.da_cheng_qi_tang]
  conf: 0.9
- type: formula_indication
  s: 产后腹痛用当归生姜羊肉汤，兼治寒疝虚劳；羊肉为肉中之王温中补血。
  seq: [73]
  q: 当归生姜羊肉汤
  ents: [formula.dang_gui_sheng_jiang_yang_rou_tang, herb.yang_rou]
  conf: 0.95
- type: clinical_tip
  s: 产后烦满不得卧，胞中浊物未尽，用枳实芍药散（等分）化脓亦可。
  seq: [84]
  q: 芍药
  ents: [herb.zhi_shi, herb.shao_yao]
  conf: 0.9
  asr: 只是=枳实
- type: formula_indication
  s: 枳实芍药散不效，示瘀血重，改下瘀血汤（大黄桃仁䗪虫等）。
  seq: [101]
  q: 下淤血汤
  ents: [formula.xia_yu_xue_tang]
  conf: 0.95
- type: clinical_tip
  s: 攻瘀可佐大黄桃仁；下焦阳虚寒凝瘀可先/兼附子温阳再化瘀。
  seq: [118]
  q: 温下焦的阳
  ents: [herb.fu_zi]
  conf: 0.85
- type: clinical_tip
  s: 产后七八日少腹坚痛恶露不尽、不大便烦躁发热实脉，黄昏倍烦为大承气证。
  seq: [139]
  q: 大承气汤增
  ents: [formula.da_cheng_qi_tang]
  conf: 0.9
  asr: 增=证
- type: formula_indication
  s: 产后风数十日不解，头微痛恶寒发热干呕汗出，用阳旦汤即桂枝汤加肉桂。
  seq: [176]
  q: 桂枝汤
  ents: [formula.gui_zhi_tang, new.herb.rou_gui]
  conf: 0.95
- type: clinical_tip
  s: 阳旦汤中肉桂生用少许（约半勺），不可同煮，以助心阳。
  seq: [182]
  q: 不要下去煮
  ents: [new.herb.rou_gui]
  conf: 0.9
- type: diagnostic_rule
  s: 产后面正赤喘头痛：实热白虎面赤光亮；虚热粉红无光，用竹叶汤（含附子）。
  seq: [198]
  q: 虚热的脸红是粉红的
  ents: [formula.zhu_ye_tang, formula.bai_hu_tang]
  conf: 0.95
- type: clinical_tip
  s: 口渴喜热饮为里寒虚热（竹叶汤）；喜冷饮为实热（白虎）。
  seq: [221]
  q: 喜欢喝温的水，就是竹叶汤
  ents: [formula.zhu_ye_tang]
  conf: 0.9
- type: formula_indication
  s: 哺乳乳汁不足致虚烦呕逆，用竹皮大丸安中益气。
  seq: [232]
  q: 猪皮大碗
  ents: [formula.zhu_pi_da_wan]
  conf: 0.9
  asr: 猪皮大碗=竹皮大丸
- type: clinical_tip
  s: 退奶用炒麦芽等使月经来则乳消，可预防乳岩；乳癖硬块同法可加竹茹瓦楞。
  seq: [267]
  q: 炒麦芽
  ents: [new.herb.mai_ya]
  conf: 0.9
- type: formula_indication
  s: 产后热利下重虚甚，白头翁汤加甘草阿胶；阿胶冲服勿久煮。
  seq: [295]
  q: 甘草跟阿胶
  ents: [formula.bai_tou_weng_jia_gan_cao_e_jiao_tang, herb.e_jiao]
  conf: 0.95
