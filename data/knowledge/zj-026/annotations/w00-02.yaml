  - meridian.tv
  - concept.luo_xue
  conf: 0.95
- type: acupoint_usage
  s: 商丘在内踝骨交接缝中，直刺；为脾经经穴。
  seq:
  - 19
  - 25
  q: 交接的缝里面，叫做商丘
  ents:
  - acupoint.sp5
  - meridian.sp
  conf: 0.9
- type: clinical_tip
  s: 痛多酸少宜先泻后补；酸多痛少宜先补后泻。痛较易除，麻需更多次治疗。
  seq:
  - 36
  - 39
  q: 痛比较多，酸比较少，就是先泻后补
  ents:
  - method.bu_xie
  conf: 0.9
- type: concept_definition
  s: 三阴交为足三阴（脾、肝、肾）交会处，与足三里同为大穴；勿太贴骨下针。
  seq:
  - 74
  - 88
  q: 三条阴经都交汇在这里
  ents:
