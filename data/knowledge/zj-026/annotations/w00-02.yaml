kps:
- type: acupoint_usage
  s: 公孙通冲脉、气脉强，腹胀等可用；为络穴，虚实补泻皆可。
  seq:
  - 6
  - 11
  q: 腹胀、肚子骨胀啊，什么通通可以用公孙
