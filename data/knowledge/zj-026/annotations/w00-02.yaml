- key: c01
  title: 公孙商丘与对称取穴
  start_seq: 0
  summary: 公孙通冲脉，气强，腹胀肠切痛等虚实可治。商丘为脾经经穴，在踝骨交接缝，直刺。久痛可先泻后补；公孙痛可对取对侧或鱼际等对称法。
  clauses: []
  topics:
  - acupoint.sp4
  - acupoint.sp5
  - meridian.tv
- key: c02
  title: 三阴交大穴与孕妇禁忌
  start_seq: 74
  summary: 三阴交与足三里皆为大穴；足三阴（脾肝肾）交会。可诊治痛经等妇科，按压痛测病情。孕妇：补合谷泻三阴交易伤胎，故合谷、三阴交一般禁针（勿补泻搞错）。
  clauses: []
  topics:
  - acupoint.sp6
  - acupoint.li4
  - acupoint.st36
