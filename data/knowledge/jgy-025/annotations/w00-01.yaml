kps:
- type: pathomechanism
  s: 心伤后精之残渣不能循任上达而生须，逆入淋巴则成淋巴系病变；胡子渐少为残渣逆流之望诊线索。
  seq: [51]
  q: 胡子越来越少
  ents: []
  conf: 0.85
- type: diagnostic_rule
  s: 脚冷而身热、脉洪大：里寒外热；激素可假增胃口，仍须据足冷定里寒。
  seq: [85]
  q: 脚是冷的
  ents: [herb.fu_zi]
  conf: 0.9
- type: treatment_principle
  s: 中医处方写寒湿热虚实等病机，不必以淋巴瘤/白血病西名作为辨证结论。
  seq: [92]
  q: 不需要
  ents: []
  conf: 0.8
- type: formula_indication
  s: 眠差属心血虚（非心阳亢），黄芩黄连白芍阿胶合黄连阿胶汤意以复心血则能深睡。
  seq: [119]
  q: 黄连阿胶汤
  ents: [formula.huang_lian_e_jiao_tang, herb.huang_lian, herb.e_jiao]
  conf: 0.95
  asr: 黄牙的阿胶=黄连阿胶
- type: clinical_tip
  s: 里寒用生附子；生硫黄入三焦，配牡蛎可速消淋巴痰结肿瘤；半夏配硫黄亦治淋巴痰饮。
  seq: [124]
  q: 生附子
  ents: [herb.fu_zi, new.herb.liu_huang, herb.mu_li, herb.ban_xia]
  conf: 0.9
  asr: 硫磺=硫黄；半牛丸=半夏硫黄
- type: diagnostic_rule
  s: 黄连阿胶汤辨证参考：舌苔黄焦乏津。
  seq: [160]
  q: 舌苔是黄
  ents: [formula.huang_lian_e_jiao_tang]
  conf: 0.85
- type: treatment_principle
  s: 治心必兼治肺（火克金），如引擎过热须顾水箱；治肝先固脾、治肾先安心，以阻断传变。
  seq: [174]
