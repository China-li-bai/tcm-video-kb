- key: c01
  title: 足三里迎随补泻
  start_seq: 0
  summary: 足阳明经气下行。足三里补泻勿死记顺逆时针，应随经气流向：顺经快转慢回为补，逆经为泻；补用单数（三五七九）后稍提针。常灸足三里可健胃气、助长寿；血压偏高可于足三里下五分斜刺。
  clauses: []
  topics:
  - acupoint.st36
  - method.bu_xie
  - meridian.st
- key: c02
  title: 上巨虚下巨虚条口丰隆
  start_seq: 135
  summary: 阑尾奇穴可助诊治。上巨虚善治乳房结块，下巨虚善治脐下结块；二者间下一寸为条口，可透承山治肩不能举。丰隆名示丰满，亦为祛痰要穴，美容需疗程；其下为解溪。
  clauses: []
  topics:
  - acupoint.st37
  - acupoint.st39
  - acupoint.st38
  - acupoint.st40
