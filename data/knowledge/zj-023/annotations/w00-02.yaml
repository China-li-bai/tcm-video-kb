kps:
- type: clinical_tip
  s: 足三里补泻按经气流向，勿死记顺/逆时针（左右腿相反）：顺经快转慢回为补，逆经为泻。
  seq:
  - 21
  - 67
  q: 不要去说什么，顺时针逆时针这样会搞错
  ents:
  - acupoint.st36
  - method.bu_xie
  - meridian.st
  conf: 0.95
- type: clinical_tip
  s: 补用单数捻转（三五七九）后将针稍上提如绿豆许，气下行更快。
  seq:
  - 23
  - 23
  q: 转三下转五下，转七下转九下，补完以后
  ents:
  - method.bu_xie
  conf: 0.9
- type: acupoint_usage
  s: 足三里为合穴属土、又为本穴，虚实皆可治；常灸可保胃气、助长寿。
  seq:
  - 26
  - 75
  q: 常常灸足三里的是那一个人健康长寿
  ents:
  - acupoint.st36
  - zangfu.wei
  conf: 0.9
- type: clinical_tip
  s: 血压偏高可于足三里下约半寸处以四十五度斜刺向足三里，有助阳气下行。
  seq:
  - 72
  - 73
  q: 足三里下五分的地方半寸量，然后真是斜刺
  ents:
  - acupoint.st36
  conf: 0.85
  asr: 真是=针是
- type: acupoint_usage
  s: 上巨虚善治乳房硬块；下巨虚善治脐下结块（如胞宫肿块）；限在胃经者尤宜。
  seq:
  - 198
  - 204
  q: 上巨虚呢穴道顾名思义这个对我们的乳乳房的硬块非常好
  ents:
  - acupoint.st37
  - acupoint.st39
  conf: 0.95
- type: acupoint_usage
  s: 条口在上、下巨虚之间（上巨虚下一寸）；条口透承山专治肩不能举。
  seq:
  - 274
  - 280
  q: 条口透沉三专专门道五十间
  ents:
  - acupoint.st38
  - acupoint.bl57
  conf: 0.9
  asr: 沉三=承山；五十间=手不能举
- type: acupoint_usage
  s: 丰隆可助丰满美容（需隔日疗程、宜补不宜泻），更是著名祛痰穴。
  seq:
