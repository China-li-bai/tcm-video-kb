chapters:
- key: c01
  title: 子宫肌瘤术后不孕·下焦寒湿
  start_seq: 0
  summary: 三次肌瘤手术（最多一次取出二十八颗），压迫膀胱、经痛崩漏输血；术后不孕。2007-01起一方到底：生附+炮附治下焦寒湿盛（腹脚冰凉），合当归芍药散/当归生姜类补血止腹痛、生姜和胃；生附合桂枝鼓心阳达四肢。约一月半怀孕。
  clauses: []
  topics:
  - new.disease.zi_gong_ji_liu
  - herb.fu_zi
  - formula.dang_gui_shao_yao_san
- key: c02
  title: 大乌头煎阶梯与孕后当归散
  start_seq: 103
  summary: 少腹大寒痛：大建中（蜀椒干姜）无效且吐白沫则大乌头煎（乌头须蜜制，不可生煎）。孕后停攻伐；前二十周当归散，后二十周白术散意安胎。阳药运行可驱阴积外排（头汗臭秽）。阴极生热、阳极生寒——纯热不应时可阴中求阳。
  clauses: []
  topics:
  - formula.da_wu_tou_jian
  - formula.dang_gui_san
  - herb.wu_tou
