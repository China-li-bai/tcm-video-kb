chapters:
- key: c01
  title: 五脏风寒概说·肺肝中风中寒
  start_seq: 0
  summary: 金匮第十一篇五脏风寒积聚，条文残缺最多。肺中风口燥而喘身肿；肺中寒吐浊涕。肝中风头目眩两胁痛；肝中寒胸中痛不得转侧食则吐。肝着喜按用旋覆花汤（旋覆花、葱、新绛/茜草）。
  clauses: []
  topics:
  - disease.ji_ju
  - zangfu.wu_zang
  - new.formula.xuan_fu_hua_tang
- key: c02
  title: 心中风寒伤·防己黄芪与乌头
  start_seq: 155
  summary: 心中风火逆上焦热、饥不欲食吐；心中寒如蒜状心痛彻背，脉浮可自愈，不愈乌头赤石脂丸。心伤头面赤下重烦热脐跳脉弦。邪哭魂魄不安属气血少，癫狂可从肝肺心治。
  clauses: []
  topics:
  - new.formula.fang_ji_huang_qi_tang
  - formula.wu_tou_chi_shi_zhi_wan
  - concept.qi_xue
- key: c03
  title: 脾中风湿·利尿勿汗·脾约麻子仁
  start_seq: 291
  summary: 脾中风发热形如醉人腹中烦重短气，湿盛心火不降。治湿利尿勿发汗；白术茯苓，少腹静脉证重用白芍。脾约胃热约束脾津→麻子仁丸；酸枣仁敛肝藏血。
  clauses: []
  topics:
  - zangfu.pi
  - method.fa_han
  - formula.ma_zi_ren_wan
