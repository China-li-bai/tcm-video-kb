chapters:
- key: c01
  title: 留针、出针与晕针
  start_seq: 19
  summary: 留针一般20–30分钟，中风可更久。十四岁以下多单刺不留针。出针宜垂直缓慢，近皮停数秒可免出血。宜卧位施针；站坐易晕针。晕针则卧平、松衣、通风，可针人中，勿过度惊吓处理。
  clauses: []
  topics:
  - method.zhen_jiu
  - acupoint.gv26
  - method.bu_xie
- key: c02
  title: 针具规格与透刺
  start_seq: 79
  summary: 常用32号一寸半毫针；手足浅部用一寸；硬结/肿胀可用28号。三寸针用于透穴，腕踝痛头痛可立竿见影。介绍九针、火针、放血针；防断针须留针柄于外。
  clauses: []
  topics:
  - method.zhen_jiu
  - new.book.针灸大成
- key: c03
  title: 干支五行与脏腑阴阳
  start_seq: 167
  summary: 天干配脏腑（甲胆乙肝…）取五行属性：木火土金水，脏阴腑阳。肺为水箱散热、心为引擎之喻，说明肺降热防上逆。为后文经络五行穴性铺垫。
  clauses: []
  topics:
  - concept.wu_xing
  - concept.yin_yang
  - zangfu.fei
