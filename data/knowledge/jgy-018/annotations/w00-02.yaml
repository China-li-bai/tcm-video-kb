kps:
- type: contraindication
  s: 呕家有痈脓不可止呕，止则脓闭内溃；酒客大呕亦勿强止。
  seq: [3]
  q: 呕吐
  ents: [symptom.ou_tu]
  conf: 0.9
  asr: 臃拢=痈脓
- type: diagnostic_rule
  s: 先呕后渴为津液已伤属顺；渴欲饮水水入则吐为水停心下（水逆类），主小半夏汤。
  seq: [25]
  q: 小半夏汤
  ents: [formula.xiao_ban_xia_tang, symptom.ou_tu, herb.ban_xia, herb.sheng_jiang]
  conf: 0.95
  asr: 水停星下/水平心象=水停心下；赢家=饮家
- type: diagnostic_rule
  s: 呕家本渴，今反不渴为心下有支饮；小半夏仅治胃中饮停恶心，苓桂术甘治膈上支饮必兼眩晕。
  seq: [33]
  q: 口渴
  ents: [formula.xiao_ban_xia_tang, formula.fu_ling_gui_zhi_bai_zhu_gan_cao_tang, symptom.ou_tu]
  conf: 0.9
  asr: 临桂疏肝/苓桂竹肝=苓桂术甘；知饮=支饮
- type: pathomechanism
  s: 胃中素虚冷者误发汗，阳虚膈气上逆，脉反数似胃热，实为虚数；可致胃反（朝食暮吐）。
  seq: [53]
  q: 发汗
  ents: [method.fa_han, concept.yang_xu, new.pattern.wei_fan]
  conf: 0.9
  asr: 杨六徐=阳虚；朝子暮兔=朝食暮吐
- type: clinical_tip
  s: 寸口脉微示血虚：无气→荣虚→血不足→胸中冷；经方须先复胸阳，单补血无效。望手掌苍白与脉合参。
  seq: [83]
  q: 血虚
  ents: [concept.xue_xu, concept.yang_xu]
  conf: 0.9
- type: contraindication
  s: 病人欲吐者不可下；除非确属阳明燥实。少阳兼呕可见大柴胡，寒凉误下易成胃反。
  seq: [117]
  q: 大柴胡汤
  ents: [formula.da_chai_hu_tang, symptom.ou_tu, new.pattern.wei_fan]
  conf: 0.95
  asr: 邵阳=少阳
- type: formula_indication
  s: 哕（打嗝）：虚热用橘皮生姜汤；虚寒胸满用吴茱萸汤；胃气欲绝用茯苓四逆或通脉四逆。
  seq: [135]
  q: 橘皮
  ents: [symptom.hui, formula.ju_pi_tang, formula.wu_zhu_yu_tang, formula.fu_ling_si_ni_tang]
  conf: 0.9
  asr: 睡=哕；菊碧生姜=橘皮生姜
- type: formula_indication
  s: 吴茱萸汤特证：剧烈头痛（肩胛至后脑至太阳）、头痛必呕吐、手足冷、经行头痛吐、胃下垂虚寒；补肝血、肝经上巅。
  seq: [185]
  q: 头痛
  ents: [formula.wu_zhu_yu_tang, herb.wu_zhu_yu, symptom.tou_tong, symptom.ou_tu]
  conf: 0.95
  asr: 吴茱妤/无助/五珠乙/吴猪鲤=吴茱萸
- type: formula_indication
  s: 干呕、吐涎沫、头痛皆属吴茱萸汤：干呕因胃寒无物，吐涎沫因上焦寒逼肺津。
  seq: [258]
  q: 干呕
  ents: [formula.wu_zhu_yu_tang, symptom.gan_ou, symptom.tou_tong]
  conf: 0.9
  asr: 吐咽沫=吐涎沫
- type: formula_indication
  s: 呕而肠鸣心下痞、食后下利为半夏泻心汤；无肠鸣腹痛用甘草泻心；肠鸣下利重则重用生姜成生姜泻心汤。
  seq: [269]
  q: 半夏泻心汤
  ents: [formula.ban_xia_xie_xin_tang, formula.gan_cao_xie_xin_tang, formula.sheng_jiang_xie_xin_tang, symptom.ou_tu]
  conf: 0.95
  asr: 性价比=心下痞；夏利=下利；长鸣=肠鸣
- type: formula_composition
  s: 生姜泻心重用生姜排水，干姜仅温中不加量；半夏泻心含芩连姜夏参草枣，舌苔黄重用黄芩。
  seq: [305]
  q: 生姜泻心汤
  ents: [formula.sheng_jiang_xie_xin_tang, herb.sheng_jiang, herb.gan_jiang]
  conf: 0.9
- type: formula_indication
  s: 干呕而下利，黄芩加半夏生姜汤：有痛加芍药，用黄芩半夏生姜，不用黄连。
  seq: [329]
  q: 黄芩加半夏生姜汤
  ents: [formula.huang_qin_jia_ban_xia_sheng_jiang_tang, symptom.gan_ou, symptom.xia_li, herb.huang_qin]
  conf: 0.95
- type: treatment_principle
  s: 下利用诸方仍不止时，终极导利从小便出，否则利久人脱。
  seq: [341]
  q: 小便
  ents: [symptom.xia_li]
  conf: 0.85
  asr: 自立=止利
- type: formula_indication
  s: 诸呕吐谷不得下、胸有痰饮、痰声漉漉，小半夏汤祛痰止呕。
  seq: [346]
  q: 痰饮
  ents: [formula.xiao_ban_xia_tang, syndrome.tan_yin, symptom.ou_tu]
  conf: 0.9
  asr: 古不得下=谷不得下
- type: clinical_tip
  s: 吐后口渴须缓饮，急灌则水停胃中；停水用猪苓散（猪苓茯苓白术，散剂久留胃肠利水）。
  seq: [366]
  q: 猪苓
  ents: [formula.zhu_ling_san, herb.fu_ling, herb.bai_zhu, symptom.ou_tu]
  conf: 0.9
- type: formula_indication
  s: 呕而脉弱、小便复利、身有微热为里虚阳欲脱，四逆汤（生附子壮心阳、干姜）；肢冷过肘膝。
  seq: [374]
  q: 脉弱
  ents: [formula.si_ni_tang, pulse.ruo, herb.fu_zi, herb.gan_jiang, symptom.ou_tu]
  conf: 0.95
  asr: 父子=附子
