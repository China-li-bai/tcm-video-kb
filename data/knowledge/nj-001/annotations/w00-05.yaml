- key: c02
  title: 虚邪与恬淡真气
  start_seq: 108
  summary: 虚邪贼风避之有时；五邪生克传变有虚实。恬淡虚无则真气从之，精神内守病安从来。
  clauses: []
  topics:
  - concept.xu_xie
  - concept.zhen_qi
- key: c03
  title: 肾气天癸与脉穴
  start_seq: 321
  summary: 七岁肾气盛（肾主骨、换牙）；女子太冲脉盛等天癸次第。太溪候肾，足有三脉（太冲、冲阳、太溪等）。
  clauses: []
