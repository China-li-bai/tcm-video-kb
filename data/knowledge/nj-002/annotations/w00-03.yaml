- key: c01
  title: 五行五脏化五气
  start_seq: 0
  summary: 续《内经》：天有四时五行（寒暑燥湿风），人有五脏化五气、情志相应。暑热耗津；阴阳为血气男女、水火征兆。
  clauses: []
  topics:
  - concept.wu_xing
  - zangfu.wu_zang
  - concept.yin_yang
- key: c02
  title: 阴阳消长与肾衰
  start_seq: 224
  summary: 阴在内为阳之守，阳在外为阴之使。中年后阴气/肾气渐衰（五八六八七八等），宜知阴阳消长；五十后肾气始衰可酌补肾。病由表入里至五脏则半死半生。
  clauses: []
  topics:
  - concept.yin_yang
  - zangfu.shen
