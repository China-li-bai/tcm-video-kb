- key: c01
  title: 冲阳内庭厉兑陷谷
  start_seq: 0
  summary: 冲阳为胃经原穴（约解溪下二寸），昔粗针易伤动脉故常禁针，今细针可拨脉下针；有冲阳脉示胃气尚存，虚实皆可治。内庭为荥（水），厉兑为井（金、子穴）。陷谷可治水气上面部。下牙痛取胃经，上牙痛取大肠经。
  clauses: []
  topics:
  - acupoint.st42
  - acupoint.st44
  - acupoint.st45
  - acupoint.st43
- key: c02
  title: 脾与胃表里总说
  start_seq: 230
  summary: 脾与胃互为表里（胃为表、脾为里）。脾藏血、主四肢与肌肉；甘味入脾胃。为足太阴脾经各论作铺垫。
  clauses: []
  topics:
  - zangfu.pi
  - zangfu.wei
  - concept.biao_li
