- type: concept_definition
  s: 六阳经有原穴，阴经无原穴（与阴经以输代原相对）。冲阳为胃经原穴。
  seq:
  - 14
  - 22
  q: 阳经上面才有原穴，阴经上面没有穴足
  ents:
  - acupoint.st42
  - concept.yuan_xue
  - meridian.st
  conf: 0.9
  asr: 穴足=原穴
- type: contraindication
  s: 昔日粗针易中动脉，冲阳常禁针；今细针可摸脉拨开后下针，虚实皆可用。
  seq:
  - 25
  - 39
  q: 冲阳是竞争的
  ents:
  - acupoint.st42
  conf: 0.9
  asr: 竞争=禁针
- type: clinical_tip
