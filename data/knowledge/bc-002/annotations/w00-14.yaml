chapters:
- key: c01
  title: 乌梅与露蜂房
  start_seq: 0
  summary: 露蜂房外形介绍后入乌梅：梅实炮制分乌梅白梅；乌梅酸平涩，收敛解热消肿驱蛔，治下利与吐蛔；酸主收亦能加重痉挛，夜抽筋宜甘缓勿过酸。
  clauses: []
  topics: [herb.wu_mei, herb.lu_feng_fang]
- key: c02
  title: 粉锡戎盐代赭石
  start_seq: 180
  summary: 粉锡（铅粉）外用解毒治皮肤硬疮，内服过多伤血。青盐/戎盐可清肾结石，宜少用助排水，过食伤骨；常配茯苓。代赭石（ASR带者食）苦寒镇降，胃热呕逆反胃、带下可用。
  clauses: []
  topics: [herb.fen_xi, herb.rong_yan, herb.dai_zhe_shi]
- key: c03
  title: 附子天雄半夏
  start_seq: 360
  summary: 附子回阳救逆、防脱水；阳虚汗出不固等多赖附子。天雄并论。半夏燥湿化痰，脑积水、肺中水饮可用；强调炮制去麻。
  clauses: []
  topics: [herb.fu_zi, herb.tian_xiong, herb.ban_xia]
- key: c04
  title: 大黄巴豆葶苈旋覆
  start_seq: 1200
  summary: 巴豆峻下。大黄泻实非单纯清热。葶苈子下气行水泻肺定喘，力猛伤胃须配大枣（葶苈大枣泻肺汤）。旋覆花（ASR悬浮花）降气化痰止呕，重证合吴茱萸生姜。
  clauses: []
  topics: [herb.da_huang, herb.ba_dou, herb.ting_li_zi, herb.xuan_fu_hua, herb.wu_zhu_yu, herb.da_zao]
