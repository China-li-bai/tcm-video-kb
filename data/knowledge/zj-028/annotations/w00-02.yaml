- key: c01
  title: 漏谷地机阴陵泉治水肿
  start_seq: 0
  summary: 三阴交为妇科大穴，宜常灸。漏谷（三阴交上三寸）为与胃经相通之络部取穴。三阴交、地机、阴陵泉合用专治水肿，起针常可见水液外渗。阴陵泉为合穴、水穴，主湿、风湿、膝痛及小便异常。
  clauses: []
  topics:
  - acupoint.sp6
  - acupoint.sp7
  - acupoint.sp8
  - acupoint.sp9
- key: c02
  title: 血海与冲门
  start_seq: 178
  summary: 血海为大穴，治月经过多或闭经、漏下；合三阴交、中极可治诸痛经，宜浅刺（约一寸）。冲门与云门相对称；胞衣不下可取冲门。针深浅须依病位（皮病浅、筋病入筋）。
  clauses: []
  topics:
  - acupoint.sp10
  - acupoint.sp12
  - acupoint.cv3
