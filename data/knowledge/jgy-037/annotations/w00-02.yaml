kps:
- type: diagnostic_rule
  s: SLE可呈全身红疹刺痛（非痒）、严重脱发，不必仅见面部蝶斑。
  seq: [9]
  q: 全身性的红疹
  ents: [new.disease.hong_ban_lang_chuang]
  conf: 0.95
- type: pathomechanism
  s: 纳亢而饿则须即食、不食则头痛：阳停胃腑不能入脏，须食以维阴阳平衡。
  seq: [75]
  q: 头痛
  ents: [concept.yin_yang]
  conf: 0.85
- type: herb_property
  s: 皮肤病见蜕皮：蝉蜕+蛇蜕同用；蝉蜕（甲壳）偏四肢关节，蛇蜕偏肌肉皮肤。
  seq: [127]
  q: 蝉队跟蛇队
  ents: [new.herb.chan_tui, new.herb.she_tui]
  conf: 0.9
  asr: 蝉队/残队=蝉蜕；蛇队=蛇蜕
- type: formula_indication
  s: 疏肝清肝常用龙胆草；本案初诊即投。
  seq: [107]
  q: 龙胆草
  ents: [herb.long_dan]
  conf: 0.9
- type: clinical_tip
  s: 约十二日红斑大退、头痛减；手脚冷则加当归人参等补血，主方可不变仅加减。
  seq: [157]
  q: 头痛
  ents: [herb.dang_gui, herb.ren_shen, new.disease.hong_ban_lang_chuang]
  conf: 0.85
- type: clinical_tip
  s: 四诊约七周红斑几退尽、眠便渴近常；未碰西医者效较快。同病异人处方可迥异，须辨证。
  seq: [212]
  q: 红斑
  ents: [new.disease.hong_ban_lang_chuang]
  conf: 0.9
- type: treatment_principle
  s: 疏肝清肝时常兼肝胆肾之阳药；轻证肝淡即可，手脚冰冷重症须乌头麻黄硫磺等固阳回阳。
  seq: [299]
  q: 乌头
  ents: [herb.wu_tou, herb.ma_huang, concept.yang_qi]
  conf: 0.9
  asr: 肝淡身体≈干姜细辛类
- type: clinical_tip
  s: 始终保持病人阳气，再重亦不易殆；能受阳药则有救。
  seq: [294]
