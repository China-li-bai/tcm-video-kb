- key: c01
  title: 酒风与奇病论胎九月喑
  start_seq: 0
  summary: 身热懈惰、汗出恶风短气为酒风，方用泽泻等解酒。孕至九月突然失音，乃胞络受压，非病，分娩自愈。
  clauses: []
  topics:
  - new.disease.jiu_feng
  - herb.ze_xie
- key: c02
  title: 诊脉久病与寒入头痛消渴
  start_seq: 115
  summary: 尺脉数盛为诊（久病伤经）。面见青黑主痛、白主寒。大寒犯头久而不去可入骨致多年头痛。甘味太过中满气溢可转为消渴。
  clauses: []
  topics:
  - symptom.tou_tong
  - symptom.xiao_ke
- key: c03
  title: 口苦属胆与先天癫痫
  start_seq: 304
  summary: 口苦当思肝胆。另述生而癫痫等奇病；过食肥甘与消渴病机再申。
  clauses: []
  topics:
  - zangfu.dan
  - disease.dian_xian
