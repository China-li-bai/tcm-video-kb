- key: c01
  title: 白及止血肺伤
  start_seq: 0
  summary: 白及苦寒疗痈肿肺损咳血；复方清瘀配伍；以通为补。
  clauses: []
  topics: [herb.bai_ji]
- key: c02
  title: 大戟峻下
  start_seq: 74
  summary: 大戟峻猛；十枣汤生粉红枣送服清肺积水。
  clauses: []
