kps:
- type: clinical_tip
  s: 白及（ASR白吉）味苦性寒无毒，主痈肿恶疮败疽，伤科止血常用。
  seq: [13]
  q: 专门是臃肿恶疮败局
  ents: [herb.bai_ji]
  conf: 0.9
  asr: 白吉=白及；臃肿=痈肿；败局=败疽
- type: clinical_tip
  s: 白及入肺，治肺损咳血吐血；单用止血前须先清积瘀，常配丹皮、麦冬、川芎等复方。
  seq: [15]
  q: 肺吐血
  ents: [herb.bai_ji]
  conf: 0.9
- type: contraindication
  s: 痈疽已溃烂者不宜单用白及苦寒收敛，宜先排脓。
  seq: [68]
  q: 拥挤已经溃烂了
  ents: [herb.bai_ji]
  conf: 0.85
  asr: 拥挤=痈疽
- type: clinical_tip
  s: 中医以通为补：瘀滞不去则补不入，当先通后补。
  seq: [134]
  q: 以通为补
  ents: [herb.bai_ji]
  conf: 0.95
- type: contraindication
  s: 大戟为峻猛药，性凶，临床须慎用。
  seq: [78]
  q: 很凶很菌的药
  ents: [herb.da_ji]
  conf: 0.9
  asr: 很菌=很峻
- type: clinical_tip
  s: 十枣汤类方中甘遂芫花大戟须生用为粉，红枣汤送服，才能去肺中积水；若煮汤则仅利下焦而不清肺水。
  seq: [664]
  q: 不会清肺里面的水
  ents: [herb.da_ji, formula.shi_zao_tang]
  conf: 0.95
- type: clinical_tip
  s: 李时珍称大戟治留饮，倪氏指出其未必亲试，十枣汤症成因不单是留饮。
  seq: [629]
  q: 他一定没有用过
  ents: [herb.da_ji, person.li_shi_zhen]
  conf: 0.85
- type: clinical_tip
  s: 白头翁经方使用甚多，本经所载。
  seq: [327]
  q: 白头翁经方使用很多
  ents: [herb.bai_tou_weng]
  conf: 0.9
- type: clinical_tip
  s: 连翘为临床常用清热解毒药。
  seq: [429]
  q: 连翘就是我们常用常常使用的药物
  ents: [herb.lian_qiao]
  conf: 0.9
- type: clinical_tip
  s: 夏枯草本经药物，临床用途广。
  seq: [503]
  q: 这个夏枯草呢
  ents: [herb.xia_ku_cao]
  conf: 0.85
- type: contraindication
  s: 巴豆剧毒，产于巴蜀；药房见索常惊，古有走马汤类急下之用。
  seq: [677]
  q: 这个毒药啊
  ents: [herb.ba_dou]
  conf: 0.95
- type: clinical_tip
  s: 走马汤取义如马边走边泻，巴豆峻下通便极速。
  seq: [678]
  q: 走马汤
  ents: [herb.ba_dou]
  conf: 0.9
- type: clinical_tip
  s: 皂荚药房少备，为峻烈开窍涤痰药。
  seq: [794]
  q: 这个皂荚
  ents: [herb.zao_jia]
  conf: 0.85
- type: contraindication
  s: 雄黄加热可变为砒霜，有大毒，须慎。
  seq: [839]
  q: 雄黄加热变成砒霜
  ents: [herb.xiong_huang]
  conf: 0.95
- type: clinical_tip
  s: 雷丸药房常见，为驱虫要药。
  seq: [989]
  q: 药房都有这个雷丸
  ents: [herb.lei_wan]
  conf: 0.85
- type: clinical_tip
  s: 蜈蚣本经所载，有毒攻毒、息风之用。
  seq: [1109]
  q: 蜈蚣。
  ents: [herb.wu_gong]
  conf: 0.85
- type: clinical_tip
  s: 桃仁专活血化瘀，妇人痛经血块、久咳痰血、脑与脏腑瘀滞皆可用。
  seq: [1255]
  q: 专门活血化瘀
  ents: [herb.tao_ren]
  conf: 0.95
- type: clinical_tip
  s: 桃仁含油脂可润肠通便，力不及大黄而有化瘀之功。
  seq: [1268]
  q: 可以利大便
  ents: [herb.tao_ren]
  conf: 0.9
- type: pathomechanism
  s: 久病必有瘀；经方家主张以通为补，瘀不去则补不进。
  seq: [1279]
  q: 久病必有瘀
  ents: [herb.tao_ren]
  conf: 0.95
- type: clinical_tip
  s: 蓄血发狂、月经不通、咳逆等皆桃仁所主；瘀结大便色黑冲水可见血色。
  seq: [1290]
  q: 蓄血发狂
  ents: [herb.tao_ren]
  conf: 0.9
- type: clinical_tip
  s: 杏仁（杏核）为止咳平喘要药，本草常论。
  seq: [1357]
  q: 杏仁
  ents: [herb.xing_ren]
  conf: 0.9
- type: clinical_tip
  s: 赤小豆入方利水消肿，经方中有专方。
  seq: [461]
  q: 赤小豆到了
  ents: [herb.chi_xiao_dou]
  conf: 0.85
- type: clinical_tip
  s: 艾叶温经止血安胎，本经第六部所载。
  seq: [1642]
  q: 艾叶
  ents: [herb.ai]
  conf: 0.9
- type: formula_indication
  s: 虚烦失眠可用张仲景栀子豉汤。
  seq: [1419]
  q: 栀子豉豉汤来治疗
  ents: [herb.zhi_zi, herb.shi]
  conf: 0.9
- type: clinical_tip
  s: 鸡子黄即鸡蛋黄，入黄连阿胶汤等方。
  seq: [1961]
  q: 鸡子黄就是鸡蛋黄
  ents: [herb.ji_zi_huang]
  conf: 0.95
- type: formula_indication
  s: 黄连阿胶汤中用阿胶等药。
  seq: [1970]
  q: 黄连阿胶汤里面就有药吃
  ents: [herb.e_jiao, herb.huang_lian]
  conf: 0.9
- type: clinical_tip
  s: 合欢可令人情志舒畅。
  seq: [2065]
  q: 合欢很好
  ents: [herb.he_huan]
  conf: 0.9
- type: clinical_tip
  s: 远志除强心外，可安神减焦虑、平和心情。
  seq: [2066]
  q: 远志可以让一个人震惊
  ents: [herb.yuan_zhi]
  conf: 0.85
  asr: 震惊=镇静
- type: clinical_tip
  s: 古称牙子，今称狼牙。
  seq: [225]
  q: 现在称之为狼牙
  ents: [herb.lang_ya]
  conf: 0.85
- type: clinical_tip
  s: 当归与麦冬生地等常同用治阴血不足面色干枯。
  seq: [456]
  q: 当归生地
  ents: [herb.dang_gui]
  conf: 0.85
- type: clinical_tip
  s: 小麦入方，甘麦大枣汤类养心安神。
  seq: [2191]
  q: 小麦
  ents: [herb.xiao_mai]
  conf: 0.85
