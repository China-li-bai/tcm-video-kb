chapters:
- key: c01
  title: 水气病与风水皮水正水
  start_seq: 0
  summary: 《金匮》水气病脉证：水肿鼓胀积水。水病多由表证失治（当用麻桂葛而误用银翘板蓝等）水内停；饮病多自内生。浅深：风水→皮水→正水/石水/黄汗。风水脉浮、骨节疼痛恶风，似麻黄/桂枝证。
  clauses: []
  topics: [classic.jgy_ch_shui_qi_bing_mai_zheng_bing_zhi, disease.shui_qi_bing, syndrome.feng_shui, syndrome.pi_shui, syndrome.zheng_shui]
- key: c02
  title: 黄汗与防己黄芪
  start_seq: 300
  summary: 黄汗不宜妄发汗；黄芪芍药桂枝苦酒汤等。风水/皮水常用防己黄芪汤（讲中己黄芪汤）。
  clauses: []
  topics: [syndrome.huang_han, formula.fang_ji_huang_qi_tang, herb.huang_qi]
- key: c03
  title: 正水甘草麻黄与阴虚调桂芍
  start_seq: 1100
  summary: 皮水失治深入为正水（ASR泥/漓水），可用越婢加术汤、甘草麻黄汤等。阴虚证调桂枝白芍分量；肺积水与大肠相关等。
  clauses: []
  topics: [syndrome.zheng_shui, formula.gan_cao_ma_huang_tang, formula.yue_bi_tang, herb.gui_zhi, herb.shao_yao]
