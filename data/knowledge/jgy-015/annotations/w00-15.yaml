kps:
- type: concept_definition
  s: 水气病即水肿鼓胀积水；多由表证失治，水内停而成，异于自内生之饮病。
  seq: [8]
  q: 水病
  ents: [disease.shui_qi_bing]
  conf: 0.95
- type: pathomechanism
  s: 水病浅深：风水最浅→失治入皮水→再入正水/石水/黄汗。
  seq: [13]
  q: 风水
  ents: [syndrome.feng_shui, syndrome.pi_shui, syndrome.zheng_shui]
  conf: 0.95
- type: diagnostic_rule
  s: 风水脉浮、骨节疼痛恶风，外观似麻黄汤或桂枝汤证。
  seq: [22]
  q: 风水
  ents: [syndrome.feng_shui, formula.ma_huang_tang, formula.gui_zhi_tang]
  conf: 0.95
- type: clinical_tip
  s: 表证当用麻桂葛发表；误用连翘银花板蓝等，表不去则水渐停成水病。
  seq: [10]
  q: 葛根汤
  ents: [formula.ge_gen_tang, formula.gui_zhi_tang]
  conf: 0.9
- type: contraindication
  s: 黄汗不宜妄发汗；可用黄芪芍药桂枝苦酒汤一类。
  seq: [320]
  q: 黄汗
  ents: [syndrome.huang_han, herb.huang_qi]
  conf: 0.9
  asr: 黄芪古酒汤=黄芪芍药桂枝苦酒汤
- type: formula_indication
  s: 风水/皮水常用防己黄芪汤（讲中己黄芪汤）。
  seq: [967]
  q: 己黄芪汤
  ents: [formula.fang_ji_huang_qi_tang]
  conf: 0.9
  asr: 己黄芪汤=防己黄芪汤
- type: clinical_tip
  s: 皮水失治深入为正水，可用越婢加术汤、甘草麻黄汤等。
  seq: [1121]
  q: 甘草麻黄汤
  ents: [formula.gan_cao_ma_huang_tang, formula.yue_bi_tang, syndrome.zheng_shui]
  conf: 0.85
  asr: 月杯加足=越婢加术；漓/泥/离水≈正水
- type: treatment_principle
  s: 经方调阴常倚桂枝与白芍之比例；阴虚勿妄去白芍，行阳则重桂枝。
  seq: [1440]
  q: 白芍
  ents: [herb.gui_zhi, herb.shao_yao]
  conf: 0.85
