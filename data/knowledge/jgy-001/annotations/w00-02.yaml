chapters:
- key: c01
  title: 续伤寒·霍乱名义与湿热
  start_seq: 0
  summary: 伤寒金匮本一书，宋后分册；霍乱篇并入金匮。中医霍乱指呕吐下利，本于太阴湿热，多见于春分后南方。辨虚实：按腹喜按属虚，忌妄投承气。
  clauses: []
  topics:
  - disease.huo_luan
  - classic.jin_gui_yao_lve
- key: c02
  title: 阳明自愈与脉微恶寒用四逆
  start_seq: 137
  summary: 阳明但热不寒，能食；不能食则非阳明。霍乱后脉微恶寒、四肢厥，乃心阳不足而非表寒，当四逆汤（或加人参），忌误作表证发汗。
  clauses: []
  topics:
  - six_channel.yangming
  - formula.si_ni_tang
- key: c03
  title: 霍乱热多五苓·寒多理中
  start_seq: 281
  summary: 霍乱头痛发热身疼：热多欲饮水、小便不利用五苓散；寒多不欲水用理中丸。五苓散治水停肌表、中焦无水而吐水。
  clauses: []
  topics:
  - formula.wu_ling_san
  - formula.li_zhong_wan
