kps:
- type: concept_definition
  s: 伤寒与金匮原为一书《伤寒杂病论》，宋后分册；霍乱等非六经篇并入金匮。
  seq: [4]
  q: 伤寒杂病论
  ents: [classic.shang_han_lun, classic.jin_gui_yao_lve]
  conf: 0.95
- type: concept_definition
  s: 中医霍乱指呕吐下利，不必等同西医霍乱病名；素问以太阴湿热中满致之。
  seq: [11, 18]
  q: 中满祸乱
  ents: [disease.huo_luan]
  conf: 0.85
  asr: 祸乱=霍乱
- type: contraindication
  s: 下利按腹喜按属虚，妄投大承气汤可害人。
  seq: [135]
  q: 大承气汤
  ents: [formula.da_cheng_qi_tang]
  conf: 0.95
- type: diagnostic_rule
  s: 阳明但见热不见寒；能食属阳明，不能食则非阳明。
  seq: [149, 156]
  q: 只看到热症
  ents: [six_channel.yangming]
  conf: 0.9
- type: diagnostic_rule
  s: 霍乱后恶寒而脉微，为心阳不足，非表寒（表寒脉当浮紧）；当用四逆汤急救。
  seq: [232, 274]
  q: 四逆汤
  ents: [formula.si_ni_tang]
  conf: 0.9
- type: formula_indication
  s: 霍乱热多欲饮水（兼小便不利）用五苓散；寒多不欲水用理中丸。
  seq: [283, 287]
  q: 五苓散
  ents: [formula.wu_ling_san, formula.li_zhong_wan]
  conf: 0.95
- type: pathomechanism
  s: 五苓散证：水停肌表而中焦无水，口渴饮水反吐；散能集表水归膀胱。
  seq: [291]
  q: 喝水就吐
  ents: [formula.wu_ling_san]
  conf: 0.95
