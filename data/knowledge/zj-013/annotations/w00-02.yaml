- key: c02
  title: 素髎、人中、龈交
  start_seq: 186
  summary: 素髎在鼻尖正中。人中（水沟）近取治面肿等。龈交为督脉终点，治牙龈肿烂、牙周病效佳，口内不便灸。头部穴多治神志病，可近取查阅功能。
  clauses: []
  topics:
  - acupoint.gv25
  - acupoint.gv26
  - acupoint.gv28
