  conf: 0.95
- type: treatment_principle
  s: 遗尿、小便无力多因小肠火不足、膀胱水不化；治宜助火气化，灸中极（膀胱募）等。
  seq:
  - 30
  - 74
  q: 中极是膀胱经的墓穴
