- type: acupoint_usage
  s: 丰隆等足阳明穴可用于丰胸；脚部穴道系统学完亦可用于针灸美容。
  seq:
  - 1
  - 2
  q: 丰隆穴也可以丰胸
  ents:
  - acupoint.st40
  - meridian.st
  conf: 0.85
- type: concept_definition
  s: 中医认为奶水与月经相关，此系统由心所主；阳明与冲脉下行胞宫，月经来潮则胸胀渐消。
  seq:
  - 38
  - 44
  q: 奶水就是月经，而这个系统呢是心脏在管
  ents:
  - zangfu.xin
  - meridian.st
  - meridian.tv
  conf: 0.9
  asr: 味精=胃经；冲卖=冲脉
- type: treatment_principle
  s: 乳腺硬块初期可按所过经络取穴消散，局部硬结处加灸，早期效佳。
  seq:
  - 111
  - 189
  q: 有硬块的地方灸，这是最初期的百分之百为好
  ents:
  - method.zhen_jiu
  conf: 0.9
- type: contraindication
  s: 乳中一般不下针；旁开穴可针。乳根在乳房下缘，常用于美容及局部治疗。
  seq:
  - 209
  - 216
  q: 乳中呢就是不要下乳中旁边都可以下
  ents:
  - acupoint.st17
  - acupoint.st18
  conf: 0.95
- type: acupoint_usage
  s: 不容在巨阙外开两寸；名示“食入不容”，治胃胀食不下。巨阙为心募。
  seq:
