kps:
- type: diagnostic_rule
  s: 问口渴与否及想喝冷水或热水即可辨寒热，电话问诊也能判断。
  seq: [260, 262]
  q: 你口渴想喝什么水啊，你就知道寒热如何了。
  ents: [new.symptom.口渴, concept.han_re]
  conf: 0.85
- type: treatment_principle
  s: 阳证通利大便，阴证通利小便；实脾时（如实脾饮）一定要问病人小便情况。
  seq: [265, 267]
  q: 所以在阳症的时候，我们通理大便。
  ents: [method.li_xiao_bian, new.concept.实脾]
  conf: 0.85
  asr: 食脾=实脾；通便便小练=通利小便
- type: clause_interpretation
  s: 第279条本太阳病误下，表未解而腹满时痛者属太阴，用桂枝加芍药汤；大实痛、按之更痛者用桂枝加大黄汤。
  seq: [273, 285]
  q: 这是桂枝加芍药汤
  ents: [clause.shl.279, formula.gui_zhi_jia_shao_yao_tang, formula.gui_zhi_jia_da_huang_tang, symptom.fu_man, symptom.fu_tong]
  conf: 0.9
- type: formula_composition
  s: 桂枝加芍药汤：桂枝三钱、芍药加倍为六钱，加炙甘草、生姜三片、大枣，煮取三碗分服；不加饴糖（加饴糖即小建中汤）。
  seq: [278, 290]
  q: 芍药就用六钱
  ents: [formula.gui_zhi_jia_shao_yao_tang, formula.xiao_jian_zhong_tang, herb.gui_zhi, herb.shao_yao, herb.gan_cao, herb.sheng_jiang, herb.da_zao, herb.jiao_yi]
  conf: 0.85
- type: herb_property
  s: 甘味易生湿，太阴本有湿，故桂枝加芍药汤不加饴糖。
  seq: [291, 292]
  q: 甜味的东西会深思
  ents: [herb.jiao_yi]
  conf: 0.75
  asr: 深思=生湿；胰糖=饴糖
- type: herb_property
  s: 白芍专治腹中寒水累积、血行不畅所致的阵发性疼痛，痛经、肠痛亦可用。
  seq: [280, 281]
  q: 女孩子的月经痛你也可以用白芍啊
  ents: [herb.shao_yao, symptom.fu_tong]
  conf: 0.85
- type: clinical_tip
  s: 倪师治小儿血癌（脾湿盛、腹胀、手脚冰冷、不渴）：桂枝汤重用芍药，加生附子（小儿二钱、成人五六钱）及茯苓利湿，去寒湿以复阳。
  seq: [304, 311]
  q: 我用桂汤汤重用芍药
  ents: [formula.gui_zhi_tang, herb.shao_yao, herb.fu_zi, herb.fu_ling, new.disease.血癌]
  conf: 0.6
  asr: 生腹/参附=生附子；白虎汤汤福灵疑为"茯苓"之误识
- type: diagnostic_rule
  s: 判断好转：能睡、能吃、二便正常、手脚由冷转热；第五胸椎压痛消失。
  seq: [312, 314]
  q: 第五次按下去他不痛就好了。
  conf: 0.75
  asr: 第五支/第五针=第五胸椎
- type: formula_composition
  s: 桂枝加大黄汤：大黄与桂枝约一比三（如桂枝三钱、大黄一钱）；病在阴脏，攻下只宜轻下，不可用到阳明的重量。
  seq: [324, 328]
  q: 桂枝汤里面大黄是一，桂枝是三
  ents: [formula.gui_zhi_jia_da_huang_tang, herb.da_huang, herb.gui_zhi]
  conf: 0.85
- type: clause_interpretation
  s: 第280条太阴脉弱、续自便利者，若须用大黄、芍药应减量，因胃气弱易被攻动。
  seq: [332, 343]
  q: 你可以大黄把它减少，或者芍药减少。
  ents: [clause.shl.280, herb.da_huang, herb.shao_yao, pulse.ruo, zangfu.wei]
  conf: 0.9
- type: pathomechanism
  s: 六经辨证中太阴以脾为主而不以肺为主；脾为肺之母，治好脾则肺自恢复，肺病另见《金匮》。
  seq: [345, 360]
  q: 太阴的候是以脾为主，不以肺为主。
  ents: [six_channel.taiyin, zangfu.pi, zangfu.fei, classic.jin_gui_yao_lve, concept.liu_jing]
  conf: 0.85
