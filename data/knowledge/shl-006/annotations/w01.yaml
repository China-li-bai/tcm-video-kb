chapters:
- key: c03
  title: 第274–276条 太阴中风、欲解时与脉浮可汗
  start_seq: 124
  summary: 太阴中风四肢烦疼，因脾主四肢肌肉、湿盛使新旧津液不能更替；阴脉由涩转长为欲愈；太阴脉浮可用桂枝汤发汗，湿盛加白术、茯苓。
  clauses: [274, 275, 276]
  topics: [six_channel.taiyin, formula.gui_zhi_tang, herb.bai_zhu, herb.fu_ling]
- key: c04
  title: 第277条 自利不渴属太阴，当温之（四逆辈）
  start_seq: 167
  summary: 下利而不渴是太阴湿盛、脏有寒；寒湿在里当温中，四逆汤类可用；并讲附子与干姜、生姜的配伍用意及祛湿药按部位选择。
  clauses: [277]
  topics: [formula.si_ni_tang, herb.fu_zi, herb.gan_jiang, herb.sheng_jiang, syndrome.han_shi]
- key: c04.s1
  parent: c04
  title: 下利不渴辨阴证；附子固表
  start_seq: 167
  summary: 下利口渴属阳证，下利不渴属阴病脏寒；炮附子固阳固表，可治汗出及二便失禁。
- key: c04.s2
  parent: c04
  title: 附子配生姜、干姜的用意
  start_seq: 198
  summary: 炮附子配生姜以去水，生附子配干姜以救逆；水犯心脏时干姜、生姜同用以速排水；经方药性源自《胎胪药录》。
- key: c05
  title: 第278条 系在太阴：手足自温、发黄与脾家实
  start_seq: 233
  summary: 手足自温表示肠胃功能尚在；太阴湿盛当发黄，小便自利则不发黄，因此治阴证必须利小便；脾家实时暴烦下利会自止，腐秽自去。
  clauses: [278]
  topics: [symptom.fa_huang, method.li_xiao_bian, symptom.xiao_bian_zi_li]
