kps:
- type: formula_composition
  s: 当归四逆汤：桂枝汤去生姜，加当归、细辛、通草（木通）；温经通脉养血。
  seq:
  - 616
  - 620
  q: 桂枝汤，把生姜拿掉，加上当归细心跟木通，通草就是木通
  ents:
  - formula.dang_gui_si_ni_tang
  - herb.dang_gui
  - herb.xi_xin
  conf: 0.95
  asr: 细心=细辛
- type: clinical_tip
  s: 西医言需截肢、末梢冰冷、冻疮等，可思当归四逆汤。内有久寒呕者加吴茱萸生姜。
  seq:
  - 611
  - 674
  q: 糖尿病的病人呢，到后来要截肢，也是当归四逆汤症啊
  ents:
  - formula.dang_gui_si_ni_tang
  conf: 0.9
- type: diagnostic_rule
  s: 厥而见热象（舌干裂、脉大、手热、小便黄）→白虎，勿误投四逆越冷。
  seq:
  - 571
  - 587
  q: 白虎汤出现的时候，你绝对不会miss掉
  ents:
  - formula.bai_hu_tang
  conf: 0.85
- type: treatment_principle
  s: 大汗出热不去无他症→白虎；阳亡外脱须急用四逆汤挽阳。
  seq:
  - 701
  - 710
  q: 要赶快下手四逆汤
  ents:
  - formula.bai_hu_tang
  - formula.si_ni_tang
  conf: 0.85
- type: formula_composition
  s: 干姜黄连黄芩人参汤：干姜与芩连寒热并投，人参补中；治寒格、食入口即吐。
  seq:
  - 809
  - 878
  q: 干姜、黄连、黄芪人参汤，所以看好姜是热药皇情，黄帝是寒凉的药
  ents:
  - formula.gan_jiang_huang_qin_huang_lian_ren_shen_tang
  conf: 0.9
  asr: 黄芪/黄帝=黄芩
- type: diagnostic_rule
  s: 厥热胜复：热多厥少当愈，厥多热少病进——可验温阳药是否中的。
  seq:
  - 904
  - 906
  q: 如果冷的时间比热的时间多，这个病成是死啊，热的时间比冷的时间多，是不是生
  ents:
  - six_channel.jueyin
  conf: 0.9
