chapters:
- key: c04
  title: 当归四逆汤：手足厥寒脉细欲绝
  start_seq: 611
  summary: 手足厥寒脉细欲绝，当归四逆汤：桂枝汤去生姜加当归细辛通草。治末梢循环差、糖尿病截肢倾向、冻疮等。内有久寒者加吴茱萸生姜。
  clauses:
  - 351
  - 352
  topics:
  - formula.dang_gui_si_ni_tang
  - herb.dang_gui
  - herb.xi_xin
- key: c05
  title: 白虎、四逆与麻黄升麻汤
  start_seq: 571
  summary: 厥而有热、舌干脉大→白虎，勿误作寒投四逆越冷。大汗出热不去无他症→白虎；阳亡外脱→四逆。麻黄升麻汤寒热并用，治肝系吐脓血（争议条文）。干姜黄连黄芩人参汤治寒格吐利。
  clauses:
  - 350
  - 357
  - 359
  topics:
  - formula.bai_hu_tang
  - formula.si_ni_tang
  - formula.ma_huang_sheng_ma_tang
  - formula.gan_jiang_huang_qin_huang_lian_ren_shen_tang
- key: c06
  title: 厥热多少与下利预后
  start_seq: 904
  summary: 热多厥少病当愈，厥多热少病进。厥阴篇多言下利（肝上肺下大肠）。下利清谷手足厥脉微→通脉四逆/干姜附子；热利下重→白头翁等。
  clauses:
  - 341
  - 342
  - 366
  topics:
  - six_channel.jueyin
  - formula.tong_mai_si_ni_tang
