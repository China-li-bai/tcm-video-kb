  - formula.zhi_zi_shi_tang
- key: c08
  title: 吴茱萸汤与病退路径
  start_seq: 1163
  summary: 干呕头痛（颠顶）吐涎沫→吴茱萸汤。呕而发热示病退至少阳，小柴胡。厥阴→少阴→太阴→少阳为正向退路。
  clauses:
  - 378
  - 379
  topics:
  - formula.wu_zhu_yu_tang
  - formula.xiao_chai_hu_tang
- key: c09
  title: 伤寒差后：脾约与补中
  start_seq: 1207
  summary: 差后喜唾胸上有寒宜理中丸；腹满时痛为太阴，大实痛为阳明可下。讲者并述分消汤、补中益气类善后及厥阴禁妄下。
  clauses:
  - 396
  - 397
  - 398
  topics:
