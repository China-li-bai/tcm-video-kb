- key: c01
  title: 厥阴提纲：消渴气上撞心与蛔厥
  start_seq: 0
  summary: 少阴未治则阴寒入厥阴（肝与心包）。提纲：消渴、气上撞心、心中疼热、饥不欲食、食则吐蛔、下之利不止。寒热错杂；蛔厥与脏厥鉴别。欲解时从丑至卯。
  clauses:
  - 326
  - 327
  - 328
  - 329
  topics:
  - six_channel.jueyin
  - formula.wu_mei_wan
- key: c02
  title: 厥热胜复与禁汗下
  start_seq: 132
  summary: 先厥后发热而利者必自止；发热为阳回吉象。厥阴下利而反发汗则口伤烂赤——厥阴主利尿退热，禁汗禁下。脉微欲绝而躁无暂安为脏厥；常自吐蛔为蛔厥。
  clauses:
  - 331
  - 335
  - 338
  - 339
  topics:
  - six_channel.jueyin
- key: c03
  title: 乌梅丸：蛔厥与久利
  start_seq: 373
  summary: 乌梅丸酸苦辛并用安蛔止久利，亦治神经质逢考下利、寒热错杂心包热肠寒。当归至厥阴篇始见，非必要不用。
  clauses:
  - 338
  topics:
  - formula.wu_mei_wan
  - herb.wu_mei
  - herb.dang_gui
