kps:
- type: concept_definition
  s: 厥阴为肝与心包；少阴寒湿未治则传入。寒热错杂为本篇核心。
  seq:
  - 3
  - 9
  q: 少阴在没好的时候，这个寒湿阴寒症会进入厥阴进入肝脏里面去
  ents:
  - six_channel.jueyin
  conf: 0.95
- type: clause_interpretation
  s: 第326条提纲：消渴、气上撞心、心中疼热、饥不欲食、食则吐蛔、下之利不止。
  seq:
  - 34
  - 34
  q: 气上壮心，心中疼热，饥饿不欲食
  ents:
  - clause.shl.326
  - six_channel.jueyin
  conf: 0.9
  asr: 壮心=撞心；吐油=吐蛔；下肢夜=下之利
- type: diagnostic_rule
  s: 先厥后发热而利者必自止——发热示阳回；厥阴见热多为吉象。
  seq:
  - 249
  - 251
  q: 伤寒先缺，后后发热，先冷啊，后面发热下利必制止
  ents:
  - clause.shl.331
  - six_channel.jueyin
  conf: 0.85
  asr: 先缺=先厥
- type: contraindication
  s: 厥阴禁发汗：下利反汗则口伤烂赤。退热靠利尿，非汗非下。
  seq:
  - 326
  - 334
  q: 厥阴下肢和反发汗者比口腔好烂刺
  ents:
  - six_channel.jueyin
  conf: 0.9
  asr: 下肢=下利；比口腔烂=口伤烂赤
- type: diagnostic_rule
  s: 脏厥：脉微而厥、躁无暂安；蛔厥：常自吐蛔，静而复时烦。
  seq:
  - 365
  - 369
  q: 跟油厥不一样，好里面肚子有虫油厥呢，其人常治吐油
  ents:
  - clause.shl.338
  conf: 0.85
  asr: 油厥=蛔厥；吐油=吐蛔
- type: formula_indication
  s: 乌梅丸：安蛔、止久利；寒热错杂（肠寒心包热）、逢考下利等神经质泄泻亦常用。
  seq:
  - 373
  - 395
  q: 乌梅丸了又足，除了足去虫以外，最主要还有酒粒
  ents:
  - formula.wu_mei_wan
  conf: 0.9
  asr: 酒粒=久利
- type: herb_property
  s: 当归至厥阴篇始重用；仲景非必要不用当归，健康人不必补血。
  seq:
  - 457
  - 459
  q: 都看不到到厥阴病才看到的当归
  ents:
  - herb.dang_gui
  - six_channel.jueyin
  conf: 0.9
