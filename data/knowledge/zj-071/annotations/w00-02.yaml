- key: c02
  title: 阑尾穴与四花灸
  start_seq: 69
  summary: 急慢性阑尾炎在阑尾穴多有压痛点，可针；寒症可灸天枢关元中脘。兼及瘰疬/甲状腺可用周围灸法思路。
  clauses: []
  topics:
  - acupoint.ex_lan_wei
  - acupoint.st25
