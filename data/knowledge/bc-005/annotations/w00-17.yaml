chapters:
- key: c01
  title: 松脂琥珀与茯苓
  start_seq: 0
  summary: 松脂（ASR松子）为松树裂缝油脂，苦温；久埋成琥珀/蜜蜡。松下茯苓可循山猪掘迹采。松花祛风。强调中药止痛祛风湿，非仅吗啡掩盖。
  clauses: []
  topics:
  - herb.song_zhi
  - herb.fu_ling
- key: c02
  title: 槐枸杞侧柏酸枣五加
  start_seq: 94
  summary: 槐花寒凉，治痔疮肠风、清肝热。枸杞子与地骨皮同株异用。侧柏叶针形，润燥乌发常配当归。柏实黑白相间利小便兼补肾安神。酸枣仁养心安神。五加皮祛风湿强筋骨（勿与五加皮酒滥饮混）。
  clauses: []
  topics:
  - new.herb.huai_hua
  - herb.gou_qi
  - new.herb.ce_bai_ye
  - herb.suan_zao_ren
  - herb.wu_jia
- key: c03
  title: 麝香阿胶鹿角
  start_seq: 640
  summary: 麝香无孔不入，喷鼻或舌下化开吞药，不必同煎。鹿角纯阳，过近阴器反抑。阿胶补血力强，汤面起泡即离火，久煮力失。
  clauses: []
  topics:
  - herb.she_xiang
  - herb.e_jiao
  - new.herb.lu_jiao
- key: c04
  title: 莲芡胡麻与日常饮食
  start_seq: 1030
  summary: 莲子心叶藕蓬皆入药；生嚼莲子易凉胀，宜熟用；强利尿时加红枣护津。芡实莲子汤可常食。胡麻即芝麻类。本草意在日常可食防病；排水必兼祛湿。
  clauses: []
  topics:
  - new.herb.lian_zi
  - new.herb.qian_shi
  - herb.hu_ma
- key: c05
  title: 雄黄禁忌与能收能放
  start_seq: 1920
  summary: 雄黄解毒力强，治蜂蛇等；内服慎。有毒攻伐药须知收放，能放不能收非高手。硫磺等阳药南方医家多用。
  clauses: []
  topics:
  - herb.xiong_huang
  - herb.shi_liu_huang
