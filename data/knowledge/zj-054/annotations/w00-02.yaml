chapters:
- key: c01
  title: 肝经流注与肝藏象
  start_seq: 0
  summary: 胆经尽于窍阴后，丑时（1–3点）入肝经起于大趾侧。肝色青属木，开窍于目，主筋；面现青气、易怒、抽筋癫痫等多责肝。嘘字功可泻肝浊。肝病失眠常丑时醒。
  clauses: []
  topics:
  - meridian.lr
  - zangfu.gan
  - concept.wu_xing
- key: c02
  title: 大敦井木本穴
  start_seq: 189
  summary: 大敦在拇趾外侧（两趾间为肝、内侧隐白属脾），为井穴属木，即肝经本穴，虚实皆可取；针宜短小。
  clauses: []
  topics:
  - acupoint.lr1
  - acupoint.sp1
- key: c03
  title: 行间荥火与太冲
  start_seq: 270
  summary: 行间在一二跖骨交接后方，荥火穴，实热/急性肝炎黄疸等多取；太冲继上为肝经要穴。失眠丑时亦可取行间或太冲。
  clauses: []
  topics:
  - acupoint.lr2
  - acupoint.lr3
- key: c04
  title: 开四关合谷太冲
  start_seq: 306
  summary: 左右合谷与太冲合称四关；合谷主气、太冲主血，同针则气血兼顾。脚部可诊太冲脉，另有冲阳等脉。
  clauses: []
  topics:
  - acupoint.li4
  - acupoint.lr3
