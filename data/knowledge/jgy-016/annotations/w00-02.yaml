kps:
- type: clinical_tip
  s: 金匮黄疸篇黄瘅可读丹或淡，即黄色病；黄汗并非真正发黄之病。
  seq: [5]
  q: 黄色的
  ents: [disease.huang_dan, syndrome.huang_han]
  conf: 0.95
- type: diagnostic_rule
  s: 黄疸分阳黄与阴黄：阳黄鲜亮如橘，约十日可愈；阴黄晦暗，较难治。
  seq: [8]
  q: 阳黄
  ents: [disease.huang_dan, new.pattern.yang_huang, new.pattern.yin_huang]
  conf: 0.95
- type: pathomechanism
  s: 黄疸总由湿积：外因汗出不透湿留体内；内因脾湿太盛致胃速脾缓、胆汁逆行而周身发黄。
  seq: [46]
  q: 表证
  ents: [disease.huang_dan, zangfu.pi]
  conf: 0.9
  asr: 卖腐者=脉浮者；诗/丝/皮湿=湿
- type: clinical_tip
  s: 素有停饮湿盛者，太阳中风服桂枝汤后反可发黄疸，因汗不得透彻、表邪与内湿胶结。
  seq: [63]
  q: 发黄疸
  ents: [formula.gui_zhi_tang, disease.huang_dan, syndrome.huang_han]
  conf: 0.9
- type: diagnostic_rule
  s: 脾病（含胰）腹水多无小便（土克水）；肝病腹水小便仍通（木克土尚未克水），可据此判病在脾或在肝。
  seq: [76]
  q: 小便
  ents: [zangfu.pi, zangfu.gan, zangfu.shen]
  conf: 0.9
- type: pathomechanism
  s: 脾胃相表里：胃扩脾收交替；胃太快而脾太慢则发黄，内外因皆归于脾湿太盛。
  seq: [104]
  q: 表里
  ents: [zangfu.pi, zangfu.wei, concept.biao_li, disease.huang_dan]
  conf: 0.9
- type: diagnostic_rule
  s: 女劳疸：额黑、微汗出、手足心热、薄暮即发、小便自利不能约束，腹如水状；经云不治，临床仍当尽力救治。
  seq: [165]
  q: 女劳
  ents: [syndrome.nv_lao_dan]
  conf: 0.95
  asr: 女劳禅=女劳疸；薄目=薄暮；汉出=汗出
- type: clinical_tip
  s: 酒疸多见于嗜酒：心中（胃）懊侬而热、不能食、常呕吐；酒性寒入胃反促蠕动而生热象。
  seq: [202]
  q: 发黄
  ents: [syndrome.jiu_dan, zangfu.wei]
  conf: 0.9
  asr: 九单/酒痰=酒疸；心中=胃
- type: formula_indication
  s: 阳明病但热不寒：经证用白虎汤，腑证用承气汤类。
  seq: [228]
  q: 白虎汤
  ents: [syndrome.yang_ming_bing, formula.bai_hu_tang, formula.cheng_qi_tang]
  conf: 0.95
- type: diagnostic_rule
  s: 黄疸必见小便不利；酒客心中热、脚下热而小便不利，为酒湿寒积及脾之征。
  seq: [246]
  q: 小便不利
  ents: [disease.huang_dan, syndrome.jiu_dan, symptom.xiao_bian_bu_li]
  conf: 0.95
  asr: 九黄氮=酒黄疸
- type: diagnostic_rule
  s: 酒疸脉浮病在上用吐法，脉沉病在下用下法。
  seq: [262]
  q: 脉浮
  ents: [syndrome.jiu_dan, pulse.fu, pulse.chen, method.tu]
  conf: 0.9
- type: formula_indication
  s: 酒疸危重（身黑）用硝石矾石散，等分火煅为散，大麦粥送服；以小便正黄、大便正黑为湿热兼瘀之据。
  seq: [294]
  q: 消石
  ents: [formula.xiao_shi_fan_shi_san, herb.xiao_shi, herb.fan_shi, syndrome.jiu_dan]
  conf: 0.9
  asr: 消石/消失=硝石；凡事/凡食=矾石；反思展=矾石散
- type: formula_indication
  s: 酒疸心中懊侬未发黄用栀子大黄汤；已发黄用茵陈蒿汤。栀子清肝胆热，豆豉清胃热，大黄硝石祛湿通便。
  seq: [305]
  q: 栀子
  ents: [formula.zhi_zi_da_huang_tang, formula.yin_chen_hao_tang, herb.zhi_zi, syndrome.jiu_dan]
  conf: 0.95
  asr: 栀子大汤=栀子大黄汤；阴陈老汤=茵陈蒿汤；阴神=茵陈
- type: treatment_principle
  s: 诸病黄家当利其小便；脉浮用桂枝加黄芪汤取汗祛湿，大便不通用栀子大黄急下则黄退胆疏。
  seq: [341]
  q: 黄芪
  ents: [formula.gui_zhi_jia_huang_qi_tang, formula.zhi_zi_da_huang_tang, disease.huang_dan, herb.huang_qi]
  conf: 0.95
  asr: 皇家=黄家；贵姿加黄芪=桂枝加黄芪
- type: formula_indication
  s: 猪膏发煎：湿久化燥见大便黑、肌肤甲错（如蛇蜕）时，以猪油润燥、乱发（血之余）炸入活血攻瘀；经方另用于妇人阴吹。
  seq: [373]
  q: 大便黑
  ents: [formula.zhu_gao_fa_jian, herb.zhu_gao]
  conf: 0.9
  asr: 诸膏法经/珠高发经/猪羔法尖=猪膏发煎
