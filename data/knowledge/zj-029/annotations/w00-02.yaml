- key: c01
  title: 胸旁脾经穴与乳房硬块取经
  start_seq: 0
  summary: 天溪等胸旁穴宜旁开约五分刺入肋间隙，勿直对肋骨。乳房硬块须辨所在经络（脾/胃/心包/心/肺）取穴，无单一特效穴。云门—中府属肺线，周荣—胸乡属脾线。初期硬块灸优于针，可教患者自灸按摩。
  clauses: []
  topics:
  - acupoint.sp18
  - meridian.sp
  - acupoint.sp20
- key: c02
  title: 大包为大络
  start_seq: 82
  summary: 大包在腋下约六寸（极泉下六寸），为脾之大络，统诸阴经阳经络脉，虚实皆可治；亦用于手挛不能握等。
  clauses: []
  topics:
  - acupoint.sp21
  - concept.luo_xue
