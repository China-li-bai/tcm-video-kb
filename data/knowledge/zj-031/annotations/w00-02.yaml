- key: c01
  title: 心与小肠表里及少泽前谷
  start_seq: 0
  summary: 心移热于小肠，二者表里。少泽为小肠井穴，常点刺放血。前谷为荥（水），握拳横纹头取之；治乳汁不足，亦可用于未时（13–15时）精神不振，穴较痛。
  clauses: []
  topics:
  - zangfu.xin
  - zangfu.xiao_chang
  - acupoint.si1
  - acupoint.si2
- key: c02
  title: 后溪养老
  start_seq: 126
  summary: 后溪为输穴，通督脉，亦为小肠母穴，治督脉/脊痛及小肠虚证、肩痛。养老为郄，翻腕显骨缝取穴，浅刺半寸；治目不明、白内障、近视；养老透间使治肘不能拧巾。
  clauses: []
  topics:
  - acupoint.si3
  - acupoint.si6
  - meridian.gv
