chapters:
- key: c01
  title: 胸痹心痛概说·瓜蒌薤白与人参汤
  start_seq: 0
  summary: 金匮第九篇胸痹心痛短气。经方可速治心脏病。实证胸痹用瓜蒌薤白白酒/半夏及枳实薤白桂枝汤；虚证胸闷用人参汤（理中类），肠胃致胸闷需辨虚实。
  clauses: []
  topics:
  - syndrome.xiong_bi
  - formula.gua_lou_xie_bai_bai_jiu_tang
  - formula.ren_shen_tang
- key: c02
  title: 茯苓杏仁甘草汤·缓痛气塞
  start_seq: 126
  summary: 胸中气塞短气缓痛用茯苓杏仁甘草汤；与麻杏石甘等肺方鉴别。虚实胸闷剂量可等量人参甘草活用。
  clauses: []
  topics:
  - formula.fu_ling_xing_ren_gan_cao_tang
- key: c03
  title: 心包炎感·桂枝生姜枳实与乌头
  start_seq: 250
  summary: 心中痞、心悬似心包炎用桂枝生姜枳实汤行胸阳利水。心痛剧者乌头赤石脂丸；乌头/乌梅传抄之辨。
  clauses: []
  topics:
  - formula.gui_zhi_sheng_jiang_zhi_shi_tang
  - formula.wu_tou_chi_shi_zhi_wan
