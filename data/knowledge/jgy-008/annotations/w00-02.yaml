chapters:
- key: c01
  title: 肺痿成因·津伤与误滋阴
  start_seq: 0
  summary: 金匮第七篇肺痿肺痈咳嗽上气。肺痿为肺叶萎；多因汗吐消渴便难下利等津液亡失，肺与大肠表里。寸口数、咳吐浊唾为热痿；误以温病阴虚法治咳可造肺痿。
  clauses: []
  topics:
  - syndrome.fei_wei
  - concept.jin_ye
- key: c02
  title: 肺中冷·甘草干姜汤
  start_seq: 130
  summary: 吐涎沫清稀非浓痰、不渴、小便数属肺中冷，甘草干姜汤温之；口燥渴则属消渴分上中下三消。
  clauses: []
  topics:
  - formula.gan_cao_gan_jiang_tang
  - syndrome.fei_wei
- key: c03
  title: 肺痈咳嗽上气与麦门冬汤
  start_seq: 272
  summary: 肺气肿等久咳方有麻黄类、泽漆汤等；篇后麦门冬汤治火逆上气等。
  clauses: []
  topics:
  - formula.mai_men_dong_tang
  - formula.ma_huang_tang
