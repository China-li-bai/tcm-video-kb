- key: c01
  title: 皮肤病五大穴
  start_seq: 0
  summary: 针灸治皮肤病（过敏、风疹等）与用药不同，不必发表药；有皮病/皮痒五大穴为必取，先止痒，对诸皮病多有效。内经重针少药。
  clauses: []
  topics:
  - method.zhen_jiu
- key: c02
  title: 膝五针鹤顶
  start_seq: 76
  summary: 膝五针治诸膝关节炎/痛肿：鹤顶（髌上肌肉交界）、膝眼、阴陵泉、阳陵泉等；肿甚可用长针与雀啄术。
  clauses: []
  topics:
  - acupoint.ex_he_ding
  - acupoint.gb34
  - acupoint.sp9
