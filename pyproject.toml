[project]
name = "tcm-video-kb"
version = "0.1.0"
description = "倪海厦中医讲座视频知识库 — monorepo workspace"
requires-python = ">=3.11"
dependencies = [
  "tcmkb-core",
  "tcmkb-lexicon",
  "tcmkb-ingest",
  "tcmkb-graph",
  "tcmkb-api[server]",
]

[project.optional-dependencies]
# `uv sync --extra asr` installs FunASR + torch CPU into the workspace .venv
asr = ["tcmkb-ingest[asr]"]

[tool.uv.workspace]
members = [
  "packages/tcmkb_core",
  "packages/tcmkb_lexicon",
  "packages/tcmkb_ingest",
  "packages/tcmkb_graph",
  "services/api",
]

[tool.uv.sources]
tcmkb-core = { workspace = true }
tcmkb-lexicon = { workspace = true }
tcmkb-ingest = { workspace = true }
tcmkb-graph = { workspace = true }
tcmkb-api = { workspace = true }
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "packages/tcmkb_core/src",
  "packages/tcmkb_lexicon/src",
  "packages/tcmkb_ingest/src",
  "packages/tcmkb_graph/src",
  "services/api/src",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.27",
]
