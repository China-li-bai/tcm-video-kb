clauses:
- id: clause.shl.001
  'no': 1
  section: 辨太阳病脉证并治上
  text: 太阳之为病，脉浮，头项强痛而恶寒。
  text_trad: 太陽之為病，脈浮，頭項強痛而惡寒。
  entities: [six_channel.taiyang]
- id: clause.shl.002
  'no': 2
  section: 辨太阳病脉证并治上
  text: 太阳病，发热，汗出，恶风，脉缓者，名为中风。
  text_trad: 太陽病，發熱，汗出，惡風，脈緩者，名為中風。
  entities: [six_channel.taiyang]
- id: clause.shl.003
  'no': 3
  section: 辨太阳病脉证并治上
  text: 太阳病，或已发热，或未发热，必恶寒，体痛，呕逆，脉阴阳俱紧者，名为伤寒。
  text_trad: 太陽病，或已發熱，或未發熱，必惡寒，體痛，嘔逆，脈陰陽俱緊者，名為傷寒。
  entities: [six_channel.taiyang]
- id: clause.shl.004
  'no': 4
  section: 辨太阳病脉证并治上
  text: 伤寒一日，太阳受之，脉若静者，为不传。颇欲吐，若躁烦，脉数急者，为传也。
  text_trad: 傷寒一日，太陽受之，脈若靜者，為不傳。頗欲吐，若躁煩，脈數急者，為傳也。
  entities: []
- id: clause.shl.005
  'no': 5
  section: 辨太阳病脉证并治上
  text: 伤寒二三日，阳明少阳证不见者，为不传也。
  text_trad: 傷寒二三日，陽明少陽證不見者，為不傳也。
  entities: []
- id: clause.shl.006
  'no': 6
  section: 辨太阳病脉证并治上
  text: 太阳病，发热而渴，不恶寒者，为温病。若发汗已，身灼热者，名曰风温。风温为病，脉阴阳俱浮，自汗出，身重，多眠睡，鼻息必鼾，语言难出。若被下者，小便不利，直视失溲，若被火者，微发黄色，剧则如惊痫，时瘈疭；若火熏之，一逆尚引日，再逆促命期。
  text_trad: 太陽病，發熱而渴，不惡寒者，為溫病。若發汗已，身灼熱者，名曰風溫。風溫為病，脈陰陽俱浮，自汗出，身重，多眠睡，鼻息必鼾，語言難出。若被下者，小便不利，直視失溲，若被火者，微發黃色，劇則如驚癇，時瘈瘲；若火熏之，一逆尚引日，再逆促命期。
  entities: [six_channel.taiyang]
- id: clause.shl.007
  'no': 7
  section: 辨太阳病脉证并治上
  text: 病有发热恶寒者，发于阳也；无热恶寒者，发于阴也。发于阳七日愈，发于阴六日愈。以阳数七，阴数六故也。
  text_trad: 病有發熱惡寒者，發於陽也；無熱惡寒者，發於陰也。發於陽七日愈，發於陰六日愈。以陽數七，陰數六故也。
  entities: []
- id: clause.shl.008
  'no': 8
  section: 辨太阳病脉证并治上
  text: 太阳病，头痛至七日以上自愈者，以行其经尽故也。若欲作再经者，针足阳明，使经不传则愈。
  text_trad: 太陽病，頭痛至七日以上自愈者，以行其經盡故也。若欲作再經者，針足陽明，使經不傳則愈。
  entities: [six_channel.taiyang]
- id: clause.shl.009
  'no': 9
  section: 辨太阳病脉证并治上
  text: 太阳病，欲解时，从巳至未上。
  text_trad: 太陽病，欲解時，從巳至未上。
  entities: [six_channel.taiyang]
- id: clause.shl.010
  'no': 10
  section: 辨太阳病脉证并治上
  text: 风家，表解而不了了者，十二日愈。
  text_trad: 風家，表解而不了了者，十二日愈。
  entities: []
- id: clause.shl.011
  'no': 11
  section: 辨太阳病脉证并治上
  text: 病人身大热，反欲得衣者，热在皮肤，寒在骨髓也；身大寒，反不欲近衣者，寒在皮肤，热在骨髓也。
  text_trad: 病人身大熱，反欲得衣者，熱在皮膚，寒在骨髓也；身大寒，反不欲近衣者，寒在皮膚，熱在骨髓也。
  entities: []
- id: clause.shl.012
  'no': 12
  section: 辨太阳病脉证并治上
  text: 太阳中风，阳浮而阴弱，阳浮者，热自发，阴弱者，汗自出。啬啬恶寒，淅淅恶风，翕翕发热，鼻鸣干呕者，桂枝汤主之。
  text_trad: 太陽中風，陽浮而陰弱，陽浮者，熱自發，陰弱者，汗自出。嗇嗇惡寒，淅淅惡風，翕翕發熱，鼻鳴乾嘔者，桂枝湯主之。
  entities: [formula.gui_zhi_tang, six_channel.taiyang]
- id: clause.shl.013
  'no': 13
  section: 辨太阳病脉证并治上
  text: 太阳病，头痛，发热，汗出，恶风，桂枝汤主之。
  text_trad: 太陽病，頭痛，發熱，汗出，惡風，桂枝湯主之。
  entities: [formula.gui_zhi_tang, six_channel.taiyang]
- id: clause.shl.014
  'no': 14
  section: 辨太阳病脉证并治上
  text: 太阳病，项背强几几，反汗出恶风者，桂枝加葛根汤主之。
  text_trad: 太陽病，項背強几几，反汗出惡風者，桂枝加葛根湯主之。
  entities: [formula.gui_zhi_jia_ge_gen_tang, six_channel.taiyang]
- id: clause.shl.015
  'no': 15
  section: 辨太阳病脉证并治上
  text: 太阳病，下之后，其气上冲者，可与桂枝汤，方用前法。若不上冲者，不得与之。
  text_trad: 太陽病，下之後，其氣上衝者，可與桂枝湯，方用前法。若不上衝者，不得與之。
  entities: [formula.gui_zhi_tang, six_channel.taiyang]
- id: clause.shl.016
  'no': 16
  section: 辨太阳病脉证并治上
  text: 太阳病三日，已发汗，若吐、若下、若温针，仍不解者，此为坏病，桂枝不中与之也。观其脉证，知犯何逆，随证治之。桂枝本为解肌，若其人脉浮紧，发热汗不出者，不可与之也，常须识此，勿令误也。
  text_trad: 太陽病三日，已發汗，若吐、若下、若溫針，仍不解者，此為壞病，桂枝不中與之也。觀其脈證，知犯何逆，隨證治之。桂枝本為解肌，若其人脈浮緊，發熱汗不出者，不可與之也，常須識此，勿令誤也。
  entities: [six_channel.taiyang]
- id: clause.shl.017
  'no': 17
  section: 辨太阳病脉证并治上
  text: 若酒客病，不可与桂枝汤，得之则呕，以酒客不喜甘故也。
  text_trad: 若酒客病，不可與桂枝湯，得之則嘔，以酒客不喜甘故也。
  entities: [formula.gui_zhi_tang]
- id: clause.shl.018
  'no': 18
  section: 辨太阳病脉证并治上
  text: 喘家作，桂枝汤加厚朴、杏子佳。
  text_trad: 喘家作，桂枝湯加厚朴、杏子佳。
  entities: [formula.gui_zhi_tang]
- id: clause.shl.019
  'no': 19
  section: 辨太阳病脉证并治上
  text: 凡服桂枝汤吐者，其后必吐脓血也。
  text_trad: 凡服桂枝湯吐者，其後必吐膿血也。
  entities: [formula.gui_zhi_tang]
- id: clause.shl.020
  'no': 20
  section: 辨太阳病脉证并治上
  text: 太阳病，发汗，遂漏不止，其人恶风，小便难，四肢微急，难以屈伸者，桂枝加附子汤主之。
  text_trad: 太陽病，發汗，遂漏不止，其人惡風，小便難，四肢微急，難以屈伸者，桂枝加附子湯主之。
  entities: [formula.gui_zhi_jia_fu_zi_tang, six_channel.taiyang]
- id: clause.shl.021
  'no': 21
  section: 辨太阳病脉证并治上
  text: 太阳病，下之后，脉促胸满者，桂枝去芍药汤主之。
  text_trad: 太陽病，下之後，脈促胸滿者，桂枝去芍藥湯主之。
  entities: [formula.gui_zhi_qu_shao_yao_tang, six_channel.taiyang]
- id: clause.shl.022
  'no': 22
  section: 辨太阳病脉证并治上
  text: 若微寒者，桂枝去芍药加附子汤主之。
  text_trad: 若微寒者，桂枝去芍藥加附子湯主之。
  entities: [formula.gui_zhi_qu_shao_yao_jia_fu_zi_tang]
- id: clause.shl.023
  'no': 23
  section: 辨太阳病脉证并治上
  text: 太阳病，得之八九日，如疟状，发热恶寒，热多寒少，其人不呕，清便欲自可，一日二三度发。脉微缓者，为欲愈也；脉微而恶寒者，此阴阳俱虚，不可更发汗更下更吐也；面色反有热色者，未欲解也，以其不能得小汗出，身必痒，宜桂枝麻黄各半汤。
  text_trad: 太陽病，得之八九日，如瘧狀，發熱惡寒，熱多寒少，其人不嘔，清便欲自可，一日二三度發。脈微緩者，為欲愈也；脈微而惡寒者，此陰陽俱虛，不可更發汗更下更吐也；面色反有熱色者，未欲解也，以其不能得小汗出，身必癢，宜桂枝麻黃各半湯。
  entities: [formula.gui_zhi_ma_huang_ge_ban_tang, six_channel.taiyang]
- id: clause.shl.024
  'no': 24
  section: 辨太阳病脉证并治上
  text: 太阳病，初服桂枝汤，反烦不解者，先刺风池、风府，却与桂枝汤则愈。
  text_trad: 太陽病，初服桂枝湯，反煩不解者，先刺風池、風府，卻與桂枝湯則愈。
  entities: [formula.gui_zhi_tang, six_channel.taiyang]
- id: clause.shl.025
  'no': 25
  section: 辨太阳病脉证并治上
  text: 服桂枝汤，大汗出，脉洪大者，与桂枝汤，如前法。若形似疟，一日再发者，汗出必解，宜桂枝二麻黄一汤。
  text_trad: 服桂枝湯，大汗出，脈洪大者，與桂枝湯，如前法。若形似瘧，一日再發者，汗出必解，宜桂枝二麻黃一湯。
  entities: [formula.gui_zhi_er_ma_huang_yi_tang, formula.gui_zhi_tang]
- id: clause.shl.026
  'no': 26
  section: 辨太阳病脉证并治上
  text: 服桂枝汤，大汗出后，大烦渴不解，脉洪大者，白虎加人参汤主之。
  text_trad: 服桂枝湯，大汗出後，大煩渴不解，脈洪大者，白虎加人參湯主之。
  entities: [formula.bai_hu_jia_ren_shen_tang, formula.gui_zhi_tang]
- id: clause.shl.027
  'no': 27
  section: 辨太阳病脉证并治上
  text: 太阳病，发热恶寒，热多寒少，脉微弱者，此无阳也，不可发汗，宜桂枝二越婢一汤。
  text_trad: 太陽病，發熱惡寒，熱多寒少，脈微弱者，此無陽也，不可發汗，宜桂枝二越婢一湯。
  entities: [formula.gui_zhi_er_yue_bi_yi_tang, six_channel.taiyang]
- id: clause.shl.028
  'no': 28
  section: 辨太阳病脉证并治上
  text: 服桂枝汤，或下之，仍头项强痛，翕翕发热，无汗，心下满微痛，小便不利者，桂枝去桂加茯苓白术汤主之。
  text_trad: 服桂枝湯，或下之，仍頭項強痛，翕翕發熱，無汗，心下滿微痛，小便不利者，桂枝去桂加茯苓白朮湯主之。
  entities: [formula.gui_zhi_qu_gui_jia_fu_ling_bai_zhu_tang, formula.gui_zhi_tang]
- id: clause.shl.029
  'no': 29
  section: 辨太阳病脉证并治上
  text: 伤寒脉浮，自汗出，小便数，心烦，微恶寒，脚挛急，反与桂枝欲攻其表，此误也。得之便厥，咽中干，烦躁吐逆者，作甘草干姜汤与之，以复其阳；若厥愈足温者，更作芍药甘草汤与之，其脚即伸。若胃气不和，谵语者，少与调胃承气汤；若重发汗，复加烧针者，四逆汤主之。
  text_trad: 傷寒脈浮，自汗出，小便數，心煩，微惡寒，腳攣急，反與桂枝欲攻其表，此誤也。得之便厥，咽中乾，煩躁吐逆者，作甘草乾薑湯與之，以復其陽；若厥愈足溫者，更作芍藥甘草湯與之，其腳即伸。若胃氣不和，譫語者，少與調胃承氣湯；若重發汗，復加燒針者，四逆湯主之。
  entities: [formula.gan_cao_gan_jiang_tang, formula.shao_yao_gan_cao_tang, formula.diao_wei_cheng_qi_tang, formula.si_ni_tang]
- id: clause.shl.030
  'no': 30
  section: 辨太阳病脉证并治上
  text: 问曰：证象阳旦，按法治之而增剧，厥逆，咽中干，两胫拘急而谵语。师曰：言夜半手足当温，两脚当伸。后如师言。何以知此？答曰：寸口脉浮而大，浮为风，大为虚，风则生微热，虚则两胫挛，病证象桂枝，因加附子参其间，增桂令汗出，附子温经，亡阳故也。厥逆，咽中干，烦躁，阳明内结，谵语烦乱，更饮甘草干姜汤。夜半阳气还，两足当热，胫尚微拘急，重与芍药甘草汤，尔乃胫伸。以承气汤微溏，则止其谵语，故知病可愈。
  text_trad: 問曰：證象陽旦，按法治之而增劇，厥逆，咽中乾，兩脛拘急而譫語。師曰：言夜半手足當溫，兩腳當伸。後如師言。何以知此？答曰：寸口脈浮而大，浮為風，大為虛，風則生微熱，虛則兩脛攣，病證象桂枝，因加附子參其間，增桂令汗出，附子溫經，亡陽故也。厥逆，咽中乾，煩躁，陽明內結，譫語煩亂，更飲甘草乾薑湯。夜半陽氣還，兩足當熱，脛尚微拘急，重與芍藥甘草湯，爾乃脛伸。以承氣湯微溏，則止其譫語，故知病可愈。
  entities: [formula.gan_cao_gan_jiang_tang, formula.shao_yao_gan_cao_tang, formula.cheng_qi_tang]
- id: clause.shl.031
  'no': 31
  section: 辨太阳病脉证并治中
  text: 太阳病，项背强几几，无汗恶风，葛根汤主之。
  text_trad: 太陽病，項背強几几，無汗惡風，葛根湯主之。
  entities: [formula.ge_gen_tang, six_channel.taiyang]
- id: clause.shl.032
  'no': 32
  section: 辨太阳病脉证并治中
  text: 太阳与阳明合病者，必自下利，葛根汤主之。
  text_trad: 太陽與陽明合病者，必自下利，葛根湯主之。
  entities: [formula.ge_gen_tang]
- id: clause.shl.033
  'no': 33
  section: 辨太阳病脉证并治中
  text: 太阳与阳明合病，不下利，但呕者，葛根加半夏汤主之。
  text_trad: 太陽與陽明合病，不下利，但嘔者，葛根加半夏湯主之。
  entities: [formula.ge_gen_jia_ban_xia_tang]
- id: clause.shl.034
  'no': 34
  section: 辨太阳病脉证并治中
  text: 太阳病，桂枝证，医反下之，利遂不止，脉促者，表未解也；喘而汗出者，葛根黄芩黄连汤主之。
  text_trad: 太陽病，桂枝證，醫反下之，利遂不止，脈促者，表未解也；喘而汗出者，葛根黃芩黃連湯主之。
  entities: [formula.ge_gen_huang_qin_huang_lian_tang, six_channel.taiyang]
- id: clause.shl.035
  'no': 35
  section: 辨太阳病脉证并治中
  text: 太阳病，头痛，发热，身疼，腰痛，骨节疼痛，恶风，无汗而喘者，麻黄汤主之。
  text_trad: 太陽病，頭痛，發熱，身疼，腰痛，骨節疼痛，惡風，無汗而喘者，麻黃湯主之。
  entities: [formula.ma_huang_tang, six_channel.taiyang]
- id: clause.shl.036
  'no': 36
  section: 辨太阳病脉证并治中
  text: 太阳与阳明合病，喘而胸满者，不可下，宜麻黄汤。
  text_trad: 太陽與陽明合病，喘而胸滿者，不可下，宜麻黃湯。
  entities: [formula.ma_huang_tang]
- id: clause.shl.037
  'no': 37
  section: 辨太阳病脉证并治中
  text: 太阳病，十日已去，脉浮细而嗜卧者，外已解也。设胸满胁痛者，与小柴胡汤。脉但浮者，与麻黄汤。
  text_trad: 太陽病，十日已去，脈浮細而嗜臥者，外已解也。設胸滿脅痛者，與小柴胡湯。脈但浮者，與麻黃湯。
  entities: [formula.xiao_chai_hu_tang, formula.ma_huang_tang, six_channel.taiyang]
- id: clause.shl.038
  'no': 38
  section: 辨太阳病脉证并治中
  text: 太阳中风，脉浮紧，发热恶寒，身疼痛，不汗出而烦躁者，大青龙汤主之。若脉微弱，汗出恶风者，不可服之，服之则厥逆，筋惕肉𥆧，此为逆也。
  text_trad: 太陽中風，脈浮緊，發熱惡寒，身疼痛，不汗出而煩躁者，大青龍湯主之。若脈微弱，汗出惡風者，不可服之，服之則厥逆，筋惕肉瞤，此為逆也。
  entities: [formula.da_qing_long_tang, six_channel.taiyang]
- id: clause.shl.039
  'no': 39
  section: 辨太阳病脉证并治中
  text: 伤寒脉浮缓，身不疼，但重，乍有轻时，无少阴证者，大青龙汤发之。
  text_trad: 傷寒脈浮緩，身不疼，但重，乍有輕時，無少陰證者，大青龍湯發之。
  entities: [formula.da_qing_long_tang]
- id: clause.shl.040
  'no': 40
  section: 辨太阳病脉证并治中
  text: 伤寒表不解，心下有水气，干呕，发热而咳，或渴，或利，或噎，或小便不利，少腹满，或喘者，小青龙汤主之。
  text_trad: 傷寒表不解，心下有水氣，乾嘔，發熱而咳，或渴，或利，或噎，或小便不利，少腹滿，或喘者，小青龍湯主之。
  entities: [formula.xiao_qing_long_tang]
- id: clause.shl.041
  'no': 41
  section: 辨太阳病脉证并治中
  text: 伤寒心下有水气，咳而微喘，发热不渴。服汤已，渴者，此寒去欲解也。小青龙汤主之。
  text_trad: 傷寒心下有水氣，咳而微喘，發熱不渴。服湯已，渴者，此寒去欲解也。小青龍湯主之。
  entities: [formula.xiao_qing_long_tang]
- id: clause.shl.042
  'no': 42
  section: 辨太阳病脉证并治中
  text: 太阳病，外证未解，脉浮弱者，当以汗解，宜桂枝汤。
  text_trad: 太陽病，外證未解，脈浮弱者，當以汗解，宜桂枝湯。
  entities: [formula.gui_zhi_tang, six_channel.taiyang]
- id: clause.shl.043
  'no': 43
  section: 辨太阳病脉证并治中
  text: 太阳病，下之微喘者，表未解故也，桂枝加厚朴杏子汤主之。
  text_trad: 太陽病，下之微喘者，表未解故也，桂枝加厚朴杏子湯主之。
  entities: [formula.gui_zhi_jia_hou_po_xing_zi_tang, six_channel.taiyang]
- id: clause.shl.044
  'no': 44
  section: 辨太阳病脉证并治中
  text: 太阳病，外证未解，不可下也，下之为逆，欲解外者，宜桂枝汤。
  text_trad: 太陽病，外證未解，不可下也，下之為逆，欲解外者，宜桂枝湯。
  entities: [formula.gui_zhi_tang, six_channel.taiyang]
- id: clause.shl.045
  'no': 45
  section: 辨太阳病脉证并治中
  text: 太阳病，先发汗不解，而复下之，脉浮者不愈。浮为在外，而反下之，故令不愈，今脉浮，故知在外，当须解外则愈，宜桂枝汤。
  text_trad: 太陽病，先發汗不解，而復下之，脈浮者不愈。浮為在外，而反下之，故令不愈，今脈浮，故知在外，當須解外則愈，宜桂枝湯。
  entities: [formula.gui_zhi_tang, six_channel.taiyang]
- id: clause.shl.046
  'no': 46
  section: 辨太阳病脉证并治中
  text: 太阳病，脉浮紧，无汗，发热，身疼痛，八九日不解，表证仍在，此当发其汗。服药已微除，其人发烦目瞑，剧者必衄，衄乃解，所以然者，阳气重故也，麻黄汤主之。
  text_trad: 太陽病，脈浮緊，無汗，發熱，身疼痛，八九日不解，表證仍在，此當發其汗。服藥已微除，其人發煩目瞑，劇者必衄，衄乃解，所以然者，陽氣重故也，麻黃湯主之。
  entities: [formula.ma_huang_tang, six_channel.taiyang]
- id: clause.shl.047
  'no': 47
  section: 辨太阳病脉证并治中
  text: 太阳病，脉浮紧，发热，身无汗，自衄者愈。
  text_trad: 太陽病，脈浮緊，發熱，身無汗，自衄者愈。
  entities: [six_channel.taiyang]
- id: clause.shl.048
  'no': 48
  section: 辨太阳病脉证并治中
  text: 二阳并病，太阳初得病时，发其汗，汗先出不彻，因转属阳明，续自微汗出，不恶寒。若太阳病证不罢者，不可下，下之为逆，如此可小发汗。设面色缘缘正赤者，阳气怫郁在表，当解之，熏之。若发汗不彻，不足言，阳气怫郁不得越，当汗不汗，其人躁烦，不知痛处，乍在腹中，乍在四肢，按之不可得，其人短气但坐，以汗出不彻故也。更发汗则愈，何以知汗出不彻？以脉涩故知也。
  text_trad: 二陽併病，太陽初得病時，發其汗，汗先出不徹，因轉屬陽明，續自微汗出，不惡寒。若太陽病證不罷者，不可下，下之為逆，如此可小發汗。設面色緣緣正赤者，陽氣怫鬱在表，當解之，熏之。若發汗不徹，不足言，陽氣怫鬱不得越，當汗不汗，其人躁煩，不知痛處，乍在腹中，乍在四肢，按之不可得，其人短氣但坐，以汗出不徹故也。更發汗則愈，何以知汗出不徹？以脈澀故知也。
  entities: [six_channel.taiyang]
- id: clause.shl.049
  'no': 49
  section: 辨太阳病脉证并治中
  text: 脉浮数者，法当汗出而愈。若下之，身重心悸者，不可发汗，当自汗出乃解。所以然者，尺中脉微，此里虚。须表里实，津液自和，便自汗出愈。
  text_trad: 脈浮數者，法當汗出而愈。若下之，身重心悸者，不可發汗，當自汗出乃解。所以然者，尺中脈微，此裏虛。須表裏實，津液自和，便自汗出愈。
  entities: []
- id: clause.shl.050
  'no': 50
  section: 辨太阳病脉证并治中
  text: 脉浮紧者，法当身疼痛，宜以汗解之，假令尺中迟者，不可发汗，何以知然？以荣气不足，血少故也。
  text_trad: 脈浮緊者，法當身疼痛，宜以汗解之，假令尺中遲者，不可發汗，何以知然？以榮氣不足，血少故也。
  entities: []
- id: clause.shl.051
  'no': 51
  section: 辨太阳病脉证并治中
  text: 脉浮者，病在表，可发汗，宜麻黄汤。
  text_trad: 脈浮者，病在表，可發汗，宜麻黃湯。
  entities: [formula.ma_huang_tang]
- id: clause.shl.052
  'no': 52
  section: 辨太阳病脉证并治中
  text: 脉浮而数者，可发汗，宜麻黄汤。
  text_trad: 脈浮而數者，可發汗，宜麻黃湯。
  entities: [formula.ma_huang_tang]
- id: clause.shl.053
  'no': 53
  section: 辨太阳病脉证并治中
  text: 病常自汗出者，此为荣气和，荣气和者，外不谐，以卫气不共荣气谐和故尔，以荣行脉中，卫行脉外，复发其汗，荣卫和则愈，宜桂枝汤。
  text_trad: 病常自汗出者，此為榮氣和，榮氣和者，外不諧，以衛氣不共榮氣諧和故爾，以榮行脈中，衛行脈外，復發其汗，榮衛和則愈，宜桂枝湯。
  entities: [formula.gui_zhi_tang]
- id: clause.shl.054
  'no': 54
  section: 辨太阳病脉证并治中
  text: 病人藏无他病，时发热、自汗出而不愈者，此卫气不和也，先其时发汗则愈，宜桂枝汤。
  text_trad: 病人藏無他病，時發熱、自汗出而不愈者，此衛氣不和也，先其時發汗則愈，宜桂枝湯。
  entities: [formula.gui_zhi_tang]
- id: clause.shl.055
  'no': 55
  section: 辨太阳病脉证并治中
  text: 伤寒脉浮紧，不发汗，因致衄者，麻黄汤主之。
  text_trad: 傷寒脈浮緊，不發汗，因致衄者，麻黃湯主之。
  entities: [formula.ma_huang_tang]
- id: clause.shl.056
  'no': 56
  section: 辨太阳病脉证并治中
  text: 伤寒不大便六七日，头痛有热者，与承气汤，其小便清者，知不在里，仍在表也，当须发汗；若头痛者，必衄，宜桂枝汤。
  text_trad: 傷寒不大便六七日，頭痛有熱者，與承氣湯，其小便清者，知不在裏，仍在表也，當須發汗；若頭痛者，必衄，宜桂枝湯。
  entities: [formula.gui_zhi_tang, formula.cheng_qi_tang]
- id: clause.shl.057
  'no': 57
  section: 辨太阳病脉证并治中
  text: 伤寒发汗已解，半日许复烦，脉浮数者，可更发汗，宜桂枝汤。
  text_trad: 傷寒發汗已解，半日許復煩，脈浮數者，可更發汗，宜桂枝湯。
  entities: [formula.gui_zhi_tang]
- id: clause.shl.058
  'no': 58
  section: 辨太阳病脉证并治中
  text: 凡病，若发汗，若吐，若下，若亡血，亡津液。阴阳自和者，必自愈。
  text_trad: 凡病，若發汗，若吐，若下，若亡血，亡津液。陰陽自和者，必自愈。
  entities: []
- id: clause.shl.059
  'no': 59
  section: 辨太阳病脉证并治中
  text: 大下之后，复发汗，小便不利者，亡津液故也。勿治之，得小便利，必自愈。
  text_trad: 大下之後，復發汗，小便不利者，亡津液故也。勿治之，得小便利，必自愈。
  entities: []
- id: clause.shl.060
  'no': 60
  section: 辨太阳病脉证并治中
  text: 下之后，复发汗，必振寒，脉微细。所以然者，以内外俱虚故也。
  text_trad: 下之後，復發汗，必振寒，脈微細。所以然者，以內外俱虛故也。
  entities: []
- id: clause.shl.061
  'no': 61
  section: 辨太阳病脉证并治中
  text: 下之后，复发汗，昼日烦躁不得眠，夜而安静，不呕不渴，无表证，脉沉微，身无大热者，干姜附子汤主之。
  text_trad: 下之後，復發汗，晝日煩躁不得眠，夜而安靜，不嘔不渴，無表證，脈沉微，身無大熱者，乾薑附子湯主之。
  entities: [formula.gan_jiang_fu_zi_tang]
- id: clause.shl.062
  'no': 62
  section: 辨太阳病脉证并治中
  text: 发汗后，身疼痛，脉沉迟者，桂枝加芍药生姜各一两人参三两新加汤主之。
  text_trad: 發汗後，身疼痛，脈沉遲者，桂枝加芍藥生薑各一兩人參三兩新加湯主之。
  entities: [formula.gui_zhi_jia_shao_yao_sheng_jiang_ge_yi_liang_ren_shen_san_liang_xin_jia_tang]
- id: clause.shl.063
  'no': 63
  section: 辨太阳病脉证并治中
  text: 发汗后，不可更行桂枝汤，汗出而喘，无大热者，可与麻黄杏仁甘草石膏汤。
  text_trad: 發汗後，不可更行桂枝湯，汗出而喘，無大熱者，可與麻黃杏仁甘草石膏湯。
  entities: [formula.ma_huang_xing_ren_gan_cao_shi_gao_tang, formula.gui_zhi_tang]
- id: clause.shl.064
  'no': 64
  section: 辨太阳病脉证并治中
  text: 发汗过多，其人叉手自冒心，心下悸，欲得按者，桂枝甘草汤主之。
  text_trad: 發汗過多，其人叉手自冒心，心下悸，欲得按者，桂枝甘草湯主之。
  entities: [formula.gui_zhi_gan_cao_tang]
- id: clause.shl.065
  'no': 65
  section: 辨太阳病脉证并治中
  text: 发汗后，其人脐下悸者，欲作奔豚，茯苓桂枝甘草大枣汤主之。
  text_trad: 發汗後，其人臍下悸者，欲作奔豚，茯苓桂枝甘草大棗湯主之。
  entities: [formula.fu_ling_gui_zhi_gan_cao_da_zao_tang]
- id: clause.shl.066
  'no': 66
  section: 辨太阳病脉证并治中
  text: 发汗后，腹胀满者，厚朴生姜半夏甘草人参汤主之。
  text_trad: 發汗後，腹脹滿者，厚朴生薑半夏甘草人參湯主之。
  entities: [formula.hou_po_sheng_jiang_ban_xia_gan_cao_ren_shen_tang]
- id: clause.shl.067
  'no': 67
  section: 辨太阳病脉证并治中
  text: 伤寒若吐若下后，心下逆满，气上冲胸，起则头眩，脉沉紧，发汗则动经，身为振振摇者，茯苓桂枝白术甘草汤主之。
  text_trad: 傷寒若吐若下後，心下逆滿，氣上衝胸，起則頭眩，脈沉緊，發汗則動經，身為振振搖者，茯苓桂枝白朮甘草湯主之。
  entities: [formula.fu_ling_gui_zhi_bai_zhu_gan_cao_tang]
- id: clause.shl.068
  'no': 68
  section: 辨太阳病脉证并治中
  text: 发汗，病不解，反恶寒者，虚故也，芍药甘草附子汤主之。
  text_trad: 發汗，病不解，反惡寒者，虛故也，芍藥甘草附子湯主之。
  entities: [formula.shao_yao_gan_cao_fu_zi_tang]
- id: clause.shl.069
  'no': 69
  section: 辨太阳病脉证并治中
  text: 发汗，若下之，病仍不解，烦躁者，茯苓四逆汤主之。
  text_trad: 發汗，若下之，病仍不解，煩躁者，茯苓四逆湯主之。
  entities: [formula.fu_ling_si_ni_tang]
- id: clause.shl.070
  'no': 70
  section: 辨太阳病脉证并治中
  text: 发汗后恶寒者，虚故也。不恶寒但热者，实也。当和胃气，与调胃承气汤。
  text_trad: 發汗後惡寒者，虛故也。不惡寒但熱者，實也。當和胃氣，與調胃承氣湯。
  entities: [formula.diao_wei_cheng_qi_tang]
- id: clause.shl.071
  'no': 71
  section: 辨太阳病脉证并治中
  text: 太阳病，发汗后，大汗出，胃中干，烦躁不得眠，欲得饮水者，少少与饮之，令胃气和则愈。若脉浮，小便不利，微热消渴者，五苓散主之。
  text_trad: 太陽病，發汗後，大汗出，胃中乾，煩躁不得眠，欲得飲水者，少少與飲之，令胃氣和則愈。若脈浮，小便不利，微熱消渴者，五苓散主之。
  entities: [formula.wu_ling_san, six_channel.taiyang]
- id: clause.shl.072
  'no': 72
  section: 辨太阳病脉证并治中
  text: 发汗已，脉浮数，烦渴者，五苓散主之。
  text_trad: 發汗已，脈浮數，煩渴者，五苓散主之。
  entities: [formula.wu_ling_san]
- id: clause.shl.073
  'no': 73
  section: 辨太阳病脉证并治中
  text: 伤寒汗出而渴者，五苓散主之；不渴者，茯苓甘草汤主之。
  text_trad: 傷寒汗出而渴者，五苓散主之；不渴者，茯苓甘草湯主之。
  entities: [formula.fu_ling_gan_cao_tang, formula.wu_ling_san]
- id: clause.shl.074
  'no': 74
  section: 辨太阳病脉证并治中
  text: 中风发热，六七日不解而烦，有表里证，渴欲饮水，水入则吐者，名曰水逆，五苓散主之。
  text_trad: 中風發熱，六七日不解而煩，有表裏證，渴欲飲水，水入則吐者，名曰水逆，五苓散主之。
  entities: [formula.wu_ling_san]
- id: clause.shl.075
  'no': 75
  section: 辨太阳病脉证并治中
  text: 未持脉时，病人手叉自冒心，师因教试令咳，而不咳者，此必两耳聋无闻也。所以然者，以重发汗，虚，故如此。发汗后，饮水多，必喘；以水灌之，亦喘。
  text_trad: 未持脈時，病人手叉自冒心，師因教試令咳，而不咳者，此必兩耳聾無聞也。所以然者，以重發汗，虛，故如此。發汗後，飲水多，必喘；以水灌之，亦喘。
  entities: []
- id: clause.shl.076
  'no': 76
  section: 辨太阳病脉证并治中
  text: 发汗后，水药不得入口，为逆；若更发汗，必吐下不止。发汗吐下后，虚烦不得眠，若剧者，必反复颠倒，心中懊𢙐，栀子豉汤主之。若少气者，栀子甘草豉汤主之；若呕者，栀子生姜豉汤主之。
  text_trad: 發汗後，水藥不得入口，爲逆；若更發汗，必吐下不止。發汗吐下後，虛煩不得眠，若劇者，必反復顛倒，心中懊憹，梔子豉湯主之。若少氣者，梔子甘草豉湯主之；若嘔者，梔子生薑豉湯主之。
  entities: [formula.zhi_zi_gan_cao_shi_tang, formula.zhi_zi_sheng_jiang_shi_tang, formula.zhi_zi_shi_tang]
- id: clause.shl.077
  'no': 77
  section: 辨太阳病脉证并治中
  text: 发汗，若下之，而烦热，胸中窒者，栀子豉汤主之。
  text_trad: 發汗，若下之，而煩熱，胸中窒者，梔子豉湯主之。
  entities: [formula.zhi_zi_shi_tang]
- id: clause.shl.078
  'no': 78
  section: 辨太阳病脉证并治中
  text: 伤寒五六日，大下之后，身热不去，心中结痛者，未欲解也，栀子豉汤主之。
  text_trad: 傷寒五六日，大下之後，身熱不去，心中結痛者，未欲解也，梔子豉湯主之。
  entities: [formula.zhi_zi_shi_tang]
- id: clause.shl.079
  'no': 79
  section: 辨太阳病脉证并治中
  text: 伤寒下后，心烦腹满，卧起不安者，栀子厚朴汤主之。
  text_trad: 傷寒下後，心煩腹滿，臥起不安者，梔子厚朴湯主之。
  entities: [formula.zhi_zi_hou_po_tang]
- id: clause.shl.080
  'no': 80
  section: 辨太阳病脉证并治中
  text: 伤寒，医以丸药大下之，身热不去，微烦者，栀子干姜汤主之。
  text_trad: 傷寒，醫以丸藥大下之，身熱不去，微煩者，梔子乾薑湯主之。
  entities: [formula.zhi_zi_gan_jiang_tang]
- id: clause.shl.081
  'no': 81
  section: 辨太阳病脉证并治中
  text: 凡用栀子汤，病人旧微溏者，不可与服之。
  text_trad: 凡用梔子湯，病人舊微溏者，不可與服之。
  entities: []
- id: clause.shl.082
  'no': 82
  section: 辨太阳病脉证并治中
  text: 太阳病发汗，汗出不解，其人仍发热，心下悸，头眩，身𥆧动，振振欲擗地者，真武汤主之。
  text_trad: 太陽病發汗，汗出不解，其人仍發熱，心下悸，頭眩，身瞤動，振振欲擗地者，真武湯主之。
  entities: [formula.zhen_wu_tang, six_channel.taiyang]
- id: clause.shl.083
  'no': 83
  section: 辨太阳病脉证并治中
  text: 咽喉干燥者，不可发汗。
  text_trad: 咽喉乾燥者，不可發汗。
  entities: []
- id: clause.shl.084
  'no': 84
  section: 辨太阳病脉证并治中
  text: 淋家，不可发汗，汗出必便血。
  text_trad: 淋家，不可發汗，汗出必便血。
  entities: []
- id: clause.shl.085
  'no': 85
  section: 辨太阳病脉证并治中
  text: 疮家，虽身疼痛，不可发汗，汗出则痉。
  text_trad: 瘡家，雖身疼痛，不可發汗，汗出則痙。
  entities: []
- id: clause.shl.086
  'no': 86
  section: 辨太阳病脉证并治中
  text: 衄家，不可发汗，汗出必额上陷，脉急紧，直视不能眴，不得眠。
  text_trad: 衄家，不可發汗，汗出必額上陷，脈急緊，直視不能眴，不得眠。
  entities: []
- id: clause.shl.087
  'no': 87
  section: 辨太阳病脉证并治中
  text: 亡血家，不可发汗，发汗则寒栗而振。
  text_trad: 亡血家，不可發汗，發汗則寒慄而振。
  entities: []
- id: clause.shl.088
  'no': 88
  section: 辨太阳病脉证并治中
  text: 汗家，重发汗，必恍惚心乱，小便已阴疼，与禹余粮丸。
  text_trad: 汗家，重發汗，必恍惚心亂，小便已陰疼，與禹餘糧丸。
  entities: [formula.yu_yu_liang_wan]
- id: clause.shl.089
  'no': 89
  section: 辨太阳病脉证并治中
  text: 病人有寒，复发汗，胃中冷，必吐蛔。
  text_trad: 病人有寒，復發汗，胃中冷，必吐蚘。
  entities: []
- id: clause.shl.090
  'no': 90
  section: 辨太阳病脉证并治中
  text: 本发汗，而复下之，此为逆也。若先发汗，治不为逆。本先下之，而反汗之，为逆，若先下之，治不为逆。
  text_trad: 本發汗，而復下之，此為逆也。若先發汗，治不為逆。本先下之，而反汗之，為逆，若先下之，治不為逆。
  entities: []
- id: clause.shl.091
  'no': 91
  section: 辨太阳病脉证并治中
  text: 伤寒，医下之，续得下利清谷不止，身疼痛者，急当救里。后身疼痛，清便自调者，急当救表。救里宜四逆汤，救表宜桂枝汤。
  text_trad: 傷寒，醫下之，續得下利清穀不止，身疼痛者，急當救裏。後身疼痛，清便自調者，急當救表。救裏宜四逆湯，救表宜桂枝湯。
  entities: [formula.gui_zhi_tang, formula.si_ni_tang]
- id: clause.shl.092
  'no': 92
  section: 辨太阳病脉证并治中
  text: 病发热，头痛，脉反沉，若不差，身体疼痛，当救其里，宜四逆汤。
  text_trad: 病發熱，頭痛，脈反沉，若不差，身體疼痛，當救其裏，宜四逆湯。
  entities: [formula.si_ni_tang]
- id: clause.shl.093
  'no': 93
  section: 辨太阳病脉证并治中
  text: 太阳病，先下而不愈，因复发汗，以此表里俱虚，其人因致冒。冒家汗出自愈。所以然者，汗出表和故也。里未和，然后复下之。
  text_trad: 太陽病，先下而不愈，因復發汗，以此表裏俱虛，其人因致冒。冒家汗出自愈。所以然者，汗出表和故也。裏未和，然後復下之。
  entities: [six_channel.taiyang]
- id: clause.shl.094
  'no': 94
  section: 辨太阳病脉证并治中
  text: 太阳病未解，脉阴阳俱停，必先振栗汗出而解。但阳脉微者，先汗出而解；但阴脉微者，下之而解。若欲下之，宜调胃承气汤。
  text_trad: 太陽病未解，脈陰陽俱停，必先振慄汗出而解。但陽脈微者，先汗出而解；但陰脈微者，下之而解。若欲下之，宜調胃承氣湯。
  entities: [formula.diao_wei_cheng_qi_tang, six_channel.taiyang]
- id: clause.shl.095
  'no': 95
  section: 辨太阳病脉证并治中
  text: 太阳病，发热汗出者，此为荣弱卫强，故使汗出，欲救邪风者，宜桂枝汤。
  text_trad: 太陽病，發熱汗出者，此為榮弱衛強，故使汗出，欲救邪風者，宜桂枝湯。
  entities: [formula.gui_zhi_tang, six_channel.taiyang]
- id: clause.shl.096
  'no': 96
  section: 辨太阳病脉证并治中
  text: 伤寒五六日，中风，往来寒热，胸胁苦满，嘿嘿不欲饮食，心烦喜呕。或胸中烦而不呕，或渴，或腹中痛，或胁下痞硬，或心下悸、小便不利，或不渴、身有微热，或咳者，小柴胡汤主之。
  text_trad: 傷寒五六日，中風，往來寒熱，胸脅苦滿，嘿嘿不欲飲食，心煩喜嘔。或胸中煩而不嘔，或渴，或腹中痛，或脅下痞鞕，或心下悸、小便不利，或不渴、身有微熱，或咳者，小柴胡湯主之。
  entities: [formula.xiao_chai_hu_tang]
- id: clause.shl.097
  'no': 97
  section: 辨太阳病脉证并治中
  text: 血弱气尽，腠理开，邪气因入，与正气相搏，结于胁下，正邪分争，往来寒热，休作有时，嘿嘿不欲饮食，藏府相连，其痛必下，邪高痛下，故使呕也，小柴胡汤主之。服柴胡汤已，渴者属阳明，以法治之。
  text_trad: 血弱氣盡，腠理開，邪氣因入，與正氣相搏，結於脅下，正邪分爭，往來寒熱，休作有時，嘿嘿不欲飲食，藏府相連，其痛必下，邪高痛下，故使嘔也，小柴胡湯主之。服柴胡湯已，渴者屬陽明，以法治之。
  entities: [formula.xiao_chai_hu_tang, formula.chai_hu_tang]
- id: clause.shl.098
  'no': 98
  section: 辨太阳病脉证并治中
  text: 得病六七日，脉迟浮弱，恶风寒，手足温，医二三下之，不能食而胁下满痛，面目及身黄，颈项强，小便难者，与柴胡汤，后必下重。本渴饮水而呕者，柴胡不中与也，食谷者哕。
  text_trad: 得病六七日，脈遲浮弱，惡風寒，手足溫，醫二三下之，不能食而脅下滿痛，面目及身黃，頸項強，小便難者，與柴胡湯，後必下重。本渴飲水而嘔者，柴胡不中與也，食穀者噦。
  entities: [formula.chai_hu_tang]
- id: clause.shl.099
  'no': 99
  section: 辨太阳病脉证并治中
  text: 伤寒四五日，身热，恶风，颈项强，胁下满，手足温而渴者，小柴胡汤主之。
  text_trad: 傷寒四五日，身熱，惡風，頸項強，脅下滿，手足溫而渴者，小柴胡湯主之。
  entities: [formula.xiao_chai_hu_tang]
- id: clause.shl.100
  'no': 100
  section: 辨太阳病脉证并治中
  text: 伤寒，阳脉涩，阴脉弦，法当腹中急痛，先与小建中汤，不差者，与小柴胡汤主之。
  text_trad: 傷寒，陽脈澀，陰脈弦，法當腹中急痛，先與小建中湯，不差者，與小柴胡湯主之。
  entities: [formula.xiao_chai_hu_tang, formula.xiao_jian_zhong_tang]
- id: clause.shl.101
  'no': 101
  section: 辨太阳病脉证并治中
  text: 伤寒中风，有柴胡证，但见一证便是，不必悉具。凡柴胡汤病证而下之，若柴胡证不罢者，复与柴胡汤，必蒸蒸而振，却复发热汗出而解。
  text_trad: 傷寒中風，有柴胡證，但見一證便是，不必悉具。凡柴胡湯病證而下之，若柴胡證不罷者，復與柴胡湯，必蒸蒸而振，卻復發熱汗出而解。
  entities: [formula.chai_hu_tang]
- id: clause.shl.102
  'no': 102
  section: 辨太阳病脉证并治中
  text: 伤寒二三日，心中悸而烦者，小建中汤主之。
  text_trad: 傷寒二三日，心中悸而煩者，小建中湯主之。
  entities: [formula.xiao_jian_zhong_tang]
- id: clause.shl.103
  'no': 103
  section: 辨太阳病脉证并治中
  text: 太阳病，过经十余日，反二三下之。后四五日，柴胡证仍在者，先与小柴胡汤；呕不止，心下急，郁郁微烦者，为未解也，与大柴胡汤下之则愈。
  text_trad: 太陽病，過經十餘日，反二三下之。後四五日，柴胡證仍在者，先與小柴胡湯；嘔不止，心下急，鬱鬱微煩者，為未解也，與大柴胡湯下之則愈。
  entities: [formula.xiao_chai_hu_tang, formula.da_chai_hu_tang, six_channel.taiyang]
- id: clause.shl.104
  'no': 104
  section: 辨太阳病脉证并治中
  text: 伤寒十三日不解，胸胁满而呕，日晡所发潮热，已而微利。此本柴胡证，下之以不得利，今反利者，知医以丸药下之，此非其治也。潮热者，实也。先宜服小柴胡汤以解外，后以柴胡加芒硝汤主之。
  text_trad: 傷寒十三日不解，胸脅滿而嘔，日晡所發潮熱，已而微利。此本柴胡證，下之以不得利，今反利者，知醫以丸藥下之，此非其治也。潮熱者，實也。先宜服小柴胡湯以解外，後以柴胡加芒硝湯主之。
  entities: [formula.chai_hu_jia_mang_xiao_tang, formula.xiao_chai_hu_tang]
- id: clause.shl.105
  'no': 105
  section: 辨太阳病脉证并治中
  text: 伤寒十三日，过经，谵语者，以有热也，当以汤下之。若小便利者，大便当硬，而反下利，脉调和者，知医以丸药下之，非其治也。若自下利者，脉当微厥，今反和者，此为内实也，调胃承气汤主之。
  text_trad: 傷寒十三日，過經，譫語者，以有熱也，當以湯下之。若小便利者，大便當鞕，而反下利，脈調和者，知醫以丸藥下之，非其治也。若自下利者，脈當微厥，今反和者，此為內實也，調胃承氣湯主之。
  entities: [formula.diao_wei_cheng_qi_tang]
- id: clause.shl.106
  'no': 106
  section: 辨太阳病脉证并治中
  text: 太阳病不解，热结膀胱，其人如狂，血自下，下者愈。其外不解者，尚未可攻，当先解其外。外解已，但少腹急结者，乃可攻之，宜桃核承气汤。
  text_trad: 太陽病不解，熱結膀胱，其人如狂，血自下，下者愈。其外不解者，尚未可攻，當先解其外。外解已，但少腹急結者，乃可攻之，宜桃核承氣湯。
  entities: [formula.tao_he_cheng_qi_tang, six_channel.taiyang]
- id: clause.shl.107
  'no': 107
  section: 辨太阳病脉证并治中
  text: 伤寒八九日，下之，胸满烦惊，小便不利，谵语，一身尽重，不可转侧者，柴胡加龙骨牡蛎汤主之。
  text_trad: 傷寒八九日，下之，胸滿煩驚，小便不利，譫語，一身盡重，不可轉側者，柴胡加龍骨牡蠣湯主之。
  entities: [formula.chai_hu_jia_long_gu_mu_li_tang]
- id: clause.shl.108
  'no': 108
  section: 辨太阳病脉证并治中
  text: 伤寒腹满谵语，寸口脉浮而紧，此肝乘脾也，名曰纵，刺期门。
  text_trad: 傷寒腹滿譫語，寸口脈浮而緊，此肝乘脾也，名曰縱，刺期門。
  entities: []
- id: clause.shl.109
  'no': 109
  section: 辨太阳病脉证并治中
  text: 伤寒发热，啬啬恶寒，大渴欲饮水，其腹必满，自汗出，小便利，其病欲解，此肝乘肺也，名曰横，刺期门。
  text_trad: 傷寒發熱，嗇嗇惡寒，大渴欲飲水，其腹必滿，自汗出，小便利，其病欲解，此肝乘肺也，名曰橫，刺期門。
  entities: []
- id: clause.shl.110
  'no': 110
  section: 辨太阳病脉证并治中
  text: 太阳病二日，反躁，凡熨其背而大汗出，大热入胃，胃中水竭，躁烦，必发谵语。十余日，振栗，自下利者，此为欲解也。故其汗从腰以下不得汗，欲小便不得，反呕，欲失溲，足下恶风，大便硬，小便当数而反不数及不多，大便已，头卓然而痛，其人足心必热，谷气下流故也。
  text_trad: 太陽病二日，反躁，凡熨其背而大汗出，大熱入胃，胃中水竭，躁煩，必發譫語。十餘日，振慄，自下利者，此為欲解也。故其汗從腰以下不得汗，欲小便不得，反嘔，欲失溲，足下惡風，大便鞕，小便當數而反不數及不多，大便已，頭卓然而痛，其人足心必熱，穀氣下流故也。
  entities: [six_channel.taiyang]
- id: clause.shl.111
  'no': 111
  section: 辨太阳病脉证并治中
  text: 太阳病中风，以火劫发汗，邪风被火热，血气流溢，失其常度。两阳相熏灼，其身发黄。阳盛则欲衄，阴虚小便难。阴阳俱虚竭，身体则枯燥，但头汗出，剂颈而还，腹满，微喘，口干咽烂，或不大便，久则谵语，甚者至哕，手足躁扰，捻衣摸床，小便利者，其人可治。
  text_trad: 太陽病中風，以火劫發汗，邪風被火熱，血氣流溢，失其常度。兩陽相熏灼，其身發黃。陽盛則欲衄，陰虛小便難。陰陽俱虛竭，身體則枯燥，但頭汗出，劑頸而還，腹滿，微喘，口乾咽爛，或不大便，久則譫語，甚者至噦，手足躁擾，捻衣摸床，小便利者，其人可治。
  entities: [six_channel.taiyang]
- id: clause.shl.112
  'no': 112
  section: 辨太阳病脉证并治中
  text: 伤寒脉浮，医以火迫劫之，亡阳，必惊狂，卧起不安者，桂枝去芍药加蜀漆牡蛎龙骨救逆汤主之。
  text_trad: 傷寒脈浮，醫以火迫劫之，亡陽，必驚狂，臥起不安者，桂枝去芍藥加蜀漆牡蠣龍骨救逆湯主之。
  entities: [formula.gui_zhi_qu_shao_yao_jia_shu_qi_mu_li_long_gu_jiu_ni_tang]
- id: clause.shl.113
  'no': 113
  section: 辨太阳病脉证并治中
  text: 形作伤寒，其脉不弦紧而弱，弱者必渴，被火必谵语，弱者发热脉浮，解之当汗出愈。
  text_trad: 形作傷寒，其脈不弦緊而弱，弱者必渴，被火必譫語，弱者發熱脈浮，解之當汗出愈。
  entities: []
- id: clause.shl.114
  'no': 114
  section: 辨太阳病脉证并治中
  text: 太阳病，以火熏之，不得汗，其人必躁。到经不解，必清血，名为火邪。
  text_trad: 太陽病，以火熏之，不得汗，其人必躁。到經不解，必清血，名爲火邪。
  entities: [six_channel.taiyang]
- id: clause.shl.115
  'no': 115
  section: 辨太阳病脉证并治中
  text: 脉浮，热甚，而反灸之，此为实，实以虚治，因火而动，必咽燥，吐血。
  text_trad: 脈浮，熱甚，而反灸之，此為實，實以虛治，因火而動，必咽燥，吐血。
  entities: []
- id: clause.shl.116
  'no': 116
  section: 辨太阳病脉证并治中
  text: 微数之脉，慎不可灸。因火为邪，则为烦逆，追虚逐实，血散脉中，火气虽微，内攻有力，焦骨伤筋，血难复也。脉浮，宜以汗解。用火灸之，邪无从出，因火而盛，病从腰以下必重而痹，名火逆也。欲自解者，必当先烦，烦乃有汗而解。何以知之？脉浮，故知汗出解。
  text_trad: 微數之脈，慎不可灸。因火為邪，則為煩逆，追虛逐實，血散脈中，火氣雖微，內攻有力，焦骨傷筋，血難復也。脈浮，宜以汗解。用火灸之，邪無從出，因火而盛，病從腰以下必重而痹，名火逆也。欲自解者，必當先煩，煩乃有汗而解。何以知之？脈浮，故知汗出解。
  entities: []
- id: clause.shl.117
  'no': 117
  section: 辨太阳病脉证并治中
  text: 烧针令其汗，针处被寒，核起而赤者，必发奔豚。气从少腹上冲心者，灸其核上各一壮，与桂枝加桂汤，更加桂二两也。
  text_trad: 燒針令其汗，針處被寒，核起而赤者，必發奔豚。氣從少腹上衝心者，灸其核上各一壯，與桂枝加桂湯，更加桂二兩也。
  entities: [formula.gui_zhi_jia_gui_tang]
- id: clause.shl.118
  'no': 118
  section: 辨太阳病脉证并治中
  text: 火逆下之，因烧针烦躁者，桂枝甘草龙骨牡蛎汤主之。
  text_trad: 火逆下之，因燒針煩躁者，桂枝甘草龍骨牡蠣湯主之。
  entities: [formula.gui_zhi_gan_cao_long_gu_mu_li_tang]
- id: clause.shl.119
  'no': 119
  section: 辨太阳病脉证并治中
  text: 太阳伤寒者，加温针，必惊也。
  text_trad: 太陽傷寒者，加溫針，必驚也。
  entities: [six_channel.taiyang]
- id: clause.shl.120
  'no': 120
  section: 辨太阳病脉证并治中
  text: 太阳病，当恶寒发热，今自汗出，反不恶寒发热，关上脉细数者，以医吐之过也。一二日吐之者，腹中饥，口不能食；三四日吐之者，不喜糜粥，欲食冷食，朝食暮吐，以医吐之所致也，此为小逆。
  text_trad: 太陽病，當惡寒發熱，今自汗出，反不惡寒發熱，關上脈細數者，以醫吐之過也。一二日吐之者，腹中飢，口不能食；三四日吐之者，不喜糜粥，欲食冷食，朝食暮吐，以醫吐之所致也，此為小逆。
  entities: [six_channel.taiyang]
- id: clause.shl.121
  'no': 121
  section: 辨太阳病脉证并治中
  text: 太阳病吐之，但太阳病当恶寒，今反不恶寒，不欲近衣，此为吐之内烦也。
  text_trad: 太陽病吐之，但太陽病當惡寒，今反不惡寒，不欲近衣，此為吐之內煩也。
  entities: [six_channel.taiyang]
- id: clause.shl.122
  'no': 122
  section: 辨太阳病脉证并治中
  text: 病人脉数，数为热，当消谷引食，而反吐者，此以发汗，令阳气微，膈气虚，脉乃数也。数为客热，不能消谷，以胃中虚冷，故吐也。
  text_trad: 病人脈數，數為熱，當消穀引食，而反吐者，此以發汗，令陽氣微，膈氣虛，脈乃數也。數為客熱，不能消穀，以胃中虛冷，故吐也。
  entities: []
- id: clause.shl.123
  'no': 123
  section: 辨太阳病脉证并治中
  text: 太阳病，过经十余日，心下温温欲吐，而胸中痛，大便反溏，腹微满，郁郁微烦，先此时自极吐下者，与调胃承气汤。若不尔者，不可与。但欲呕，胸中痛，微溏者，此非柴胡汤证，以呕，故知极吐下也。
  text_trad: 太陽病，過經十餘日，心下溫溫欲吐，而胸中痛，大便反溏，腹微滿，鬱鬱微煩，先此時自極吐下者，與調胃承氣湯。若不爾者，不可與。但欲嘔，胸中痛，微溏者，此非柴胡湯證，以嘔，故知極吐下也。
  entities: [formula.diao_wei_cheng_qi_tang, formula.chai_hu_tang, six_channel.taiyang]
- id: clause.shl.124
  'no': 124
  section: 辨太阳病脉证并治中
  text: 太阳病，六七日表证仍在，脉微而沉，反不结胸，其人发狂者，以热在下焦，少腹当硬满，小便自利者，下血乃愈。所以然者，以太阳随经，瘀热在里故也，抵当汤主之。
  text_trad: 太陽病，六七日表證仍在，脈微而沉，反不結胸，其人發狂者，以熱在下焦，少腹當鞕滿，小便自利者，下血乃愈。所以然者，以太陽隨經，瘀熱在裏故也，抵當湯主之。
  entities: [formula.di_dang_tang, six_channel.taiyang]
- id: clause.shl.125
  'no': 125
  section: 辨太阳病脉证并治中
  text: 太阳病，身黄，脉沉结，少腹硬，小便不利者，为无血也。小便自利，其人如狂者，血证谛也，抵当汤主之。
  text_trad: 太陽病，身黃，脈沉結，少腹鞕，小便不利者，為無血也。小便自利，其人如狂者，血證諦也，抵當湯主之。
  entities: [formula.di_dang_tang, six_channel.taiyang]
- id: clause.shl.126
  'no': 126
  section: 辨太阳病脉证并治中
  text: 伤寒有热，少腹满，应小便不利，今反利者，为有血也，当下之，不可余药，宜抵当丸。
  text_trad: 傷寒有熱，少腹滿，應小便不利，今反利者，為有血也，當下之，不可餘藥，宜抵當丸。
  entities: [formula.di_dang_wan]
- id: clause.shl.127
  'no': 127
  section: 辨太阳病脉证并治中
  text: 太阳病，小便利者，以饮水多，必心下悸，小便少者，必苦里急也。
  text_trad: 太陽病，小便利者，以飲水多，必心下悸，小便少者，必苦裏急也。
  entities: [six_channel.taiyang]
- id: clause.shl.128
  'no': 128
  section: 辨太阳病脉证并治下
  text: 问曰：病有结胸，有藏结，其状如何？按之痛，寸脉浮，关脉沉，名曰结胸也。
  text_trad: 問曰：病有結胸，有藏結，其狀如何？按之痛，寸脈浮，關脈沉，名曰結胸也。
  entities: []
- id: clause.shl.129
  'no': 129
  section: 辨太阳病脉证并治下
  text: 何谓藏结？答曰：如结胸状，饮食如故，时时下利，寸脉浮，关脉小细沉紧，名曰藏结。舌上白胎滑者，难治。
  text_trad: 何謂藏結？答曰：如結胸狀，飲食如故，時時下利，寸脈浮，關脈小細沉緊，名曰藏結。舌上白胎滑者，難治。
  entities: []
- id: clause.shl.130
  'no': 130
  section: 辨太阳病脉证并治下
  text: 藏结无阳证，不往来寒热，其人反静，舌上胎滑者，不可攻也。
  text_trad: 藏結無陽證，不往來寒熱，其人反靜，舌上胎滑者，不可攻也。
  entities: []
- id: clause.shl.131
  'no': 131
  section: 辨太阳病脉证并治下
  text: 病发于阳，而反下之，热入因作结胸；病发于阴，而反下之，因作痞也。所以成结胸者，以下之太早故也。结胸者，项亦强，如柔痉状，下之则和，宜大陷胸丸。
  text_trad: 病發於陽，而反下之，熱入因作結胸；病發於陰，而反下之，因作痞也。所以成結胸者，以下之太早故也。結胸者，項亦強，如柔痙狀，下之則和，宜大陷胸丸。
  entities: [formula.da_xian_xiong_wan]
- id: clause.shl.132
  'no': 132
  section: 辨太阳病脉证并治下
  text: 结胸证，其脉浮大者，不可下，下之则死。
  text_trad: 結胸證，其脈浮大者，不可下，下之則死。
  entities: []
- id: clause.shl.133
  'no': 133
  section: 辨太阳病脉证并治下
  text: 结胸证悉具，烦躁者亦死。
  text_trad: 結胸證悉具，煩躁者亦死。
  entities: []
- id: clause.shl.134
  'no': 134
  section: 辨太阳病脉证并治下
  text: 太阳病，脉浮而动数，浮则为风，数则为热，动则为痛，数则为虚。头痛，发热，微盗汗出，而反恶寒者，表未解也，医反下之，动数变迟，膈内拒痛，胃中空虚，客气动膈，短气躁烦，心中懊𢙐，阳气内陷，心下因硬，则为结胸，大陷胸汤主之。若不结胸，但头汗出，余处无汗，剂颈而还，小便不利，身必发黄。
  text_trad: 太陽病，脈浮而動數，浮則為風，數則為熱，動則為痛，數則為虛。頭痛，發熱，微盜汗出，而反惡寒者，表未解也，醫反下之，動數變遲，膈內拒痛，胃中空虛，客氣動膈，短氣躁煩，心中懊憹，陽氣內陷，心下因鞕，則為結胸，大陷胸湯主之。若不結胸，但頭汗出，餘處無汗，劑頸而還，小便不利，身必發黃。
  entities: [formula.da_xian_xiong_tang, six_channel.taiyang]
- id: clause.shl.135
  'no': 135
  section: 辨太阳病脉证并治下
  text: 伤寒六七日，结胸热实，脉沉而紧，心下痛，按之石硬者，大陷胸汤主之。
  text_trad: 傷寒六七日，結胸熱實，脈沉而緊，心下痛，按之石鞕者，大陷胸湯主之。
  entities: [formula.da_xian_xiong_tang]
- id: clause.shl.136
  'no': 136
  section: 辨太阳病脉证并治下
  text: 伤寒十余日，热结在里，复往来寒热者，与大柴胡汤；但结胸，无大热者，此为水结在胸胁也，但头微汗出者，大陷胸汤主之。
  text_trad: 傷寒十餘日，熱結在裏，復往來寒熱者，與大柴胡湯；但結胸，無大熱者，此為水結在胸脅也，但頭微汗出者，大陷胸湯主之。
  entities: [formula.da_chai_hu_tang, formula.da_xian_xiong_tang]
- id: clause.shl.137
  'no': 137
  section: 辨太阳病脉证并治下
  text: 太阳病，重发汗而复下之，不大便五六日，舌上燥而渴，日晡所小有潮热，从心下至少腹硬满而痛，不可近者，大陷胸汤主之。
  text_trad: 太陽病，重發汗而復下之，不大便五六日，舌上燥而渴，日晡所小有潮熱，從心下至少腹鞕滿而痛，不可近者，大陷胸湯主之。
  entities: [formula.da_xian_xiong_tang, six_channel.taiyang]
- id: clause.shl.138
  'no': 138
  section: 辨太阳病脉证并治下
  text: 小结胸病，正在心下，按之则痛，脉浮滑者，小陷胸汤主之。
  text_trad: 小結胸病，正在心下，按之則痛，脈浮滑者，小陷胸湯主之。
  entities: [formula.xiao_xian_xiong_tang]
- id: clause.shl.139
  'no': 139
  section: 辨太阳病脉证并治下
  text: 太阳病，二三日，不能卧，但欲起，心下必结，脉微弱者，此本有寒分也。反下之，若利止，必作结胸；未止者，四日复下之，此作协热利也。
  text_trad: 太陽病，二三日，不能臥，但欲起，心下必結，脈微弱者，此本有寒分也。反下之，若利止，必作結胸；未止者，四日復下之，此作協熱利也。
  entities: [six_channel.taiyang]
- id: clause.shl.140
  'no': 140
  section: 辨太阳病脉证并治下
  text: 太阳病，下之，其脉促，不结胸者，此为欲解也；脉浮者，必结胸；脉紧者，必咽痛；脉弦者，必两胁拘急；脉细数者，头痛未止；脉沉紧者，必欲呕；脉沉滑者，协热利；脉浮滑者，必下血。
  text_trad: 太陽病，下之，其脈促，不結胸者，此為欲解也；脈浮者，必結胸；脈緊者，必咽痛；脈弦者，必兩脅拘急；脈細數者，頭痛未止；脈沉緊者，必欲嘔；脈沉滑者，協熱利；脈浮滑者，必下血。
  entities: [six_channel.taiyang]
- id: clause.shl.141
  'no': 141
  section: 辨太阳病脉证并治下
  text: 病在阳，应以汗解之，反以冷水潠之，若灌之，其热被劫，不得去，弥更益烦，肉上粟起，意欲饮水，反不渴者，服文蛤散；若不差者，与五苓散。寒实结胸，无热证者，与三物小陷胸汤，白散亦可服。
  text_trad: 病在陽，應以汗解之，反以冷水潠之，若灌之，其熱被劫，不得去，彌更益煩，肉上粟起，意欲飲水，反不渴者，服文蛤散；若不差者，與五苓散。寒實結胸，無熱證者，與三物小陷胸湯，白散亦可服。
  entities: [formula.san_wu_xiao_xian_xiong_tang, formula.wu_ling_san, formula.wen_ge_san]
- id: clause.shl.142
  'no': 142
  section: 辨太阳病脉证并治下
  text: 太阳与少阳并病，头项强痛，或眩冒，时如结胸，心下痞硬者，当刺大椎第一间、肺俞、肝俞，慎不可发汗，发汗则谵语、脉弦，五日谵语不止，当刺期门。
  text_trad: 太陽與少陽并病，頭項強痛，或眩冒，時如結胸，心下痞鞕者，當刺大椎第一間、肺俞、肝俞，慎不可發汗，發汗則譫語、脈弦，五日譫語不止，當刺期門。
  entities: []
- id: clause.shl.143
  'no': 143
  section: 辨太阳病脉证并治下
  text: 妇人中风，发热恶寒，经水适来，得之七八日，热除而脉迟身凉，胸胁下满，如结胸状，谵语者，此为热入血室也。当刺期门，随其实而取之。
  text_trad: 婦人中風，發熱惡寒，經水適來，得之七八日，熱除而脈遲身涼，胸脅下滿，如結胸狀，譫語者，此為熱入血室也。當刺期門，隨其實而取之。
  entities: []
- id: clause.shl.144
  'no': 144
  section: 辨太阳病脉证并治下
  text: 妇人中风，七八日续得寒热，发作有时，经水适断者，此为热入血室，其血必结，故使如疟状，发作有时，小柴胡汤主之。
  text_trad: 婦人中風，七八日續得寒熱，發作有時，經水適斷者，此為熱入血室，其血必結，故使如瘧狀，發作有時，小柴胡湯主之。
  entities: [formula.xiao_chai_hu_tang]
- id: clause.shl.145
  'no': 145
  section: 辨太阳病脉证并治下
  text: 妇人伤寒，发热，经水适来，昼日明了，暮则谵语，如见鬼状，此为热入血室，无犯胃气及上二焦，必自愈。
  text_trad: 婦人傷寒，發熱，經水適來，晝日明了，暮則譫語，如見鬼狀，此為熱入血室，無犯胃氣及上二焦，必自愈。
  entities: []
- id: clause.shl.146
  'no': 146
  section: 辨太阳病脉证并治下
  text: 伤寒六七日，发热，微恶寒，支节烦疼，微呕，心下支结，外证未去者，柴胡桂枝汤主之。
  text_trad: 傷寒六七日，發熱，微惡寒，支節煩疼，微嘔，心下支結，外證未去者，柴胡桂枝湯主之。
  entities: [formula.chai_hu_gui_zhi_tang]
- id: clause.shl.147
  'no': 147
  section: 辨太阳病脉证并治下
  text: 伤寒五六日，已发汗而复下之，胸胁满微结，小便不利，渴而不呕，但头汗出，往来寒热，心烦者，此为未解也，柴胡桂枝干姜汤主之。
  text_trad: 傷寒五六日，已發汗而復下之，胸脅滿微結，小便不利，渴而不嘔，但頭汗出，往來寒熱，心煩者，此為未解也，柴胡桂枝乾薑湯主之。
  entities: [formula.chai_hu_gui_zhi_gan_jiang_tang]
- id: clause.shl.148
  'no': 148
  section: 辨太阳病脉证并治下
  text: 伤寒五六日，头汗出，微恶寒，手足冷，心下满，口不欲食，大便硬，脉细者，此为阳微结，必有表，复有里也。脉沉，亦在里也。汗出，为阳微。假令纯阴结，不得复有外证，悉入在里，此为半在里半在外也。脉虽沉紧，不得为少阴病。所以然者，阴不得有汗，今头汗出，故知非少阴也。可与小柴胡汤，设不了了者，得屎而解。
  text_trad: 傷寒五六日，頭汗出，微惡寒，手足冷，心下滿，口不欲食，大便鞕，脈細者，此為陽微結，必有表，復有裏也。脈沉，亦在裏也。汗出，為陽微。假令純陰結，不得復有外證，悉入在裏，此為半在裏半在外也。脈雖沉緊，不得為少陰病。所以然者，陰不得有汗，今頭汗出，故知非少陰也。可與小柴胡湯，設不了了者，得屎而解。
  entities: [formula.xiao_chai_hu_tang, six_channel.shaoyin]
- id: clause.shl.149
  'no': 149
  section: 辨太阳病脉证并治下
  text: 伤寒五六日，呕而发热者，柴胡汤证具，而以他药下之，柴胡证仍在者，复与柴胡汤。此虽已下之，不为逆，必蒸蒸而振，却发热汗出而解。若心下满而硬痛者，此为结胸也，大陷胸汤主之。但满而不痛者，此为痞，柴胡不中与之，宜半夏泻心汤。
  text_trad: 傷寒五六日，嘔而發熱者，柴胡湯證具，而以他藥下之，柴胡證仍在者，復與柴胡湯。此雖已下之，不為逆，必蒸蒸而振，卻發熱汗出而解。若心下滿而鞕痛者，此為結胸也，大陷胸湯主之。但滿而不痛者，此為痞，柴胡不中與之，宜半夏瀉心湯。
  entities: [formula.ban_xia_xie_xin_tang, formula.da_xian_xiong_tang, formula.chai_hu_tang]
- id: clause.shl.150
  'no': 150
  section: 辨太阳病脉证并治下
  text: 太阳少阳并病，而反下之，成结胸，心下硬，下利不止，水浆不下，其人心烦。
  text_trad: 太陽少陽并病，而反下之，成結胸，心下鞕，下利不止，水漿不下，其人心煩。
  entities: []
- id: clause.shl.151
  'no': 151
  section: 辨太阳病脉证并治下
  text: 脉浮而紧，而复下之，紧反入里，则作痞，按之自濡，但气痞耳。
  text_trad: 脈浮而緊，而復下之，緊反入裏，則作痞，按之自濡，但氣痞耳。
  entities: []
- id: clause.shl.152
  'no': 152
  section: 辨太阳病脉证并治下
  text: 太阳中风，下利，呕逆，表解者，乃可攻之。其人漐漐汗出，发作有时，头痛，心下痞硬满，引胁下痛，干呕，短气，汗出，不恶寒者，此表解里未和也。十枣汤主之。
  text_trad: 太陽中風，下利，嘔逆，表解者，乃可攻之。其人漐漐汗出，發作有時，頭痛，心下痞鞕滿，引脅下痛，乾嘔，短氣，汗出，不惡寒者，此表解裏未和也。十棗湯主之。
  entities: [formula.shi_zao_tang, six_channel.taiyang]
- id: clause.shl.153
  'no': 153
  section: 辨太阳病脉证并治下
  text: 太阳病，医发汗，遂发热恶寒。因复下之，心下痞，表里俱虚，阴阳气并竭，无阳则阴独。复加烧针，因胸烦。面色青黄，肤𥆧者，难治；今色微黄，手足温者，易愈。
  text_trad: 太陽病，醫發汗，遂發熱惡寒。因復下之，心下痞，表裏俱虛，陰陽氣并竭，無陽則陰獨。復加燒針，因胸煩。面色青黃，膚瞤者，難治；今色微黃，手足溫者，易愈。
  entities: [six_channel.taiyang]
- id: clause.shl.154
  'no': 154
  section: 辨太阳病脉证并治下
  text: 心下痞，按之濡，其脉关上浮者，大黄黄连泻心汤主之。
  text_trad: 心下痞，按之濡，其脈關上浮者，大黃黃連瀉心湯主之。
  entities: [formula.da_huang_huang_lian_xie_xin_tang]
- id: clause.shl.155
  'no': 155
  section: 辨太阳病脉证并治下
  text: 心下痞，而复恶寒汗出者，附子泻心汤主之。
  text_trad: 心下痞，而復惡寒汗出者，附子瀉心湯主之。
  entities: [formula.fu_zi_xie_xin_tang]
- id: clause.shl.156
  'no': 156
  section: 辨太阳病脉证并治下
  text: 本以下之，故心下痞，与泻心汤，痞不解，其人渴而口燥，烦，小便不利者，五苓散主之。
  text_trad: 本以下之，故心下痞，與瀉心湯，痞不解，其人渴而口燥，煩，小便不利者，五苓散主之。
  entities: [formula.wu_ling_san, formula.xie_xin_tang]
- id: clause.shl.157
  'no': 157
  section: 辨太阳病脉证并治下
  text: 伤寒汗出，解之后，胃中不和，心下痞硬，干噫食臭，胁下有水气，腹中雷鸣，下利者，生姜泻心汤主之。
  text_trad: 傷寒汗出，解之後，胃中不和，心下痞鞕，乾噫食臭，脅下有水氣，腹中雷鳴，下利者，生薑瀉心湯主之。
  entities: [formula.sheng_jiang_xie_xin_tang]
- id: clause.shl.158
  'no': 158
  section: 辨太阳病脉证并治下
  text: 伤寒中风，医反下之，其人下利，日数十行，谷不化，腹中雷鸣，心下痞硬而满，干呕，心烦不得安。医见心下痞，谓病不尽，复下之，其痞益甚，此非结热，但以胃中虚，客气上逆，故使硬也，甘草泻心汤主之。
  text_trad: 傷寒中風，醫反下之，其人下利，日數十行，穀不化，腹中雷鳴，心下痞鞕而滿，乾嘔，心煩不得安。醫見心下痞，謂病不盡，復下之，其痞益甚，此非結熱，但以胃中虛，客氣上逆，故使鞕也，甘草瀉心湯主之。
  entities: [formula.gan_cao_xie_xin_tang]
- id: clause.shl.159
  'no': 159
  section: 辨太阳病脉证并治下
  text: 伤寒，服汤药，下利不止，心下痞硬。服泻心汤已，复以他药下之，利不止。医以理中与之，利益甚。理中者，理中焦，此利在下焦，赤石脂禹余粮汤主之。复不止者，当利其小便。
  text_trad: 傷寒，服湯藥，下利不止，心下痞鞕。服瀉心湯已，復以他藥下之，利不止。醫以理中與之，利益甚。理中者，理中焦，此利在下焦，赤石脂禹餘糧湯主之。復不止者，當利其小便。
  entities: [formula.chi_shi_zhi_yu_yu_liang_tang, formula.xie_xin_tang]
- id: clause.shl.160
  'no': 160
  section: 辨太阳病脉证并治下
  text: 伤寒吐下后，发汗，虚烦，脉甚微，八九日心下痞硬，胁下痛，气上冲咽喉，眩冒，经脉动惕者，久而成痿。
  text_trad: 傷寒吐下後，發汗，虛煩，脈甚微，八九日心下痞鞕，脅下痛，氣上衝咽喉，眩冒，經脈動惕者，久而成痿。
  entities: []
- id: clause.shl.161
  'no': 161
  section: 辨太阳病脉证并治下
  text: 伤寒发汗，若吐若下，解后，心下痞硬，噫气不除者，旋覆代赭汤主之。
  text_trad: 傷寒發汗，若吐若下，解後，心下痞鞕，噫氣不除者，旋覆代赭湯主之。
  entities: [formula.xuan_fu_dai_zhe_tang]
- id: clause.shl.162
  'no': 162
  section: 辨太阳病脉证并治下
  text: 下后，不可更行桂枝汤，若汗出而喘，无大热者，可与麻黄杏子甘草石膏汤。
  text_trad: 下後，不可更行桂枝湯，若汗出而喘，無大熱者，可與麻黃杏子甘草石膏湯。
  entities: [formula.gui_zhi_tang]
- id: clause.shl.163
  'no': 163
  section: 辨太阳病脉证并治下
  text: 太阳病，外证未除，而数下之，遂协热而利，利下不止，心下痞硬，表里不解者，桂枝人参汤主之。
  text_trad: 太陽病，外證未除，而數下之，遂協熱而利，利下不止，心下痞鞕，表裏不解者，桂枝人參湯主之。
  entities: [formula.gui_zhi_ren_shen_tang, six_channel.taiyang]
- id: clause.shl.164
  'no': 164
  section: 辨太阳病脉证并治下
  text: 伤寒大下后，复发汗，心下痞，恶寒者，表未解也。不可攻痞，当先解表，表解乃可攻痞。解表宜桂枝汤，攻痞宜大黄黄连泻心汤。
  text_trad: 傷寒大下後，復發汗，心下痞，惡寒者，表未解也。不可攻痞，當先解表，表解乃可攻痞。解表宜桂枝湯，攻痞宜大黃黃連瀉心湯。
  entities: [formula.da_huang_huang_lian_xie_xin_tang, formula.gui_zhi_tang]
- id: clause.shl.165
  'no': 165
  section: 辨太阳病脉证并治下
  text: 伤寒发热，汗出不解，心中痞硬，呕吐而下利者，大柴胡汤主之。
  text_trad: 傷寒發熱，汗出不解，心中痞鞕，嘔吐而下利者，大柴胡湯主之。
  entities: [formula.da_chai_hu_tang]
- id: clause.shl.166
  'no': 166
  section: 辨太阳病脉证并治下
  text: 病如桂枝证，头不痛，项不强，寸脉微浮，胸中痞硬，气上冲喉咽不得息者，此为胸有寒也，当吐之，宜瓜蒂散。
  text_trad: 病如桂枝證，頭不痛，項不強，寸脈微浮，胸中痞鞕，氣上衝喉咽不得息者，此為胸有寒也，當吐之，宜瓜蒂散。
  entities: [formula.gua_di_san]
- id: clause.shl.167
  'no': 167
  section: 辨太阳病脉证并治下
  text: 病胁下素有痞，连在脐旁，痛引少腹，入阴筋者，此名藏结，死。
  text_trad: 病脅下素有痞，連在臍旁，痛引少腹，入陰筋者，此名藏結，死。
  entities: []
- id: clause.shl.168
  'no': 168
  section: 辨太阳病脉证并治下
  text: 伤寒若吐若下后，七八日不解，热结在里，表里俱热，时时恶风，大渴，舌上干燥而烦，欲饮水数升者，白虎加人参汤主之。
  text_trad: 傷寒若吐若下後，七八日不解，熱結在裏，表裏俱熱，時時惡風，大渴，舌上乾燥而煩，欲飲水數升者，白虎加人參湯主之。
  entities: [formula.bai_hu_jia_ren_shen_tang]
- id: clause.shl.169
  'no': 169
  section: 辨太阳病脉证并治下
  text: 伤寒无大热，口燥渴，心烦，背微恶寒者，白虎加人参汤主之。
  text_trad: 傷寒無大熱，口燥渴，心煩，背微惡寒者，白虎加人參湯主之。
  entities: [formula.bai_hu_jia_ren_shen_tang]
- id: clause.shl.170
  'no': 170
  section: 辨太阳病脉证并治下
  text: 伤寒，脉浮，发热无汗，其表不解，不可与白虎汤；渴欲饮水，无表证者，白虎加人参汤主之。
  text_trad: 傷寒，脈浮，發熱無汗，其表不解，不可與白虎湯；渴欲飲水，無表證者，白虎加人參湯主之。
  entities: [formula.bai_hu_jia_ren_shen_tang, formula.bai_hu_tang]
- id: clause.shl.171
  'no': 171
  section: 辨太阳病脉证并治下
  text: 太阳少阳并病，心下硬，颈项强而眩者，当刺大椎、肺俞、肝俞，慎勿下之。
  text_trad: 太陽少陽并病，心下鞕，頸項強而眩者，當刺大椎、肺俞、肝俞，慎勿下之。
  entities: []
- id: clause.shl.172
  'no': 172
  section: 辨太阳病脉证并治下
  text: 太阳与少阳合病，自下利者，与黄芩汤；若呕者，黄芩加半夏生姜汤主之。
  text_trad: 太陽與少陽合病，自下利者，與黃芩湯；若嘔者，黃芩加半夏生薑湯主之。
  entities: [formula.huang_qin_jia_ban_xia_sheng_jiang_tang, formula.huang_qin_tang]
- id: clause.shl.173
  'no': 173
  section: 辨太阳病脉证并治下
  text: 伤寒胸中有热，胃中有邪气，腹中痛，欲呕吐者，黄连汤主之。
  text_trad: 傷寒胸中有熱，胃中有邪氣，腹中痛，欲嘔吐者，黃連湯主之。
  entities: [formula.huang_lian_tang]
- id: clause.shl.174
  'no': 174
  section: 辨太阳病脉证并治下
  text: 伤寒八九日，风湿相搏，身体疼烦，不能自转侧，不呕不渴，脉浮虚而涩者，桂枝附子汤主之。若其人大便硬，小便自利者，去桂加白术汤主之。
  text_trad: 傷寒八九日，風濕相搏，身體疼煩，不能自轉側，不嘔不渴，脈浮虛而澀者，桂枝附子湯主之。若其人大便鞕，小便自利者，去桂加白朮湯主之。
  entities: [formula.qu_gui_jia_bai_zhu_tang, formula.gui_zhi_fu_zi_tang]
- id: clause.shl.175
  'no': 175
  section: 辨太阳病脉证并治下
  text: 风湿相搏，骨节疼烦，掣痛不得屈伸，近之则痛剧，汗出短气，小便不利，恶风不欲去衣，或身微肿者，甘草附子汤主之。
  text_trad: 風濕相搏，骨節疼煩，掣痛不得屈伸，近之則痛劇，汗出短氣，小便不利，惡風不欲去衣，或身微腫者，甘草附子湯主之。
  entities: [formula.gan_cao_fu_zi_tang]
- id: clause.shl.176
  'no': 176
  section: 辨太阳病脉证并治下
  text: 伤寒，脉浮滑，此以表有热，里有寒，白虎汤主之。
  text_trad: 傷寒，脈浮滑，此以表有熱，裏有寒，白虎湯主之。
  entities: [formula.bai_hu_tang]
- id: clause.shl.177
  'no': 177
  section: 辨太阳病脉证并治下
  text: 伤寒，脉结代，心动悸，炙甘草汤主之。
  text_trad: 傷寒，脈結代，心動悸，炙甘草湯主之。
  entities: [formula.zhi_gan_cao_tang]
- id: clause.shl.178
  'no': 178
  section: 辨太阳病脉证并治下
  text: 脉按之来缓，时一止复来者，名曰结。又脉来动而中止，更来小数，中有还者反动，名曰结，阴也。脉来动而中止，不能自还，因而复动者，名曰代，阴也。得此脉者，必难治。
  text_trad: 脈按之來緩，時一止復來者，名曰結。又脈來動而中止，更來小數，中有還者反動，名曰結，陰也。脈來動而中止，不能自還，因而復動者，名曰代，陰也。得此脈者，必難治。
  entities: []
- id: clause.shl.179
  'no': 179
  section: 辨阳明病脉证并治
  text: 问曰：病有太阳阳明，有正阳阳明，有少阳阳明，何谓也？答曰：太阳阳明者，脾约是也；正阳阳明者，胃家实是也；少阳阳明者，发汗利小便已，胃中燥烦实，大便难是也。
  text_trad: 問曰：病有太陽陽明，有正陽陽明，有少陽陽明，何謂也？答曰：太陽陽明者，脾約是也；正陽陽明者，胃家實是也；少陽陽明者，發汗利小便已，胃中燥煩實，大便難是也。
  entities: []
- id: clause.shl.180
  'no': 180
  section: 辨阳明病脉证并治
  text: 阳明之为病，胃家实是也。
  text_trad: 陽明之為病，胃家實是也。
  entities: [six_channel.yangming]
- id: clause.shl.181
  'no': 181
  section: 辨阳明病脉证并治
  text: 问曰：何缘得阳明病？答曰：太阳病，若发汗，若下，若利小便，此亡津液，胃中干燥，因转属阳明。不更衣，内实，大便难者，此名阳明也。
  text_trad: 問曰：何緣得陽明病？答曰：太陽病，若發汗，若下，若利小便，此亡津液，胃中乾燥，因轉屬陽明。不更衣，內實，大便難者，此名陽明也。
  entities: [six_channel.taiyang, six_channel.yangming]
- id: clause.shl.182
  'no': 182
  section: 辨阳明病脉证并治
  text: 问曰：阳明病外证云何？答曰：身热，汗自出，不恶寒，反恶热者也。
  text_trad: 問曰：陽明病外證云何？答曰：身熱，汗自出，不惡寒，反惡熱者也。
  entities: [six_channel.yangming]
- id: clause.shl.183
  'no': 183
  section: 辨阳明病脉证并治
  text: 问曰：病有得之一日，不发热而恶寒者，何也？答曰：虽得之一日，恶寒将自罢，即自汗出而恶热也。
  text_trad: 問曰：病有得之一日，不發熱而惡寒者，何也？答曰：雖得之一日，惡寒將自罷，即自汗出而惡熱也。
  entities: []
- id: clause.shl.184
  'no': 184
  section: 辨阳明病脉证并治
  text: 问曰：恶寒何故自罢？答曰：阳明居中，主土也，万物所归，无所复传，始虽恶寒，二日自止，此为阳明病也。
  text_trad: 問曰：惡寒何故自罷？答曰：陽明居中，主土也，萬物所歸，無所復傳，始雖惡寒，二日自止，此為陽明病也。
  entities: [six_channel.yangming]
- id: clause.shl.185
  'no': 185
  section: 辨阳明病脉证并治
  text: 本太阳，初得病时，发其汗，汗先出不彻，因转属阳明也。伤寒发热，无汗，呕不能食，而反汗出濈濈然者，是转属阳明也。
  text_trad: 本太陽，初得病時，發其汗，汗先出不徹，因轉屬陽明也。傷寒發熱，無汗，嘔不能食，而反汗出濈濈然者，是轉屬陽明也。
  entities: []
- id: clause.shl.186
  'no': 186
  section: 辨阳明病脉证并治
  text: 伤寒三日，阳明脉大。
  text_trad: 傷寒三日，陽明脈大。
  entities: []
- id: clause.shl.187
  'no': 187
  section: 辨阳明病脉证并治
  text: 伤寒脉浮而缓，手足自温者，是为系在太阴。太阴者，身当发黄，若小便自利者，不能发黄；至七八日，大便硬者，为阳明病也。
  text_trad: 傷寒脈浮而緩，手足自溫者，是為繫在太陰。太陰者，身當發黃，若小便自利者，不能發黃；至七八日，大便鞕者，為陽明病也。
  entities: [six_channel.yangming]
- id: clause.shl.188
  'no': 188
  section: 辨阳明病脉证并治
  text: 伤寒转系阳明者，其人濈然微汗出也。
  text_trad: 傷寒轉繫陽明者，其人濈然微汗出也。
  entities: []
- id: clause.shl.189
  'no': 189
  section: 辨阳明病脉证并治
  text: 阳明中风，口苦咽干，腹满微喘，发热恶寒，脉浮而紧。若下之，则腹满，小便难也。
  text_trad: 陽明中風，口苦咽乾，腹滿微喘，發熱惡寒，脈浮而緊。若下之，則腹滿，小便難也。
  entities: [six_channel.yangming]
- id: clause.shl.190
  'no': 190
  section: 辨阳明病脉证并治
  text: 阳明病，若能食，名中风；不能食，名中寒。
  text_trad: 陽明病，若能食，名中風；不能食，名中寒。
  entities: [six_channel.yangming]
- id: clause.shl.191
  'no': 191
  section: 辨阳明病脉证并治
  text: 阳明病，若中寒者，不能食，小便不利，手足濈然汗出，此欲作固瘕，必大便初硬后溏。所以然者，以胃中冷，水谷不别故也。
  text_trad: 陽明病，若中寒者，不能食，小便不利，手足濈然汗出，此欲作固瘕，必大便初鞕後溏。所以然者，以胃中冷，水穀不別故也。
  entities: [six_channel.yangming]
- id: clause.shl.192
  'no': 192
  section: 辨阳明病脉证并治
  text: 阳明病，初欲食，小便反不利，大便自调，其人骨节疼，翕翕如有热状，奄然发狂，濈然汗出而解者，此水不胜谷气，与汗共并，脉紧则愈。
  text_trad: 陽明病，初欲食，小便反不利，大便自調，其人骨節疼，翕翕如有熱狀，奄然發狂，濈然汗出而解者，此水不勝穀氣，與汗共并，脈緊則愈。
  entities: [six_channel.yangming]
- id: clause.shl.193
  'no': 193
  section: 辨阳明病脉证并治
  text: 阳明病，欲解时，从申至戌上。
  text_trad: 陽明病，欲解時，從申至戌上。
  entities: [six_channel.yangming]
- id: clause.shl.194
  'no': 194
  section: 辨阳明病脉证并治
  text: 阳明病，不能食，攻其热必哕，所以然者，胃中虚冷故也。以其人本虚，攻其热必哕。
  text_trad: 陽明病，不能食，攻其熱必噦，所以然者，胃中虛冷故也。以其人本虛，攻其熱必噦。
  entities: [six_channel.yangming]
- id: clause.shl.195
  'no': 195
  section: 辨阳明病脉证并治
  text: 阳明病，脉迟，食难用饱，饱则微烦头眩，必小便难，此欲作谷瘅，虽下之，腹满如故，所以然者，脉迟故也。
  text_trad: 陽明病，脈遲，食難用飽，飽則微煩頭眩，必小便難，此欲作穀癉，雖下之，腹滿如故，所以然者，脈遲故也。
  entities: [six_channel.yangming]
- id: clause.shl.196
  'no': 196
  section: 辨阳明病脉证并治
  text: 阳明病，法多汗，反无汗，其身如虫行皮中状者，此以久虚故也。
  text_trad: 陽明病，法多汗，反無汗，其身如蟲行皮中狀者，此以久虛故也。
  entities: [six_channel.yangming]
- id: clause.shl.197
  'no': 197
  section: 辨阳明病脉证并治
  text: 阳明病，反无汗而小便利，二三日呕而咳，手足厥者，必苦头痛；若不咳，不呕，手足不厥者，头不痛。
  text_trad: 陽明病，反無汗而小便利，二三日嘔而咳，手足厥者，必苦頭痛；若不咳，不嘔，手足不厥者，頭不痛。
  entities: [six_channel.yangming]
- id: clause.shl.198
  'no': 198
  section: 辨阳明病脉证并治
  text: 阳明病，但头眩，不恶寒，故能食而咳，其人咽必痛；若不咳者，咽不痛。
  text_trad: 陽明病，但頭眩，不惡寒，故能食而咳，其人咽必痛；若不咳者，咽不痛。
  entities: [six_channel.yangming]
- id: clause.shl.199
  'no': 199
  section: 辨阳明病脉证并治
  text: 阳明病，无汗，小便不利，心中懊𢙐者，身必发黄。
  text_trad: 陽明病，無汗，小便不利，心中懊憹者，身必發黃。
  entities: [six_channel.yangming]
- id: clause.shl.200
  'no': 200
  section: 辨阳明病脉证并治
  text: 阳明病，被火，额上微汗出，而小便不利者，必发黄。
  text_trad: 陽明病，被火，額上微汗出，而小便不利者，必發黃。
  entities: [six_channel.yangming]
- id: clause.shl.201
  'no': 201
  section: 辨阳明病脉证并治
  text: 阳明病，脉浮而紧者，必潮热，发作有时，但浮者，必盗汗出。
  text_trad: 陽明病，脈浮而緊者，必潮熱，發作有時，但浮者，必盜汗出。
  entities: [six_channel.yangming]
- id: clause.shl.202
  'no': 202
  section: 辨阳明病脉证并治
  text: 阳明病，口燥，但欲漱水，不欲咽者，此必衄。
  text_trad: 陽明病，口燥，但欲漱水，不欲嚥者，此必衄。
  entities: [six_channel.yangming]
- id: clause.shl.203
  'no': 203
  section: 辨阳明病脉证并治
  text: 阳明病，本自汗出，医更重发汗，病已差，尚微烦不了了者，此必大便硬故也。以亡津液，胃中干燥，故令大便硬。当问其小便日几行。若本小便日三四行，今日再行，故知大便不久出。今为小便数少，以津液当还入胃中，故知不久必大便也。
  text_trad: 陽明病，本自汗出，醫更重發汗，病已差，尚微煩不了了者，此必大便鞕故也。以亡津液，胃中乾燥，故令大便鞕。當問其小便日幾行。若本小便日三四行，今日再行，故知大便不久出。今為小便數少，以津液當還入胃中，故知不久必大便也。
  entities: [six_channel.yangming]
- id: clause.shl.204
  'no': 204
  section: 辨阳明病脉证并治
  text: 伤寒呕多，虽有阳明证，不可攻之。
  text_trad: 傷寒嘔多，雖有陽明證，不可攻之。
  entities: []
- id: clause.shl.205
  'no': 205
  section: 辨阳明病脉证并治
  text: 阳明病，心下硬满者，不可攻之。攻之，利遂不止者死，利止者愈。
  text_trad: 陽明病，心下鞕滿者，不可攻之。攻之，利遂不止者死，利止者愈。
  entities: [six_channel.yangming]
- id: clause.shl.206
  'no': 206
  section: 辨阳明病脉证并治
  text: 阳明病，面合色赤，不可攻之，必发热、色黄者，小便不利也。
  text_trad: 陽明病，面合色赤，不可攻之，必發熱、色黃者，小便不利也。
  entities: [six_channel.yangming]
- id: clause.shl.207
  'no': 207
  section: 辨阳明病脉证并治
  text: 阳明病，不吐不下，心烦者，可与调胃承气汤。
  text_trad: 陽明病，不吐不下，心煩者，可與調胃承氣湯。
  entities: [formula.diao_wei_cheng_qi_tang, six_channel.yangming]
- id: clause.shl.208
  'no': 208
  section: 辨阳明病脉证并治
  text: 阳明病，脉迟，虽汗出不恶寒者，其身必重，短气，腹满而喘，有潮热者，此外欲解，可攻里也。手足濈然汗出者，此大便已硬也，大承气汤主之；若汗多，微发热恶寒者，外未解也，其热不潮，未可与承气汤；若腹大满不通者，可与小承气汤，微和胃气，勿令致大泄下。
  text_trad: 陽明病，脈遲，雖汗出不惡寒者，其身必重，短氣，腹滿而喘，有潮熱者，此外欲解，可攻裏也。手足濈然汗出者，此大便已鞕也，大承氣湯主之；若汗多，微發熱惡寒者，外未解也，其熱不潮，未可與承氣湯；若腹大滿不通者，可與小承氣湯，微和胃氣，勿令致大泄下。
  entities: [formula.da_cheng_qi_tang, formula.xiao_cheng_qi_tang, formula.cheng_qi_tang, six_channel.yangming]
- id: clause.shl.209
  'no': 209
  section: 辨阳明病脉证并治
  text: 阳明病，潮热，大便微硬者，可与大承气汤，不硬者，不可与之。若不大便六七日，恐有燥屎，欲知之法，少与小承气汤。汤入腹中，转矢气者，此有燥屎也，乃可攻之；若不转矢气者，此但初头硬，后必溏，不可攻之，攻之必胀满不能食也。欲饮水者，与水则哕。其后发热者，必大便复硬而少也，以小承气汤和之。不转矢气者，慎不可攻也。
  text_trad: 陽明病，潮熱，大便微鞕者，可與大承氣湯，不鞕者，不可與之。若不大便六七日，恐有燥屎，欲知之法，少與小承氣湯。湯入腹中，轉矢氣者，此有燥屎也，乃可攻之；若不轉矢氣者，此但初頭鞕，後必溏，不可攻之，攻之必脹滿不能食也。欲飲水者，與水則噦。其後發熱者，必大便復鞕而少也，以小承氣湯和之。不轉矢氣者，慎不可攻也。
  entities: [formula.da_cheng_qi_tang, formula.xiao_cheng_qi_tang, six_channel.yangming]
- id: clause.shl.210
  'no': 210
  section: 辨阳明病脉证并治
  text: 夫实则谵语，虚则郑声，郑声者，重语也。直视，谵语，喘满者死，下利者亦死。
  text_trad: 夫實則譫語，虛則鄭聲，鄭聲者，重語也。直視，譫語，喘滿者死，下利者亦死。
  entities: []
- id: clause.shl.211
  'no': 211
  section: 辨阳明病脉证并治
  text: 发汗多，若重发汗者，亡其阳，谵语，脉短者死，脉自和者不死。
  text_trad: 發汗多，若重發汗者，亡其陽，譫語，脈短者死，脈自和者不死。
  entities: []
- id: clause.shl.212
  'no': 212
  section: 辨阳明病脉证并治
  text: 伤寒若吐若下后，不解，不大便五六日，上至十余日。日晡所发潮热，不恶寒，独语如见鬼状。若剧者，发则不识人，循衣摸床，惕而不安，微喘直视。脉弦者生，涩者死。微者，但发热谵语者，大承气汤主之。若一服利，则止后服。
  text_trad: 傷寒若吐若下後，不解，不大便五六日，上至十餘日。日晡所發潮熱，不惡寒，獨語如見鬼狀。若劇者，發則不識人，循衣摸床，惕而不安，微喘直視。脈弦者生，澀者死。微者，但發熱譫語者，大承氣湯主之。若一服利，則止後服。
  entities: [formula.da_cheng_qi_tang]
- id: clause.shl.213
  'no': 213
  section: 辨阳明病脉证并治
  text: 阳明病，其人多汗，以津液外出，胃中燥，大便必硬，硬则谵语。小承气汤主之。若一服谵语止者，更莫复服。
  text_trad: 陽明病，其人多汗，以津液外出，胃中燥，大便必鞕，鞕則譫語。小承氣湯主之。若一服譫語止者，更莫復服。
  entities: [formula.xiao_cheng_qi_tang, six_channel.yangming]
- id: clause.shl.214
  'no': 214
  section: 辨阳明病脉证并治
  text: 阳明病，谵语，发潮热，脉滑而疾者，小承气汤主之。因与承气汤一升，腹中转气者，更服一升；若不转气者，勿更与之。明日又不大便，脉反微涩者，里虚也，为难治，不可更与承气汤也。
  text_trad: 陽明病，譫語，發潮熱，脈滑而疾者，小承氣湯主之。因與承氣湯一升，腹中轉氣者，更服一升；若不轉氣者，勿更與之。明日又不大便，脈反微澀者，裏虛也，為難治，不可更與承氣湯也。
  entities: [formula.xiao_cheng_qi_tang, formula.cheng_qi_tang, six_channel.yangming]
- id: clause.shl.215
  'no': 215
  section: 辨阳明病脉证并治
  text: 阳明病，谵语，有潮热，反不能食者，胃中必有燥屎五六枚也。若能食者，但硬耳。宜大承气汤下之。
  text_trad: 陽明病，譫語，有潮熱，反不能食者，胃中必有燥屎五六枚也。若能食者，但鞕耳。宜大承氣湯下之。
  entities: [formula.da_cheng_qi_tang, six_channel.yangming]
- id: clause.shl.216
  'no': 216
  section: 辨阳明病脉证并治
  text: 阳明病，下血，谵语者，此为热入血室。但头汗出者，刺期门，随其实而泻之，濈然汗出则愈。
  text_trad: 陽明病，下血，譫語者，此為熱入血室。但頭汗出者，刺期門，隨其實而瀉之，濈然汗出則愈。
  entities: [six_channel.yangming]
- id: clause.shl.217
  'no': 217
  section: 辨阳明病脉证并治
  text: 汗出，谵语者，以有燥屎在胃中，此为风也。须下者，过经乃可下之。下之若早，语言必乱，以表虚里实故也。下之愈，宜大承气汤。
  text_trad: 汗出，譫語者，以有燥屎在胃中，此為風也。須下者，過經乃可下之。下之若早，語言必亂，以表虛裏實故也。下之愈，宜大承氣湯。
  entities: [formula.da_cheng_qi_tang]
- id: clause.shl.218
  'no': 218
  section: 辨阳明病脉证并治
  text: 伤寒四五日，脉沉而喘满，沉为在里，而反发其汗，津液越出，大便为难，表虚里实，久则谵语。
  text_trad: 傷寒四五日，脈沉而喘滿，沉為在裏，而反發其汗，津液越出，大便為難，表虛裏實，久則譫語。
  entities: []
- id: clause.shl.219
  'no': 219
  section: 辨阳明病脉证并治
  text: 三阳合病，腹满，身重，难以转侧，口不仁，面垢，谵语，遗尿。发汗则谵语，下之则额上生汗，手足厥冷。若自汗出者，白虎汤主之。
  text_trad: 三陽合病，腹滿，身重，難以轉側，口不仁，面垢，譫語，遺尿。發汗則譫語，下之則額上生汗，手足厥冷。若自汗出者，白虎湯主之。
  entities: [formula.bai_hu_tang]
- id: clause.shl.220
  'no': 220
  section: 辨阳明病脉证并治
  text: 二阳并病，太阳证罢，但发潮热，手足漐漐汗出，大便难而谵语者，下之则愈，宜大承气汤。
  text_trad: 二陽并病，太陽證罷，但發潮熱，手足漐漐汗出，大便難而譫語者，下之則愈，宜大承氣湯。
  entities: [formula.da_cheng_qi_tang]
- id: clause.shl.221
  'no': 221
  section: 辨阳明病脉证并治
  text: 阳明病，脉浮而紧，咽燥，口苦，腹满而喘，发热汗出，不恶寒，反恶热，身重。若发汗则躁，心愦愦，反谵语，若加温针，必怵惕，烦躁不得眠。若下之，则胃中空虚，客气动膈，心中懊𢙐，舌上胎者，栀子豉汤主之。
  text_trad: 陽明病，脈浮而緊，咽燥，口苦，腹滿而喘，發熱汗出，不惡寒，反惡熱，身重。若發汗則躁，心憒憒，反譫語，若加溫針，必怵惕，煩躁不得眠。若下之，則胃中空虛，客氣動膈，心中懊憹，舌上胎者，梔子豉湯主之。
  entities: [formula.zhi_zi_shi_tang, six_channel.yangming]
- id: clause.shl.222
  'no': 222
  section: 辨阳明病脉证并治
  text: 若渴欲饮水，口干舌燥者，白虎加人参汤主之。
  text_trad: 若渴欲飲水，口乾舌燥者，白虎加人參湯主之。
  entities: [formula.bai_hu_jia_ren_shen_tang]
- id: clause.shl.223
  'no': 223
  section: 辨阳明病脉证并治
  text: 若脉浮，发热，渴欲饮水，小便不利者，猪苓汤主之。
  text_trad: 若脈浮，發熱，渴欲飲水，小便不利者，豬苓湯主之。
  entities: [formula.zhu_ling_tang]
- id: clause.shl.224
  'no': 224
  section: 辨阳明病脉证并治
  text: 阳明病，汗出多而渴者，不可与猪苓汤，以汗多胃中燥，猪苓汤复利其小便故也。
  text_trad: 陽明病，汗出多而渴者，不可與豬苓湯，以汗多胃中燥，豬苓湯復利其小便故也。
  entities: [formula.zhu_ling_tang, six_channel.yangming]
- id: clause.shl.225
  'no': 225
  section: 辨阳明病脉证并治
  text: 脉浮而迟，表热里寒，下利清谷者，四逆汤主之。
  text_trad: 脈浮而遲，表熱裏寒，下利清穀者，四逆湯主之。
  entities: [formula.si_ni_tang]
- id: clause.shl.226
  'no': 226
  section: 辨阳明病脉证并治
  text: 若胃中虚冷，不能食者，饮水则哕。
  text_trad: 若胃中虛冷，不能食者，飲水則噦。
  entities: []
- id: clause.shl.227
  'no': 227
  section: 辨阳明病脉证并治
  text: 脉浮，发热，口干，鼻燥，能食者则衄。
  text_trad: 脈浮，發熱，口乾，鼻燥，能食者則衄。
  entities: []
- id: clause.shl.228
  'no': 228
  section: 辨阳明病脉证并治
  text: 阳明病，下之，其外有热，手足温，不结胸，心中懊𢙐，饥不能食，但头汗出者，栀子豉汤主之。
  text_trad: 陽明病，下之，其外有熱，手足溫，不結胸，心中懊憹，飢不能食，但頭汗出者，梔子豉湯主之。
  entities: [formula.zhi_zi_shi_tang, six_channel.yangming]
- id: clause.shl.229
  'no': 229
  section: 辨阳明病脉证并治
  text: 阳明病，发潮热，大便溏，小便自可，胸胁满不去者，与小柴胡汤。
  text_trad: 陽明病，發潮熱，大便溏，小便自可，胸脅滿不去者，與小柴胡湯。
  entities: [formula.xiao_chai_hu_tang, six_channel.yangming]
- id: clause.shl.230
  'no': 230
  section: 辨阳明病脉证并治
  text: 阳明病，胁下硬满，不大便，而呕，舌上白胎者，可与小柴胡汤。上焦得通，津液得下，胃气因和，身濈然汗出而解。
  text_trad: 陽明病，脅下鞕滿，不大便，而嘔，舌上白胎者，可與小柴胡湯。上焦得通，津液得下，胃氣因和，身濈然汗出而解。
  entities: [formula.xiao_chai_hu_tang, six_channel.yangming]
- id: clause.shl.231
  'no': 231
  section: 辨阳明病脉证并治
  text: 阳明中风，脉弦浮大而短气，腹都满，胁下及心痛，久按之气不通，鼻干，不得汗，嗜卧，一身及目悉黄，小便难，有潮热，时时哕，耳前后肿。刺之小差，外不解，病过十日，脉续浮者，与小柴胡汤。
  text_trad: 陽明中風，脈弦浮大而短氣，腹都滿，脅下及心痛，久按之氣不通，鼻乾，不得汗，嗜臥，一身及目悉黃，小便難，有潮熱，時時噦，耳前後腫。刺之小差，外不解，病過十日，脈續浮者，與小柴胡湯。
  entities: [formula.xiao_chai_hu_tang, six_channel.yangming]
- id: clause.shl.232
  'no': 232
  section: 辨阳明病脉证并治
  text: 脉但浮，无余证者，与麻黄汤。若不尿，腹满加哕者，不治。
  text_trad: 脈但浮，無餘證者，與麻黃湯。若不尿，腹滿加噦者，不治。
  entities: [formula.ma_huang_tang]
- id: clause.shl.233
  'no': 233
  section: 辨阳明病脉证并治
  text: 阳明病，自汗出，若发汗，小便自利者，此为津液内竭，虽硬不可攻之，当须自欲大便，宜蜜煎导而通之，若土瓜根及大猪胆汁，皆可为导。
  text_trad: 陽明病，自汗出，若發汗，小便自利者，此為津液內竭，雖鞕不可攻之，當須自欲大便，宜蜜煎導而通之，若土瓜根及大豬膽汁，皆可為導。
  entities: [formula.mi_jian_dao, six_channel.yangming]
- id: clause.shl.234
  'no': 234
  section: 辨阳明病脉证并治
  text: 阳明病，脉迟，汗出多，微恶寒者，表未解也，可发汗，宜桂枝汤。
  text_trad: 陽明病，脈遲，汗出多，微惡寒者，表未解也，可發汗，宜桂枝湯。
  entities: [formula.gui_zhi_tang, six_channel.yangming]
- id: clause.shl.235
  'no': 235
  section: 辨阳明病脉证并治
  text: 阳明病，脉浮，无汗而喘者，发汗则愈，宜麻黄汤。
  text_trad: 陽明病，脈浮，無汗而喘者，發汗則愈，宜麻黃湯。
  entities: [formula.ma_huang_tang, six_channel.yangming]
- id: clause.shl.236
  'no': 236
  section: 辨阳明病脉证并治
  text: 阳明病，发热汗出者，此为热越，不能发黄也；但头汗出，身无汗，剂颈而还，小便不利，渴引水浆者，此为瘀热在里，身必发黄，茵陈蒿汤主之。
  text_trad: 陽明病，發熱汗出者，此為熱越，不能發黃也；但頭汗出，身無汗，劑頸而還，小便不利，渴引水漿者，此為瘀熱在裏，身必發黃，茵陳蒿湯主之。
  entities: [formula.yin_chen_hao_tang, six_channel.yangming]
- id: clause.shl.237
  'no': 237
  section: 辨阳明病脉证并治
  text: 阳明证，其人喜忘者，必有畜血。所以然者，本有久瘀血，故令喜忘，屎虽硬，大便反易，其色必黑者，宜抵当汤下之。
  text_trad: 陽明證，其人喜忘者，必有畜血。所以然者，本有久瘀血，故令喜忘，屎雖鞕，大便反易，其色必黑者，宜抵當湯下之。
  entities: [formula.di_dang_tang]
- id: clause.shl.238
  'no': 238
  section: 辨阳明病脉证并治
  text: 阳明病，下之，心中懊𢙐而烦，胃中有燥屎者，可攻。腹微满，初头硬，后必溏，不可攻之。若有燥屎者，宜大承气汤。
  text_trad: 陽明病，下之，心中懊憹而煩，胃中有燥屎者，可攻。腹微滿，初頭鞕，後必溏，不可攻之。若有燥屎者，宜大承氣湯。
  entities: [formula.da_cheng_qi_tang, six_channel.yangming]
- id: clause.shl.239
  'no': 239
  section: 辨阳明病脉证并治
  text: 病人不大便五六日，绕脐痛，烦躁，发作有时者，此有燥屎，故使不大便也。
  text_trad: 病人不大便五六日，繞臍痛，煩躁，發作有時者，此有燥屎，故使不大便也。
  entities: []
- id: clause.shl.240
  'no': 240
  section: 辨阳明病脉证并治
  text: 病人烦热，汗出则解，又如疟状，日晡所发热者，属阳明也。脉实者，宜下之；脉浮虚者，宜发汗。下之，与大承气汤；发汗，宜桂枝汤。
  text_trad: 病人煩熱，汗出則解，又如瘧狀，日晡所發熱者，屬陽明也。脈實者，宜下之；脈浮虛者，宜發汗。下之，與大承氣湯；發汗，宜桂枝湯。
  entities: [formula.da_cheng_qi_tang, formula.gui_zhi_tang]
- id: clause.shl.241
  'no': 241
  section: 辨阳明病脉证并治
  text: 大下后，六七日不大便，烦不解，腹满痛者，此有燥屎也。所以然者，本有宿食故也，宜大承气汤。
  text_trad: 大下後，六七日不大便，煩不解，腹滿痛者，此有燥屎也。所以然者，本有宿食故也，宜大承氣湯。
  entities: [formula.da_cheng_qi_tang]
- id: clause.shl.242
  'no': 242
  section: 辨阳明病脉证并治
  text: 病人小便不利，大便乍难乍易，时有微热，喘冒不能卧者，有燥屎也。宜大承气汤。
  text_trad: 病人小便不利，大便乍難乍易，時有微熱，喘冒不能臥者，有燥屎也。宜大承氣湯。
  entities: [formula.da_cheng_qi_tang]
- id: clause.shl.243
  'no': 243
  section: 辨阳明病脉证并治
  text: 食谷欲呕，属阳明也，吴茱萸汤主之；得汤反剧者，属上焦也。
  text_trad: 食穀欲嘔，屬陽明也，吳茱萸湯主之；得湯反劇者，屬上焦也。
  entities: [formula.wu_zhu_yu_tang]
- id: clause.shl.244
  'no': 244
  section: 辨阳明病脉证并治
  text: 太阳病，寸缓、关浮、尺弱，其人发热汗出，复恶寒，不呕，但心下痞者，此以医下之也。如其不下者，病人不恶寒而渴者，此转属阳明也，小便数者，大便必硬，不更衣十日，无所苦也。渴欲饮水，少少与之，但以法救之，渴者，宜五苓散。
  text_trad: 太陽病，寸緩、關浮、尺弱，其人發熱汗出，復惡寒，不嘔，但心下痞者，此以醫下之也。如其不下者，病人不惡寒而渴者，此轉屬陽明也，小便數者，大便必鞕，不更衣十日，無所苦也。渴欲飲水，少少與之，但以法救之，渴者，宜五苓散。
  entities: [formula.wu_ling_san, six_channel.taiyang]
- id: clause.shl.245
  'no': 245
  section: 辨阳明病脉证并治
  text: 阳脉微而汗出少者，为自和也；汗出多者为太过，阳脉实。因发其汗，出多者，亦为太过，太过者，为阳绝于里，亡津液，大便因硬也。
  text_trad: 陽脈微而汗出少者，為自和也；汗出多者為太過，陽脈實。因發其汗，出多者，亦為太過，太過者，為陽絕於裏，亡津液，大便因鞕也。
  entities: []
- id: clause.shl.246
  'no': 246
  section: 辨阳明病脉证并治
  text: 脉浮而芤，浮为阳，芤为阴，浮芤相搏，胃气生热，其阳则绝。
  text_trad: 脈浮而芤，浮為陽，芤為陰，浮芤相搏，胃氣生熱，其陽則絕。
  entities: []
- id: clause.shl.247
  'no': 247
  section: 辨阳明病脉证并治
  text: 趺阳脉浮而涩，浮则胃气强，涩则小便数，浮涩相搏，大便则硬，其脾为约，麻子仁丸主之。
  text_trad: 趺陽脈浮而澀，浮則胃氣強，澀則小便數，浮澀相搏，大便則鞕，其脾為約，麻子仁丸主之。
  entities: [formula.ma_zi_ren_wan]
- id: clause.shl.248
  'no': 248
  section: 辨阳明病脉证并治
  text: 太阳病三日，发汗不解，蒸蒸发热者，属胃也，调胃承气汤主之。
  text_trad: 太陽病三日，發汗不解，蒸蒸發熱者，屬胃也，調胃承氣湯主之。
  entities: [formula.diao_wei_cheng_qi_tang, six_channel.taiyang]
- id: clause.shl.249
  'no': 249
  section: 辨阳明病脉证并治
  text: 伤寒吐后，腹胀满者，与调胃承气汤。
  text_trad: 傷寒吐後，腹脹滿者，與調胃承氣湯。
  entities: [formula.diao_wei_cheng_qi_tang]
- id: clause.shl.250
  'no': 250
  section: 辨阳明病脉证并治
  text: 太阳病，若吐、若下，若发汗后，微烦，小便数，大便因硬者，与小承气汤，和之愈。
  text_trad: 太陽病，若吐、若下，若發汗後，微煩，小便數，大便因鞕者，與小承氣湯，和之愈。
  entities: [formula.xiao_cheng_qi_tang, six_channel.taiyang]
- id: clause.shl.251
  'no': 251
  section: 辨阳明病脉证并治
  text: 得病二三日，脉弱，无太阳柴胡证，烦躁，心下硬，至四五日，虽能食，以小承气汤少少与，微和之，令小安。至六日，与承气汤一升。若不大便六七日，小便少者，虽不受食，但初头硬，后必溏，未定成硬，攻之必溏，须小便利，屎定硬，乃可攻之，宜大承气汤。
  text_trad: 得病二三日，脈弱，無太陽柴胡證，煩躁，心下鞕，至四五日，雖能食，以小承氣湯少少與，微和之，令小安。至六日，與承氣湯一升。若不大便六七日，小便少者，雖不受食，但初頭鞕，後必溏，未定成鞕，攻之必溏，須小便利，屎定鞕，乃可攻之，宜大承氣湯。
  entities: [formula.da_cheng_qi_tang, formula.xiao_cheng_qi_tang, formula.cheng_qi_tang]
- id: clause.shl.252
  'no': 252
  section: 辨阳明病脉证并治
  text: 伤寒六七日，目中不了了，睛不和，无表里证，大便难，身微热者，此为实也。急下之，宜大承气汤。
  text_trad: 傷寒六七日，目中不了了，睛不和，無表裏證，大便難，身微熱者，此為實也。急下之，宜大承氣湯。
  entities: [formula.da_cheng_qi_tang]
- id: clause.shl.253
  'no': 253
  section: 辨阳明病脉证并治
  text: 阳明病，发热，汗多者，急下之，宜大承气汤。
  text_trad: 陽明病，發熱，汗多者，急下之，宜大承氣湯。
  entities: [formula.da_cheng_qi_tang, six_channel.yangming]
- id: clause.shl.254
  'no': 254
  section: 辨阳明病脉证并治
  text: 发汗不解，腹满痛者，急下之，宜大承气汤。
  text_trad: 發汗不解，腹滿痛者，急下之，宜大承氣湯。
  entities: [formula.da_cheng_qi_tang]
- id: clause.shl.255
  'no': 255
  section: 辨阳明病脉证并治
  text: 腹满不减，减不足言，当下之，宜大承气汤。
  text_trad: 腹滿不減，減不足言，當下之，宜大承氣湯。
  entities: [formula.da_cheng_qi_tang]
- id: clause.shl.256
  'no': 256
  section: 辨阳明病脉证并治
  text: 阳明少阳合病，必下利，其脉不负者，为顺也。负者，失也。互相克贼，名为负也。脉滑而数者，有宿食也。当下之，宜大承气汤。
  text_trad: 陽明少陽合病，必下利，其脈不負者，為順也。負者，失也。互相剋賊，名為負也。脈滑而數者，有宿食也。當下之，宜大承氣湯。
  entities: [formula.da_cheng_qi_tang]
- id: clause.shl.257
  'no': 257
  section: 辨阳明病脉证并治
  text: 病人无表里证，发热七八日，虽脉浮数者，可下之。假令已下，脉数不解，合热则消谷善饥，至六七日，不大便者，有瘀血，宜抵当汤。
  text_trad: 病人無表裏證，發熱七八日，雖脈浮數者，可下之。假令已下，脈數不解，合熱則消穀善飢，至六七日，不大便者，有瘀血，宜抵當湯。
  entities: [formula.di_dang_tang]
- id: clause.shl.258
  'no': 258
  section: 辨阳明病脉证并治
  text: 若脉数不解，而下不止，必协热便脓血也。
  text_trad: 若脈數不解，而下不止，必協熱便膿血也。
  entities: []
- id: clause.shl.259
  'no': 259
  section: 辨阳明病脉证并治
  text: 伤寒发汗已，身目为黄，所以然者，以寒湿在里不解故也，以为不可下也，于寒湿中求之。
  text_trad: 傷寒發汗已，身目為黃，所以然者，以寒濕在裏不解故也，以為不可下也，於寒濕中求之。
  entities: []
- id: clause.shl.260
  'no': 260
  section: 辨阳明病脉证并治
  text: 伤寒七八日，身黄如橘子色，小便不利，腹微满者，茵陈蒿汤主之。
  text_trad: 傷寒七八日，身黃如橘子色，小便不利，腹微滿者，茵陳蒿湯主之。
  entities: [formula.yin_chen_hao_tang]
- id: clause.shl.261
  'no': 261
  section: 辨阳明病脉证并治
  text: 伤寒，身黄，发热，栀子柏皮汤主之。
  text_trad: 傷寒，身黃，發熱，梔子柏皮湯主之。
  entities: []
- id: clause.shl.262
  'no': 262
  section: 辨阳明病脉证并治
  text: 伤寒瘀热在里，身必黄，麻黄连轺赤小豆汤主之。
  text_trad: 傷寒瘀熱在裏，身必黃，麻黃連軺赤小豆湯主之。
  entities: [formula.ma_huang_lian_yao_chi_xiao_dou_tang]
- id: clause.shl.263
  'no': 263
  section: 辨少阳病脉证并治
  text: 少阳之为病，口苦，咽干，目眩也。
  text_trad: 少陽之為病，口苦，咽乾，目眩也。
  entities: [six_channel.shaoyang]
- id: clause.shl.264
  'no': 264
  section: 辨少阳病脉证并治
  text: 少阳中风，两耳无所闻，目赤，胸中满而烦者，不可吐下，吐下则悸而惊。
  text_trad: 少陽中風，兩耳無所聞，目赤，胸中滿而煩者，不可吐下，吐下則悸而驚。
  entities: [six_channel.shaoyang]
- id: clause.shl.265
  'no': 265
  section: 辨少阳病脉证并治
  text: 伤寒，脉弦细，头痛发热者，属少阳。少阳不可发汗，发汗则谵语，此属胃，胃和则愈；胃不和，烦而悸。
  text_trad: 傷寒，脈弦細，頭痛發熱者，屬少陽。少陽不可發汗，發汗則譫語，此屬胃，胃和則愈；胃不和，煩而悸。
  entities: []
- id: clause.shl.266
  'no': 266
  section: 辨少阳病脉证并治
  text: 本太阳病不解，转入少阳者，胁下硬满，干呕不能食，往来寒热，尚未吐下，脉沉紧者，与小柴胡汤。
  text_trad: 本太陽病不解，轉入少陽者，脅下鞕滿，乾嘔不能食，往來寒熱，尚未吐下，脈沉緊者，與小柴胡湯。
  entities: [formula.xiao_chai_hu_tang, six_channel.taiyang]
- id: clause.shl.267
  'no': 267
  section: 辨少阳病脉证并治
  text: 若已吐、下、发汗、温针，谵语，柴胡汤证罢，此为坏病，知犯何逆，以法治之。
  text_trad: 若已吐、下、發汗、溫針，譫語，柴胡湯證罷，此為壞病，知犯何逆，以法治之。
  entities: [formula.chai_hu_tang]
- id: clause.shl.268
  'no': 268
  section: 辨少阳病脉证并治
  text: 三阳合病，脉浮大，上关上，但欲眠睡，目合则汗。
  text_trad: 三陽合病，脈浮大，上關上，但欲眠睡，目合則汗。
  entities: []
- id: clause.shl.269
  'no': 269
  section: 辨少阳病脉证并治
  text: 伤寒六七日，无大热，其人躁烦者，此为阳去入阴故也。
  text_trad: 傷寒六七日，無大熱，其人躁煩者，此為陽去入陰故也。
  entities: []
- id: clause.shl.270
  'no': 270
  section: 辨少阳病脉证并治
  text: 伤寒三日，三阳为尽，三阴当受邪，其人反能食而不呕，此为三阴不受邪也。
  text_trad: 傷寒三日，三陽為盡，三陰當受邪，其人反能食而不嘔，此為三陰不受邪也。
  entities: []
- id: clause.shl.271
  'no': 271
  section: 辨少阳病脉证并治
  text: 伤寒三日，少阳脉小者，欲已也。
  text_trad: 傷寒三日，少陽脈小者，欲已也。
  entities: []
- id: clause.shl.272
  'no': 272
  section: 辨少阳病脉证并治
  text: 少阳病，欲解时，从寅至辰上。
  text_trad: 少陽病，欲解時，從寅至辰上。
  entities: [six_channel.shaoyang]
- id: clause.shl.273
  'no': 273
  section: 辨太阴病脉证并治
  text: 太阴之为病，腹满而吐，食不下，自利益甚，时腹自痛。若下之，必胸下结硬。
  text_trad: 太陰之為病，腹滿而吐，食不下，自利益甚，時腹自痛。若下之，必胸下結鞕。
  entities: [six_channel.taiyin]
- id: clause.shl.274
  'no': 274
  section: 辨太阴病脉证并治
  text: 太阴中风，四肢烦疼，脉阳微阴涩而长者，为欲愈。
  text_trad: 太陰中風，四肢煩疼，脈陽微陰澀而長者，為欲愈。
  entities: [six_channel.taiyin]
- id: clause.shl.275
  'no': 275
  section: 辨太阴病脉证并治
  text: 太阴病，欲解时，从亥至丑上。
  text_trad: 太陰病，欲解時，從亥至丑上。
  entities: [six_channel.taiyin]
- id: clause.shl.276
  'no': 276
  section: 辨太阴病脉证并治
  text: 太阴病，脉浮者，可发汗，宜桂枝汤。
  text_trad: 太陰病，脈浮者，可發汗，宜桂枝湯。
  entities: [formula.gui_zhi_tang, six_channel.taiyin]
- id: clause.shl.277
  'no': 277
  section: 辨太阴病脉证并治
  text: 自利不渴者，属太阴，以其脏有寒故也，当温之，宜服四逆辈。
  text_trad: 自利不渴者，屬太陰，以其臟有寒故也，當溫之，宜服四逆輩。
  entities: []
- id: clause.shl.278
  'no': 278
  section: 辨太阴病脉证并治
  text: 伤寒脉浮而缓，手足自温者，系在太阴。太阴当发身黄，若小便自利者，不能发黄；至七八日，虽暴烦下利，日十余行，必自止，以脾家实，腐秽当去故也。
  text_trad: 傷寒脈浮而緩，手足自溫者，繫在太陰。太陰當發身黃，若小便自利者，不能發黃；至七八日，雖暴煩下利，日十餘行，必自止，以脾家實，腐穢當去故也。
  entities: []
- id: clause.shl.279
  'no': 279
  section: 辨太阴病脉证并治
  text: 本太阳病，医反下之，因尔腹满时痛者，属太阴也，桂枝加芍药汤主之；大实痛者，桂枝加大黄汤主之。
  text_trad: 本太陽病，醫反下之，因爾腹滿時痛者，屬太陰也，桂枝加芍藥湯主之；大實痛者，桂枝加大黃湯主之。
  entities: [formula.gui_zhi_jia_shao_yao_tang, formula.gui_zhi_jia_da_huang_tang, six_channel.taiyang]
- id: clause.shl.280
  'no': 280
  section: 辨太阴病脉证并治
  text: 太阴为病，脉弱，其人续自便利，设当行大黄、芍药者，宜减之，以其人胃气弱，易动故也。
  text_trad: 太陰為病，脈弱，其人續自便利，設當行大黃、芍藥者，宜減之，以其人胃氣弱，易動故也。
  entities: []
- id: clause.shl.281
  'no': 281
  section: 辨少阴病脉证并治
  text: 少阴之为病，脉微细，但欲寐也。
  text_trad: 少陰之為病，脈微細，但欲寐也。
  entities: [six_channel.shaoyin]
- id: clause.shl.282
  'no': 282
  section: 辨少阴病脉证并治
  text: 少阴病，欲吐不吐，心烦，但欲寐，五六日自利而渴者，属少阴也。虚故引水自救。若小便色白者，少阴病形悉具。小便白者，以下焦虚有寒，不能制水，故令色白也。
  text_trad: 少陰病，欲吐不吐，心煩，但欲寐，五六日自利而渴者，屬少陰也。虛故引水自救。若小便色白者，少陰病形悉具。小便白者，以下焦虛有寒，不能制水，故令色白也。
  entities: [six_channel.shaoyin]
- id: clause.shl.283
  'no': 283
  section: 辨少阴病脉证并治
  text: 病人脉阴阳俱紧，反汗出者，亡阳也，此属少阴，法当咽痛而复吐利。
  text_trad: 病人脈陰陽俱緊，反汗出者，亡陽也，此屬少陰，法當咽痛而復吐利。
  entities: []
- id: clause.shl.284
  'no': 284
  section: 辨少阴病脉证并治
  text: 少阴病，咳而下利，谵语者，被火气劫故也。小便必难，以强责少阴汗也。
  text_trad: 少陰病，咳而下利，譫語者，被火氣劫故也。小便必難，以強責少陰汗也。
  entities: [six_channel.shaoyin]
- id: clause.shl.285
  'no': 285
  section: 辨少阴病脉证并治
  text: 少阴病，脉细沉数，病为在里，不可发汗。
  text_trad: 少陰病，脈細沉數，病為在裏，不可發汗。
  entities: [six_channel.shaoyin]
- id: clause.shl.286
  'no': 286
  section: 辨少阴病脉证并治
  text: 少阴病，脉微，不可发汗，亡阳故也。阳已虚，尺脉弱涩者，复不可下之。
  text_trad: 少陰病，脈微，不可發汗，亡陽故也。陽已虛，尺脈弱澀者，復不可下之。
  entities: [six_channel.shaoyin]
- id: clause.shl.287
  'no': 287
  section: 辨少阴病脉证并治
  text: 少阴病，脉紧，至七八日，自下利，脉暴微，手足反温，脉紧反去者，为欲解也，虽烦下利，必自愈。
  text_trad: 少陰病，脈緊，至七八日，自下利，脈暴微，手足反溫，脈緊反去者，為欲解也，雖煩下利，必自愈。
  entities: [six_channel.shaoyin]
- id: clause.shl.288
  'no': 288
  section: 辨少阴病脉证并治
  text: 少阴病，下利，若利自止，恶寒而踡卧，手足温者，可治。
  text_trad: 少陰病，下利，若利自止，惡寒而踡臥，手足溫者，可治。
  entities: [six_channel.shaoyin]
- id: clause.shl.289
  'no': 289
  section: 辨少阴病脉证并治
  text: 少阴病，恶寒而踡，时自烦，欲去衣被者，可治。
  text_trad: 少陰病，惡寒而踡，時自煩，欲去衣被者，可治。
  entities: [six_channel.shaoyin]
- id: clause.shl.290
  'no': 290
  section: 辨少阴病脉证并治
  text: 少阴中风，脉阳微阴浮者，为欲愈。
  text_trad: 少陰中風，脈陽微陰浮者，為欲愈。
  entities: [six_channel.shaoyin]
- id: clause.shl.291
  'no': 291
  section: 辨少阴病脉证并治
  text: 少阴病，欲解时，从子至寅上。
  text_trad: 少陰病，欲解時，從子至寅上。
  entities: [six_channel.shaoyin]
- id: clause.shl.292
  'no': 292
  section: 辨少阴病脉证并治
  text: 少阴病，吐、利，手足不逆冷，反发热者，不死；脉不至者，灸少阴七壮。
  text_trad: 少陰病，吐、利，手足不逆冷，反發熱者，不死；脈不至者，灸少陰七壯。
  entities: [six_channel.shaoyin]
- id: clause.shl.293
  'no': 293
  section: 辨少阴病脉证并治
  text: 少阴病，八九日，一身手足尽热者，以热在膀胱，必便血也。
  text_trad: 少陰病，八九日，一身手足盡熱者，以熱在膀胱，必便血也。
  entities: [six_channel.shaoyin]
- id: clause.shl.294
  'no': 294
  section: 辨少阴病脉证并治
  text: 少阴病，但厥，无汗，而强发之，必动其血。未知从何道出，或从口鼻，或从目出者，是名下厥上竭，为难治。
  text_trad: 少陰病，但厥，無汗，而強發之，必動其血。未知從何道出，或從口鼻，或從目出者，是名下厥上竭，為難治。
  entities: [six_channel.shaoyin]
- id: clause.shl.295
  'no': 295
  section: 辨少阴病脉证并治
  text: 少阴病，恶寒，身踡而利，手足逆冷者，不治。
  text_trad: 少陰病，惡寒，身踡而利，手足逆冷者，不治。
  entities: [six_channel.shaoyin]
- id: clause.shl.296
  'no': 296
  section: 辨少阴病脉证并治
  text: 少阴病，吐、利、躁烦，四逆者，死。
  text_trad: 少陰病，吐、利、躁煩，四逆者，死。
  entities: [six_channel.shaoyin]
- id: clause.shl.297
  'no': 297
  section: 辨少阴病脉证并治
  text: 少阴病，下利止而头眩，时时自冒者，死。
  text_trad: 少陰病，下利止而頭眩，時時自冒者，死。
  entities: [six_channel.shaoyin]
- id: clause.shl.298
  'no': 298
  section: 辨少阴病脉证并治
  text: 少阴病，四逆，恶寒而身踡，脉不至，不烦而躁者，死。
  text_trad: 少陰病，四逆，惡寒而身踡，脈不至，不煩而躁者，死。
  entities: [six_channel.shaoyin]
- id: clause.shl.299
  'no': 299
  section: 辨少阴病脉证并治
  text: 少阴病，六七日，息高者，死。
  text_trad: 少陰病，六七日，息高者，死。
  entities: [six_channel.shaoyin]
- id: clause.shl.300
  'no': 300
  section: 辨少阴病脉证并治
  text: 少阴病，脉微细沉，但欲卧，汗出不烦，自欲吐。至五六日，自利，复烦躁不得卧寐者，死。
  text_trad: 少陰病，脈微細沉，但欲臥，汗出不煩，自欲吐。至五六日，自利，復煩躁不得臥寐者，死。
  entities: [six_channel.shaoyin]
- id: clause.shl.301
  'no': 301
  section: 辨少阴病脉证并治
  text: 少阴病，始得之，反发热，脉沉者，麻黄细辛附子汤主之。
  text_trad: 少陰病，始得之，反發熱，脈沉者，麻黃細辛附子湯主之。
  entities: [formula.ma_huang_xi_xin_fu_zi_tang, six_channel.shaoyin]
- id: clause.shl.302
  'no': 302
  section: 辨少阴病脉证并治
  text: 少阴病，得之二三日，麻黄附子甘草汤微发汗，以二三日无证，故微发汗也。
  text_trad: 少陰病，得之二三日，麻黃附子甘草湯微發汗，以二三日無證，故微發汗也。
  entities: [formula.ma_huang_fu_zi_gan_cao_tang, six_channel.shaoyin]
- id: clause.shl.303
  'no': 303
  section: 辨少阴病脉证并治
  text: 少阴病，得之二三日以上，心中烦，不得卧，黄连阿胶汤主之。
  text_trad: 少陰病，得之二三日以上，心中煩，不得臥，黃連阿膠湯主之。
  entities: [formula.huang_lian_e_jiao_tang, six_channel.shaoyin]
- id: clause.shl.304
  'no': 304
  section: 辨少阴病脉证并治
  text: 少阴病，得之一二日，口中和，其背恶寒者，当灸之，附子汤主之。
  text_trad: 少陰病，得之一二日，口中和，其背惡寒者，當灸之，附子湯主之。
  entities: [formula.fu_zi_tang, six_channel.shaoyin]
- id: clause.shl.305
  'no': 305
  section: 辨少阴病脉证并治
  text: 少阴病，身体痛，手足寒，骨节痛，脉沉者，附子汤主之。
  text_trad: 少陰病，身體痛，手足寒，骨節痛，脈沉者，附子湯主之。
  entities: [formula.fu_zi_tang, six_channel.shaoyin]
- id: clause.shl.306
  'no': 306
  section: 辨少阴病脉证并治
  text: 少阴病，下利，便脓血者，桃花汤主之。
  text_trad: 少陰病，下利，便膿血者，桃花湯主之。
  entities: [formula.tao_hua_tang, six_channel.shaoyin]
- id: clause.shl.307
  'no': 307
  section: 辨少阴病脉证并治
  text: 少阴病，二三日至四五日，腹痛，小便不利，下利不止，便脓血者，桃花汤主之。
  text_trad: 少陰病，二三日至四五日，腹痛，小便不利，下利不止，便膿血者，桃花湯主之。
  entities: [formula.tao_hua_tang, six_channel.shaoyin]
- id: clause.shl.308
  'no': 308
  section: 辨少阴病脉证并治
  text: 少阴病，下利，便脓血者，可刺。
  text_trad: 少陰病，下利，便膿血者，可刺。
  entities: [six_channel.shaoyin]
- id: clause.shl.309
  'no': 309
  section: 辨少阴病脉证并治
  text: 少阴病，吐利，手足逆冷，烦躁欲死者，吴茱萸汤主之。
  text_trad: 少陰病，吐利，手足逆冷，煩躁欲死者，吳茱萸湯主之。
  entities: [formula.wu_zhu_yu_tang, six_channel.shaoyin]
- id: clause.shl.310
  'no': 310
  section: 辨少阴病脉证并治
  text: 少阴病，下利，咽痛，胸满，心烦，猪肤汤主之。
  text_trad: 少陰病，下利，咽痛，胸滿，心煩，豬膚湯主之。
  entities: [formula.zhu_fu_tang, six_channel.shaoyin]
- id: clause.shl.311
  'no': 311
  section: 辨少阴病脉证并治
  text: 少阴病，二三日，咽痛者，可与甘草汤；不差者，与桔梗汤。
  text_trad: 少陰病，二三日，咽痛者，可與甘草湯；不差者，與桔梗湯。
  entities: [formula.gan_cao_tang, formula.jie_geng_tang, six_channel.shaoyin]
- id: clause.shl.312
  'no': 312
  section: 辨少阴病脉证并治
  text: 少阴病，咽中伤，生疮，不能语言，声不出者，苦酒汤主之。
  text_trad: 少陰病，咽中傷，生瘡，不能語言，聲不出者，苦酒湯主之。
  entities: [formula.ku_jiu_tang, six_channel.shaoyin]
- id: clause.shl.313
  'no': 313
  section: 辨少阴病脉证并治
  text: 少阴病，咽中痛，半夏散及汤主之。
  text_trad: 少陰病，咽中痛，半夏散及湯主之。
  entities: [formula.ban_xia_san_ji_tang, six_channel.shaoyin]
- id: clause.shl.314
  'no': 314
  section: 辨少阴病脉证并治
  text: 少阴病，下利，白通汤主之。
  text_trad: 少陰病，下利，白通湯主之。
  entities: [formula.bai_tong_tang, six_channel.shaoyin]
- id: clause.shl.315
  'no': 315
  section: 辨少阴病脉证并治
  text: 少阴病，下利，脉微者，与白通汤。利不止，厥逆无脉，干呕烦者，白通加猪胆汁汤主之。服汤，脉暴出者死，微续者生。
  text_trad: 少陰病，下利，脈微者，與白通湯。利不止，厥逆無脈，乾嘔煩者，白通加豬膽汁湯主之。服湯，脈暴出者死，微續者生。
  entities: [formula.bai_tong_jia_zhu_dan_zhi_tang, formula.bai_tong_tang, six_channel.shaoyin]
- id: clause.shl.316
  'no': 316
  section: 辨少阴病脉证并治
  text: 少阴病，二三日不已，至四五日，腹痛，小便不利，四肢沉重疼痛，自下利者，此为有水气。其人或咳，或小便利，或下利，或呕者，真武汤主之。
  text_trad: 少陰病，二三日不已，至四五日，腹痛，小便不利，四肢沉重疼痛，自下利者，此為有水氣。其人或咳，或小便利，或下利，或嘔者，真武湯主之。
  entities: [formula.zhen_wu_tang, six_channel.shaoyin]
- id: clause.shl.317
  'no': 317
  section: 辨少阴病脉证并治
  text: 少阴病，下利清谷，里寒外热，手足厥逆，脉微欲绝，身反不恶寒。其人面色赤，或腹痛，或干呕，或咽痛，或利止脉不出者，通脉四逆汤主之。
  text_trad: 少陰病，下利清穀，裏寒外熱，手足厥逆，脈微欲絕，身反不惡寒。其人面色赤，或腹痛，或乾嘔，或咽痛，或利止脈不出者，通脈四逆湯主之。
  entities: [formula.tong_mai_si_ni_tang, six_channel.shaoyin]
- id: clause.shl.318
  'no': 318
  section: 辨少阴病脉证并治
  text: 少阴病，四逆，其人或咳，或悸，或小便不利，或腹中痛，或泄利下重者，四逆散主之。
  text_trad: 少陰病，四逆，其人或咳，或悸，或小便不利，或腹中痛，或泄利下重者，四逆散主之。
  entities: [formula.si_ni_san, six_channel.shaoyin]
- id: clause.shl.319
  'no': 319
  section: 辨少阴病脉证并治
  text: 少阴病，下利，六七日，咳而呕渴，心烦不得眠者，猪苓汤主之。
  text_trad: 少陰病，下利，六七日，咳而嘔渴，心煩不得眠者，豬苓湯主之。
  entities: [formula.zhu_ling_tang, six_channel.shaoyin]
- id: clause.shl.320
  'no': 320
  section: 辨少阴病脉证并治
  text: 少阴病，得之二三日，口燥，咽干者，急下之，宜大承气汤。
  text_trad: 少陰病，得之二三日，口燥，咽乾者，急下之，宜大承氣湯。
  entities: [formula.da_cheng_qi_tang, six_channel.shaoyin]
- id: clause.shl.321
  'no': 321
  section: 辨少阴病脉证并治
  text: 少阴病，自利清水，色纯青，心下必痛，口干燥者，可下之，宜大承气汤。
  text_trad: 少陰病，自利清水，色純青，心下必痛，口乾燥者，可下之，宜大承氣湯。
  entities: [formula.da_cheng_qi_tang, six_channel.shaoyin]
- id: clause.shl.322
  'no': 322
  section: 辨少阴病脉证并治
  text: 少阴病，六七日，腹胀，不大便者，急下之，宜大承气汤。
  text_trad: 少陰病，六七日，腹脹，不大便者，急下之，宜大承氣湯。
  entities: [formula.da_cheng_qi_tang, six_channel.shaoyin]
- id: clause.shl.323
  'no': 323
  section: 辨少阴病脉证并治
  text: 少阴病，脉沉者，急温之，宜四逆汤。
  text_trad: 少陰病，脈沉者，急溫之，宜四逆湯。
  entities: [formula.si_ni_tang, six_channel.shaoyin]
- id: clause.shl.324
  'no': 324
  section: 辨少阴病脉证并治
  text: 少阴病，饮食入口则吐，心中温温欲吐，复不能吐，始得之，手足寒，脉弦迟者，此胸中实，不可下也，当吐之。若膈上有寒饮，干呕者，不可吐也，当温之，宜四逆汤。
  text_trad: 少陰病，飲食入口則吐，心中溫溫欲吐，復不能吐，始得之，手足寒，脈弦遲者，此胸中實，不可下也，當吐之。若膈上有寒飲，乾嘔者，不可吐也，當溫之，宜四逆湯。
  entities: [formula.si_ni_tang, six_channel.shaoyin]
- id: clause.shl.325
  'no': 325
  section: 辨少阴病脉证并治
  text: 少阴病，下利，脉微涩，呕而汗出，必数更衣，反少者，当温其上，灸之。
  text_trad: 少陰病，下利，脈微澀，嘔而汗出，必數更衣，反少者，當溫其上，灸之。
  entities: [six_channel.shaoyin]
- id: clause.shl.326
  'no': 326
  section: 辨厥阴病脉证并治
  text: 厥阴之为病，消渴，气上撞心，心中疼热，饥而不欲食，食则吐蛔。下之利不止。
  text_trad: 厥陰之為病，消渴，氣上撞心，心中疼熱，飢而不欲食，食則吐蚘。下之利不止。
  entities: [six_channel.jueyin]
- id: clause.shl.327
  'no': 327
  section: 辨厥阴病脉证并治
  text: 厥阴中风，脉微浮为欲愈，不浮为未愈。
  text_trad: 厥陰中風，脈微浮為欲愈，不浮為未愈。
  entities: [six_channel.jueyin]
- id: clause.shl.328
  'no': 328
  section: 辨厥阴病脉证并治
  text: 厥阴病，欲解时，从丑至卯上。
  text_trad: 厥陰病，欲解時，從丑至卯上。
  entities: [six_channel.jueyin]
- id: clause.shl.329
  'no': 329
  section: 辨厥阴病脉证并治
  text: 厥阴病，渴欲饮水者，少少与之愈。
  text_trad: 厥陰病，渴欲飲水者，少少與之愈。
  entities: [six_channel.jueyin]
- id: clause.shl.330
  'no': 330
  section: 辨厥阴病脉证并治
  text: 诸四逆厥者，不可下之，虚家亦然。
  text_trad: 諸四逆厥者，不可下之，虛家亦然。
  entities: []
- id: clause.shl.331
  'no': 331
  section: 辨厥阴病脉证并治
  text: 伤寒，先厥，后发热而利者，必自止。见厥复利。
  text_trad: 傷寒，先厥，後發熱而利者，必自止。見厥復利。
  entities: []
- id: clause.shl.332
  'no': 332
  section: 辨厥阴病脉证并治
  text: 伤寒，始发热六日，厥反九日而利。凡厥利者，当不能食；今反能食者，恐为除中。食以索饼，不发热者，知胃气尚在，必愈。恐暴热来出而复去也。后三日脉之，其热续在者，期之旦日夜半愈。所以然者，本发热六日，厥反九日，复发热三日，并前六日，亦为九日，与厥相应，故期之旦日夜半愈。后三日脉之而脉数，其热不罢者，此为热气有余，必发痈脓也。
  text_trad: 傷寒，始發熱六日，厥反九日而利。凡厥利者，當不能食；今反能食者，恐為除中。食以索餅，不發熱者，知胃氣尚在，必愈。恐暴熱來出而復去也。後三日脈之，其熱續在者，期之旦日夜半愈。所以然者，本發熱六日，厥反九日，復發熱三日，并前六日，亦為九日，與厥相應，故期之旦日夜半愈。後三日脈之而脈數，其熱不罷者，此為熱氣有餘，必發癰膿也。
  entities: []
- id: clause.shl.333
  'no': 333
  section: 辨厥阴病脉证并治
  text: 伤寒脉迟，六七日，而反与黄芩汤彻其热，脉迟为寒，今与黄芩汤复除其热，腹中应冷，当不能食，今反能食，此名除中，必死。
  text_trad: 傷寒脈遲，六七日，而反與黃芩湯徹其熱，脈遲為寒，今與黃芩湯復除其熱，腹中應冷，當不能食，今反能食，此名除中，必死。
  entities: [formula.huang_qin_tang]
- id: clause.shl.334
  'no': 334
  section: 辨厥阴病脉证并治
  text: 伤寒，先厥后发热，下利必自止。而反汗出，咽中痛者，其喉为痹。发热无汗，而利必自止；若不止，必便脓血。便脓血者，其喉不痹。
  text_trad: 傷寒，先厥後發熱，下利必自止。而反汗出，咽中痛者，其喉為痹。發熱無汗，而利必自止；若不止，必便膿血。便膿血者，其喉不痹。
  entities: []
- id: clause.shl.335
  'no': 335
  section: 辨厥阴病脉证并治
  text: 伤寒，一二日至四五日厥者，必发热，前热者，后必厥。厥深者，热亦深；厥微者，热亦微。厥应下之，而反发汗者，必口伤烂赤。
  text_trad: 傷寒，一二日至四五日厥者，必發熱，前熱者，後必厥。厥深者，熱亦深；厥微者，熱亦微。厥應下之，而反發汗者，必口傷爛赤。
  entities: []
- id: clause.shl.336
  'no': 336
  section: 辨厥阴病脉证并治
  text: 伤寒病，厥五日，热亦五日。设六日，当复厥，不厥者自愈。厥终不过五日，以热五日，故知自愈。
  text_trad: 傷寒病，厥五日，熱亦五日。設六日，當復厥，不厥者自愈。厥終不過五日，以熱五日，故知自愈。
  entities: []
- id: clause.shl.337
  'no': 337
  section: 辨厥阴病脉证并治
  text: 凡厥者，阴阳气不相顺接，便为厥。厥者，手足逆冷者是也。
  text_trad: 凡厥者，陰陽氣不相順接，便為厥。厥者，手足逆冷者是也。
  entities: []
- id: clause.shl.338
  'no': 338
  section: 辨厥阴病脉证并治
  text: 伤寒，脉微而厥，至七八日，肤冷，其人躁无暂安时者，此为藏厥，非蛔厥也。蛔厥者，其人当吐蛔，令病者静而复时烦者，此为藏寒。蛔上入其膈故烦，须臾复止，得食而呕，又烦者，蛔闻食臭出，其人常自吐蛔。蛔厥者，乌梅丸主之。又主久利。
  text_trad: 傷寒，脈微而厥，至七八日，膚冷，其人躁無暫安時者，此為藏厥，非蚘厥也。蚘厥者，其人當吐蚘，令病者靜而復時煩者，此為藏寒。蚘上入其膈故煩，須臾復止，得食而嘔，又煩者，蚘聞食臭出，其人常自吐蚘。蚘厥者，烏梅丸主之。又主久利。
  entities: [formula.wu_mei_wan]
- id: clause.shl.339
  'no': 339
  section: 辨厥阴病脉证并治
  text: 伤寒，热少微厥，指头寒，嘿嘿不欲食，烦躁。数日，小便利，色白者，此热除也，欲得食，其病为愈。若厥而呕，胸胁烦满者，其后必便血。
  text_trad: 傷寒，熱少微厥，指頭寒，嘿嘿不欲食，煩躁。數日，小便利，色白者，此熱除也，欲得食，其病為愈。若厥而嘔，胸脅煩滿者，其後必便血。
  entities: []
- id: clause.shl.340
  'no': 340
  section: 辨厥阴病脉证并治
  text: 病者手足厥冷，言我不结胸，小腹满，按之痛者，此冷结在膀胱关元也。
  text_trad: 病者手足厥冷，言我不結胸，小腹滿，按之痛者，此冷結在膀胱關元也。
  entities: []
- id: clause.shl.341
  'no': 341
  section: 辨厥阴病脉证并治
  text: 伤寒发热四日，厥反三日，复热四日，厥少热多者，其病当愈。四日至七日，热不除者，必便脓血。
  text_trad: 傷寒發熱四日，厥反三日，復熱四日，厥少熱多者，其病當愈。四日至七日，熱不除者，必便膿血。
  entities: []
- id: clause.shl.342
  'no': 342
  section: 辨厥阴病脉证并治
  text: 伤寒，厥四日，热反三日，复厥五日，其病为进。寒多热少，阳气退，故为进也。
  text_trad: 傷寒，厥四日，熱反三日，復厥五日，其病為進。寒多熱少，陽氣退，故為進也。
  entities: []
- id: clause.shl.343
  'no': 343
  section: 辨厥阴病脉证并治
  text: 伤寒六七日，脉微，手足厥冷，烦躁，灸厥阴，厥不还者，死。
  text_trad: 傷寒六七日，脈微，手足厥冷，煩躁，灸厥陰，厥不還者，死。
  entities: []
- id: clause.shl.344
  'no': 344
  section: 辨厥阴病脉证并治
  text: 伤寒发热，下利，厥逆，躁不得卧者，死。
  text_trad: 傷寒發熱，下利，厥逆，躁不得臥者，死。
  entities: []
- id: clause.shl.345
  'no': 345
  section: 辨厥阴病脉证并治
  text: 伤寒发热，下利至甚，厥不止者，死。
  text_trad: 傷寒發熱，下利至甚，厥不止者，死。
  entities: []
- id: clause.shl.346
  'no': 346
  section: 辨厥阴病脉证并治
  text: 伤寒六七日，不利，便发热而利，其人汗出不止者，死。有阴无阳故也。
  text_trad: 傷寒六七日，不利，便發熱而利，其人汗出不止者，死。有陰無陽故也。
  entities: []
- id: clause.shl.347
  'no': 347
  section: 辨厥阴病脉证并治
  text: 伤寒五六日，不结胸，腹濡，脉虚复厥者，不可下，此亡血，下之死。
  text_trad: 傷寒五六日，不結胸，腹濡，脈虛復厥者，不可下，此亡血，下之死。
  entities: []
- id: clause.shl.348
  'no': 348
  section: 辨厥阴病脉证并治
  text: 发热而厥，七日下利者，为难治。
  text_trad: 發熱而厥，七日下利者，為難治。
  entities: []
- id: clause.shl.349
  'no': 349
  section: 辨厥阴病脉证并治
  text: 伤寒脉促，手足厥逆，可灸之。
  text_trad: 傷寒脈促，手足厥逆，可灸之。
  entities: []
- id: clause.shl.350
  'no': 350
  section: 辨厥阴病脉证并治
  text: 伤寒，脉滑而厥者，里有热，白虎汤主之。
  text_trad: 傷寒，脈滑而厥者，裏有熱，白虎湯主之。
  entities: [formula.bai_hu_tang]
- id: clause.shl.351
  'no': 351
  section: 辨厥阴病脉证并治
  text: 手足厥寒，脉细欲绝者，当归四逆汤主之。
  text_trad: 手足厥寒，脈細欲絕者，當歸四逆湯主之。
  entities: [formula.dang_gui_si_ni_tang]
- id: clause.shl.352
  'no': 352
  section: 辨厥阴病脉证并治
  text: 若其人内有久寒者，宜当归四逆加吴茱萸生姜汤。
  text_trad: 若其人內有久寒者，宜當歸四逆加吳茱萸生薑湯。
  entities: [formula.dang_gui_si_ni_jia_wu_zhu_yu_sheng_jiang_tang]
- id: clause.shl.353
  'no': 353
  section: 辨厥阴病脉证并治
  text: 大汗出，热不去，内拘急，四肢疼，又下利厥逆而恶寒者，四逆汤主之。
  text_trad: 大汗出，熱不去，內拘急，四肢疼，又下利厥逆而惡寒者，四逆湯主之。
  entities: [formula.si_ni_tang]
- id: clause.shl.354
  'no': 354
  section: 辨厥阴病脉证并治
  text: 大汗，若大下利而厥冷者，四逆汤主之。
  text_trad: 大汗，若大下利而厥冷者，四逆湯主之。
  entities: [formula.si_ni_tang]
- id: clause.shl.355
  'no': 355
  section: 辨厥阴病脉证并治
  text: 病人手足厥冷，脉乍紧者，邪结在胸中，心下满而烦，饥不能食者，病在胸中，当须吐之，宜瓜蒂散。
  text_trad: 病人手足厥冷，脈乍緊者，邪結在胸中，心下滿而煩，飢不能食者，病在胸中，當須吐之，宜瓜蒂散。
  entities: [formula.gua_di_san]
- id: clause.shl.356
  'no': 356
  section: 辨厥阴病脉证并治
  text: 伤寒，厥而心下悸，宜先治水，当服茯苓甘草汤，却治其厥。不尔，水渍入胃，必作利也。
  text_trad: 傷寒，厥而心下悸，宜先治水，當服茯苓甘草湯，卻治其厥。不爾，水漬入胃，必作利也。
  entities: [formula.fu_ling_gan_cao_tang]
- id: clause.shl.357
  'no': 357
  section: 辨厥阴病脉证并治
  text: 伤寒六七日，大下后，寸脉沉而迟，手足厥逆，下部脉不至，喉咽不利，唾脓血，泄利不止者，为难治，麻黄升麻汤主之。
  text_trad: 傷寒六七日，大下後，寸脈沉而遲，手足厥逆，下部脈不至，喉咽不利，唾膿血，泄利不止者，為難治，麻黃升麻湯主之。
  entities: [formula.ma_huang_sheng_ma_tang]
- id: clause.shl.358
  'no': 358
  section: 辨厥阴病脉证并治
  text: 伤寒四五日，腹中痛，若转气下趣少腹者，此欲自利也。
  text_trad: 傷寒四五日，腹中痛，若轉氣下趣少腹者，此欲自利也。
  entities: []
- id: clause.shl.359
  'no': 359
  section: 辨厥阴病脉证并治
  text: 伤寒本自寒下，医复吐下之，寒格，更逆吐下，若食入口即吐，干姜黄芩黄连人参汤主之。
  text_trad: 傷寒本自寒下，醫復吐下之，寒格，更逆吐下，若食入口即吐，乾薑黃芩黃連人參湯主之。
  entities: [formula.gan_jiang_huang_qin_huang_lian_ren_shen_tang]
- id: clause.shl.360
  'no': 360
  section: 辨厥阴病脉证并治
  text: 下利，有微热而渴，脉弱者，今自愈。
  text_trad: 下利，有微熱而渴，脈弱者，今自愈。
  entities: []
- id: clause.shl.361
  'no': 361
  section: 辨厥阴病脉证并治
  text: 下利脉数，有微热汗出，今自愈。设复紧，为未解。
  text_trad: 下利脈數，有微熱汗出，今自愈。設復緊，為未解。
  entities: []
- id: clause.shl.362
  'no': 362
  section: 辨厥阴病脉证并治
  text: 下利，手足厥冷，无脉者，灸之。不温。若脉不还，反微喘者，死。少阴负趺阳者，为顺也。
  text_trad: 下利，手足厥冷，無脈者，灸之。不溫。若脈不還，反微喘者，死。少陰負趺陽者，為順也。
  entities: []
- id: clause.shl.363
  'no': 363
  section: 辨厥阴病脉证并治
  text: 下利，寸脉反浮数，尺中自涩者，必清脓血。
  text_trad: 下利，寸脈反浮數，尺中自澀者，必清膿血。
  entities: []
- id: clause.shl.364
  'no': 364
  section: 辨厥阴病脉证并治
  text: 下利清谷，不可攻表，汗出必胀满。
  text_trad: 下利清穀，不可攻表，汗出必脹滿。
  entities: []
- id: clause.shl.365
  'no': 365
  section: 辨厥阴病脉证并治
  text: 下利，脉沉弦者，下重也；脉大者，为未止；脉微弱数者，为欲自止，虽发热，不死。
  text_trad: 下利，脈沉弦者，下重也；脈大者，為未止；脈微弱數者，為欲自止，雖發熱，不死。
  entities: []
- id: clause.shl.366
  'no': 366
  section: 辨厥阴病脉证并治
  text: 下利，脉沉而迟，其人面少赤，身有微热，下利清谷者，必郁冒汗出而解。病人必微厥。所以然者，其面戴阳，下虚故也。
  text_trad: 下利，脈沉而遲，其人面少赤，身有微熱，下利清穀者，必鬱冒汗出而解。病人必微厥。所以然者，其面戴陽，下虛故也。
  entities: []
- id: clause.shl.367
  'no': 367
  section: 辨厥阴病脉证并治
  text: 下利，脉数而渴者，今自愈。设不差，必清脓血，以有热故也。
  text_trad: 下利，脈數而渴者，今自愈。設不差，必清膿血，以有熱故也。
  entities: []
- id: clause.shl.368
  'no': 368
  section: 辨厥阴病脉证并治
  text: 下利后脉绝，手足厥冷，晬时脉还，手足温者生，脉不还者死。
  text_trad: 下利後脈絕，手足厥冷，晬時脈還，手足溫者生，脈不還者死。
  entities: []
- id: clause.shl.369
  'no': 369
  section: 辨厥阴病脉证并治
  text: 伤寒下利，日十余行，脉反实者，死。
  text_trad: 傷寒下利，日十餘行，脈反實者，死。
  entities: []
- id: clause.shl.370
  'no': 370
  section: 辨厥阴病脉证并治
  text: 下利清谷，里寒外热，汗出而厥者，通脉四逆汤主之。
  text_trad: 下利清穀，裏寒外熱，汗出而厥者，通脈四逆湯主之。
  entities: [formula.tong_mai_si_ni_tang]
- id: clause.shl.371
  'no': 371
  section: 辨厥阴病脉证并治
  text: 热利下重者，白头翁汤主之。
  text_trad: 熱利下重者，白頭翁湯主之。
  entities: [formula.bai_tou_weng_tang]
- id: clause.shl.372
  'no': 372
  section: 辨厥阴病脉证并治
  text: 下利腹胀满，身体疼痛者，先温其里，乃攻其表。温里宜四逆汤，攻表宜桂枝汤。
  text_trad: 下利腹脹滿，身體疼痛者，先溫其裏，乃攻其表。溫裏宜四逆湯，攻表宜桂枝湯。
  entities: [formula.gui_zhi_tang, formula.si_ni_tang]
- id: clause.shl.373
  'no': 373
  section: 辨厥阴病脉证并治
  text: 下利欲饮水者，以有热故也，白头翁汤主之。
  text_trad: 下利欲飲水者，以有熱故也，白頭翁湯主之。
  entities: [formula.bai_tou_weng_tang]
- id: clause.shl.374
  'no': 374
  section: 辨厥阴病脉证并治
  text: 下利谵语者，有燥屎也，宜小承气汤。
  text_trad: 下利譫語者，有燥屎也，宜小承氣湯。
  entities: [formula.xiao_cheng_qi_tang]
- id: clause.shl.375
  'no': 375
  section: 辨厥阴病脉证并治
  text: 下利后，更烦，按之心下濡者，为虚烦也，宜栀子豉汤。
  text_trad: 下利後，更煩，按之心下濡者，為虛煩也，宜梔子豉湯。
  entities: [formula.zhi_zi_shi_tang]
- id: clause.shl.376
  'no': 376
  section: 辨厥阴病脉证并治
  text: 呕家有痈脓者，不可治呕，脓尽自愈。
  text_trad: 嘔家有癰膿者，不可治嘔，膿盡自愈。
  entities: []
- id: clause.shl.377
  'no': 377
  section: 辨厥阴病脉证并治
  text: 呕而脉弱，小便复利，身有微热，见厥者难治，四逆汤主之。
  text_trad: 嘔而脈弱，小便復利，身有微熱，見厥者難治，四逆湯主之。
  entities: [formula.si_ni_tang]
- id: clause.shl.378
  'no': 378
  section: 辨厥阴病脉证并治
  text: 干呕，吐涎沫，头痛者，吴茱萸汤主之。
  text_trad: 乾嘔，吐涎沫，頭痛者，吳茱萸湯主之。
  entities: [formula.wu_zhu_yu_tang]
- id: clause.shl.379
  'no': 379
  section: 辨厥阴病脉证并治
  text: 呕而发热者，小柴胡汤主之。
  text_trad: 嘔而發熱者，小柴胡湯主之。
  entities: [formula.xiao_chai_hu_tang]
- id: clause.shl.380
  'no': 380
  section: 辨厥阴病脉证并治
  text: 伤寒，大吐、大下之，极虚，复极汗者，其人外气怫郁，复与之水，以发其汗，因得哕。所以然者，胃中寒冷故也。
  text_trad: 傷寒，大吐、大下之，極虛，復極汗者，其人外氣怫鬱，復與之水，以發其汗，因得噦。所以然者，胃中寒冷故也。
  entities: []
- id: clause.shl.381
  'no': 381
  section: 辨厥阴病脉证并治
  text: 伤寒，哕而腹满，视其前后，知何部不利，利之即愈。
  text_trad: 傷寒，噦而腹滿，視其前後，知何部不利，利之即愈。
  entities: []
- id: clause.shl.382
  'no': 382
  section: 辨霍乱病脉证并治
  text: 问曰：病有霍乱者何？答曰：呕吐而利，此名霍乱。
  text_trad: 問曰：病有霍亂者何？答曰：嘔吐而利，此名霍亂。
  entities: []
- id: clause.shl.383
  'no': 383
  section: 辨霍乱病脉证并治
  text: 问曰：病发热、头痛、身疼、恶寒、吐利者，此属何病？答曰：此名霍乱。霍乱自吐下，又利止，复更发热也。
  text_trad: 問曰：病發熱、頭痛、身疼、惡寒、吐利者，此屬何病？答曰：此名霍亂。霍亂自吐下，又利止，復更發熱也。
  entities: []
- id: clause.shl.384
  'no': 384
  section: 辨霍乱病脉证并治
  text: 伤寒，其脉微涩者，本是霍乱，今是伤寒，却四五日，至阴经上，转入阴必利；本呕，下利者，不可治也。欲似大便，而反失气，仍不利者，此属阳明也，便必硬，十三日愈。所以然者，经尽故也。下利后，当便硬，硬则能食者愈。今反不能食，到后经中，颇能食，复过一经能食，过之一日当愈；不愈者，不属阳明也。
  text_trad: 傷寒，其脈微澀者，本是霍亂，今是傷寒，卻四五日，至陰經上，轉入陰必利；本嘔，下利者，不可治也。欲似大便，而反失氣，仍不利者，此屬陽明也，便必鞕，十三日愈。所以然者，經盡故也。下利後，當便鞕，鞕則能食者愈。今反不能食，到後經中，頗能食，復過一經能食，過之一日當愈；不愈者，不屬陽明也。
  entities: []
- id: clause.shl.385
  'no': 385
  section: 辨霍乱病脉证并治
  text: 恶寒脉微而复利，利止，亡血也，四逆加人参汤主之。
  text_trad: 惡寒脈微而復利，利止，亡血也，四逆加人參湯主之。
  entities: [formula.si_ni_jia_ren_shen_tang]
- id: clause.shl.386
  'no': 386
  section: 辨霍乱病脉证并治
  text: 霍乱，头痛，发热，身疼痛，热多欲饮水者，五苓散主之。寒多不用水者，理中丸主之。
  text_trad: 霍亂，頭痛，發熱，身疼痛，熱多欲飲水者，五苓散主之。寒多不用水者，理中丸主之。
  entities: [formula.wu_ling_san, formula.li_zhong_wan]
- id: clause.shl.387
  'no': 387
  section: 辨霍乱病脉证并治
  text: 吐利止而身痛不休者，当消息和解其外，宜桂枝汤小和之。
  text_trad: 吐利止而身痛不休者，當消息和解其外，宜桂枝湯小和之。
  entities: [formula.gui_zhi_tang]
- id: clause.shl.388
  'no': 388
  section: 辨霍乱病脉证并治
  text: 吐利，汗出，发热，恶寒，四肢拘急，手足厥冷者，四逆汤主之。
  text_trad: 吐利，汗出，發熱，惡寒，四肢拘急，手足厥冷者，四逆湯主之。
  entities: [formula.si_ni_tang]
- id: clause.shl.389
  'no': 389
  section: 辨霍乱病脉证并治
  text: 既吐且利，小便复利而大汗出，下利清谷，内寒外热，脉微欲绝者，四逆汤主之。
  text_trad: 既吐且利，小便復利而大汗出，下利清穀，內寒外熱，脈微欲絕者，四逆湯主之。
  entities: [formula.si_ni_tang]
- id: clause.shl.390
  'no': 390
  section: 辨霍乱病脉证并治
  text: 吐已下断，汗出而厥，四肢拘急不解，脉微欲绝者，通脉四逆加猪胆汁汤主之。
  text_trad: 吐已下斷，汗出而厥，四肢拘急不解，脈微欲絕者，通脈四逆加豬膽汁湯主之。
  entities: [formula.tong_mai_si_ni_jia_zhu_dan_zhi_tang]
- id: clause.shl.391
  'no': 391
  section: 辨霍乱病脉证并治
  text: 吐利，发汗，脉平，小烦者，以新虚不胜谷气故也。
  text_trad: 吐利，發汗，脈平，小煩者，以新虛不勝穀氣故也。
  entities: []
- id: clause.shl.392
  'no': 392
  section: 辨阴阳易差后劳复病脉证并治
  text: 伤寒阴阳易之为病，其人身体重，少气，少腹里急，或引阴中拘挛，热上冲胸，头重不欲举，眼中生花，膝胫拘急者，烧裈散主之。
  text_trad: 傷寒陰陽易之為病，其人身體重，少氣，少腹裏急，或引陰中拘攣，熱上衝胸，頭重不欲舉，眼中生花，膝脛拘急者，燒褌散主之。
  entities: [formula.shao_kun_san]
- id: clause.shl.393
  'no': 393
  section: 辨阴阳易差后劳复病脉证并治
  text: 大病差后，劳复者，枳实栀子豉汤主之。
  text_trad: 大病差後，勞復者，枳實梔子豉湯主之。
  entities: [formula.zhi_shi_zhi_zi_shi_tang]
- id: clause.shl.394
  'no': 394
  section: 辨阴阳易差后劳复病脉证并治
  text: 伤寒差以后，更发热，小柴胡汤主之。脉浮者，以汗解之；脉沉实者，以下解之。
  text_trad: 傷寒差以後，更發熱，小柴胡湯主之。脈浮者，以汗解之；脈沉實者，以下解之。
  entities: [formula.xiao_chai_hu_tang]
- id: clause.shl.395
  'no': 395
  section: 辨阴阳易差后劳复病脉证并治
  text: 大病差后，从腰以下有水气者，牡蛎泽泻散主之。
  text_trad: 大病差後，從腰以下有水氣者，牡蠣澤瀉散主之。
  entities: [formula.mu_li_ze_xie_san]
- id: clause.shl.396
  'no': 396
  section: 辨阴阳易差后劳复病脉证并治
  text: 大病差后，喜唾，久不了了，胸上有寒，当以丸药温之，宜理中丸。
  text_trad: 大病差後，喜唾，久不了了，胸上有寒，當以丸藥溫之，宜理中丸。
  entities: [formula.li_zhong_wan]
- id: clause.shl.397
  'no': 397
  section: 辨阴阳易差后劳复病脉证并治
  text: 伤寒解后，虚羸少气，气逆欲吐，竹叶石膏汤主之。
  text_trad: 傷寒解後，虛羸少氣，氣逆欲吐，竹葉石膏湯主之。
  entities: [formula.zhu_ye_shi_gao_tang]
- id: clause.shl.398
  'no': 398
  section: 辨阴阳易差后劳复病脉证并治
  text: 病人脉已解，而日暮微烦，以病新差，人强与谷，脾胃气尚弱，不能消谷，故令微烦，损谷则愈。
  text_trad: 病人脈已解，而日暮微煩，以病新差，人強與穀，脾胃氣尚弱，不能消穀，故令微煩，損穀則愈。
  entities: []
