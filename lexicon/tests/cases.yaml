# 纠错 / 匹配回归用例。CI: python -m tcmkb_lexicon test --root lexicon
# must_fix 的输入全部取自 /workspace/asr-bench/out 中实际出现的误识（已 t2s）；must_not_fix 为必须保持原样的正常用语。
must_fix:
