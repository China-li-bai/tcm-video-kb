must_not_fix:
  - {in: "湖北竹山县的竹山很漂亮", note: "地名竹山（右侧非 里/穴）"}
  - {in: "孙思邈的千金方很有名", note: "千金方 中的 金方"}
  - {in: "祝你早生贵子", note: "贵子 无 汤/加 等右侧"}
  - {in: "八月桂子飘香", note: "桂子 无方剂上下文"}
  - {in: "他昨天从上海飞到台北", note: "上海 附近无 张仲景/金匮"}
  - {in: "院子里种了一棵金桂", note: "金桂 附近无 伤寒"}
  - {in: "这家店物美价廉", note: "物美 附近无 乌梅/虫"}
  - {in: "秦始皇帝统一六国", note: "皇帝 附近无 岐伯/内经"}
  - {in: "上寒下热的病人", note: "上寒下热 为正常病机用语"}
  - {in: "小孩子在玩玩具", note: "玩具 附近无 汤剂/散剂"}
  - {in: "中国经济发展很快", note: "经济 附近无 针/转"}
  - {in: "凉秋九月，天气转凉", note: "凉秋 附近无 穴/足三里"}
  - {in: "他是个很悲观的人", note: "悲观 右侧非 浮涂/伏兔"}
  - {in: "张仲你好", note: "张仲你 右侧需 发明/的/也/用"}
  - {in: "足三里、合谷、内关、三阴交", note: "正确术语不得被改"}
  - {in: "桂枝汤、五苓散、乌梅丸、伤寒论、金匮要略", note: "正确术语不得被改"}
  - {in: "道法于阴阳，和于术数", note: "正确原文"}
match:
  - {in: "太阳中风，桂枝汤主之", expect: [syndrome.tai_yang_zhong_feng, formula.gui_zhi_tang]}
  - {in: "针扎到足三里以后", expect: [acupoint.st36]}
  - {in: "太阳病，脉浮，头项强痛而恶寒", expect: [syndrome.tai_yang_bing, pulse.fu, symptom.tou_xiang_qiang_tong, symptom.e_han]}
  - {in: "今天太阳很大", not_expect: [six_channel.taiyang, acupoint.ex_tai_yang], note: "太阳 无上下文"}
  - {in: "在太阳穴扎针", expect: [acupoint.ex_tai_yang]}
  - {in: "张仲景写了伤寒论", expect: [person.zhang_zhong_jing, classic.shang_han_lun]}
  - {in: "伤寒论第十二条", expect: [classic.shang_han_lun]}
  - {in: "喝小柴胡汤", expect: [formula.xiao_chai_hu_tang], not_expect: [herb.chai_hu]}
  - {in: "这个人心情很好", not_expect: [zangfu.xin], note: "单字脏腑需上下文"}
  - {in: "心经的井穴少冲", expect: [meridian.ht, acupoint.ht9]}
