[project]
name = "tcmkb-ingest"
version = "0.1.0"
description = "Ingest pipeline steps + scheduler + CLI (tcmkb)"
requires-python = ">=3.11"
dependencies = [
  "tcmkb-core",
  "tcmkb-lexicon",
  "click>=8",
  "opencc-python-reimplemented>=0.1.7",
]

[project.optional-dependencies]
# Real ASR (s04). funasr does not declare torch; torch/torchaudio come from the
# PyTorch CPU index (see [tool.uv.sources] in the workspace root pyproject).
asr = [
  "funasr>=1.4",
  "modelscope>=1.20",
  "torch>=2.4",
  "torchaudio>=2.4",
  "psutil>=5.9",
]

[project.scripts]
tcmkb = "tcmkb_ingest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
